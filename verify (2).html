<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>動作検証：OCR照合・グループ別集計</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.1.11/index.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
<style>
  body {
    background-color: #F2F4F5;
    background-image: radial-gradient(circle at 1px 1px, rgba(30,41,59,0.05) 1px, transparent 0);
    background-size: 20px 20px;
  }
  .heading-divider { display: flex; align-items: center; gap: 0.75rem; }
  .heading-divider::before, .heading-divider::after {
    content: ""; flex: 1; height: 1px; background: #CBD3D8;
  }
</style>
</head>
<body class="min-h-screen text-slate-800">
  <div class="max-w-xl mx-auto px-5 py-10">

    <header class="mb-8">
      <div class="inline-block px-3 py-1 rounded-full bg-[#1E3A5F] text-white text-xs font-medium mb-3">
        検証ツール
      </div>
      <h1 class="text-xl font-bold text-slate-900">動作検証：OCR照合・グループ別集計</h1>
      <p class="mt-1.5 text-sm text-slate-500">テンプレートの集計行（緑70／緑70+90／All）と同じ区分で件数を出します。</p>
    </header>

    <!-- ステータスパネル -->
    <div class="grid grid-cols-3 gap-3 mb-8">
      <div id="status-upload" class="rounded-2xl border border-slate-200 bg-white shadow-sm p-3.5 text-center">
        <div class="text-xs text-slate-400 mb-1.5">① 画像取り込み</div>
        <div class="status-badge text-sm font-semibold text-slate-300">未検証</div>
      </div>
      <div id="status-ocr" class="rounded-2xl border border-slate-200 bg-white shadow-sm p-3.5 text-center">
        <div class="text-xs text-slate-400 mb-1.5">② OCR処理</div>
        <div class="status-badge text-sm font-semibold text-slate-300">未検証</div>
      </div>
      <div id="status-match" class="rounded-2xl border border-slate-200 bg-white shadow-sm p-3.5 text-center">
        <div class="text-xs text-slate-400 mb-1.5">③ 照合・集計</div>
        <div class="status-badge text-sm font-semibold text-slate-300">未検証</div>
      </div>
    </div>

    <!-- 画像アップロード -->
    <div class="heading-divider text-xs font-medium text-slate-400 mb-4">
      <span>画像からOCR（本番用フロー）</span>
    </div>
    <label class="block cursor-pointer rounded-2xl border-2 border-dashed border-slate-300 bg-white hover:border-emerald-400 hover:bg-emerald-50/30 transition-colors p-8 text-center mb-3">
      <input id="file-input" type="file" accept="image/*" class="hidden" />
      <span class="text-slate-500 text-sm" id="drop-label">画像ファイルを選択（スクリーンショット推奨）</span>
    </label>
    <img id="preview" class="hidden max-h-56 mx-auto rounded-2xl border border-slate-200 shadow-sm mb-3" />
    <div id="progress-wrap" class="hidden mb-6">
      <div class="flex justify-between text-xs text-slate-500 mb-1.5">
        <span id="progress-label">処理中…</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-emerald-600 rounded-full transition-all" style="width:0%"></div>
      </div>
    </div>
    <div id="error-wrap" class="hidden mb-6 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 whitespace-pre-line"></div>

    <!-- テキスト直接入力（この環境でのOCR代替） -->
    <div class="heading-divider text-xs font-medium text-slate-400 mb-4">
      <span>テキストを直接入力（この環境の検証用）</span>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 mb-8">
      <p class="text-xs text-slate-400 mb-2">OCRが使えない環境のため、認識結果を模したテキストをここに貼り付けて照合ロジックを確認できます。</p>
      <textarea id="manual-text" class="w-full h-28 text-sm p-3 rounded-xl border border-slate-200 bg-slate-50 font-mono" placeholder="例：ここにOCR結果を模したテキストを貼り付け">スキル一覧　一匹狼　ナイター〇　交流重賞〇　シンパシー　逃げのコツ〇　探求心　精神力　まき直し　急発進　逃げ直線〇</textarea>
      <button id="match-btn" class="mt-3 text-xs px-4 py-2 rounded-full bg-emerald-600 text-white font-medium hover:bg-emerald-700 transition-colors">
        このテキストで照合する
      </button>
    </div>

    <!-- 照合結果 -->
    <div id="result-wrap" class="hidden">
      <div class="heading-divider text-xs font-medium text-slate-400 mb-4">
        <span>グループ別 集計結果</span>
      </div>

      <div class="space-y-2.5 mb-6">
        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-slate-700">緑70</p>
            <p class="text-xs text-slate-400">列B = SP70 の行のみ</p>
          </div>
          <p class="text-lg font-bold text-emerald-600" id="group-sp70"></p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-slate-700">緑70+90</p>
            <p class="text-xs text-slate-400">列A に「緑」の記載がある行</p>
          </div>
          <p class="text-lg font-bold text-emerald-600" id="group-midori"></p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-slate-700">All</p>
            <p class="text-xs text-slate-400">マスタ全件（今回のサンプルは93件）</p>
          </div>
          <p class="text-lg font-bold text-emerald-600" id="group-all"></p>
        </div>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4">
        <p class="text-xs text-slate-400 mb-2.5">検出されたスキル</p>
        <div id="matched-chips" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>

  </div>

<script>
// サンプルマスタ一覧（列A・列Bの実データを保持。本番ではテンプレートから自動読込）
const MASTER_SKILLS = [
{name:"一匹狼",colA:"緑",colB:"SP70"},{name:"ナイター○",colA:"緑",colB:"SP70"},{name:"交流重賞○",colA:"緑",colB:"SP70"},
{name:"シンパシー",colA:"緑",colB:"SP70"},{name:"川崎レース場○",colA:"緑",colB:"SP70"},{name:"小倉レース場○",colA:"緑",colB:"SP70"},
{name:"札幌レース場○",colA:"緑",colB:"SP70"},{name:"新潟レース場○",colA:"緑",colB:"SP70"},{name:"函館レース場○",colA:"緑",colB:"SP70"},
{name:"福島レース場○",colA:"緑",colB:"SP70"},{name:"ロンシャンレース場○",colA:"緑",colB:"SP70"},{name:"サンタアニタパークレース場○",colA:"緑",colB:"SP70"},
{name:"デルマーレース場○",colA:"緑",colB:"SP70"},{name:"船橋レース場○",colA:"緑",colB:"SP70"},{name:"盛岡レース場○",colA:"緑",colB:"SP70"},
{name:"小回り○",colA:"緑",colB:"SP70"},{name:"直線コース○",colA:"緑",colB:"SP70"},
{name:"大井レース場○",colA:"緑",colB:"SP90"},{name:"京都レース場○",colA:"緑",colB:"SP90"},{name:"中京レース場○",colA:"緑",colB:"SP90"},
{name:"東京レース場○",colA:"緑",colB:"SP90"},{name:"中山レース場○",colA:"緑",colB:"SP90"},{name:"阪神レース場○",colA:"緑",colB:"SP90"},
{name:"おひとり様○",colA:"緑",colB:"SP90"},{name:"泥遊び○",colA:"緑",colB:"SP90"},{name:"春ウマ娘○",colA:"緑",colB:"SP90"},
{name:"夏ウマ娘○",colA:"緑",colB:"SP90"},{name:"秋ウマ娘○",colA:"緑",colB:"SP90"},{name:"冬ウマ娘○",colA:"緑",colB:"SP90"},
{name:"右回り○",colA:"緑",colB:"SP90"},{name:"左回り○",colA:"緑",colB:"SP90"},{name:"伏兵○",colA:"緑",colB:"SP90"},
{name:"根幹距離○",colA:"緑",colB:"SP90"},{name:"非根幹距離○",colA:"緑",colB:"SP90"},{name:"対抗意識○",colA:"緑",colB:"SP90"},
{name:"道悪○",colA:"緑",colB:"SP90"},{name:"良バ場○",colA:"緑",colB:"SP90"},{name:"晴れの日○",colA:"緑",colB:"SP90"},
{name:"雨の日○",colA:"緑",colB:"SP90"},{name:"曇りの日○",colA:"緑",colB:"SP90"},{name:"雪の日○",colA:"緑",colB:"SP90"},
{name:"徹底マーク○",colA:"緑",colB:"SP90"},{name:"内枠得意○",colA:"緑",colB:"SP90"},{name:"外枠得意○",colA:"緑",colB:"SP90"},
{name:"逃げのコツ○",colA:"緑",colB:"SP110"},{name:"先行のコツ○",colA:"緑",colB:"SP110"},{name:"差しのコツ○",colA:"緑",colB:"SP110"},
{name:"追込のコツ○",colA:"緑",colB:"SP110"},{name:"ラッキーセブン",colA:"緑",colB:"SP110"},
{name:"探求心",colA:"緑",colB:"SP120"},{name:"精神力",colA:"緑",colB:"SP120"},{name:"踏み込み上手",colA:"緑",colB:"SP120"},
{name:"短距離コーナー○",colA:"",colB:"SP100"},{name:"短距離直線○",colA:"",colB:"SP100"},{name:"マイルコーナー○",colA:"",colB:"SP100"},
{name:"マイル直線○",colA:"",colB:"SP100"},{name:"中距離コーナー○",colA:"",colB:"SP100"},{name:"中距離直線○",colA:"",colB:"SP100"},
{name:"長距離コーナー○",colA:"",colB:"SP100"},{name:"長距離直線○",colA:"",colB:"SP100"},{name:"ダート直線○",colA:"",colB:"SP100"},
{name:"ダートコーナー○",colA:"",colB:"SP100"},{name:"尻尾上がり",colA:"",colB:"SP100"},{name:"地固め",colA:"",colB:"SP100"},
{name:"ふり絞り",colA:"",colB:"SP100"},
{name:"十万バリキ",colA:"",colB:"SP120"},{name:"負けん気",colA:"",colB:"SP120"},{name:"一番乗り",colA:"",colB:"SP120"},
{name:"がんばり屋",colA:"",colB:"SP120"},{name:"先駆け",colA:"",colB:"SP120"},{name:"巧みなステップ",colA:"",colB:"SP120"},
{name:"直滑降",colA:"",colB:"SP120"},{name:"まき直し",colA:"",colB:"SP120"},{name:"急発進",colA:"",colB:"SP120"},
{name:"無二",colA:"",colB:"SP120"},{name:"無三",colA:"",colB:"SP120"},{name:"駆け降り",colA:"",colB:"SP120"},
{name:"登竜門",colA:"",colB:"SP120"},{name:"急降下",colA:"",colB:"SP120"},{name:"弾ける足取り",colA:"",colB:"SP120"},
{name:"余勢を駆って",colA:"",colB:"SP120"},{name:"華麗な足取り",colA:"",colB:"SP120"},
{name:"逃げ直線○",colA:"",colB:"SP130"},{name:"逃げコーナー○",colA:"",colB:"SP130"},{name:"先行直線○",colA:"",colB:"SP130"},
{name:"先行コーナー○",colA:"",colB:"SP130"},{name:"差し直線○",colA:"",colB:"SP130"},{name:"差しコーナー○",colA:"",colB:"SP130"},
{name:"追込直線○",colA:"",colB:"SP130"},{name:"追込コーナー○",colA:"",colB:"SP130"},{name:"逃げためらい",colA:"",colB:"SP130"},
{name:"逃げ焦り",colA:"",colB:"SP130"},{name:"逃げけん制",colA:"",colB:"SP130"}
];

// 集計グループの定義（テンプレート4〜6行目の集計行と同じ区分）
const GROUPS = [
  { key: "group-sp70",  filter: (s) => s.colB === "SP70" },
  { key: "group-midori", filter: (s) => s.colA === "緑" },
  { key: "group-all",   filter: () => true }
];

const fileInput = document.getElementById('file-input');
const dropLabel = document.getElementById('drop-label');
const preview = document.getElementById('preview');
const progressWrap = document.getElementById('progress-wrap');
const progressBar = document.getElementById('progress-bar');
const progressPct = document.getElementById('progress-pct');
const progressLabel = document.getElementById('progress-label');
const errorWrap = document.getElementById('error-wrap');
const manualText = document.getElementById('manual-text');
const matchBtn = document.getElementById('match-btn');
const resultWrap = document.getElementById('result-wrap');
const matchedChips = document.getElementById('matched-chips');

function setStatus(id, state, label) {
  const el = document.querySelector('#' + id + ' .status-badge');
  const colors = { ok: 'text-emerald-600', ng: 'text-red-600', pending: 'text-amber-600', idle: 'text-slate-300' };
  el.className = 'status-badge text-sm font-semibold ' + colors[state];
  el.textContent = label;
}
function showError(msg) {
  errorWrap.classList.remove('hidden');
  errorWrap.textContent = msg;
}

function runMatch(text) {
  const normalized = text.replace(/\s+/g, '');
  const matchedEntries = MASTER_SKILLS.filter(s => normalized.includes(s.name.replace(/\s+/g, '')));

  GROUPS.forEach(g => {
    const totalInGroup = MASTER_SKILLS.filter(g.filter).length;
    const matchedInGroup = matchedEntries.filter(g.filter).length;
    document.getElementById(g.key).textContent = matchedInGroup + ' / ' + totalInGroup;
  });

  matchedChips.innerHTML = '';
  matchedEntries.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200';
    chip.textContent = s.name;
    matchedChips.appendChild(chip);
  });
  if (matchedEntries.length === 0) {
    matchedChips.innerHTML = '<span class="text-xs text-slate-400">該当なし</span>';
  }
  resultWrap.classList.remove('hidden');
  setStatus('status-match', 'ok', '完了');
}

matchBtn.addEventListener('click', () => runMatch(manualText.value));

fileInput.addEventListener('change', async (e) => {
  errorWrap.classList.add('hidden');
  const file = e.target.files[0];
  if (!file) return;

  try {
    const url = URL.createObjectURL(file);
    preview.src = url;
    preview.classList.remove('hidden');
    dropLabel.textContent = file.name;
    setStatus('status-upload', 'ok', '成功');
  } catch (err) {
    setStatus('status-upload', 'ng', '失敗');
    showError('画像の読み込みに失敗しました: ' + err.message);
    return;
  }

  setStatus('status-ocr', 'pending', '処理中…');
  progressWrap.classList.remove('hidden');

  try {
    const { data } = await Tesseract.recognize(file, 'jpn+eng', {
      logger: (m) => {
        if (m.status) progressLabel.textContent = m.status;
        if (typeof m.progress === 'number') {
          const pct = Math.round(m.progress * 100);
          progressBar.style.width = pct + '%';
          progressPct.textContent = pct + '%';
        }
      }
    });
    setStatus('status-ocr', 'ok', '成功');
    manualText.value = data.text.trim();
    runMatch(data.text);
  } catch (err) {
    setStatus('status-ocr', 'ng', '失敗');
    showError('OCR処理に失敗しました: ' + err.message + '\n\n' +
      'この環境の制限による可能性があります。下の「テキストを直接入力」欄で照合ロジックのみ確認できます。');
  } finally {
    progressWrap.classList.add('hidden');
  }
});
</script>
</body>
</html>
