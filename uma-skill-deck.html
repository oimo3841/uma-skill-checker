<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>UmaSkill Deck</title>
	<!-- 共通スタイル（デザイントークン・共通部品）。Tailwindより先に読み込む。
	     Tailwindのユーティリティは @layer utilities に入るため、レイヤーに属さない
	     common.css の方が強い。読み込み順は common.css → Tailwind → 下の<style>で、
	     「共通の土台 → ユーティリティ → このページ固有の上書き」の三層になる。 -->
	<link rel="stylesheet" href="css/common.css?v=2026-09-10g" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.1.11/index.global.js"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<!-- 共有モジュール（データ層・テンプレート管理UI・レコード書き込み。special.htmlのDeck連携モードと共有） -->
	<script src="js/uma-skill-deck-core.js?v=2026-09-11f"></script>
	<script src="js/uma-skill-deck.js?v=2026-09-11a"></script>
	<style>
		/* Tailwind の hidden と同義。CDNを読めなかった場合でも非表示要素が
		   全部見えてしまわないための保険で、このページは意図的に残している。
		   （css/common.css にも html:not(.uma-tw-ready) 限定の同趣旨の保険があるが、
		     こちらは常時有効。このページには hidden と sm:inline を併記した要素が
		     無いため、常に効かせても既存の挙動は変わらない） */
		.hidden { display: none !important; }

		/* ページの地。UmaSkill Deck は「評価して比較する」画面なので藍系。
		   作り（淡い色面＋放射グラデーション）は UmaStar OCR と共通で、色相だけが違う。 */
		body {
			background-color: #f5f6fb;
			background-image:
				radial-gradient(ellipse 720px 300px at 50% -4%, rgba(199, 210, 250, 0.55), transparent 70%),
				linear-gradient(180deg, #f1f3fc 0%, #f8f9fd 42%, #ffffff 100%);
			background-repeat: no-repeat;
			background-attachment: fixed;
		}

		/* このツールのアクセント。共通部品はこの変数を見て色が決まる。
		   値は Tailwind v4.1.11 のパレット実測値。 */
		:root {
			--uma-accent: #4f39f6;            /* indigo-600 */
			--uma-accent-hover: #432dd7;      /* indigo-700 */
			--uma-accent-soft: #eef2ff;       /* indigo-50  */
			--uma-accent-soft-text: #432dd7;  /* indigo-700 */
			--uma-accent-border: #c6d2ff;     /* indigo-200 */
			--uma-accent-ring: #4f39f6;       /* indigo-600 */
		}

		/* .glass-card / .icon-btn / 入力欄の一括指定は css/common.css へ移した。
		   （.icon-btn は .uma-icon-btn、入力欄は .uma-input を併記して使う） */

		/* タブ。3つ横並びの切り替えで、この画面にしか出てこないためここに置く。 */
		.tab-btn {
			padding: var(--uma-sp-2) var(--uma-sp-1);
			border-radius: var(--uma-r-lg);
			font-size: var(--uma-fs-sm);
			line-height: var(--uma-lh-sm);
			font-weight: 500;
			text-align: center;
			color: var(--uma-text-muted);
			background: var(--uma-surface);
			border: 1px solid var(--uma-border);
			cursor: pointer;
			transition: background-color var(--uma-transition), border-color var(--uma-transition), color var(--uma-transition);
		}
		.tab-btn:hover:not(.tab-active) { border-color: var(--uma-border-strong); background: var(--uma-surface-sunken); }
		.tab-active {
			background: var(--uma-accent-soft);
			color: var(--uma-accent-soft-text);
			border-color: var(--uma-accent-border);
			font-weight: 600;
		}

		/* 一覧の行の見た目は css/common.css の .uma-list-row が持つ。
		   （core.js の .usd-list-card と同じ定義が二重にあったため一本化した） */

		/* ============================================================
		 * 比較シートのグリッド
		 *
		 * 構造: <table> ではなく div + CSS Grid。
		 *   <tr> への角丸指定はブラウザに無視されるため、行全体を1枚のカードで
		 *   囲む見せ方ができない。加えて sticky 列と「行を囲む枠」は相性が悪く、
		 *   横スクロールすると枠が途中で千切れて見える。そこで「行を囲む」のを
		 *   やめ、情報セルと値タイルをそれぞれ独立した角丸要素にしてカード感を出す。
		 *
		 * 行の地色: tr が無いので、行の全セルに --row-bg を直接付ける。
		 *   sticky セルにも同じ変数が効くので、下を通過する要素が透けない。
		 *   後から「効果タイプで行を色分け」を足すときは、この --row-bg の
		 *   付け方を変えるだけで済む（セル側の規則は無改修）。
		 *
		 * 色: 生のhexは書かない。すべて css/common.css のトークン経由で参照する
		 *   （F-19: Tailwind v4 と v3 でパレット実値が違い、直書きは静かにズレる）。
		 *   ★の色 --uma-star / --uma-star-empty は common.css に既にある。
		 * ============================================================ */
		.deck-grid-wrap {
			overflow: auto;
			max-height: 60vh;
			border: 1px solid var(--uma-border);
			border-radius: var(--uma-r-lg);
			box-shadow: var(--uma-shadow-1);
			background: var(--uma-surface);
		}
		/* 列幅: 情報セル192px ＋ 候補列76px×人数 ＋ 余りを埋める列。
		   列数はJSが --deck-cand-count に入れる。
		   モックアップの情報セルは168pxだが、実物には「行（スキル）の削除」ボタンが
		   あるぶん幅が要る。末尾の 1fr は、候補が少ないときに行の地色（ゼブラ）を
		   右端まで届かせるためのもので、JS側が空セルを1つ出す。 */
		.deck-grid {
			display: grid;
			grid-template-columns: 192px repeat(var(--deck-cand-count, 1), 76px) minmax(0, 1fr);
			width: 100%;
			min-width: min-content;
		}
		/* 候補0人のとき。repeat() は0を受け付けない（宣言ごと無効になる）ので、
		   候補列を持たない定義に差し替える。JS側も行ごとに
		   「情報セル＋余り列」の2つしか出さないため、両者の数が合っていないと
		   セルが1つずつ隣の列へずれて重なって見える。 */
		.deck-grid--no-cand { grid-template-columns: 192px minmax(0, 1fr); }
		.deck-cell {
			display: flex;
			align-items: center;
			justify-content: center;
			/* グリッド項目の既定は min-width:auto で、中身の最小幅までしか縮まない。
			   これがあると情報セルがトラック幅(168px)を超えて広がり、
			   スキル名のクリップ（6文字ぶん）が一切効かなくなる。 */
			min-width: 0;
			padding: var(--uma-sp-2) var(--uma-sp-1);
			background: var(--row-bg, var(--uma-surface));
			/* 横のヘアラインのみ。縦の罫線は引かない（v7準拠） */
			border-bottom: 1px solid var(--uma-border);
		}
		.deck-row-a { --row-bg: var(--uma-surface); }
		.deck-row-b { --row-bg: var(--uma-surface-sunken); }

		/* ---- ヘッダー行（候補名）: 上端固定 ---- */
		.deck-head {
			position: sticky; top: 0; z-index: 3;
			--row-bg: var(--uma-surface-muted);
			padding-top: var(--uma-sp-3);
			font-size: var(--uma-fs-sm); font-weight: 700;
			color: var(--uma-text-subtle);
		}
		/* 左上の角。top と left の両方で固定されるので、他より1段高くして最優先にする。 */
		.deck-corner {
			position: sticky; top: 0; left: 0; z-index: 4;
			justify-content: flex-start;
			padding-left: var(--uma-sp-3);
		}

		/* ---- 情報セル（スキル名＋計）: 左端固定 ---- */
		.deck-info {
			position: sticky; left: 0; z-index: 2;
			justify-content: space-between;
			gap: var(--uma-sp-2);
			padding: var(--uma-sp-2-5) var(--uma-sp-3);
		}
		.deck-name {
			display: flex; align-items: center; gap: var(--uma-sp-2);
			flex: 1 1 auto; min-width: 0;
			font-size: var(--uma-fs-md); font-weight: 500;
		}
		/* 行（スキル）の削除。情報セルの右端に小さく添える。 */
		.deck-name-del {
			flex: 0 0 auto; padding: 0; background: none; border: none;
			color: var(--uma-text-faint); cursor: pointer; line-height: 0;
		}
		.deck-name-del:hover { color: var(--uma-text-muted); }
		/* 効果タイプのドット。色分けは別フェーズなので、今はプレースホルダーの1色。 */
		.deck-cat-dot {
			width: 8px; height: 8px; border-radius: var(--uma-r-full);
			flex: 0 0 auto;
			background: var(--uma-border-strong);
		}

		/* ---- スキル名のフェード表示 ----
		   約6文字ぶんの幅でクリップし、実際にはみ出しているものだけ右端をフェードさせる。
		   .is-truncated は JS が scrollWidth/clientWidth の実測で付ける（文字数の決め打ちはしない）。 */
		.deck-name-wrap { position: relative; min-width: 0; }
		/* 6em = 全角6文字ぶん。実フォント（14px）での実測値で決めている:
		   漢字6文字=84px(=6em) / 東京レース場○(7文字)=86px / 漢字7文字=98px。
		   6.4em(89.6px)だと7文字の「東京レース場○」まで収まってしまい、
		   フェードが一度も効かなかった。 */
		.deck-name-clip {
			display: block; max-width: 6em;
			overflow: hidden; white-space: nowrap;
			background: none; border: none; padding: 0;
			font: inherit; color: inherit; text-align: left;
			cursor: default;
		}
		.deck-name-wrap.is-truncated .deck-name-clip {
			-webkit-mask-image: linear-gradient(to right, black 72%, transparent 100%);
			mask-image: linear-gradient(to right, black 72%, transparent 100%);
			cursor: pointer;
		}

		/* ---- 計バッジ ----
		   0=控えめなグレー / 1以上=薄い藍。値タイル（彩度の高い★）より弱いトーンに留め、
		   「値タイルが主役・計は補助」という序列を保つ。切り替えは実色のみ（opacity不使用）。 */
		.deck-total {
			flex: 0 0 auto;
			min-width: 22px; text-align: center;
			padding: var(--uma-sp-1) var(--uma-sp-2);
			border-radius: var(--uma-r-md);
			font-size: var(--uma-fs-md); font-weight: 700;
			background: var(--uma-surface-muted); color: var(--uma-text-subtle);
			transition: background-color var(--uma-transition), color var(--uma-transition);
		}
		.deck-total--on { background: var(--uma-accent-soft); color: var(--uma-accent-soft-text); }

		/* ---- 候補名チップ ----
		   ヘッダーの地色（--uma-surface-muted）から明確に浮かせるため、
		   Deckのアクセント（藍）の淡い面と枠線を当てる。 */
		.deck-cand-pill {
			position: relative;
			display: inline-flex; align-items: center; gap: var(--uma-sp-1);
			max-width: 100%;
			padding: var(--uma-sp-1) var(--uma-sp-2-5);
			border: 1px solid var(--uma-accent-border);
			border-radius: var(--uma-r-full);
			background: var(--uma-accent-soft);
			font-size: var(--uma-fs-xs); font-weight: 700;
			color: var(--uma-text);
		}
		.deck-cand-pill input[type=checkbox] {
			width: 11px; height: 11px; margin: 0; flex: 0 0 auto;
			accent-color: var(--uma-accent);
		}
		.deck-cand-name {
			background: none; border: none; padding: 0;
			font: inherit; color: inherit; cursor: pointer;
			overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
		}
		.deck-cand-x {
			position: absolute; top: -6px; right: -6px;
			width: 15px; height: 15px; padding: 0;
			border: 1px solid var(--uma-accent-border);
			border-radius: var(--uma-r-full);
			background: var(--uma-surface);
			color: var(--uma-text-subtle);
			font-size: var(--uma-fs-2xs); line-height: 1;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer;
		}
		.deck-cand-x:hover { border-color: var(--uma-border-strong); color: var(--uma-text); }

		/* ---- 値タイル（★） ----
		   1タップで 0→1→2→3→0 と巡回する（js/uma-skill-deck.js の cycleStar）。
		   <button> なので Tab移動・Enter・Space が素で効く。 */
		.star-tile {
			position: relative;
			width: 42px; height: 38px;
			border: none; border-radius: var(--uma-r-md);
			padding: 0;
			display: flex; align-items: center; justify-content: center;
			background: var(--uma-surface-muted);
			cursor: pointer; user-select: none;
			transition: transform 80ms ease, background-color var(--uma-transition);
		}
		.star-tile:hover { background: var(--uma-border); }
		.star-tile:active { transform: scale(.92); }
		.star-tile:focus-visible { outline: 2px solid var(--uma-accent-ring); outline-offset: 1px; }
		/* Lv0 は控えめな☆1個、Lv1〜3 は★。Lv3 だけ「上1・下2」のピラミッド配置。 */
		.star-off { font-size: 14px; line-height: 1; color: var(--uma-star-empty); }
		.star-on { color: var(--uma-star); }
		.star-single { font-size: 17px; line-height: 1; }
		.star-pair { display: flex; gap: 3px; line-height: 1; }
		.star-pair span { font-size: 14px; }
		.star-pyramid { display: flex; flex-direction: column; align-items: center; }
		.star-pyramid .star-top { font-size: 12px; line-height: 1; }
		.star-pyramid .star-bottom { display: flex; gap: 2px; line-height: 1; margin-top: -2px; }
		.star-pyramid .star-bottom span { font-size: 12px; }

		/* ---- 手動修正の可視化 ----
		   OCRが読んだ値から人が動かしたセルを示す。★の色を変えるのではなく
		   タイルの枠線（リング）で示している。色相の変化（黄→赤）だけに頼ると
		   判別しづらい人がいるため、「枠があるか無いか」という形の違いで分かるようにする。
		   右上の点は、離れた位置からでも「直したセルがある」と気づくための補助。
		   枠は inset の box-shadow で描く。border だと 42×38px の内寸が変わり、
		   ★の位置が修正の有無でずれてしまうため。 */
		.star-tile.is-edited { box-shadow: inset 0 0 0 2px var(--uma-danger-text); }
		.star-tile.is-edited::after {
			content: "";
			position: absolute; top: -3px; right: -3px;
			width: 7px; height: 7px; border-radius: var(--uma-r-full);
			background: var(--uma-danger-text);
			border: 1.5px solid var(--uma-surface);
		}
		/* 無効にした候補の列では、修正の印も他と同じく彩度を落とす
		   （比較対象から外した列が視線を集めないようにする）。 */
		.col-disabled .star-tile.is-edited { box-shadow: inset 0 0 0 2px var(--uma-danger-border); }
		.col-disabled .star-tile.is-edited::after { background: var(--uma-danger-border); }

		/* ---- 無効にした候補の列 ----
		   注意: sticky を使うグリッド内では opacity<1 を使わないこと。
		   opacity は新しいスタッキングコンテキストを生成し、sticky要素間の
		   z-index順序を壊すため、スクロール時に別セルが手前に描画される
		   不具合の原因になる。無効状態の表現は実色の変更のみで行う。 */
		.deck-cell.col-disabled { --row-bg: var(--uma-surface-muted); }
		.col-disabled, .col-disabled * { color: var(--uma-text-faint); }
		.col-disabled .deck-cand-pill { background: var(--uma-surface); border-color: var(--uma-border); }
		/* 無効列の★も、0/1以上の区別は残しつつ彩度を落として前に出させない。
		   詳細度(0,2,0)なので .star-on(0,1,0) に必ず勝つ。 */
		.col-disabled .star-on { color: var(--uma-border-strong); }
		.col-disabled .star-tile { background: var(--uma-surface-muted); }

		/* ---- スマホ幅 ----
		   デスクトップの目安値（情報192px・候補76px）のままだと 375px で候補が
		   1列強しか見えず、「複数候補を並べて見比べる」という用途を満たさない。
		   タップ領域そのもの（タイル42×38px）は縮めず、その周りの余白と
		   情報セルだけを詰めて、候補が2列見えるようにする。 */
		@media (max-width: 480px) {
			.deck-grid {
				grid-template-columns: 148px repeat(var(--deck-cand-count, 1), 64px) minmax(0, 1fr);
			}
			.deck-grid--no-cand { grid-template-columns: 148px minmax(0, 1fr); }
			.deck-info { padding-left: var(--uma-sp-2); padding-right: var(--uma-sp-2); }
			.deck-corner { padding-left: var(--uma-sp-2); }
			/* 4em = 全角4文字ぶん。狭い幅では名前より候補の見比べを優先し、
			   はみ出しはフェード＋タップでの全文表示に任せる。 */
			.deck-name-clip { max-width: 4em; }
		}

		/* ---- コントロールエリア ----
		   .uma-pill / .uma-btn は special.html と共有する共通部品なので本体は触らず、
		   Deck側のクラスにだけ「丸く・影あり」を上書きする。 */
		.row-filter-btn, .deck-pill-btn {
			border-radius: var(--uma-r-full);
			box-shadow: var(--uma-shadow-1);
		}
		/* 行の絞り込みは .uma-pill（UmaStar OCR の結果表と同じ形）を併記して使う。
		   選択状態は .active（js/uma-skill-deck.js が付け外しする）。 */
	</style>
</head>
<body class="min-h-screen">
	<div class="max-w-3xl mx-auto p-4 md:p-6">
		<header class="flex items-center justify-between mb-4">
			<div>
				<h1 class="text-lg font-bold text-slate-800">UmaSkill Deck</h1>
				<p class="text-xs text-slate-400" id="js-version-note"></p>
			</div>
		</header>

		<nav class="grid grid-cols-3 gap-2 mb-5">
			<button id="tab-btn-template" class="tab-btn tab-active" onclick="switchTab('template')">テンプレート</button>
			<button id="tab-btn-record" class="tab-btn" onclick="switchTab('record')">比較シート</button>
			<button id="tab-btn-data" class="tab-btn" onclick="switchTab('data')">データ管理</button>
		</nav>

		<!-- ============ テンプレートタブ ============ -->
		<!-- 中身（一覧・編集・スキル選択モーダル）は js/uma-skill-deck-core.js が描画する。
		     special.html のDeck連携モードと同じコンポーネントを共有するため、
		     このページ側にはマークアップを持たない。 -->
		<section id="tab-panel-template">
			<div id="template-panel-root"></div>
		</section>

		<!-- ============ 比較シートタブ ============ -->
		<section id="tab-panel-record" class="hidden">
			<div id="record-list-view">
				<div class="flex items-center gap-2 mb-3">
					<select id="record-new-template-select" class="uma-input flex-1"></select>
					<button id="record-new-btn" onclick="createRecordFromTemplate()" class="uma-btn uma-btn--primary whitespace-nowrap">＋ 新規作成</button>
				</div>
				<p class="text-xs text-slate-500 mb-2" id="record-count-badge"></p>
				<div id="record-list"></div>
			</div>
			<div id="record-editor-view" class="hidden glass-card">
				<div class="flex items-center gap-2 mb-2">
					<button onclick="closeRecordEditor()" class="icon-btn uma-icon-btn"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
					<input id="record-name-input" onchange="onRecordNameChange()" class="uma-input flex-1"/>
				</div>
				<div class="flex items-center gap-2 mb-3 text-xs">
					<span class="text-slate-500 whitespace-nowrap">テンプレート：</span>
					<select id="record-template-select" onchange="switchRecordTemplate(this.value)" class="uma-input" style="width:auto;"></select>
				</div>
				<!-- スキルを足す入口はテンプレート編集画面と同じ3つ（条件／テキスト／手入力）。
				     片方だけ1ボタンのままにすると、この画面からテキスト検索と手入力へ行けなくなる。 -->
				<div class="flex flex-wrap gap-2 mb-2">
					<button onclick="openRecordSkillPicker()" class="uma-btn uma-btn--secondary deck-pill-btn">
						<i data-lucide="filter" class="w-3.5 h-3.5" style="display:inline;vertical-align:-2px;"></i> 条件でスキルを検索
					</button>
					<button onclick="openRecordTextPicker()" class="uma-btn uma-btn--secondary deck-pill-btn">
						<i data-lucide="file-text" class="w-3.5 h-3.5" style="display:inline;vertical-align:-2px;"></i> テキストで検索
					</button>
					<button onclick="openRecordCustomSkill()" class="uma-btn uma-btn--secondary deck-pill-btn">
						<i data-lucide="plus" class="w-3.5 h-3.5" style="display:inline;vertical-align:-2px;"></i> マスターにないスキルを追加
					</button>
				</div>
				<div class="flex flex-wrap gap-2 mb-2">
					<div class="flex items-center gap-1.5 flex-1 min-w-[160px]">
						<input id="candidate-label-input" placeholder="候補の名前（例：親A）" class="uma-input flex-1"/>
						<button onclick="addCandidate()" class="uma-btn uma-btn--secondary whitespace-nowrap">＋ 候補</button>
					</div>
				</div>
				<p id="record-enabled-count" class="text-xs text-slate-500 mb-2"></p>
				<div class="flex gap-1.5 mb-3" role="group" aria-label="行の絞り込み">
					<button onclick="setRecordRowFilter('all')" class="row-filter-btn uma-pill" data-mode="all">すべて</button>
					<button onclick="setRecordRowFilter('zero')" class="row-filter-btn uma-pill" data-mode="zero">不足のみ（計0）</button>
					<button onclick="setRecordRowFilter('nonzero')" class="row-filter-btn uma-pill" data-mode="nonzero">充足あり（計1+）</button>
				</div>
				<!-- グリッドについての案内（候補が0人、絞り込みで0件など）。
				     スクロールボックスの中に置くと、スキルが多いときに下へ流れて
				     画面外になり読まれない。枠の外・上に出す。 -->
				<p id="record-grid-note" class="hidden text-xs text-slate-500 mb-2"></p>
				<div id="record-grid-wrap" class="deck-grid-wrap"></div>
			</div>
		</section>

		<!-- ============ データ管理タブ ============ -->
		<section id="tab-panel-data" class="hidden">
			<div class="glass-card mb-4">
				<p class="text-sm font-semibold text-slate-700 mb-2">保存件数</p>
				<p class="text-xs text-slate-500">テンプレート：<span id="data-template-count"></span>／比較シート：<span id="data-record-count"></span>／カスタムスキル：<span id="data-custom-count"></span></p>
			</div>
			<div class="glass-card mb-4">
				<p class="text-sm font-semibold text-slate-700 mb-2">マスタースキルデータ</p>
				<p class="text-xs text-slate-500 mb-2">版：<span id="data-master-version"></span>／取得日時：<span id="data-master-fetched"></span></p>
				<button onclick="refreshMasterData()" class="uma-btn uma-btn--secondary">
					<i data-lucide="refresh-cw" class="w-3.5 h-3.5" style="display:inline;vertical-align:-2px;"></i> 再取得
				</button>
			</div>
			<div class="glass-card mb-4">
				<p class="text-sm font-semibold text-slate-700 mb-2">エクスポート</p>
				<textarea id="export-textarea" class="uma-input w-full h-28 font-mono" readonly></textarea>
				<div class="flex gap-2 mt-2">
					<button onclick="exportData()" class="uma-btn uma-btn--secondary">表示する</button>
					<button onclick="copyExportData()" class="uma-btn uma-btn--secondary">コピー</button>
				</div>
			</div>
			<div class="glass-card">
				<p class="text-sm font-semibold text-slate-700 mb-2">インポート</p>
				<textarea id="import-textarea" placeholder="エクスポートしたJSON文字列を貼り付け" class="uma-input w-full h-28 font-mono"></textarea>
				<button onclick="importData()" class="uma-btn uma-btn--primary mt-2">読み込む（現在のデータを置き換える）</button>
			</div>
		</section>
	</div>

	<!-- ============ 候補フルネーム表示（タップで一時的に表示） ============ -->
	<div id="name-reveal-tip" class="hidden" style="position:fixed;z-index:70;background:var(--uma-surface-inverse);color:var(--uma-text-inverse);font-size:var(--uma-fs-xs);padding:var(--uma-sp-1) var(--uma-sp-2);border-radius:var(--uma-r-sm);white-space:nowrap;pointer-events:none;"></div>

	<!-- ============ Undoボタン（履歴がある間、常時表示） ============ -->
	<button id="undo-button" onclick="performUndo()" class="hidden fixed bottom-6 left-6 z-[60] flex items-center gap-2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg">
		<i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
		<span>元に戻す</span>
		<span id="undo-count-badge" class="bg-white/20 rounded-full px-1.5 text-[10px]"></span>
	</button>

	<!-- ============ トースト通知 ============ -->
	<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-16 opacity-0 pointer-events-none transition-all bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-[60]">
		<span id="toast-message"></span>
	</div>
</body>
</html>
