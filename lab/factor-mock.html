	<title>②因子周回の調和のモック（作業用）</title>
	<!--
		UmaStar（special）の②因子周回の画面を①本育成編成の画面にそろえ、並べ替えの操作を直す案の試し描き（モック・T45）。
		おいもさんが見て決めるための作業用のページ。**ツール本体には組み込まない**（どのページからもリンクしない）。保存は無い。外へは何も送らない。

		作り: special.html を「セット名 LoHトプロ・①に [陣風の花紺青]ダイワスカーレットとカード6枚・距離／脚質／バ場 長距離／逃げ／芝・
		②はオススメサポで「追加」（残りの枠に1枚指定・22種）・継承固有 5種 Lv3・共通スキルのヒントLv 3」にした状態で、
		①・②（タイル）・②（星取表）・オススメサポの枚数の小窓の HTML と、ページの CSS（css/ の3つ・Tailwind・ページの <style>・core が差し込む CSS）を
		2026-10-31 の origin/main（core 2026-10-31i）から Playwright で写し取った（下の cap-*。読み込むときに場面の側だけを入れる）。
		写しなので、製品を変えてもこのページは変わらない。その上にモックの差分（<style id="t45-css"> と <script id="t45-js">）を当てている。

		引数: ?scene=1now|1new|1sort|2tnow|2tnew|2sort|2gnow|2gnew|count（既定 2tnew）
		      ?fit=a|b|c|d（②の合計の行の案。既定 d）・?pin=0（枚数の小窓で、残りの枠の指定が無い形）・?theme=light|dark・?guide=0（案内を閉じておく）・?shot=1（案内を隠す）
	-->
	<style id="t45-css">
/* ===== T45 のモックの差分（ここから下だけがモックの追加。上の写しは 2026-10-31 の origin/main〔core 2026-10-31i〕） ===== */
/* 色は今のトークン（--uma-*）だけ。新しい色は使わない（恒久ルール30）。選択の表現はベースカラー（--uma-control*）／モノトーン、緑はパッシブだけ */
.t45-hidden { display: none !important; }

/* ---- モックの案内（左上） ---- */
.t45-guide { position: fixed; left: 8px; top: 8px; z-index: 2147483000; max-width: min(340px, calc(100vw - 16px)); font-size: 12px; line-height: 1.5;
	background: var(--uma-surface); color: var(--uma-text); border: 1px solid var(--uma-border-strong); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.t45-guide-toggle { display: block; min-height: 32px; padding: 4px 10px; font: inherit; font-weight: 700; color: var(--uma-text-heading); background: transparent; border: 0; cursor: pointer; }
.t45-guide-body { padding: 0 10px 10px; display: grid; gap: 6px; max-height: calc(100vh - 60px); overflow: auto; }
.t45-guide[data-open="0"] .t45-guide-body { display: none; }
.t45-guide label { display: grid; gap: 2px; font-weight: 600; color: var(--uma-text-heading); }
.t45-guide select { font: inherit; min-height: 32px; padding: 2px 6px; border: 1px solid var(--uma-border-strong); border-radius: 6px; background: var(--uma-surface); color: var(--uma-text); }
.t45-guide p { margin: 0; color: var(--uma-text-muted); }
.t45-guide .t45-guide-row { display: flex; gap: 6px; flex-wrap: wrap; }
.t45-guide .t45-guide-row button { font: inherit; min-height: 32px; padding: 2px 10px; border: 1px solid var(--uma-border-strong); border-radius: 6px; background: var(--uma-surface); color: var(--uma-text-heading); cursor: pointer; }
.t45-guide .t45-guide-row button[aria-pressed="true"] { background: var(--uma-control); border-color: var(--uma-control-edge); color: var(--uma-control-text); }

/* ---- (1)(2) 合計の行: ［N Pt／N種］［?］［継承固有｜X種｜LvX］［共通スキル｜LvX］［↺］の1行 ---- */
.t45-head .usd-band-main { flex-wrap: nowrap; gap: 6px; }
.t45-cfg { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.t45-seg { display: inline-flex; align-items: center; min-height: 28px; padding-inline: 10px 2px; border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-full);
	background: var(--uma-surface); color: var(--uma-text-heading); font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600; white-space: nowrap; }
.t45-seg-label { white-space: nowrap; padding-right: 4px; }
/* 押すたびに1つ増える部品（今の select から ▾ を無くした形。区切りの線は今のまま） */
.t45-step { position: relative; font: inherit; color: inherit; background: transparent; border: 0; border-left: 1px solid var(--uma-border); border-radius: 0; margin: 0;
	padding: 0 6px; min-height: 26px; cursor: pointer; font-variant-numeric: tabular-nums; }
.t45-step:last-child { border-radius: 0 var(--uma-r-full) var(--uma-r-full) 0; padding-right: 8px; }
.t45-step:hover { background: var(--uma-surface-muted); }
.t45-step:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: 1px; }
/* 押せる範囲は高さ 44px 以上（見た目は 26〜28px のまま。上下に 9px ずつ広げる） */
.t45-step::before, .t45-head .t45-reset::before, .t45-head .usd-band-help::before, .t45-sumbtn::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px; }
.t45-head .t45-reset, .t45-head .usd-band-help { position: relative; flex: none; }
/* 合計の数字を押すと「?」の小窓（①の合計と同じ形。案c） */
.t45-sumbtn { position: relative; display: inline-flex; align-items: baseline; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--uma-text-subtle); text-underline-offset: 3px; }
.t45-sumbtn:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: 2px; }
/* 案b: 字を詰める（今の fit=1〜2 と同じ大きさ） */
.t45-head:is([data-t45-fit="b"], [data-t45-fit="c"], [data-t45-fit="d"]) .t45-seg { font-size: 11px; padding-inline: 7px 1px; }
.t45-head:is([data-t45-fit="b"], [data-t45-fit="c"], [data-t45-fit="d"]) .t45-step { padding: 0 4px; }
.t45-head:is([data-t45-fit="b"], [data-t45-fit="c"], [data-t45-fit="d"]) .t45-step:last-child { padding-right: 6px; }
.t45-head:is([data-t45-fit="b"], [data-t45-fit="c"], [data-t45-fit="d"]) :is(.usd-band-main, .t45-cfg) { gap: 4px; }
.t45-head:is([data-t45-fit="b"], [data-t45-fit="c"], [data-t45-fit="d"]) .usd-band-pt { font-size: 20px; }
/* 案c: ラベルを2段の小さな字（部品の高さ 28px の中に収める） */
.t45-head[data-t45-fit="c"] .t45-seg-label { display: inline-grid; line-height: 1.05; font-size: 9.5px; text-align: center; padding-right: 3px; }
.t45-head[data-t45-fit="c"] .t45-seg { padding-inline: 6px 1px; }

/* ---- (3) ②のサポートカードのパネル（①の .usd-roster-slots と同じ部品。育成ウマ娘のパネルは無い） ---- */
.t45-fcards { min-width: 0; }
.t45-fcards .usd-roster-lower { padding: 0; }
.t45-fcards-head { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 12px; color: var(--uma-text-muted); }
.t45-fcards-head .t45-fcards-from { margin-left: auto; }

/* ---- (5)(6) 並べ替えの入口とアイコン（列見出しの「スキル名」の右。押せる高さは 44px 以上） ---- */
.t45-tones { display: inline-flex; align-items: stretch; margin-left: auto; align-self: stretch; }
.t45-tonebtn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 17px; min-height: 44px; padding: 0 1px; border: 0; background: transparent;
	color: var(--uma-text-muted); cursor: pointer; border-radius: 6px; }
.t45-tonebtn:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; }
.t45-tonebtn svg, .t45-tonebtn .usd-roster-toneicon { pointer-events: none; }
.t45-tonebtn[aria-pressed="true"] { background: var(--uma-control); color: var(--uma-control-text); }
.t45-tonebtn[aria-pressed="true"] .usd-roster-toneicon { box-shadow: 0 0 0 1px var(--uma-control-text); border-radius: 4px; }
.t45-sortentry { min-width: 22px; color: var(--uma-text-heading); }
.t45-sortentry svg { width: 15px; height: 15px; }
.t45-gh-flex { display: flex !important; align-items: center; gap: 2px; }
.t45-gh-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- 小窓（並べ替え・枚数・カードの指定）。今の小窓の部品（.uma-popover）を使い、位置だけモックが決める ---- */
.t45-back { position: fixed; inset: 0; z-index: 2147482000; background: transparent; }
.t45-pop { position: fixed; z-index: 2147482500; width: min(320px, calc(100vw - 16px)); }
.t45-sortlist { display: flex; flex-direction: column; gap: 6px; }
.t45-sortopt { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-md);
	background: var(--uma-surface); cursor: pointer; color: var(--uma-text-heading); font-weight: 600; }
.t45-sortopt input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--uma-control); }
.t45-sortopt[data-on="1"] { border-color: var(--uma-control-mark); box-shadow: inset 0 0 0 1px var(--uma-control-mark); background: var(--uma-control-soft); }
.t45-sortopt .usd-roster-toneicon { flex: none; }
.t45-sortopt small { display: block; font-weight: 400; color: var(--uma-text-muted); font-size: 11px; }
.t45-cardlist { display: grid; gap: 6px; }
.t45-cardpick { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-md); background: var(--uma-surface);
	color: var(--uma-text-heading); font: inherit; text-align: left; cursor: pointer; }
.t45-cardpick:disabled { opacity: .45; cursor: not-allowed; }
.t45-cardpick img { width: 20px; height: 20px; flex: none; }
.t45-cardpick small { color: var(--uma-text-muted); }
.t45-note { margin: 8px 0 0; font-size: 11px; color: var(--uma-text-muted); }
/* 小窓の中の並べ替えのアイコンにも、列見出しと同じ色（core の .usd-roster-grid の値の写し） */
.t45-pop { --usd-tone-icon-heal: #2a7fd4; --usd-tone-icon-debuff: #d4363f; --usd-tone-icon-fg: #ffffff; --usd-tone-icon-passive: var(--uma-green-skill); --usd-tone-icon-circle: var(--uma-text-heading); }
:root[data-theme="dark"] .t45-pop { --usd-tone-icon-heal: #4a9ef5; --usd-tone-icon-debuff: #f0605f; --usd-tone-icon-fg: #0f1318; }
/* 案d: 間隔をもう 1px 詰める（375px で 1px はみ出したため） */
.t45-head[data-t45-fit="d"] :is(.usd-band-main, .t45-cfg) { gap: 3px; }

	</style>

 data-usd-el="skill-info-btn" data-skill-id="396" aria-label="筆に任せての説明を開く" aria-expanded="false">筆に任せて</button></span></div><div class="usd-panel usd-panel--off" data-usd-el="factor-off-row" data-off-skill-id="397"><button type="button" class="usd-panel-offadd" data-usd-act="factor-enable" data-usd-el="factor-enable" data-off-skill-id="397" aria-label="ポイントマン（“オススメサポ”で除外されたスキル）を因子周回に追加する" title="ポイントマン（“オススメサポ”で除外されたスキル）を因子周回に追加する"><span class="usd-panel-offadd-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></button><span class="usd-panel-namescroll usd-hscroll" data-usd-no-trim="1" data-usd-entry-watched="1"><button type="button" class="usd-panel-namebtn usd-panel-namebtn--off" data-usd-info="397" title="ポイントマン" data-usd-el="skill-info-btn" data-skill-id="397" aria-label="ポイントマンの説明を開く" aria-expanded="false">ポイントマン</button></span></div><div class="usd-panel usd-panel--off" data-usd-el="factor-off-row" data-off-skill-id="422"><button type="button" class="usd-panel-offadd" data-usd-act="factor-enable" data-usd-el="factor-enable" data-off-skill-id="422" aria-label="レースの真髄・体（“オススメサポ”で除外されたスキル）を因子周回に追加する" title="レースの真髄・体（“オススメサポ”で除外されたスキル）を因子周回に追加する"><span class="usd-panel-offadd-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></button><span class="usd-panel-namescroll usd-hscroll" data-usd-no-trim="1" data-usd-entry-watched="1"><button type="button" class="usd-panel-namebtn usd-panel-namebtn--off" data-usd-info="422" title="レースの真髄・体" data-usd-el="skill-info-btn" data-skill-id="422" aria-label="レースの真髄・体の説明を開く" aria-expanded="false">レースの真髄・体</button></span></div><div class="usd-panel usd-panel--off" data-usd-el="factor-off-row" data-off-skill-id="427"><button type="button" class="usd-panel-offadd" data-usd-act="factor-enable" data-usd-el="factor-enable" data-off-skill-id="427" aria-label="陽の加護（“オススメサポ”で除外されたスキル）を因子周回に追加する" title="陽の加護（“オススメサポ”で除外されたスキル）を因子周回に追加する"><span class="usd-panel-offadd-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></button><span class="usd-panel-namescroll usd-hscroll" data-usd-no-trim="1" data-usd-entry-watched="1"><button type="button" class="usd-panel-namebtn usd-panel-namebtn--off" data-usd-info="427" title="陽の加護" data-usd-el="skill-info-btn" data-skill-id="427" aria-label="陽の加護の説明を開く" aria-expanded="false">陽の加護</button></span></div></div></div></div></div></div></div>
				<!-- スキルセットOCR（フェーズa コミット4・改訂）: ゲームの「スキルセット詳細」画面のスクショから白スキルを読み取り、
				     対象スキルセットへ足す。入口のボタン「スキルセットのスクショで追加」と「?」（撮影ガイド）は core の編集画面の
				     入口の並び（「テキストで検索」の後ろ。2026-09-27 に右隣の「未収録スキルを追加」を廃止したので、いまは並びの最後）に、createTemplateManager の
				     screenshotEntry で出す。ここにあるのは、そのボタンが呼ぶ部品（ファイル選択・進捗・画像単位の知らせ）。
				     読み取りは js/skillset-ocr.js、結果の選択と確定は core の openSkillRowsPicker（「テキストで検索」と同じ報告）。 -->
				<div id="deck-ocr-status">
					<input type="file" id="deck-ocr-files" accept="image/*" multiple="" hidden="">
					<p id="deck-ocr-progress" class="text-xs text-slate-500 mt-2" hidden=""></p>
					<!-- 画像単位の知らせ（4b）。因子OCRの画質警告（#quality-warn-wrap）と同じ見た目。表示は classList の hidden -->
					<div id="deck-ocr-warn" class="hidden mt-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 whitespace-pre-line flex gap-2">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-amber-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
						<div id="deck-ocr-warn-content"></div>
					</div>
					<!-- 文字を読み取れなかったスキルパネル（31セッション目）。確定文面4aの置き換え。
					     警告ではなく事実の知らせなので、4b の琥珀色ではなく落ち着いた地にする。
					     ここを要確認の行（ピッカーの中）とは**別の区画**にしたのは、注意書きが指している
					     「テキストで検索」「条件でスキルを検索」の入口がピッカーの外＝編集画面にあるため。
					     読み取れなかった行が1つ以上あるときだけ出す（0のときは見出しごと出さない）。 -->
					<div id="deck-ocr-panels" class="hidden mt-2 rounded-xl border border-slate-200 bg-slate-50 p-3">
						<p class="text-xs font-semibold text-slate-700">文字を読み取れなかったスキルパネル</p>
						<p class="mt-1 text-[11px] text-slate-500">すでに追加済みのものが含まれることがあります。必要なものは「テキストで検索」または「条件で検索」から追加してください。</p>
						<div id="deck-ocr-panels-list" class="mt-2 flex flex-wrap gap-2"></div>
					</div>
				</div>
				<!-- 「元に戻す」はここ（②のパネルの下・インライン）ではなく、画面左下に固定した #deck-undo-btn に移した
				     （C-55 の (4)(5)。①で除外したときにも同じ場所に出る）。
				     **同じ場所にあった選択の注記（#deck-selected-note・「✓「◯◯」のN種＋…を照合します」）は
				     68セッション目に削除した。** この注記に固有の情報が1つも無かったため ――
				     セット名は直前に自分で選んだ操作の繰り返し、因子・遺伝子の内訳は②の B・C のチェックが
				     すでに示している、「N種」は結果の「対象スキル数」カードが出している。
				     （切り替え直後に画面外へ出る問題も、これで消えた。位置の調整は要らなくなった。） -->
			</div>

			<!-- 誤認識の読み替え辞書（任意）。C-132: 新UIでは「スクショで追加」の小窓（#skillset-guide-dict）へ移す（enterDeckMode）。
			     旧UIではここ（#ocr-dict-home）に戻す。保存の形・中身・効く処理は変えない（id はそのまま） -->
			<div id="ocr-dict-home">
			
			</div><!-- /#ocr-dict-home -->

			</div><!-- /#step-panel-1 -->

			<!-- ステップ2：親A・祖A1・祖A2（＋任意で親B・祖B1・祖B2）の画像アップロード -->
			<div id="step-panel-2" class="step-panel" role="tabpanel" aria-labelledby="step-tab-2" hidden=""></div><!-- /#step-panel-2 -->
		</div>

	</div>

	

	<!-- ===== 引き出しパネル =====
	     行き先は3つとも同じ骨格（.uma-drawer）。背景の暗転は1枚を共有し、
	     同時に開くのは1つだけ。開閉は openDrawer() / closeDrawer() が管理する。 -->
	<div id="drawer-backdrop" class="uma-drawer-backdrop" hidden=""></div>

	<!-- 照合結果（★の数）。表の列が人数ぶん増えるので、他より広い引き出しにする。 -->
	<aside id="result-drawer" class="uma-drawer uma-drawer--wide" hidden="" role="dialog" aria-modal="true" aria-label="照合結果">
		<div class="uma-drawer-header">
			<div class="flex items-center gap-2 min-w-0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-4 h-4 text-green-600 shrink-0"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<p class="text-sm font-bold text-slate-800 truncate">照合結果（★の数）</p>
			</div>
			<div class="flex items-center gap-2 shrink-0">
				<button id="result-drawer-close" type="button" class="uma-btn uma-btn--secondary">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" aria-hidden="true" class="lucide lucide-x w-3.5 h-3.5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
					<span>閉じる</span>
				</button>
			</div>
		</div>
		<!-- 引き出しの中のタブ（C-62 の (9)）。**引き出しは2つのまま**で、押すともう一方の
		     引き出しへ切り替える（openDrawer が開いていた側を畳んでから開く）。
		     exam は1つの引き出しの中でパネルを切り替えるが（C-18）、special で同じ形にするのが
		     C-59 の段5 で、**段5 は引き続き見送り中**（理由と着手の条件は C-60 の6節）。
		     ここで作ったタブ帯は、段5 に着手したときにそのまま「1つの引き出しの中のタブ」になるので、
		     作り直しにはならない。
		     中身がまだ無い行き先は押せない（ラベルにも「（なし）」を出す）。未読の点はタブの右に出すので、
		     OCR＋結合を1回で走らせて照合結果が開いたとき、結合画像の側に点が見えて行けることが分かる。
		     骨格の CSS は css/shell.css（.drawer-tabs / .drawer-tab）。 -->
		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">
			<button type="button" role="tab" class="drawer-tab" id="result-tab-result" aria-selected="true" tabindex="0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<span id="result-tab-result-label">照合結果（なし）</span>
				<span id="result-tab-result-dot" class="uma-fab-dot" hidden=""></span>

	<!-- 画像結合レビュー（SNS投稿用・β）。中身は画像なのでDeckと同じ幅でよい。 -->

		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">

				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>

		<div class="uma-drawer-body">

		<!-- Deck へ向かうボタンだけは Deck 側のアクセント（藍）で塗り、行き先を色で示す。

		<button id="deck-drawer-trigger" type="button" class="uma-fab-item deck-accent" aria-controls="deck-drawer" aria-expanded="false">

				<!-- スキルセットOCR（フェーズa コミット4・改訂）: ゲームの「スキルセット詳細」画面のスクショから白スキルを読み取り、
				     対象スキルセットへ足す。入口のボタン「スキルセットのスクショで追加」と「?」（撮影ガイド）は core の編集画面の
				     入口の並び（「テキストで検索」の後ろ。2026-09-27 に右隣の「未収録スキルを追加」を廃止したので、いまは並びの最後）に、createTemplateManager の
				     screenshotEntry で出す。ここにあるのは、そのボタンが呼ぶ部品（ファイル選択・進捗・画像単位の知らせ）。
				     読み取りは js/skillset-ocr.js、結果の選択と確定は core の openSkillRowsPicker（「テキストで検索」と同じ報告）。 -->
				<div id="deck-ocr-status">
					<input type="file" id="deck-ocr-files" accept="image/*" multiple="" hidden="">
					<p id="deck-ocr-progress" class="text-xs text-slate-500 mt-2" hidden=""></p>
					<!-- 画像単位の知らせ（4b）。因子OCRの画質警告（#quality-warn-wrap）と同じ見た目。表示は classList の hidden -->
					<div id="deck-ocr-warn" class="hidden mt-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 whitespace-pre-line flex gap-2">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-amber-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
						<div id="deck-ocr-warn-content"></div>
					</div>
					<!-- 文字を読み取れなかったスキルパネル（31セッション目）。確定文面4aの置き換え。
					     警告ではなく事実の知らせなので、4b の琥珀色ではなく落ち着いた地にする。
					     ここを要確認の行（ピッカーの中）とは**別の区画**にしたのは、注意書きが指している
					     「テキストで検索」「条件でスキルを検索」の入口がピッカーの外＝編集画面にあるため。
					     読み取れなかった行が1つ以上あるときだけ出す（0のときは見出しごと出さない）。 -->
					<div id="deck-ocr-panels" class="hidden mt-2 rounded-xl border border-slate-200 bg-slate-50 p-3">
						<p class="text-xs font-semibold text-slate-700">文字を読み取れなかったスキルパネル</p>
						<p class="mt-1 text-[11px] text-slate-500">すでに追加済みのものが含まれることがあります。必要なものは「テキストで検索」または「条件で検索」から追加してください。</p>
						<div id="deck-ocr-panels-list" class="mt-2 flex flex-wrap gap-2"></div>
					</div>
				</div>
				<!-- 「元に戻す」はここ（②のパネルの下・インライン）ではなく、画面左下に固定した #deck-undo-btn に移した
				     （C-55 の (4)(5)。①で除外したときにも同じ場所に出る）。
				     **同じ場所にあった選択の注記（#deck-selected-note・「✓「◯◯」のN種＋…を照合します」）は
				     68セッション目に削除した。** この注記に固有の情報が1つも無かったため ――
				     セット名は直前に自分で選んだ操作の繰り返し、因子・遺伝子の内訳は②の B・C のチェックが
				     すでに示している、「N種」は結果の「対象スキル数」カードが出している。
				     （切り替え直後に画面外へ出る問題も、これで消えた。位置の調整は要らなくなった。） -->
			</div>

			<!-- 誤認識の読み替え辞書（任意）。C-132: 新UIでは「スクショで追加」の小窓（#skillset-guide-dict）へ移す（enterDeckMode）。
			     旧UIではここ（#ocr-dict-home）に戻す。保存の形・中身・効く処理は変えない（id はそのまま） -->
			<div id="ocr-dict-home">
			
			</div><!-- /#ocr-dict-home -->

			</div><!-- /#step-panel-1 -->

			<!-- ステップ2：親A・祖A1・祖A2（＋任意で親B・祖B1・祖B2）の画像アップロード -->
			<div id="step-panel-2" class="step-panel" role="tabpanel" aria-labelledby="step-tab-2" hidden=""></div><!-- /#step-panel-2 -->
		</div>

	</div>

	

	<!-- ===== 引き出しパネル =====

	<div id="drawer-backdrop" class="uma-drawer-backdrop" hidden=""></div>

	<!-- 画像結合レビュー（SNS投稿用・β）。中身は画像なのでDeckと同じ幅でよい。 -->

			<span class="uma-fab-icon stitch-accent-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images w-4 h-4"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<span id="fab-dot-stitch" class="uma-fab-dot" hidden=""></span>

		<!-- Deck へ向かうボタンだけは Deck 側のアクセント（藍）で塗り、行き先を色で示す。

		     hidden を書いた状態で置いてある。 -->
		<button id="deck-drawer-trigger" type="button" class="uma-fab-item deck-accent" aria-controls="deck-drawer" aria-expanded="false">

				<span id="fab-dot-deck" class="uma-fab-dot" hidden=""></span>

		<!-- C-132: 帯の「セット」「レース」のボタンと同じ小窓を開く（帯のボタンはそのまま）。新UIのあいだだけ出す（updateDeckEntryVisibility）。

				<!-- スキルセットOCR（フェーズa コミット4・改訂）: ゲームの「スキルセット詳細」画面のスクショから白スキルを読み取り、
				     対象スキルセットへ足す。入口のボタン「スキルセットのスクショで追加」と「?」（撮影ガイド）は core の編集画面の
				     入口の並び（「テキストで検索」の後ろ。2026-09-27 に右隣の「未収録スキルを追加」を廃止したので、いまは並びの最後）に、createTemplateManager の
				     screenshotEntry で出す。ここにあるのは、そのボタンが呼ぶ部品（ファイル選択・進捗・画像単位の知らせ）。
				     読み取りは js/skillset-ocr.js、結果の選択と確定は core の openSkillRowsPicker（「テキストで検索」と同じ報告）。 -->
				<div id="deck-ocr-status">
					<input type="file" id="deck-ocr-files" accept="image/*" multiple="" hidden="">
					<p id="deck-ocr-progress" class="text-xs text-slate-500 mt-2" hidden=""></p>
					<!-- 画像単位の知らせ（4b）。因子OCRの画質警告（#quality-warn-wrap）と同じ見た目。表示は classList の hidden -->
					<div id="deck-ocr-warn" class="hidden mt-2 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 whitespace-pre-line flex gap-2">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-amber-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
						<div id="deck-ocr-warn-content"></div>
					</div>
					<!-- 文字を読み取れなかったスキルパネル（31セッション目）。確定文面4aの置き換え。
					     警告ではなく事実の知らせなので、4b の琥珀色ではなく落ち着いた地にする。
					     ここを要確認の行（ピッカーの中）とは**別の区画**にしたのは、注意書きが指している
					     「テキストで検索」「条件でスキルを検索」の入口がピッカーの外＝編集画面にあるため。
					     読み取れなかった行が1つ以上あるときだけ出す（0のときは見出しごと出さない）。 -->
					<div id="deck-ocr-panels" class="hidden mt-2 rounded-xl border border-slate-200 bg-slate-50 p-3">
						<p class="text-xs font-semibold text-slate-700">文字を読み取れなかったスキルパネル</p>
						<p class="mt-1 text-[11px] text-slate-500">すでに追加済みのものが含まれることがあります。必要なものは「テキストで検索」または「条件で検索」から追加してください。</p>
						<div id="deck-ocr-panels-list" class="mt-2 flex flex-wrap gap-2"></div>
					</div>
				</div>
				<!-- 「元に戻す」はここ（②のパネルの下・インライン）ではなく、画面左下に固定した #deck-undo-btn に移した
				     （C-55 の (4)(5)。①で除外したときにも同じ場所に出る）。
				     **同じ場所にあった選択の注記（#deck-selected-note・「✓「◯◯」のN種＋…を照合します」）は
				     68セッション目に削除した。** この注記に固有の情報が1つも無かったため ――
				     セット名は直前に自分で選んだ操作の繰り返し、因子・遺伝子の内訳は②の B・C のチェックが
				     すでに示している、「N種」は結果の「対象スキル数」カードが出している。
				     （切り替え直後に画面外へ出る問題も、これで消えた。位置の調整は要らなくなった。） -->
			</div>

			<!-- 誤認識の読み替え辞書（任意）。C-132: 新UIでは「スクショで追加」の小窓（#skillset-guide-dict）へ移す（enterDeckMode）。
			     旧UIではここ（#ocr-dict-home）に戻す。保存の形・中身・効く処理は変えない（id はそのまま） -->
			<div id="ocr-dict-home">
			
			</div><!-- /#ocr-dict-home -->

			</div><!-- /#step-panel-1 -->

			<!-- ステップ2：親A・祖A1・祖A2（＋任意で親B・祖B1・祖B2）の画像アップロード -->
			<div id="step-panel-2" class="step-panel" role="tabpanel" aria-labelledby="step-tab-2" hidden=""></div><!-- /#step-panel-2 -->
		</div>

	</div>

		<!-- 引き出しの中のタブ（C-62 の (9)）。**引き出しは2つのまま**で、押すともう一方の

									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4 deck-icon"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>

								</div>
							</div>
							<button type="button" class="uma-btn uma-btn--primary uma-btn--lg btn-deck-accent w-full mt-3">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>

	<!-- 画像結合レビュー（SNS投稿用・β）。中身は画像なのでDeckと同じ幅でよい。 -->

		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">

				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>

				<span id="stitch-tab-stitch-label">結合画像（なし）</span>

		<div class="uma-drawer-body">

				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images w-4 h-4"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<span id="fab-dot-stitch" class="uma-fab-dot" hidden=""></span>
			</span>

		<!-- Deck へ向かうボタンだけは Deck 側のアクセント（藍）で塗り、行き先を色で示す。

		<button id="deck-drawer-trigger" type="button" class="uma-fab-item deck-accent" aria-controls="deck-drawer" aria-expanded="false">

	<!-- 画像結合レビュー（SNS投稿用・β）。中身は画像なのでDeckと同じ幅でよい。 -->

		<!-- 照合結果の引き出しと対になるタブ帯（C-62 の (9)）。同じ2つを同じ順で並べ、

		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">
			<button type="button" role="tab" class="drawer-tab" id="stitch-tab-result" aria-selected="false" tabindex="-1" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>

				<span id="stitch-tab-stitch-label">結合画像（なし）</span>

		</div>

		<div class="uma-drawer-body">

				<span id="fab-dot-stitch" class="uma-fab-dot" hidden=""></span>
			</span>

		<!-- Deck へ向かうボタンだけは Deck 側のアクセント（藍）で塗り、行き先を色で示す。

		<button id="deck-drawer-trigger" type="button" class="uma-fab-item deck-accent" aria-controls="deck-drawer" aria-expanded="false">

		if (scene === '2tnew' || scene === '2gnew' || scene === '2sort' || scene === 'count') {
			buildHead();
			var reset = $('[data-usd-el="tier-row"] [data-usd-el="factor-reset"]');
			if (reset) reset.remove();
			buildCards();
		}
		if (scene === '1new' || scene === '1sort' || scene === '2tnew' || scene === '2sort') buildTones();
		if (scene === 'count') buildCount();
		syncCircleBtn();
	}
	apply();

	/* ===== 操作 ===== */
	document.addEventListener('click', function (ev) {
		var t = ev.target.closest('[data-t45], [data-usd-el="factor-circle-mode"]');
		if (!t) return;
		var k = t.getAttribute('data-t45');
		if (t.getAttribute('data-usd-el') === 'factor-circle-mode' && NEW) {
			// ②の操作の行の◎（◎を○に変えるモード）と、並べ替えの◎は同じ状態
			state.sort = state.sort === 'circle' ? null : 'circle';
			syncCircleBtn();
			if ($('[data-t45="tones"]')) buildTones();
			return;
		}
		if (k === 'uniq-count') { state.count = next(UNIQ_COUNTS, state.count); refreshSteps(); }
		else if (k === 'uniq-level') { state.lv = next(LVS, state.lv); refreshSteps(); }
		else if (k === 'common-level') { state.F = next(LVS, state.F); refreshSteps(); }
		else if (k === 'sort-entry' || k === 'sort-icon') openSortPop(t);
		else if (k === 'pop-close') closePop();
		else if (k === 'fcard-x') { panelCards[Number(t.getAttribute('data-index'))] = null; buildCards(); }
		else if (k === 'fcard-pick') openCardPop(t, Number(t.getAttribute('data-index')));
		else if (k === 'card-pick') {
			var idx = Number(popEl.getAttribute('data-index'));
			panelCards[idx] = t.getAttribute('data-card-id');
			popOpener = null;
			closePop();
			buildCards();
		}
		else if (k === 'count') {
			$$('[data-t45="count"]').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
			var cb = $('[data-usd-el="outside-count-btn"]');
			if (cb && cb.firstChild) cb.firstChild.textContent = t.getAttribute('data-count') + '枚';
		}
	});
	document.addEventListener('change', function (ev) {
		var t = ev.target;
		if (t.getAttribute('data-t45') !== 'sort-pick') return;
		state.sort = t.value || null;
		$$('.t45-sortopt').forEach(function (l) { l.setAttribute('data-on', l.querySelector('input').checked ? '1' : '0'); });
		syncCircleBtn();
		buildTones();
		popOpener = $('[data-t45="sort-entry"]');
		closePop();
	});
	document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && popEl) closePop(); });

	/* ===== 案内 ===== */
	function buildGuide() {
		if (SHOT) return;
		var g = document.createElement('div');
		g.className = 't45-guide';
		g.setAttribute('data-t45-guide', '');
		var open = Q.get('guide') !== '0';
		g.setAttribute('data-open', open ? '1' : '0');
		var go = function (patch) { var p = new URLSearchParams(location.search); Object.keys(patch).forEach(function (k) { p.set(k, patch[k]); }); location.search = p.toString(); };
		g.innerHTML = '<button type="button" class="t45-guide-toggle" aria-expanded="' + open + '">モックの案内（T45・作業用）</button>'
			+ '<div class="t45-guide-body">'
			+ '<label>場面<select data-g="scene">' + SCENES.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === scene ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select></label>'
			+ '<label>②の合計の行の案<select data-g="fit">' + Object.keys(FITS).map(function (k) { return '<option value="' + k + '"' + (k === FIT ? ' selected' : '') + '>' + FITS[k] + '</option>'; }).join('') + '</select></label>'
			+ '<div class="t45-guide-row"><button type="button" data-g="light" aria-pressed="' + (THEME === 'light') + '">ライト</button><button type="button" data-g="dark" aria-pressed="' + (THEME === 'dark') + '">ダーク</button></div>'
			+ '<p>写しは 2026-10-31 の origin/main（core 2026-10-31i）。保存はしない。数字（Pt／種）は写した時点のままで、部品を押しても変わらない。</p>'
			+ '<p>継承固有の「X種」「LvX」と共通スキルの「LvX」は押すたびに1つ増え、最大の次は最小に戻る。並べ替えはアイコンのどれを押しても同じ小窓が開く（行の並びは今と同じなので、モックでは行を動かさない）。②のカードは × で外し、空きを押すと直接指定の小窓。</p>'
			+ '</div>';
		document.body.appendChild(g);
		g.querySelector('.t45-guide-toggle').addEventListener('click', function () { var o = g.getAttribute('data-open') === '1'; g.setAttribute('data-open', o ? '0' : '1'); this.setAttribute('aria-expanded', String(!o)); });
		g.querySelector('[data-g="scene"]').addEventListener('change', function () { go({ scene: this.value }); });
		g.querySelector('[data-g="fit"]').addEventListener('change', function () { go({ fit: this.value }); });
		g.querySelector('[data-g="light"]').addEventListener('click', function () { go({ theme: 'light' }); });
		g.querySelector('[data-g="dark"]').addEventListener('click', function () { go({ theme: 'dark' }); });
	}
	buildGuide();

	function fitAll() { syncStickyTop(); if (!NEW) fitNowHead(); fitEntry(); }
	fitAll();
	window.addEventListener('resize', fitAll);
	// 小窓の場面は開いた形で出す
	if (scene === '1sort' || scene === '2sort') {
		var entry = $('[data-t45="sort-entry"]');
		if (entry) { entry.scrollIntoView({ block: 'start' }); window.scrollBy(0, -140); openSortPop(entry); }
	}
	window.__t45 = { scene: scene, fit: FIT, state: state };
})();

</script>
</body>
</html>
