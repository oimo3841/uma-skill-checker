<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（fetch・XHR・WebSocket・フォームの送信を、ブラウザの側で禁止する）。読むのは同じ場所の js だけ。blob: は書き出すファイルの保存に使う -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>動画の取り込みの診断（作業用）</title>
	<!--
		iPhone の Safari で、③の動画の取り込み（js/video-frames.js）が「毎回同じ画」を作れているかを記録するページ（T90・2026-11-03。T68 の診断のページを作り直した）。
		**ツール本体には組み込まない**（lab/capture-test.html と同じ扱い。どのページからもリンクしない）。
		おいもさんの操作は「動画を選ぶ → 終わったら『共有』か『保存』でファイルを Drive に置く」だけ。

		■ 外へ何も送らない
		- 動画はこの端末の中だけで読む。上の Content-Security-Policy で通信（connect-src）とフォームの送信を禁止している。
		- 記録は1つの JSON のファイルにし、「共有」（iPhone の共有の画面）か「保存」（ダウンロード）で端末に出す。

		■ 何をするか（動画を選ぶと、上から順に自動で進む）
		- 端末: user agent・使えるもの（WebCodecs・requestVideoFrameCallback など）。
		- 復号: MP4 を分解して WebCodecs（VideoDecoder）で全フレームを順に復号できるか・何枚・何秒。各フレームの小さな指紋（本文の帯のグレー）を持つ。
		- 製品: 製品と同じ処理（UmaVideoFrames.videoSource → selectFrames → composePerson）を ?runs= 回（既定 10）くり返す。
		  回ごとに 選んだ時刻・継ぎ目・取り直しの統計・人ごとの結合画像の高さと画素のハッシュ・時間 を記録し、
		  シーク1回ごとに「頼んだ時刻」と「実際に描かれた画がどのフレームだったか」（復号の指紋と照らす）を記録する。
		  結合画像は、画素のハッシュが違うものだけを JPEG で記録に入れる。
		- シーク: 止まっている時刻・動いている時刻（製品の1回目の軌跡から）で、シーク→すぐ描く／次の画を待って描く／同じ時刻へもう一度 の画が
		  どのフレームになるかを照らす。
		- 試作: 復号のフレームを出どころにして同じ selectFrames → composePerson を ?proto= 回（既定 3）。製品の回と同じ記録。
		- 書き出し: 記録の JSON（結合画像を含む）を「共有」か「保存」で端末に出す。ファイル名はこのページが付ける。
		- 取り消し: 動画の一覧の画面で選ばずに戻ったときに input の cancel が来るかも記録する。
	-->
	<style>

		@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --sub: #aaa; --line: #444; --ok: #6fd28f; --ng: #ff8a80; --warn: #f0b860; --box: #232323; } }
		body { margin: 0; padding: 8px 10px 40px; background: var(--bg); color: var(--fg); font: 12px/1.45 -apple-system, system-ui, sans-serif; }
		main { max-width: 760px; margin: 0 auto; }
		h1 { font-size: 15px; margin: 0 0 6px; }
		h2 { font-size: 13px; margin: 10px 0 3px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
		h2 small { font-weight: 400; color: var(--sub); }

		.ua { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
		.kv { margin: 2px 0 0; word-break: break-all; }

		td.t { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--sub); width: 1%; }

		button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }

<body>
<main>
	<h1>動画の取り込みの診断（作業用・T90）</h1>
	<div class="box">
		<div class="ua" id="ua"></div>
		<p class="kv" id="env"></p>
	</div>
	<h2>動画を選ぶ <small>選ぶと自動で進みます。終わるまで画面を消さず、ほかのアプリに切り替えないでください</small></h2>
	<input id="file" type="file" accept="video/*" />
	<div id="file-info" class="hint"></div>
	<div class="now" id="now"></div>
	<h2>経過</h2>
	<table><tbody id="log"></tbody></table>
	<h2>結果 <small id="sum"></small></h2>
	<table><thead><tr><th>段</th><th>回</th><th>秒</th><th>枚数（人ごと）</th><th>高さ（人ごと）</th><th>1回目と</th></tr></thead><tbody id="runs"></tbody></table>
	<div class="btns" id="btns" hidden>
		<button type="button" class="primary" id="share">共有（Drive へ）</button>
		<button type="button" id="save">保存（ダウンロード）</button>
	</div>
	<div class="hint" id="out-info"></div>
</main>

<script src="../js/common.js?v=2026-09-26a"></script>
<script src="../js/stitch.js?v=2026-11-01a"></script>
<script src="../js/video-frames.js?v=2026-11-03a"></script>
<script>
/* T90 試作: MP4（断片化していない）の分解と WebCodecs（VideoDecoder）で、時刻 t の画を「必ず同じフレーム」で出すフレームの出どころ。
 * UmaVideoFrames.selectFrames に渡す source と同じ形（{ kind, width, height, duration, drawAt(t, ctx, dw, dh, signal, how), close() }）。
 * 時刻 t の画 ＝ 表示時刻（pts）が t 以下の最後のフレーム（video 要素のシークと同じ意味）。
 * 復号は前へ進めるだけ。後ろへ戻る・先の区間へ飛ぶときは、目当てのフレームの手前のキーフレームから復号し直す。
 * 公開: window.UmaMp4Source = { probe(blob), open(blob, o) }
 */
(function (global) {
	'use strict';

	function err(code, msg) { const e = new Error(msg); e.code = code; return e; }
	function abortError() { try { return new DOMException('取り消しました', 'AbortError'); } catch (e) { const er = new Error('取り消しました'); er.name = 'AbortError'; return er; } }
	function untilAbort(p, signal) {
		if (!signal) return p;
		if (signal.aborted) return Promise.reject(abortError());
		return new Promise((res, rej) => {
			const onAbort = () => rej(abortError());
			signal.addEventListener('abort', onAbort, { once: true });
			Promise.resolve(p).then((v) => { signal.removeEventListener('abort', onAbort); res(v); }, (e) => { signal.removeEventListener('abort', onAbort); rej(e); });
		});
	}
	const str4 = (dv, o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));

	/* ── 箱 ─────────────────────────────── */
	async function readView(blob, off, len) { return new DataView(await blob.slice(off, Math.min(blob.size, off + len)).arrayBuffer()); }
	// 先頭から箱の見出しだけを読んで並べる（moov が末尾にあっても、ファイル全体は読まない）
	async function topBoxes(blob) {
		const out = []; let off = 0;
		while (off + 8 <= blob.size) {
			const h = await readView(blob, off, 16);
			if (h.byteLength < 8) break;
			let sz = h.getUint32(0); const type = str4(h, 4); let hdr = 8;
			if (sz === 1) { if (h.byteLength < 16) break; sz = Number(h.getBigUint64(8)); hdr = 16; } else if (sz === 0) sz = blob.size - off;
			if (sz < hdr) throw err('mp4', '箱の大きさが不正: ' + type);
			out.push({ type, off, sz, hdr }); off += sz;
		}
		return out;
	}
	const CONTAINERS = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'edts']);
	function children(dv, start, end) {
		const out = []; let off = start;
		while (off + 8 <= end) {
			let sz = dv.getUint32(off); const type = str4(dv, off + 4); let hdr = 8;
			if (sz === 1) { sz = Number(dv.getBigUint64(off + 8)); hdr = 16; } else if (sz === 0) sz = end - off;
			if (sz < hdr || off + sz > end) break;
			out.push({ type, off, sz, hdr, body: off + hdr, end: off + sz }); off += sz;
		}
		return out;
	}
	const find = (list, type) => list.find((b) => b.type === type);

	/* ── 映像トラック ─────────────────────────────── */
	function parseMoov(dv) {
		const moov = children(dv, 0, dv.byteLength)[0];
		if (!moov || moov.type !== 'moov') throw err('mp4', 'moov が読めない');
		const mv = children(dv, moov.body, moov.end);
		for (const trak of mv.filter((b) => b.type === 'trak')) {
			const tk = children(dv, trak.body, trak.end);
			const mdia = find(tk, 'mdia'); if (!mdia) continue;
			const md = children(dv, mdia.body, mdia.end);
			const hdlr = find(md, 'hdlr'); if (!hdlr || str4(dv, hdlr.body + 8) !== 'vide') continue;
			const mdhd = find(md, 'mdhd');
			const v = dv.getUint8(mdhd.body);
			const timescale = v === 1 ? dv.getUint32(mdhd.body + 20) : dv.getUint32(mdhd.body + 12);
			const mediaDur = v === 1 ? Number(dv.getBigUint64(mdhd.body + 24)) : dv.getUint32(mdhd.body + 16);
			const minf = find(md, 'minf'); const mf = children(dv, minf.body, minf.end);
			const stbl = find(mf, 'stbl'); const st = children(dv, stbl.body, stbl.end);
			// stsd: version/flags(4)・count(4)・entries
			const stsd = find(st, 'stsd');
			const entries = children(dv, stsd.body + 8, stsd.end);
			const entry = entries.find((e) => /^(hvc1|hev1|avc1|avc3)$/.test(e.type));
			if (!entry) throw err('codec', '対応していない映像の形式: ' + entries.map((e) => e.type).join(','));
			const width = dv.getUint16(entry.body + 24), height = dv.getUint16(entry.body + 26);
			const sub = children(dv, entry.body + 78, entry.end);
			let codec = null, description = null, lengthSize = 4, hasParams = false;
			const cfgBox = find(sub, entry.type[0] === 'h' ? 'hvcC' : 'avcC');
			if (!cfgBox) throw err('codec', entry.type + ' の設定（' + (entry.type[0] === 'h' ? 'hvcC' : 'avcC') + '）が無い');
			const cb = new Uint8Array(dv.buffer, dv.byteOffset + cfgBox.body, cfgBox.end - cfgBox.body);
			description = cb.slice();
			if (cfgBox.type === 'hvcC') {
				const profileSpace = cb[1] >> 6, tier = (cb[1] >> 5) & 1, profile = cb[1] & 31;
				const compat = (cb[2] << 24 | cb[3] << 16 | cb[4] << 8 | cb[5]) >>> 0;
				let rev = 0; for (let i = 0; i < 32; i++) if (compat & (1 << (31 - i))) rev |= (1 << i);
				const level = cb[12];
				lengthSize = (cb[21] & 3) + 1;
				const cons = Array.from(cb.subarray(6, 12)); while (cons.length > 1 && cons[cons.length - 1] === 0) cons.pop();
				codec = 'hvc1.' + (profileSpace ? String.fromCharCode(64 + profileSpace) : '') + profile + '.' + (rev >>> 0).toString(16).toUpperCase() + '.' + (tier ? 'H' : 'L') + level + '.' + cons.map((x) => x.toString(16).toUpperCase()).join('.');
				// パラメータ（VPS/SPS/PPS）が hvcC に入っているか
				let p = 23; const arrays = cb[22];
				for (let a = 0; a < arrays && p + 3 <= cb.length; a++) { const nt = cb[p] & 63; const num = cb[p + 1] << 8 | cb[p + 2]; p += 3; for (let k = 0; k < num && p + 2 <= cb.length; k++) { const len = cb[p] << 8 | cb[p + 1]; p += 2 + len; if (nt === 33) hasParams = true; } }
			} else {
				codec = 'avc1.' + [cb[1], cb[2], cb[3]].map((x) => x.toString(16).padStart(2, '0')).join('');
				lengthSize = (cb[4] & 3) + 1;
				hasParams = (cb[5] & 31) > 0;
			}
			// stts
			const stts = find(st, 'stts'); const nS = dv.getUint32(stts.body + 4);
			const dts = []; const dur = []; let t = 0;
			for (let i = 0; i < nS; i++) { const c = dv.getUint32(stts.body + 8 + i * 8), d = dv.getUint32(stts.body + 12 + i * 8); for (let k = 0; k < c; k++) { dts.push(t); dur.push(d); t += d; } }
			const n = dts.length;
			// ctts（version 1 は符号つき。0 でも Int32 で読んで差し支えない）
			const cto = new Int32Array(n);
			const ctts = find(st, 'ctts');
			if (ctts) { const nC = dv.getUint32(ctts.body + 4); let i = 0; for (let e = 0; e < nC; e++) { const c = dv.getUint32(ctts.body + 8 + e * 8), o = dv.getInt32(ctts.body + 12 + e * 8); for (let k = 0; k < c && i < n; k++) cto[i++] = o; } }
			// stss
			const sync = new Uint8Array(n);
			const stss = find(st, 'stss');
			if (stss) { const nK = dv.getUint32(stss.body + 4); for (let i = 0; i < nK; i++) { const s = dv.getUint32(stss.body + 8 + i * 4) - 1; if (s >= 0 && s < n) sync[s] = 1; } } else sync.fill(1);
			// stsz
			const stsz = find(st, 'stsz'); const fixedSize = dv.getUint32(stsz.body + 4); const sizes = new Uint32Array(n);
			if (fixedSize) sizes.fill(fixedSize); else for (let i = 0; i < n; i++) sizes[i] = dv.getUint32(stsz.body + 12 + i * 4);
			// stsc + stco/co64 → offsets
			const stsc = find(st, 'stsc'); const nSC = dv.getUint32(stsc.body + 4);
			const sc = []; for (let i = 0; i < nSC; i++) sc.push({ first: dv.getUint32(stsc.body + 8 + i * 12), per: dv.getUint32(stsc.body + 12 + i * 12) });
			const stco = find(st, 'stco'), co64 = find(st, 'co64'); const co = stco || co64; const nCh = dv.getUint32(co.body + 4);
			const chunkOff = []; for (let i = 0; i < nCh; i++) chunkOff.push(stco ? dv.getUint32(co.body + 8 + i * 4) : Number(dv.getBigUint64(co.body + 8 + i * 8)));
			const offs = new Float64Array(n);
			{ let si = 0; for (let c = 0; c < nCh && si < n; c++) { let per = 0; for (const e of sc) if (e.first - 1 <= c) per = e.per; let o = chunkOff[c]; for (let k = 0; k < per && si < n; k++) { offs[si] = o; o += sizes[si]; si++; } } if (si < n) throw err('mp4', 'サンプルの位置が足りない'); }
			// elst（media_time を引く。-1 の空の区間は飛ばす）
			let mediaTime = 0;
			const edts = find(tk, 'edts');
			if (edts) { const elst = find(children(dv, edts.body, edts.end), 'elst'); if (elst) { const ev = dv.getUint8(elst.body); const ne = dv.getUint32(elst.body + 4); for (let i = 0; i < ne; i++) { const mt = ev === 1 ? Number(dv.getBigInt64(elst.body + 16 + i * 20)) : dv.getInt32(elst.body + 12 + i * 12); if (mt >= 0) { mediaTime = mt; break; } } } }
			const pts = new Float64Array(n); for (let i = 0; i < n; i++) pts[i] = dts[i] + cto[i] - mediaTime;
			const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => pts[a] - pts[b] || a - b);
			return { codec, description, hasParams, lengthSize, width, height, timescale, duration: mediaDur / timescale, n, dts, dur, pts, sync, sizes, offs, order, entryType: entry.type, keyframes: Array.from(sync).reduce((s, v) => s + v, 0) };
		}
		throw err('no-video-track', '映像トラックが無い');
	}

	async function parse(blob) {
		const boxes = await topBoxes(blob);
		const ftyp = find(boxes, 'ftyp');
		const moov = find(boxes, 'moov');
		if (!moov) throw err('mp4', 'moov が無い' + (find(boxes, 'moof') ? '（断片化した MP4）' : ''));
		if (find(boxes, 'moof')) throw err('mp4', '断片化した MP4 には対応していない');
		const dv = await readView(blob, moov.off, moov.sz);
		const tr = parseMoov(dv);
		tr.brand = ftyp ? str4(await readView(blob, ftyp.off + 8, 4), 0) : '';
		tr.moovAt = moov.off;
		return tr;
	}

	/** 使えるか: { ok, codec, width, height, duration, frames, keyframes, reason } */
	async function probe(blob) {
		if (typeof VideoDecoder === 'undefined' || typeof EncodedVideoChunk === 'undefined') return { ok: false, reason: 'no-webcodecs' };
		let tr;
		try { tr = await parse(blob); } catch (e) { return { ok: false, reason: e.code || 'parse', message: e.message }; }
		let sup = null;
		try { sup = await VideoDecoder.isConfigSupported({ codec: tr.codec, codedWidth: tr.width, codedHeight: tr.height, description: tr.hasParams ? tr.description : undefined }); } catch (e) { return { ok: false, reason: 'unsupported', message: e.message, codec: tr.codec }; }
		return { ok: !!(sup && sup.supported), reason: sup && sup.supported ? '' : 'unsupported', codec: tr.codec, width: tr.width, height: tr.height, duration: tr.duration, frames: tr.n, keyframes: tr.keyframes, brand: tr.brand, entryType: tr.entryType, hasParams: tr.hasParams };
	}

	/** フレームの出どころを開く。o.onStat(name) で統計を知らせる */
	async function open(blob, o) {
		o = o || {};
		const tr = await parse(blob);
		const n = tr.n, ts = tr.timescale;
		const stat = { fed: 0, out: 0, restarts: 0, skips: 0, reads: 0, bytes: 0, flushes: 0, leadingSkipped: 0, skipLog: [], restartLog: [] };
		const cfg = { codec: tr.codec, codedWidth: tr.width, codedHeight: tr.height, optimizeForLatency: false };
		if (tr.hasParams) cfg.description = tr.description;
		if (o.hardware) cfg.hardwareAcceleration = o.hardware;
		// 表示順 j ↔ サンプル i（復号順）。chunk の timestamp（µs）で出てきたフレームを引く
		const presOf = new Int32Array(n); tr.order.forEach((i, j) => { presOf[i] = j; });
		const usOf = new Float64Array(n); const jOfUs = new Map();
		for (let j = 0; j < n; j++) { const i = tr.order[j]; let us = Math.round(tr.pts[i] * 1e6 / ts); while (jOfUs.has(us)) us++; usOf[i] = us; jOfUs.set(us, j); }
		const ptsSorted = new Float64Array(n); for (let j = 0; j < n; j++) ptsSorted[j] = tr.pts[tr.order[j]];
		const syncIdx = []; for (let i = 0; i < n; i++) if (tr.sync[i]) syncIdx.push(i);
		if (!syncIdx.length || syncIdx[0] !== 0) throw err('mp4', '最初のサンプルがキーフレームでない');
		// 表示順 j の目当てのフレームを復号できる、いちばん近いキーフレーム（復号順が手前で、表示時刻も手前）
		function keyFor(j) {
			const i = tr.order[j]; let best = 0;
			for (const s of syncIdx) { if (s <= i && tr.pts[s] <= tr.pts[i]) best = s; else if (s > i) break; }
			return best;
		}
		// 時刻 t（秒）→ 表示順 j（pts ≤ t の最後。無ければ 0）
		function jAt(t) {
			const tk = t * ts; let lo = 0, hi = n - 1;
			if (ptsSorted[0] > tk) return 0;
			while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ptsSorted[mid] <= tk) lo = mid; else hi = mid - 1; }
			return lo;
		}
		// ファイルの読み（キーフレームから次のキーフレームの手前までをまとめて）
		let buf = null, bufOff = 0, bufEnd = 0;
		async function sampleData(i) {
			const off = tr.offs[i], sz = tr.sizes[i];
			if (!(buf && off >= bufOff && off + sz <= bufEnd)) {
				let e = i, lo = off, hi = off + sz;
				while (e + 1 < n && !tr.sync[e + 1]) { const o2 = tr.offs[e + 1], s2 = tr.sizes[e + 1]; if (Math.max(hi, o2 + s2) - Math.min(lo, o2) > 12e6) break; e++; lo = Math.min(lo, o2); hi = Math.max(hi, o2 + s2); }

		const stills = (track || []).filter((f) => f.rep).map((f) => f.t);
		const moving = (track || []).filter((f) => f.step != null && f.step >= 20 && !f.still).map((f) => f.t);
		const pick = (arr, n) => { if (arr.length <= n) return arr; const o = []; for (let i = 0; i < n; i++) o.push(arr[Math.floor(i * arr.length / n)]); return o; };
		const pts = pick(stills, 20).map((t) => ({ t, kind: 'still' })).concat(pick(moving, 20).map((t) => ({ t, kind: 'moving' }))).sort((p, q) => p.t - q.t);
		if (!pts.length) { const D = src.duration; for (let k = 1; k <= 20; k++) pts.push({ t: +(D * k / 21).toFixed(3), kind: 'any' }); }
		out.counts = { still: pts.filter((p) => p.kind === 'still').length, moving: pts.filter((p) => p.kind === 'moving').length };
		const seekRaw = (t, force) => new Promise((res, rej) => {
			if (!force && Math.abs(video.currentTime - t) < 1e-6 && !video.seeking) { res(0); return; }
			const s = performance.now(); let tm = null;
			const done = () => { video.removeEventListener('seeked', done); clearTimeout(tm); res(Math.round((performance.now() - s) * 10) / 10); };
			video.addEventListener('seeked', done); tm = setTimeout(() => { video.removeEventListener('seeked', done); rej(new Error('seek timeout')); }, 20000);
			video.currentTime = t;
		});
		const grab = () => { x.drawImage(video, 0, 0, sw, H); return fingerprint(c, sw, H); };
		const ident = (g, t) => { const id = identify(g, jAt(t), 60); return id ? { got: id.j, d: id.d, lo: id.lo, hi: id.hi, hit: id.hit ? 1 : 0 } : null; };
		for (let i = 0; i < pts.length; i++) {
			const p = pts[i];
			now('シーク: ' + (i + 1) + '/' + pts.length + '（' + p.t.toFixed(2) + '秒）');
			const r = { t: p.t, kind: p.kind, exp: FP && FP.g.length ? jAt(p.t) : null };
			try {
				// a: 0.5秒手前から来て、シーク→すぐ描く
				await seekRaw(Math.max(0, p.t - 0.5), true);
				r.aMs = await seekRaw(p.t, true); r.aCur = +video.currentTime.toFixed(4); const ga = grab(); r.a = ident(ga, p.t);
				// b: 次の画を待つ
				let id = 0, tmr = null;
				const frame = new Promise((res) => { if (typeof video.requestVideoFrameCallback === 'function') id = video.requestVideoFrameCallback((n, m) => res(m)); tmr = setTimeout(() => res(null), 250); });
				const s2 = performance.now();
				await seekRaw(p.t, true);
				const meta = await frame; clearTimeout(tmr); try { video.cancelVideoFrameCallback(id); } catch (e) { /* 無い */ }
				r.bMs = Math.round((performance.now() - s2) * 10) / 10; r.bMeta = meta ? { mediaTime: +meta.mediaTime.toFixed(4), presented: meta.presentedFrames } : null;
				const gb = grab(); r.b = ident(gb, p.t); r.ab = +meanAbs(ga, gb).toFixed(2);
				// c: 同じ時刻へもう一度（強制）
				r.cMs = await seekRaw(p.t, true); const gc = grab(); r.c = ident(gc, p.t); r.bc = +meanAbs(gb, gc).toFixed(2);
				// d: 先へ行ってから戻る
				await seekRaw(Math.min(src.duration - 0.05, p.t + 0.5), true);
				r.dMs = await seekRaw(p.t, true); const gd = grab(); r.d = ident(gd, p.t); r.ad = +meanAbs(ga, gd).toFixed(2);
			} catch (e) { r.error = String(e.message || e); }
			out.points.push(r);
		}
		const hits = (k) => out.points.filter((p) => p[k] && p[k].hit).length, n = out.points.filter((p) => p.a).length;
		out.summary = { n, aHit: hits('a'), bHit: hits('b'), cHit: hits('c'), dHit: hits('d'), abSame: out.points.filter((p) => p.ab != null && p.ab < 1).length, bcSame: out.points.filter((p) => p.bc != null && p.bc < 1).length, adSame: out.points.filter((p) => p.ad != null && p.ad < 1).length };
		log('シーク: 照らし合わせ', JSON.stringify(out.summary), 'ok');
	} catch (e) { out.error = String(e.message || e); log('シーク: 失敗', out.error, 'ng'); }
	finally { if (src) try { src.close(); } catch (e) { /* 何もしない */ } }
	return out;
}

/* ── 全体の流れ ─────────────────────── */
async function start(file) {
	REC = { page: PAGE_VERSION, ua: navigator.userAgent, env: ENV, started: new Date().toISOString(), href: location.href, file: { name: file.name, type: file.type, size: file.size, lastModified: file.lastModified }, params: { runs: N_PROD, proto: N_PROTO, skip: Array.from(SKIP) }, log: [], visibility: [], cancelEvents: CANCELS, decode: null, product: { js: window.UmaVideoFrames ? UmaVideoFrames.VERSION : null, runs: [] }, seek: null, proto: { runs: [] }, images: {} };
	document.addEventListener('visibilitychange', () => REC.visibility.push([+((performance.now() - T0) / 1000).toFixed(2), document.visibilityState]));
	let wake = null; try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { /* 無くてもよい */ }
	STALL = { at: performance.now(), what: '' };
	const stallTimer = setInterval(() => { const q = performance.now() - STALL.at; if (q > 15000) $('now').innerHTML = '<span class="ng">止まっている？ ' + esc(STALL.what) + '（' + Math.round(q / 1000) + '秒 進まない）</span>'; }, 1000);
	log('ファイルを選んだ', file.name + '・' + (file.type || '（type なし）') + '・' + (file.size / 1048576).toFixed(1) + 'MB');
	// 1. 復号（全フレーム）と指紋
	if (!SKIP.has('decode')) { REC.decode = await decodeAll(file); }
	// 2. 製品
	let first = null;
	if (!SKIP.has('product')) {
		for (let r = 1; r <= N_PROD; r++) {
			const rec = await runOnce('product', file, r, REC.images);
			if (r > 1 && !rec.error && first && !first.error) { const same = rec.persons.every((p, k) => first.persons[k] && p.hash === first.persons[k].hash) && rec.picks.join() === first.picks.join(); if (same) { delete rec.track; } }
			REC.product.runs.push(rec);
			if (!first) first = rec;
			addRunRow('製品', rec, first);
			log('製品 ' + r + '回目', rec.error ? '失敗 ' + rec.error : (rec.persons.map((p) => p.n + '枚/' + (p.h || 'x') + 'px').join('・') + '・選んだ ' + rec.picks.length + '枚・' + sec(rec.totalMs) + '・取り直し合わず ' + rec.stats.grabMismatch + '（直った ' + rec.stats.grabFixed + '）・シーク外れ ' + rec.seeks.filter((s) => s.miss).length + '/' + rec.seeks.length), rec.error ? 'ng' : '');
			await sleep(300);
		}
	}
	// 3. シークの照らし合わせ
	if (!SKIP.has('seek')) REC.seek = await seekProbe(file, first && first.track);
	// 4. 試作
	if (!SKIP.has('proto') && (window.UmaMp4Source || (window.UmaVideoFrames && UmaVideoFrames.mp4Source)) && REC.decode && REC.decode.probe && REC.decode.probe.ok) {
		let pf = null;
		for (let r = 1; r <= N_PROTO; r++) {
			const rec = await runOnce('proto', file, r, REC.images);
			if (r > 1 && pf && !rec.error && !pf.error && rec.persons.every((p, k) => pf.persons[k] && p.hash === pf.persons[k].hash) && rec.picks.join() === pf.picks.join()) delete rec.track;
			REC.proto.runs.push(rec);
			if (!pf) pf = rec;
			addRunRow('試作', rec, pf);
			log('試作 ' + r + '回目', rec.error ? '失敗 ' + rec.error : (rec.persons.map((p) => p.n + '枚/' + (p.h || 'x') + 'px').join('・') + '・選んだ ' + rec.picks.length + '枚・' + sec(rec.totalMs) + '・取り直し合わず ' + rec.stats.grabMismatch + '・シーク外れ ' + rec.seeks.filter((s) => s.miss).length + '/' + rec.seeks.length), rec.error ? 'ng' : '');
			await sleep(300);
		}
	}
	clearInterval(stallTimer); now('');
	REC.finished = new Date().toISOString(); REC.totalSec = +((performance.now() - T0) / 1000).toFixed(1);
	FP = null;
	if (wake) try { wake.release(); } catch (e) { /* 何もしない */ }
	finish();
}
let OUT = null;
function finish() {
	const same = (runs) => { const ok = runs.filter((r) => !r.error); if (!ok.length) return '—'; const h = (r) => r.persons.map((p) => p.hash).join(' '); const n = ok.filter((r) => h(r) === h(ok[0])).length; return n + '/' + runs.length + ' 回が1回目と同じ' + (runs.length !== ok.length ? '（失敗 ' + (runs.length - ok.length) + '）' : ''); };
	$('sum').textContent = '製品 ' + same(REC.product.runs) + '／試作 ' + same(REC.proto.runs) + '・全体 ' + REC.totalSec + '秒';
	const json = JSON.stringify(REC);
	const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
	const stamp = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()); // 端末の時刻
	const base = (REC.file.name || 'video').replace(/\.[^.]+$/, '').replace(/[^\w぀-鿿-]+/g, '_').slice(0, 24);
	const name = 'T90-diag-' + stamp + '-' + base + '.json';
	const blob = new Blob([json], { type: 'application/json' });
	OUT = { blob, name };
	$('out-info').textContent = name + '・' + (blob.size / 1048576).toFixed(1) + 'MB';
	$('btns').hidden = false;
	log('終わった', '記録 ' + name + '（' + (blob.size / 1048576).toFixed(1) + 'MB）。「共有」か「保存」で端末に出してください', 'ok');
}
$('share').addEventListener('click', async () => {
	if (!OUT) return;
	const f = new File([OUT.blob], OUT.name, { type: 'application/json' });
	if (navigator.share && navigator.canShare && navigator.canShare({ files: [f] })) {
		try { await navigator.share({ files: [f], title: OUT.name }); log('共有した', OUT.name, 'ok'); } catch (e) { log('共有: ' + (e.name === 'AbortError' ? 'やめた' : '失敗'), String(e.message || e), e.name === 'AbortError' ? 'warn' : 'ng'); }
	} else { log('共有: この端末では使えない。「保存」を押してください', '', 'warn'); }
});
$('save').addEventListener('click', () => {
	if (!OUT) return;
	const a = document.createElement('a'); a.href = URL.createObjectURL(OUT.blob); a.download = OUT.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
	log('保存した', OUT.name + '（ダウンロード）', 'ok');
});
const CANCELS = [];
const fileInput = $('file');
let openedAt = null;
fileInput.addEventListener('click', () => { openedAt = performance.now(); });
fileInput.addEventListener('cancel', () => { const e = { at: +((performance.now() - T0) / 1000).toFixed(2), afterMs: openedAt ? Math.round(performance.now() - openedAt) : null }; CANCELS.push(e); log('動画を選ばずに戻った（cancel）', openedAt ? Math.round(performance.now() - openedAt) + 'ms 後' : '', 'ok'); });
fileInput.addEventListener('change', async (ev) => {
	const f = ev.target.files && ev.target.files[0];
	if (!f) return;
	ev.target.disabled = true;
	$('file-info').textContent = f.name + '・' + (f.type || '（type なし）') + '・' + (f.size / 1048576).toFixed(1) + 'MB';
	try { await start(f); } catch (e) { log('想定外の失敗', String(e.stack || e.message || e), 'ng'); if (REC) { REC.fatal = String(e.stack || e.message || e); finish(); } }
	ev.target.disabled = false;
});
</script>
