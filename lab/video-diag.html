<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（fetch・XHR・WebSocket・フォームの送信を、ブラウザの側で禁止する）。読むのは同じ場所の js だけ。blob: は書き出すファイルの保存に使う -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>動画の取り込みの診断（作業用）</title>
	<!--
		iPhone の Safari で、③の動画の取り込み（js/video-frames.js）が「毎回同じ画」を作れているかを記録するページ（T90・2026-11-03。T68 の診断のページを作り直した）。
		**ツール本体には組み込まない**（lab/capture-test.html と同じ扱い。どのページからもリンクしない）。
		おいもさんの操作は「動画を選ぶ → 終わったら『共有』か『保存』でファイルを Drive に置く」だけ。

		■ 外へ何も送らない
		- 動画はこの端末の中だけで読む。上の Content-Security-Policy で通信（connect-src）とフォームの送信を禁止している。
		- 記録は1つの JSON のファイルにし、「共有」（iPhone の共有の画面）か「保存」（ダウンロード）で端末に出す。

		■ 何をするか（動画を選ぶと、上から順に自動で進む）
		- 端末: user agent・使えるもの（WebCodecs・requestVideoFrameCallback など）。
		- 復号: MP4 を分解して WebCodecs（VideoDecoder）で全フレームを順に復号できるか・何枚・何秒。各フレームの小さな指紋（本文の帯のグレー）を持つ。
		- 製品: 製品と同じ処理（UmaVideoFrames.videoSource → selectFrames → composePerson）を ?runs= 回（既定 10）くり返す。
		  回ごとに 選んだ時刻・継ぎ目・取り直しの統計・人ごとの結合画像の高さと画素のハッシュ・時間 を記録し、
		  シーク1回ごとに「頼んだ時刻」と「実際に描かれた画がどのフレームだったか」（復号の指紋と照らす）を記録する。
		  結合画像は、画素のハッシュが違うものだけを JPEG で記録に入れる。
		- シーク: 止まっている時刻・動いている時刻（製品の1回目の軌跡から）で、シーク→すぐ描く／次の画を待って描く／同じ時刻へもう一度 の画が
		  どのフレームになるかを照らす。
		- 試作: 復号のフレームを出どころにして同じ selectFrames → composePerson を ?proto= 回（既定 3）。製品の回と同じ記録。
		- 書き出し: 記録の JSON（結合画像を含む）を「共有」か「保存」で端末に出す。ファイル名はこのページが付ける。
		- 取り消し: 動画の一覧の画面で選ばずに戻ったときに input の cancel が来るかも記録する。
	-->
	<style>
		:root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --sub: #666; --line: #d0d0d0; --ok: #0a7d32; --ng: #b3261e; --warn: #9a5b00; --box: #f4f4f4; }
		@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --sub: #aaa; --line: #444; --ok: #6fd28f; --ng: #ff8a80; --warn: #f0b860; --box: #232323; } }
		body { margin: 0; padding: 8px 10px 40px; background: var(--bg); color: var(--fg); font: 12px/1.45 -apple-system, system-ui, sans-serif; }
		main { max-width: 760px; margin: 0 auto; }
		h1 { font-size: 15px; margin: 0 0 6px; }
		h2 { font-size: 13px; margin: 10px 0 3px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
		h2 small { font-weight: 400; color: var(--sub); }
		.box { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
		.ua { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
		.kv { margin: 2px 0 0; word-break: break-all; }
		.kv i { font-style: normal; color: var(--sub); }
		table { border-collapse: collapse; width: 100%; }
		td, th { border-top: 1px solid var(--line); padding: 2px 4px; vertical-align: top; text-align: left; font-weight: 400; }
		th { color: var(--sub); }
		td.t { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--sub); width: 1%; }
		.ok { color: var(--ok); font-weight: 700; }
		.ng { color: var(--ng); font-weight: 700; }
		.warn { color: var(--warn); font-weight: 700; }
		.now { margin: 6px 0; font-weight: 700; min-height: 1.4em; }
		input[type=file] { font-size: 15px; margin: 4px 0; }
		.btns { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
		button { font: inherit; font-size: 15px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--box); color: var(--fg); min-height: 44px; }
		button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
		button:disabled { opacity: 0.5; }
		.hint { color: var(--sub); }
	</style>
</head>
<body>
<main>
	<h1>動画の取り込みの診断（作業用・T90）</h1>
	<div class="box">
		<div class="ua" id="ua"></div>
		<p class="kv" id="env"></p>
	</div>
	<h2>動画を選ぶ <small>選ぶと自動で進みます。終わるまで画面を消さず、ほかのアプリに切り替えないでください</small></h2>
	<!-- multiple: iPhone の写真の一覧の画面が「複数選択」になり、選ばずに完了したときに 0本で戻ってくるか（第2回で確かめる。製品も同じにする） -->
	<input id="file" type="file" accept="video/*" multiple />
	<div id="file-info" class="hint"></div>
	<div class="now" id="now"></div>
	<h2>経過</h2>
	<table><tbody id="log"></tbody></table>
	<h2>結果 <small id="sum"></small></h2>
	<table><thead><tr><th>段</th><th>回</th><th>秒</th><th>枚数（人ごと）</th><th>高さ（人ごと）</th><th>1回目と</th></tr></thead><tbody id="runs"></tbody></table>
	<div class="btns" id="btns" hidden>
		<button type="button" class="primary" id="share">共有（Drive へ）</button>
		<button type="button" id="save">保存（ダウンロード）</button>
	</div>
	<div class="hint" id="out-info"></div>
</main>

<script src="../js/common.js?v=2026-09-26a"></script>
<script src="../js/stitch.js?v=2026-11-01a"></script>
<script src="../js/video-frames.js?v=2026-11-08d"></script>

<script>
'use strict';
const PAGE_VERSION = 'T90-2026-11-03d';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const Q = new URLSearchParams(location.search);
const N_PROD = Math.max(0, Number(Q.get('runs') || 10));
const N_PROTO = Math.max(0, Number(Q.get('proto') || 3));   // ページの中の試作（UmaMp4Source）があるときだけ
const N_VIDEO = Math.max(0, Number(Q.get('video') || 0));   // video 要素のシークの出どころ（videoSource）だけで通す回数（比べる用）
const SKIP = new Set((Q.get('skip') || '').split(',').filter(Boolean)); // decode, product, seek, proto, video
const KIND_NAME = { product: '製品', proto: '試作', video: 'video要素' };
const LABELS = ['親', '祖1', '祖2'];
const JPEG_Q = 0.85;
const T0 = performance.now();
const sec = (ms) => (ms / 1000).toFixed(2) + '秒';
let REC = null;
const PRELOG = [];   // 記録（REC）ができる前の経過（ファイルの選択の change・cancel など）。REC に写す
let FP = null; // 復号した全フレームの指紋 { fw, fh, pts: [], g: [Uint8Array] }
let STALL = null;

/* ── 記録と表示 ─────────────────────── */
function log(what, detail, cls) {
	const tr = document.createElement('tr');
	tr.innerHTML = '<td class="t">' + sec(performance.now() - T0) + '</td><td>' + (cls ? '<span class="' + cls + '">' : '') + esc(what) + (cls ? '</span>' : '') + (detail ? '　' + esc(detail) : '') + '</td>';
	$('log').appendChild(tr);
	(REC ? REC.log : PRELOG).push([+((performance.now() - T0) / 1000).toFixed(2), what, detail || '']);
}
function now(s) { $('now').textContent = s ? 'いま: ' + s : ''; if (STALL) STALL.at = performance.now(); if (STALL) STALL.what = s; }
function renderEnv() {
	$('ua').textContent = navigator.userAgent;
	const has = (b) => (b ? '<span class="ok">あり</span>' : '<span class="ng">なし</span>');
	const v = document.createElement('video');
	const cp = (t) => esc(v.canPlayType(t) || '（空）');
	const env = {
		screen: screen.width + 'x' + screen.height, dpr: devicePixelRatio, innerWidth, cores: navigator.hardwareConcurrency || null, memory: navigator.deviceMemory || null,
		videoFrames: window.UmaVideoFrames ? UmaVideoFrames.VERSION : null, stitch: typeof STITCH_JS_VERSION !== 'undefined' ? STITCH_JS_VERSION : null, common: typeof COMMON_JS_VERSION !== 'undefined' ? COMMON_JS_VERSION : null,
		VideoDecoder: typeof VideoDecoder !== 'undefined', VideoFrame: typeof VideoFrame !== 'undefined', rvfc: 'requestVideoFrameCallback' in HTMLVideoElement.prototype, fastSeek: 'fastSeek' in HTMLMediaElement.prototype,
		share: !!(navigator.share && navigator.canShare), wakeLock: !!navigator.wakeLock, mp4src: !!(window.UmaMp4Source || (window.UmaVideoFrames && UmaVideoFrames.mp4Source)),
		canPlay: { mp4: v.canPlayType('video/mp4'), mov: v.canPlayType('video/quicktime'), hvc1: v.canPlayType('video/mp4; codecs="hvc1.1.6.L150.B0"'), avc1: v.canPlayType('video/mp4; codecs="avc1.640028"') }
	};
	$('env').innerHTML = [
		['画面', env.screen + '・dpr ' + env.dpr + '・表示幅 ' + env.innerWidth + '・' + (env.cores || '?') + 'コア'],
		['js の版', 'video-frames ' + (env.videoFrames || '<span class="ng">読めない</span>') + '・stitch ' + env.stitch + '・common ' + env.common + '・ページ ' + PAGE_VERSION],
		['WebCodecs', 'VideoDecoder ' + has(env.VideoDecoder) + '・VideoFrame ' + has(env.VideoFrame) + '・<span id="env-vd">（調べています）</span>'],
		['ほか', 'requestVideoFrameCallback ' + has(env.rvfc) + '・共有 ' + has(env.share) + '・MP4 の分解 ' + has(env.mp4src) + '・canPlayType hvc1 ' + cp('video/mp4; codecs="hvc1.1.6.L150.B0"')]
	].map(([k, val]) => '<i>' + esc(k) + ':</i> ' + val).join('／');
	if (env.VideoDecoder && VideoDecoder.isConfigSupported) {
		const q = (codec) => VideoDecoder.isConfigSupported({ codec, codedWidth: 1180, codedHeight: 2554 }).then((r) => r.supported, () => false);
		Promise.all([q('avc1.640028'), q('hvc1.1.6.L150.B0')]).then(([a, h]) => { env.h264 = a; env.hevc = h; $('env-vd').innerHTML = 'H.264 ' + has(a) + '・HEVC ' + has(h); });
	} else $('env-vd').innerHTML = '<span class="ng">VideoDecoder なし</span>';
	return env;
}
const ENV = renderEnv();

/* ── 小道具 ─────────────────────── */
const fnv = (u8) => { let h = 0x811c9dc5; for (let i = 0; i < u8.length; i++) { h ^= u8[i]; h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); };
function canvasHash(c) { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; return fnv(d) + ':' + c.width + 'x' + c.height; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function meanAbs(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }
// 指紋: 本文が入りうる帯（0.30H〜0.92H）を幅 W/16・高さ 1/3 に縮めたグレー
const fpc = document.createElement('canvas'); const fpx = fpc.getContext('2d', { willReadFrequently: true });
function makeFP(W, H) { const fw = Math.max(8, Math.round(W / 16)); const bandY0 = Math.round(H * 0.30), bandH = Math.round(H * 0.92) - bandY0; const fh = Math.round(bandH / 3); fpc.width = fw; fpc.height = fh; return { fw, fh, bandY0, bandH, W, H, pts: [], g: [] }; }
function fingerprint(img, sw, sh) {
	const y0 = Math.round(FP.bandY0 * sh / FP.H), bh = Math.round(FP.bandH * sh / FP.H);
	fpx.drawImage(img, 0, y0, sw, bh, 0, 0, FP.fw, FP.fh);
	const d = fpx.getImageData(0, 0, FP.fw, FP.fh).data; const g = new Uint8Array(FP.fw * FP.fh);
	for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8;
	return g;
}
// 時刻 t に期待するフレーム（pts ≤ t の最後）
function jAt(t) { const p = FP.pts; let lo = 0, hi = p.length - 1; if (!p.length || p[0] > t) return 0; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (p[m] <= t + 1e-9) lo = m; else hi = m - 1; } return lo; }
// 指紋 g がどのフレームか: 期待の近く（±R）でいちばん近いもの。同点（差 ≤ best+0.6）の範囲も返す
function identify(g, jc, R) {
	if (!FP || !FP.g.length) return null;
	let best = -1, bd = Infinity; const lo = Math.max(0, jc - R), hi = Math.min(FP.g.length - 1, jc + R);
	const ds = new Float32Array(hi - lo + 1);
	for (let j = lo; j <= hi; j++) { const d = meanAbs(g, FP.g[j]); ds[j - lo] = d; if (d < bd) { bd = d; best = j; } }
	let tlo = best, thi = best;
	for (let j = best - 1; j >= lo && ds[j - lo] <= bd + 0.6; j--) tlo = j;
	for (let j = best + 1; j <= hi && ds[j - lo] <= bd + 0.6; j++) thi = j;
	return { j: best, d: +bd.toFixed(2), lo: tlo, hi: thi, exp: jc, hit: jc >= tlo && jc <= thi, edge: best === lo || best === hi };
}
const vState = (v) => v ? { rs: v.readyState, ns: v.networkState, t: +v.currentTime.toFixed(4), err: v.error ? v.error.code : 0 } : null;

/* ── 製品／試作の1回 ─────────────────────── */
// 出どころを包み、シークごとに（頼んだ時刻・大きさ・ms・描かれた画がどのフレームか）を記録する
function wrapSource(src, seekLog, getVideo) {
	return Object.assign({}, src, {
		async drawAt(t, ctx, dw, dh, signal, how) {
			const s = performance.now();
			await src.drawAt(t, ctx, dw, dh, signal, how);
			const ms = performance.now() - s;
			const v = getVideo ? getVideo() : null;
			const e = { t: +t.toFixed(4), sz: dw === src.width ? 'F' : 's', ms: Math.round(ms * 10) / 10 };
			if (how && how.waitFrame) e.wait = 1;
			if (v) e.cur = +v.currentTime.toFixed(4);
			if (FP && FP.g.length) { const g = fingerprint(ctx.canvas, dw, dh); const id = identify(g, jAt(t), 40); if (id) { e.exp = id.exp; e.got = id.j; e.d = id.d; if (!id.hit) e.miss = 1; if (id.lo !== id.hi) e.tie = [id.lo, id.hi]; if (id.edge) e.edge = 1; } }
			seekLog.push(e);
		}
	});
}
async function runOnce(kind, file, runNo, images) {
	const rec = { run: runNo, seeks: [] };
	const t0 = performance.now();
	let video = null, src0 = null;
	const orig = document.createElement;
	const name = KIND_NAME[kind] || kind;
	// product … 製品と同じ出どころ（openSource があればそれ。無い版なら videoSource）／video … video 要素のシーク／proto … ページの中の試作
	if (kind !== 'proto') document.createElement = function (tag, o) { const el = orig.call(document, tag, o); if (!video && String(tag).toLowerCase() === 'video') video = el; return el; };
	try {
		now(name + ' ' + runNo + '回目: 読み込み');
		try {
			if (kind === 'product') src0 = await (UmaVideoFrames.openSource ? UmaVideoFrames.openSource(file) : UmaVideoFrames.videoSource(file));
			else if (kind === 'video') src0 = await UmaVideoFrames.videoSource(file);
			else src0 = await UmaMp4Source.open(file);
		} finally { document.createElement = orig; }
		rec.openMs = Math.round(performance.now() - t0);
		rec.kind = src0.kind || null; if (src0.fallback) rec.fallback = src0.fallback; if (src0.codec) rec.codec = src0.codec;
		rec.video = { W: src0.width, H: src0.height, D: +src0.duration.toFixed(3) };
		const src = wrapSource(src0, rec.seeks, () => video);
		const dbg = {};
		let phase = '';
		const sel = await UmaVideoFrames.selectFrames(src, { labels: LABELS, debug: dbg, onProgress: (p) => { if (p.phase !== phase) { phase = p.phase; now(name + ' ' + runNo + '回目: ' + p.phase); } } });
		rec.selectMs = Math.round(performance.now() - t0);
		if (src0.stat) rec.srcStat = Object.assign({}, src0.stat);
		src0.close(); src0 = null;
		rec.header = sel.header; rec.anchors = sel.anchors; rec.picks = sel.picks; rec.stats = sel.stats; rec.tm = Object.fromEntries(Object.entries(sel.tm).map(([k, v]) => [k, Math.round(v)]));
		rec.seams = sel.seams.map((s) => [s.from, s.to, s.shift, s.badRate, s.secondRatio, s.weak ? 1 : 0, s.uncertain ? 1 : 0, s.anchor ? 1 : 0]);
		rec.files = [];
		for (const f of sel.files) rec.files.push(fnv(new Uint8Array(await f.arrayBuffer())));
		rec.track = dbg.track;
		rec.persons = [];
		for (let k = 0; k < sel.persons.length; k++) {
			const p = sel.persons[k];
			now(name + ' ' + runNo + '回目: ' + p.label + ' を組み立て');
			const pr = { label: p.label, startT: p.startT, anchorY: p.anchorY, n: p.files.length, times: p.times, shifts: p.shifts, uncertain: p.uncertain.map((u) => u ? 1 : 0), still: (p.still || []).map((u) => u ? 1 : 0) };
			try {
				const c = await UmaVideoFrames.composePerson(p.files, p.shifts, p.uncertain, p.label, { still: p.still });
				pr.h = c.height; pr.w = c.width; pr.warn = c._stitchWarnings.length; pr.hash = canvasHash(c);
				const key = k + ':' + pr.hash;
				if (!images[key]) { const d = c.toDataURL('image/jpeg', JPEG_Q); images[key] = { person: k, hash: pr.hash, h: c.height, w: c.width, kind, firstRun: runNo, jpeg: d }; pr.newImage = 1; }
				c.width = c.height = 0;
			} catch (e) { pr.err = (e.code || '') + ' ' + String(e.message || e); }
			rec.persons.push(pr);
		}
		rec.totalMs = Math.round(performance.now() - t0);
	} catch (e) {
		rec.error = (e.name || '') + ' ' + (e.code || '') + ' ' + String(e.message || e);
		rec.totalMs = Math.round(performance.now() - t0);
		if (video) rec.videoState = vState(video);
		if (src0) try { src0.close(); } catch (e2) { /* 何もしない */ }
	} finally { document.createElement = orig; }
	return rec;
}
function addRunRow(stage, rec, first) {
	const tr = document.createElement('tr');
	const same = first && rec.persons && first.persons ? (rec.persons.length === first.persons.length && rec.persons.every((p, k) => p.hash && p.hash === first.persons[k].hash)) : null;
	const cmp = rec.error ? '<span class="ng">失敗</span>' : rec === first ? '—' : same ? '<span class="ok">同じ</span>' : '<span class="ng">違う</span>';
	tr.innerHTML = '<td>' + esc(stage) + '</td><td>' + rec.run + '</td><td class="t">' + (rec.totalMs / 1000).toFixed(1) + '</td><td>' + (rec.persons ? esc(rec.persons.map((p) => p.n).join('／')) : esc(rec.error || '')) + '</td><td>' + (rec.persons ? esc(rec.persons.map((p) => p.h || 'x').join('／')) : '') + '</td><td>' + cmp + '</td>';
	$('runs').appendChild(tr);
}

/* ── 復号（全フレーム）と指紋 ─────────────────────── */
async function decodeAll(file) {
	const d = { };
	// 製品の js の出どころ（UmaVideoFrames.mp4Probe／mp4Source）があればそれ、無ければページの中の試作（UmaMp4Source）
	const M = (window.UmaVideoFrames && UmaVideoFrames.mp4Source) ? { probe: UmaVideoFrames.mp4Probe, open: UmaVideoFrames.mp4Source, parse: null } : window.UmaMp4Source || null;
	if (!M) { d.error = 'no-mp4src'; return d; }
	now('復号: 調べる');
	const probe = await M.probe(file);
	d.probe = Object.assign({}, probe); delete d.probe.track;
	log('復号: 使えるか', JSON.stringify(d.probe), probe.ok ? 'ok' : 'ng');
	if (!probe.ok) return d;
	const t0 = performance.now();
	let src = null;
	try {
		src = await M.open(file, { track: probe.track });
		const tr = probe.track || await M.parse(file);
		FP = makeFP(src.width, src.height);
		const ptsList = []; for (let j = 0; j < tr.n; j++) ptsList.push(tr.pts[tr.order[j]] / tr.timescale);
		let last = -1, mono = true, got = 0, maxGap = 0;
		for (let j = 0; j < tr.n; j++) {
			if (j % 20 === 0) now('復号: ' + j + '/' + tr.n + ' 枚');
			const t = ptsList[j];
			const s = performance.now();
			const f = await src.frameAt(t + 1e-6);
			maxGap = Math.max(maxGap, performance.now() - s);
			if (f.timestamp <= last) mono = false; last = f.timestamp;
			FP.pts.push(t); FP.g.push(fingerprint(f, src.width, src.height)); got++;
		}
		d.frames = tr.n; d.got = got; d.mono = mono; d.ms = Math.round(performance.now() - t0); d.maxFrameMs = Math.round(maxGap); d.fps = Math.round(tr.n / (d.ms / 1000)); d.stat = Object.assign({}, src.stat);
		d.ptsFirst = ptsList.slice(0, 5); d.ptsLast = ptsList.slice(-3); d.duration = src.duration;
		// となりのフレームどうしの指紋の差（止まっている所は 0 に近い）
		const diffs = []; for (let j = 1; j < FP.g.length; j++) diffs.push(+meanAbs(FP.g[j - 1], FP.g[j]).toFixed(2));
		d.neighborDiff = diffs;
		log('復号: 全フレーム', tr.n + '枚・出てきた ' + got + '枚・順序 ' + (mono ? '正しい' : '乱れ') + '・' + sec(d.ms) + '（' + d.fps + '枚/秒・1枚の最大 ' + d.maxFrameMs + 'ms）', got === tr.n && mono ? 'ok' : 'warn');
	} catch (e) { d.error = (e.code || '') + ' ' + String(e.message || e); log('復号: 失敗', d.error, 'ng'); }
	finally { if (src) try { src.close(); } catch (e) { /* 何もしない */ } }
	return d;
}

/* ── シークの照らし合わせ ─────────────────────── */
async function seekProbe(file, track) {
	const out = { points: [], note: '各時刻で a=シーク→すぐ描く・b=シーク→次の画（requestVideoFrameCallback・最長250ms）を待って描く・c=同じ時刻へもう一度シーク（強制）→描く・d=0.5秒先へ行ってから戻る→描く。got は復号の指紋と照らしたフレームの番号（exp が期待）' };
	let src = null, video = null;
	const orig = document.createElement;
	document.createElement = function (tag, o) { const el = orig.call(document, tag, o); if (!video && String(tag).toLowerCase() === 'video') video = el; return el; };
	try {
		try { src = await UmaVideoFrames.videoSource(file); } finally { document.createElement = orig; }
		const W = src.width, H = src.height;
		const sw = Math.max(16, Math.round(W / 6));
		const c = document.createElement('canvas'); c.width = sw; c.height = H; const x = c.getContext('2d', { willReadFrequently: true });
		// 時刻: 軌跡から 止まっている代表 と 動いている（ずれが 20px 以上） を最大 20 ずつ、時間の順に間引く
		const stills = (track || []).filter((f) => f.rep).map((f) => f.t);
		const moving = (track || []).filter((f) => f.step != null && f.step >= 20 && !f.still).map((f) => f.t);
		const pick = (arr, n) => { if (arr.length <= n) return arr; const o = []; for (let i = 0; i < n; i++) o.push(arr[Math.floor(i * arr.length / n)]); return o; };
		const pts = pick(stills, 20).map((t) => ({ t, kind: 'still' })).concat(pick(moving, 20).map((t) => ({ t, kind: 'moving' }))).sort((p, q) => p.t - q.t);
		if (!pts.length) { const D = src.duration; for (let k = 1; k <= 20; k++) pts.push({ t: +(D * k / 21).toFixed(3), kind: 'any' }); }
		out.counts = { still: pts.filter((p) => p.kind === 'still').length, moving: pts.filter((p) => p.kind === 'moving').length };
		const seekRaw = (t, force) => new Promise((res, rej) => {
			if (!force && Math.abs(video.currentTime - t) < 1e-6 && !video.seeking) { res(0); return; }
			const s = performance.now(); let tm = null;
			const done = () => { video.removeEventListener('seeked', done); clearTimeout(tm); res(Math.round((performance.now() - s) * 10) / 10); };
			video.addEventListener('seeked', done); tm = setTimeout(() => { video.removeEventListener('seeked', done); rej(new Error('seek timeout')); }, 20000);
			video.currentTime = t;
		});
		const grab = () => { x.drawImage(video, 0, 0, sw, H); return fingerprint(c, sw, H); };
		const ident = (g, t) => { const id = identify(g, jAt(t), 60); return id ? { got: id.j, d: id.d, lo: id.lo, hi: id.hi, hit: id.hit ? 1 : 0 } : null; };
		for (let i = 0; i < pts.length; i++) {
			const p = pts[i];
			now('シーク: ' + (i + 1) + '/' + pts.length + '（' + p.t.toFixed(2) + '秒）');
			const r = { t: p.t, kind: p.kind, exp: FP && FP.g.length ? jAt(p.t) : null };
			try {
				// a: 0.5秒手前から来て、シーク→すぐ描く
				await seekRaw(Math.max(0, p.t - 0.5), true);
				r.aMs = await seekRaw(p.t, true); r.aCur = +video.currentTime.toFixed(4); const ga = grab(); r.a = ident(ga, p.t);
				// b: 次の画を待つ
				let id = 0, tmr = null;
				const frame = new Promise((res) => { if (typeof video.requestVideoFrameCallback === 'function') id = video.requestVideoFrameCallback((n, m) => res(m)); tmr = setTimeout(() => res(null), 250); });
				const s2 = performance.now();
				await seekRaw(p.t, true);
				const meta = await frame; clearTimeout(tmr); try { video.cancelVideoFrameCallback(id); } catch (e) { /* 無い */ }
				r.bMs = Math.round((performance.now() - s2) * 10) / 10; r.bMeta = meta ? { mediaTime: +meta.mediaTime.toFixed(4), presented: meta.presentedFrames } : null;
				const gb = grab(); r.b = ident(gb, p.t); r.ab = +meanAbs(ga, gb).toFixed(2);
				// c: 同じ時刻へもう一度（強制）
				r.cMs = await seekRaw(p.t, true); const gc = grab(); r.c = ident(gc, p.t); r.bc = +meanAbs(gb, gc).toFixed(2);
				// d: 先へ行ってから戻る
				await seekRaw(Math.min(src.duration - 0.05, p.t + 0.5), true);
				r.dMs = await seekRaw(p.t, true); const gd = grab(); r.d = ident(gd, p.t); r.ad = +meanAbs(ga, gd).toFixed(2);
			} catch (e) { r.error = String(e.message || e); }
			out.points.push(r);
		}
		const hits = (k) => out.points.filter((p) => p[k] && p[k].hit).length, n = out.points.filter((p) => p.a).length;
		out.summary = { n, aHit: hits('a'), bHit: hits('b'), cHit: hits('c'), dHit: hits('d'), abSame: out.points.filter((p) => p.ab != null && p.ab < 1).length, bcSame: out.points.filter((p) => p.bc != null && p.bc < 1).length, adSame: out.points.filter((p) => p.ad != null && p.ad < 1).length };
		log('シーク: 照らし合わせ', JSON.stringify(out.summary), 'ok');
	} catch (e) { out.error = String(e.message || e); log('シーク: 失敗', out.error, 'ng'); }
	finally { if (src) try { src.close(); } catch (e) { /* 何もしない */ } }
	return out;
}

/* ── 全体の流れ ─────────────────────── */
async function start(file) {
	REC = { page: PAGE_VERSION, ua: navigator.userAgent, env: ENV, started: new Date().toISOString(), href: location.href, file: { name: file.name, type: file.type, size: file.size, lastModified: file.lastModified }, params: { runs: N_PROD, proto: N_PROTO, video: N_VIDEO, skip: Array.from(SKIP) }, log: [], visibility: [], cancelEvents: CANCELS, decode: null, product: { js: window.UmaVideoFrames ? UmaVideoFrames.VERSION : null, openSource: !!(window.UmaVideoFrames && UmaVideoFrames.openSource), runs: [] }, seek: null, proto: { runs: [] }, videoEl: { runs: [] }, images: {} };
	REC.log.push(...PRELOG.splice(0));
	document.addEventListener('visibilitychange', () => REC.visibility.push([+((performance.now() - T0) / 1000).toFixed(2), document.visibilityState]));
	let wake = null; try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { /* 無くてもよい */ }
	STALL = { at: performance.now(), what: '' };
	const stallTimer = setInterval(() => { const q = performance.now() - STALL.at; if (q > 15000) $('now').innerHTML = '<span class="ng">止まっている？ ' + esc(STALL.what) + '（' + Math.round(q / 1000) + '秒 進まない）</span>'; }, 1000);
	log('ファイルを選んだ', file.name + '・' + (file.type || '（type なし）') + '・' + (file.size / 1048576).toFixed(1) + 'MB');
	// 1. 復号（全フレーム）と指紋
	if (!SKIP.has('decode')) { REC.decode = await decodeAll(file); }
	// 2. 製品
	let first = null;
	if (!SKIP.has('product')) {
		for (let r = 1; r <= N_PROD; r++) {
			const rec = await runOnce('product', file, r, REC.images);
			if (r > 1 && !rec.error && first && !first.error) { const same = rec.persons.every((p, k) => first.persons[k] && p.hash === first.persons[k].hash) && rec.picks.join() === first.picks.join(); if (same) { delete rec.track; } }
			REC.product.runs.push(rec);
			if (!first) first = rec;
			addRunRow('製品', rec, first);
			log('製品 ' + r + '回目', rec.error ? '失敗 ' + rec.error : (rec.persons.map((p) => p.n + '枚/' + (p.h || 'x') + 'px').join('・') + '・選んだ ' + rec.picks.length + '枚・' + sec(rec.totalMs) + '・取り直し合わず ' + rec.stats.grabMismatch + '（直った ' + rec.stats.grabFixed + '）・シーク外れ ' + rec.seeks.filter((s) => s.miss).length + '/' + rec.seeks.length), rec.error ? 'ng' : '');
			await sleep(300);
		}
	}
	// 3. シークの照らし合わせ
	if (!SKIP.has('seek')) REC.seek = await seekProbe(file, first && first.track);
	// 4. 試作（ページの中の UmaMp4Source があるときだけ）・video 要素のシークだけ（?video=N）
	const stages = [];
	if (!SKIP.has('proto') && window.UmaMp4Source && REC.decode && REC.decode.probe && REC.decode.probe.ok) stages.push(['proto', N_PROTO, REC.proto.runs]);
	if (!SKIP.has('video') && N_VIDEO > 0) stages.push(['video', N_VIDEO, REC.videoEl.runs]);
	for (const [kind, N, runs] of stages) {
		let pf = null;
		for (let r = 1; r <= N; r++) {
			const rec = await runOnce(kind, file, r, REC.images);
			if (r > 1 && pf && !rec.error && !pf.error && rec.persons.every((p, k) => pf.persons[k] && p.hash === pf.persons[k].hash) && rec.picks.join() === pf.picks.join()) delete rec.track;
			runs.push(rec);
			if (!pf) pf = rec;
			addRunRow(KIND_NAME[kind], rec, pf);
			log(KIND_NAME[kind] + ' ' + r + '回目', rec.error ? '失敗 ' + rec.error : (rec.persons.map((p) => p.n + '枚/' + (p.h || 'x') + 'px').join('・') + '・選んだ ' + rec.picks.length + '枚・' + sec(rec.totalMs) + '・取り直し合わず ' + rec.stats.grabMismatch + '・シーク外れ ' + rec.seeks.filter((s) => s.miss).length + '/' + rec.seeks.length), rec.error ? 'ng' : '');
			await sleep(300);
		}
	}
	clearInterval(stallTimer); now('');
	REC.finished = new Date().toISOString(); REC.totalSec = +((performance.now() - T0) / 1000).toFixed(1);
	FP = null;
	if (wake) try { wake.release(); } catch (e) { /* 何もしない */ }
	finish();
}
let OUT = null;
function finish() {
	const same = (runs) => { const ok = runs.filter((r) => !r.error); if (!ok.length) return '—'; const h = (r) => r.persons.map((p) => p.hash).join(' '); const n = ok.filter((r) => h(r) === h(ok[0])).length; return n + '/' + runs.length + ' 回が1回目と同じ' + (runs.length !== ok.length ? '（失敗 ' + (runs.length - ok.length) + '）' : ''); };
	$('sum').textContent = '製品 ' + same(REC.product.runs) + (REC.proto.runs.length ? '／試作 ' + same(REC.proto.runs) : '') + (REC.videoEl.runs.length ? '／video要素 ' + same(REC.videoEl.runs) : '') + '・全体 ' + REC.totalSec + '秒';
	const json = JSON.stringify(REC);
	const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
	const stamp = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()); // 端末の時刻
	const base = (REC.file.name || 'video').replace(/\.[^.]+$/, '').replace(/[^\w぀-鿿-]+/g, '_').slice(0, 24);
	const name = 'T90-diag-' + stamp + '-' + base + '.json';
	const blob = new Blob([json], { type: 'application/json' });
	OUT = { blob, name, full: true };
	$('out-info').textContent = name + '・' + (blob.size / 1048576).toFixed(1) + 'MB';
	$('btns').hidden = false;
	log('終わった', '記録 ' + name + '（' + (blob.size / 1048576).toFixed(1) + 'MB）。「共有」か「保存」で端末に出してください', 'ok');
}
$('share').addEventListener('click', async () => {
	if (!OUT) return;
	const f = new File([OUT.blob], OUT.name, { type: 'application/json' });
	if (navigator.share && navigator.canShare && navigator.canShare({ files: [f] })) {
		try { await navigator.share({ files: [f], title: OUT.name }); log('共有した', OUT.name, 'ok'); } catch (e) { log('共有: ' + (e.name === 'AbortError' ? 'やめた' : '失敗'), String(e.message || e), e.name === 'AbortError' ? 'warn' : 'ng'); }
	} else { log('共有: この端末では使えない。「保存」を押してください', '', 'warn'); }
});
$('save').addEventListener('click', () => {
	if (!OUT) return;
	const a = document.createElement('a'); a.href = URL.createObjectURL(OUT.blob); a.download = OUT.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
	log('保存した', OUT.name + '（ダウンロード）', 'ok');
});
const CANCELS = [];
const fileInput = $('file');
let openedAt = null;
fileInput.addEventListener('click', () => { openedAt = performance.now(); });
fileInput.addEventListener('cancel', () => { const e = { at: +((performance.now() - T0) / 1000).toFixed(2), afterMs: openedAt ? Math.round(performance.now() - openedAt) : null }; CANCELS.push(e); log('動画を選ばずに戻った（cancel）', openedAt ? Math.round(performance.now() - openedAt) + 'ms 後' : '', 'ok'); offerCancelRecord(); });
// 動画を選ばずに戻ったときは、その記録だけでも書き出せるようにする（動画を通す前でも「共有」「保存」が押せる）
function offerCancelRecord() {
	if (REC || OUT && OUT.full) return;
	const rec = { page: PAGE_VERSION, ua: navigator.userAgent, env: ENV, started: new Date().toISOString(), href: location.href, kind: 'cancel-only', cancelEvents: CANCELS.slice(), log: PRELOG.slice() };
	const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
	const name = 'T90-cancel-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
	OUT = { blob: new Blob([JSON.stringify(rec)], { type: 'application/json' }), name, full: false };
	$('out-info').textContent = name + '（選ばずに戻った記録だけ。このまま動画を選んで続けてもよい）';
	$('btns').hidden = false;
}
fileInput.addEventListener('change', async (ev) => {
	const n = ev.target.files ? ev.target.files.length : 0;
	const f = n ? ev.target.files[0] : null;
	if (!f) { const e = { at: +((performance.now() - T0) / 1000).toFixed(2), afterMs: openedAt ? Math.round(performance.now() - openedAt) : null, files: 0 }; CANCELS.push(e); log('動画を選ばずに戻った（change・0本）', openedAt ? Math.round(performance.now() - openedAt) + 'ms 後' : '', 'ok'); ev.target.value = ''; offerCancelRecord(); return; }
	log('動画を選んだ（change・' + n + '本）', openedAt ? Math.round(performance.now() - openedAt) + 'ms 後' : '');
	ev.target.disabled = true;
	$('file-info').textContent = f.name + '・' + (f.type || '（type なし）') + '・' + (f.size / 1048576).toFixed(1) + 'MB';
	try { await start(f); } catch (e) { log('想定外の失敗', String(e.stack || e.message || e), 'ng'); if (REC) { REC.fatal = String(e.stack || e.message || e); finish(); } }
	ev.target.disabled = false;
});
</script>
