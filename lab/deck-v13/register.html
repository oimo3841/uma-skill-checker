<!doctype html>
<html lang="ja" data-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>Deck モック v13 登録（作業用）</title>
	<!--
		UmaStar の OCR から Deck へ送ったときの「登録の画面」のモック版12（段3・T86・C-273。版11〔T84・C-272〕にボタンの形と配色を入れた）。OCR の結果と UmaStar から一緒に送るもの（今選んでいるレース・①の脚質・②のスキルの一覧）は仮のデータ。
		?case=a 親Aだけ・全部読めている（LoH）／b 親Aセット（祖1 は登録済みと全部同じ→「同一」を選んだ状態・祖2 は同じ衣装の登録済みが複数→「同一」か「新規登録」を選ぶ）／
		c 親Aだけ・読めない所あり（緑の候補3つ・青の★不明・赤が読めない・白スキルの★不明2件）／d フレンドの親／e UmaStar のレースが「指定なし」。
		?theme=light|dark で見た目を固定（撮影用）。保存先は deck.html と同じ IndexedDB（uma-lab-deck-v13）。
	-->
	<link rel="stylesheet" href="../../css/tokens.css" />
	<link rel="stylesheet" href="deck-v13.css" />
</head>
<body class="page">
<main class="reg" id="reg">
	<div class="topline"><h1>Deck に登録</h1><span class="muted small">UmaStar から</span><span class="sp" style="flex:1"></span><span class="need" id="needTop" hidden></span></div>
	<div id="body"></div>
</main>
<div class="regbar" id="regbar"><span class="sum" id="regSum"></span><button class="btn pri" type="button" id="regBtn">登録する</button></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="data-snapshot.js"></script>
<script src="deck-v13-core.js"></script>
<script src="deck-v13-register.js"></script>
</body>
</html>
