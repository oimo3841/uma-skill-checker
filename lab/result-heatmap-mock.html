	<title>照合結果のヒートマップ</title>
	<link rel="icon" href="data:," />
	<!--
		T100 段1 のモック（作業用）。UmaStar（special）と UmaExam（exam）の「照合結果」の引き出しを、スマホの幅で
		今の形と新しい形（★の記号をやめ、人ごとのマスを★の数で塗るヒートマップ）で並べて見るためのページ。
		**ツール本体には組み込まない**（どのページからもリンクしない）。ゲームの画面の画像は使わない。外へは何も送らない・何も保存しない。
		表の中身は仮のデータ（test-images の静止画1セットを今の製品で照合した結果の、スキル名と★の数だけ。★不明の「?」は見本のために2マスだけ足した）。
		「今の形」は製品の引き出しの寸法（余白・文字の大きさ・列の幅）を写した。新しい形は 640px 未満（今のツールの sm の切り替え）のときだけ効く。
		PC（640px 以上）では新しい形を選んでも今の形のまま（下の @media の外は今の形）。

		引数: ?tool=star|exam（無ければ一覧のページ）・?form=now|new・?theme=light|dark・?sets=a|ab（UmaExam の親Bセットの有無）
	-->

/* ===== 引き出しの骨格（css/shell.css の .uma-drawer を写した） ===== */
.page-bg { position: fixed; inset: 0; background: var(--uma-page); }
.backdrop { position: fixed; inset: 0; background: var(--uma-scrim); }
.drawer { position: fixed; top: 0; right: 0; width: min(96vw, 1100px); height: 100%; display: flex; flex-direction: column;
	background: var(--uma-drawer-bg); box-shadow: -8px 0 32px rgba(0, 0, 0, .18); color: var(--uma-text); }
.dr-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--uma-surface); border-bottom: 1px solid var(--uma-border); }
.dr-title { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--uma-text-heading); }
.dr-title svg { width: 16px; height: 16px; color: #16a34a; }
.btn-close { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--uma-border-strong); background: var(--uma-surface); color: var(--uma-text-heading); font-size: 12px; font-weight: 600; }
.dr-tabs { flex-shrink: 0; display: flex; gap: 8px; padding: 0 16px; background: var(--uma-surface); border-bottom: 1px solid var(--uma-border); }
.dr-tab { display: flex; align-items: center; gap: 6px; padding: 10px 8px; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid transparent; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--uma-text-subtle); }
.dr-tab.sel { color: var(--uma-text-heading); border-bottom-color: var(--uma-control-mark); }
.dr-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #e11d48; box-shadow: 0 0 0 3px rgba(225, 29, 72, .2); }
.uma-drawer-body { flex: 1; min-height: 0; overflow-y: auto; background: var(--uma-drawer-bg); }
.content { padding: 16px; }
.ic { width: 14px; height: 14px; flex-shrink: 0; }

/* ===== 今の形（製品の寸法を写した。PC はこのまま） ===== */
/* UmaStar: Deck (αテスト)に送る（uma-btn--primary uma-btn--lg）と停止の1行 */
#deck-alpha-send-note { margin-bottom: 24px; }
.btn-deck { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border: 0; border-radius: 14px;
	background: var(--deck-btn); color: var(--deck-btn-text); font-size: 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.deck-stop { margin: 6px 0 0; font-size: 11px; line-height: 16.5px; color: var(--slate-500); }
/* UmaExam: UmaSkill Deck への受け渡しの案内（deck-note） */
#deck-handoff-note { margin-bottom: 24px; }
.deck-note { border: 1px solid var(--deck-note-border); border-radius: 12px; background: var(--deck-note-bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 640px) { .deck-note { flex-direction: row; align-items: center; justify-content: space-between; } .deck-note-btn { flex-shrink: 0; } }
.deck-note-title { margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--deck-note-text); }
.deck-note-detail { margin: 2px 0 0; font-size: 11px; line-height: 1.625; color: var(--deck-note-text); }
.deck-note-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: 0; border-radius: 12px; background: var(--deck-note-btn); color: #fff; font-size: 12px; font-weight: 600; }
/* サマリーカード */
.stat-grid { display: grid; gap: 12px; margin-bottom: 24px; grid-template-columns: repeat(var(--stat-cols-sm, 2), minmax(0, 1fr)); }
@media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(var(--stat-cols, 4), minmax(0, 1fr)); } }
.stat { border-radius: 12px; border: 1px solid var(--slate-200); background: color-mix(in srgb, var(--slate-50) 50%, transparent); padding: 12px; text-align: center; }
@media (min-width: 768px) { .stat { padding: 16px; } }
.stat-label { margin: 0 0 4px; font-size: 11px; line-height: 16.5px; font-weight: 500; color: var(--slate-500); }
.stat-num { margin: 0; font-size: 18px; line-height: 28px; font-weight: 800; color: var(--slate-900); }
@media (min-width: 768px) { .stat-num { font-size: 24px; line-height: 32px; } }
.stat-sub { margin: 2px 0 0; font-size: 10px; line-height: 15px; font-weight: 500; color: var(--slate-400); }
.stat.p-a { border-color: var(--person-border); background: var(--person-50); }
.stat.p-a .stat-label { color: var(--person-700); } .stat.p-a .stat-num { color: var(--person-600); } .stat.p-a .stat-sub { color: var(--person-500); }
.stat.p-b { border-color: var(--person-b-200, var(--person-b-border-soft)); background: var(--person-b-50, transparent); }
.stat.p-b .stat-label { color: var(--person-b-700, var(--person-b-fg)); } .stat.p-b .stat-num { color: var(--person-b-600, var(--person-b-fg)); } .stat.p-b .stat-sub { color: var(--person-b-600, var(--person-b-fg)); }
/* 検索・絞り込み・コピー */
.ctrlbox { display: block; }
.ctrl { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
@media (min-width: 640px) { .ctrl { flex-direction: row; } }
.srch { position: relative; width: 100%; }
@media (min-width: 640px) { .srch { width: 256px; } }
.srch svg { position: absolute; left: 12px; top: 8px; width: 16px; height: 16px; color: var(--slate-400); }
#table-search { width: 100%; padding: 6px 12px 6px 36px; font-size: 12px; line-height: 16px; border-radius: 8px; border: 1px solid var(--slate-200); background: var(--uma-surface); color: var(--uma-text); }
.pills { display: flex; align-items: center; justify-content: flex-end; gap: 4px; width: 100%; font-size: 12px; }
@media (min-width: 640px) { .pills { width: auto; } }
.pill { padding: 4px 12px; line-height: 16px; border-radius: 8px; border: 1px solid var(--usd-ui-line); background: var(--uma-surface); color: var(--uma-text-muted); font-size: 12px; font-weight: 500; }
.pill.active { color: var(--uma-text-heading); border-color: var(--usd-ui-sel); box-shadow: inset 0 0 0 1px var(--usd-ui-sel); }
:root[data-tool="exam"] .pill { border: 0; background: var(--pill-off); color: var(--pill-off-text); }
:root[data-tool="exam"] .pill.active { background: var(--pill-on); color: var(--pill-on-text); box-shadow: none; }
:root[data-tool="exam"] .ctrl { margin-bottom: 8px; }
.copy-slot { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
.btn-copy { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--uma-control); color: #fff; font-size: 12px; font-weight: 700; }

		const stat = isExam ? EXAM_STAT : STAR_STAT;
		const n = labels.length;
		const showTotal = n >= 2;
		let html = '<div class="page-bg"></div><div class="backdrop"></div>';
		html += '<aside class="drawer f-' + f + '" id="result-drawer" role="dialog" aria-label="照合結果">';
		html += '<div class="dr-head"><span class="dr-title">' + SVG.list + '<span>' + (isExam ? '判定の結果' : '照合結果（★の数）') + '</span></span>' +
			'<button type="button" class="btn-close">' + SVG.x + '<span>閉じる</span></button></div>';
		html += '<div class="dr-tabs"><button type="button" class="dr-tab sel">' + SVG.list.replace('<svg', '<svg class="ic"') + '<span>照合結果</span></button>' +
			'<button type="button" class="dr-tab">' + SVG.img + '<span>' + (isExam ? '結合画像の表示' : '結合画像') + '</span><span class="dot"></span></button></div>';
		html += '<div class="uma-drawer-body"><div class="content"><div id="result-wrap">';
		if (!isExam) {
			html += '<div id="deck-alpha-send-note"><button type="button" class="btn-deck">' + SVG.send + '<span>Deck (αテスト)に送る</span></button>' +
				'<p class="deck-stop">UmaSkill Deck は開発を停止しました。</p></div>';
		} else {
			html += '<div id="deck-handoff-note"><div class="deck-note"><div><p class="deck-note-title">この結果をUmaSkill Deckに取り込めます</p>' +
				'<p class="deck-note-detail">' + esc(EXAM_DECK_DETAIL) + '</p></div>' +
				'<button type="button" class="deck-note-btn">' + SVG.layers + '<span>UmaSkill Deckを開いて取り込む</span></button></div></div>';
		}
		// サマリー
		const statColsSm = isExam ? (n + 1 <= 4 ? n + 1 : 2) : (n + 1 <= 3 ? n + 1 : 2);
		html += '<div id="stat-grid" class="stat-grid" style="--stat-n:' + (n + 1) + ';--stat-cols:' + Math.min(n + 1, n + 1 > 4 ? n + 1 : 4) + ';--stat-cols-sm:' + statColsSm + '">';
		html += '<div class="stat"><p class="stat-label">対象スキル数</p><p class="stat-num">' + esc(stat.total) + '</p>' + (stat.totalSub ? '<p class="stat-sub">' + esc(stat.totalSub) + '</p>' : '') + '</div>';
		labels.forEach((lb, i) => {
			const found = i < 3 ? stat.found[i] : stat.found[[2, 0, 1][i - 3]];
			const sub = stat.foundSub ? (i < 3 ? stat.foundSub[i] : stat.foundSub[[2, 0, 1][i - 3]]) : '';
			html += '<div class="stat ' + (i < 3 ? 'p-a' : 'p-b') + '"><p class="stat-label">' + lb + ' 検出</p><p class="stat-num">' + esc(found) + '</p>' + (sub ? '<p class="stat-sub">' + esc(sub) + '</p>' : '') + '</div>';
		});
		html += '</div>';
		if (isExam) html += EXAM_HIGHLIGHT_HTML(s === 'ab');
		// 検索・絞り込み・コピー
		html += '<div class="ctrlbox"><div class="ctrl"><div class="srch">' + SVG.search + '<input type="text" id="table-search" placeholder="' + (isExam ? 'スキル名' : '名前') + 'で絞り込み..." /></div>' +
			'<div class="pills"><button type="button" class="pill active" id="filter-all">すべて</button><button type="button" class="pill" id="filter-found">誰かが検出</button><button type="button" class="pill" id="filter-not-found">全員未検出</button></div></div>';
		if (isExam) {
			html += '<p class="ex-count">「すべて」に該当: ' + rows.length + '件 / 全' + rows.length + '件中</p>';
			html += '<p class="ex-note">※ スマホ等の狭い画面では、スキル名列を固定したまま横スクロールで確認できます。</p>';
			if (s === 'ab') html += '<div class="ex-toggle"><span>表示する列：</span><button type="button" class="on-a">親Aセット</button><button type="button" class="on-b">親Bセット</button></div>';
		}
		html += '<div class="copy-slot"><button type="button" class="btn-copy" id="result-copy-btn">' + SVG.copy + '<span>★の数をコピー（' + n + '列）</span></button></div></div>';
		// 表
		const nameHead = isExam ? 'スキル名（リスト順）' : '名前（リスト順）';
		const nameW = n <= 1 ? '40%' : n === 2 ? '33.333%' : n <= 4 ? '25%' : '20%';
		html += '<div class="tbl-wrap"><table class="result-table"' + (isExam ? ' style="min-width:' + (112 + n * 56 + (showTotal ? 56 : 0)) + 'px"' : '') + '>';
		
		html += '<thead><tr><th class="nm" style="width:' + nameW + '">' + nameHead + '</th>' +
			labels.map((lb, i) => '<th class="pc' + (i >= 3 ? ' pb' : '') + (i === 3 ? ' bd' : '') + '">' + lb + '</th>').join('') +
			(showTotal ? '<th class="tot">★合計</th>' : '') + '</tr></thead><tbody>';
		rows.forEach((r) => {
			let mark = '';
			if (isExam) mark = r.mark ? '<span class="gl gl-' + (r.tone.indexOf('mark-plain') >= 0 ? 'plain' : r.tone) + '" title="' + esc(r.title) + '">' + esc(r.mark) + '</span>' : '';
			else mark = '<span class="mk mk-' + r.mark + '" role="img" aria-label="' + (r.mark === 'gene' ? '遺伝子' : r.mark === 'star' ? 'サポカ外スキル' : 'その他（親から継承）') + '"></span>';
			const nameHtml = (isExam || r.mark === 'gene') ? esc(r.name) : '<span class="sn' + (r.tone ? ' tone-' + r.tone : '') + '">' + esc(r.name) + '</span>';
			html += '<tr><td class="nm">' + mark + nameHtml + '</td>';
			let total = 0;
			r.vals.forEach((v, i) => {
				const cls = 'pc' + (i >= 3 ? ' pb' : '') + (i === 3 ? ' bd' : '');
				let star, hmCls, hmTxt;
				if (v < 0) { star = '<span class="st-none">−</span>'; hmCls = 'h0'; hmTxt = ''; }
				else if (v === 0) { star = '<span class="st-unk" title="スキルは検出できましたが★の数を確定できませんでした">?</span>'; hmCls = 'hu'; hmTxt = '?'; }
				else { total += v; star = '<span class="st-on">' + '★'.repeat(v) + '</span><span class="st-off">' + '★'.repeat(3 - v) + '</span>'; hmCls = 'h' + v; hmTxt = String(v); }
				html += '<td class="' + cls + ' ' + hmCls + '"><span class="st">' + star + '</span><span class="hm" aria-label="' + (v < 0 ? '未検出' : v === 0 ? '★不明' : '★' + v) + '">' + hmTxt + '</span></td>';
			});
			if (showTotal) html += '<td class="tot">' + total + '</td>';
			html += '</tr>';
		});
		html += '</tbody></table></div></div></div></div></aside>';
		document.body.innerHTML = html;
		if (isExam && s === 'ab') document.querySelector('.result-table').style.setProperty('--hm-col', '36px');
	}

	function renderGallery() {
		document.body.className = 'gal';
		document.documentElement.classList.add('gal');
		const th = theme;
		const fr = (t, f, extra, cap, cls) => '<figure><figcaption>' + cap + '</figcaption>' +
			(cls === 'pc' ? '<div class="pcwrap">' : '') +
			'<iframe class="' + (cls === 'pc' ? '' : 'phone') + '" loading="lazy" title="' + cap + '" src="?tool=' + t + '&form=' + f + '&theme=' + th + (extra || '') + '"></iframe>' +
			(cls === 'pc' ? '</div>' : '') + '</figure>';
		const PAL = [
			['UmaStar ライト', '#fffdf8', '#cdeed6', '#14532d', '7.29', '#7fd39b', '#0b3d1f', '6.87', '#1e7f45', '#ffffff', '5.03', '#ece7dd', '#b5ab98', '#3d3428', '9.91／5.37'],
			['UmaStar ダーク', '#262523', '#1f4a30', '#c3f3d2', '8.21', '#3fa566', '#04170c', '5.99', '#8de3a9', '#04170c', '12.09', '#34322e', '#5c5a55', '#f3f1ec', '11.33／6.10'],
			['UmaExam ライト', '#ffffff', '#cbe5ff', '#0c3b6b', '8.74', '#7cbcfb', '#08284a', '7.39', '#0b6bcb', '#ffffff', '5.28', '#e6ebf3', '#a9b6cb', '#1f2d47', '11.51／6.72'],
			['UmaExam ダーク', '#222c3d', '#1d4f86', '#d6ebff', '6.83', '#4a90dc', '#03101f', '5.75', '#8cc4fb', '#08284a', '8.07', '#363e4c', '#5c6779', '#f1f4fa', '9.77／5.19']
		];
		const sw = (bg, fg, txt) => '<span class="sw" style="background:' + bg + ';color:' + fg + '">' + txt + '</span>';
		const swU = (b, l, t) => '<span class="sw" style="background-color:' + b + ';background-image:repeating-linear-gradient(45deg,' + l + ' 0 1px,transparent 1px 5px);color:' + t + '">?</span>';
		let pal = '<table class="pal"><thead><tr><th>ツール・テーマ</th><th>★0（塗りなし）</th><th>★1</th><th>★2</th><th>★3</th><th>★不明</th><th>数字／「?」と地のコントラスト</th></tr></thead><tbody>';
		PAL.forEach((p) => {
			pal += '<tr><td>' + p[0] + '</td><td>' + sw(p[1], '#888', '') + ' ' + p[1] + '</td><td>' + sw(p[2], p[3], '1') + ' ' + p[2] + '</td><td>' + sw(p[5], p[6], '2') + ' ' + p[5] + '</td><td>' + sw(p[8], p[9], '3') + ' ' + p[8] +
				'</td><td>' + swU(p[11], p[12], p[13]) + ' ' + p[11] + '</td><td>★1 ' + p[4] + '・★2 ' + p[7] + '・★3 ' + p[10] + '・? ' + p[14] + '</td></tr>';
		});
		pal += '</tbody></table>';
		document.body.innerHTML =
			'<div class="gal-head"><h1>照合結果のスマホのヒートマップ（T100 段1 モック）</h1>' +
			'<span>テーマ: <button type="button" data-th="light" aria-pressed="' + (th === 'light') + '">ライト</button> <button type="button" data-th="dark" aria-pressed="' + (th === 'dark') + '">ダーク</button></span></div>' +
			'<section><h2>UmaStar（375×812）</h2><p class="note">左が今の形、右が新しい形。表は「名前｜親A｜祖A1｜祖A2」で、★の数でマスを塗る（数字つき）。札幌レース場○の祖A1 とダートの遺伝子の祖A2 は「?」（★不明）の見本。</p>' +
			'<div class="frames">' + fr('star', 'now', '', '今の形') + fr('star', 'new', '', '新しい形') + '</div></section>' +
			'<section><h2>UmaExam（375×812）</h2><p class="note">左が今の形（親Aセットだけ）、中が新しい形（親Aセットだけ）、右が新しい形で親Bセットもあるとき（親Bセットの値は見本のための仮の値）。</p>' +
			'<div class="frames">' + fr('exam', 'now', '', '今の形') + fr('exam', 'new', '', '新しい形') + fr('exam', 'new', '&sets=ab', '新しい形（親Bセットあり）') + '</div></section>' +
			'<section><h2>PC（1280×900・半分に縮小）</h2><p class="note">新しい形を選んだ状態で開いている。640px 以上では今の形のまま（新しい形の指定は 640px 未満の中だけ）。</p>' +
			'<div class="frames">' + fr('star', 'new', '', 'UmaStar（新しい形の指定のまま）', 'pc') + fr('exam', 'new', '', 'UmaExam（新しい形の指定のまま）', 'pc') + '</div></section>' +
			'<section><h2>塗りの3段と★不明の色</h2>' + pal + '</section>';
		document.querySelectorAll('[data-th]').forEach((b) => b.addEventListener('click', () => {
			const u = new URL(location.href); u.searchParams.set('theme', b.getAttribute('data-th')); location.href = u.toString();
		}));
	}
	// UmaExam のハイライト（親Aセット。親Bセットがあるときは親Bセットの箱も。B の数は見本のための仮の値＝A の人を1つずらしたもの）
	function EXAM_HIGHLIGHT_HTML(withB) {
		const target = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
		const person = (name, d) => '<div class="ex-hl-person"><p class="ex-hl-pname">' + name + '</p><div class="hl-cards">' +
			d.labels.map((lb, k) => '<div class="hlc' + (k === 1 ? ' g' : '') + '"><p class="hlc-l">' + esc(lb) + '</p><p class="hlc-n">' + d.nums[k][0] + '<span>/' + d.nums[k][1] + '</span></p></div>').join('') + '</div></div>';
		let h = '<div class="ex-hl"><div class="ex-hl-head"><h3>' + target + '<span>ハイライト</span></h3><div class="ex-hl-modes"><span class="on">実質53種（既定）</span><span>59種個別</span></div></div><div class="ex-hl-sets">';
		h += '<div class="ex-hl-set"><p class="ex-hl-setname">親Aセット</p><div class="ex-hl-people">' + ['親A', '祖A1', '祖A2'].map((nm, i) => person(nm, EXAM_HL_DATA[i])).join('') + '</div></div>';
		if (withB) h += '<div class="ex-hl-set b"><p class="ex-hl-setname">親Bセット</p><div class="ex-hl-people">' + ['親B', '祖B1', '祖B2'].map((nm, i) => person(nm, EXAM_HL_DATA[[2, 0, 1][i]])).join('') + '</div></div>';
		h += '</div><p class="ex-hl-foot">' + esc(EXAM_HL_FOOT) + '</p></div>';
		return h;
	}
})();
</script>
</body>
</html>
