<html lang="ja" data-theme="light">

	<meta charset="UTF-8" />

	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>Deck モック v9 登録（作業用）</title>
	<!--
		UmaStar の OCR から Deck へ送ったときの「登録の画面」のモック（段3・T79）。OCR の結果は仮のデータ（T73 の結果の形）。
		?case=a 親Aだけ・全部読めた／b 家系3人（祖1 は登録済みと完全一致→自動で紐づけ・祖2 は一致が完全でない→選ぶ）／
		c 親Aだけ・読めない所あり（緑の候補3つ・青の★不明・赤が読めない・白スキルの★不明2件）／d フレンドの親。
		?theme=light|dark で見た目を固定（撮影用）。保存先は deck.html と同じ IndexedDB（uma-lab-deck-v9）。
	-->
	<link rel="stylesheet" href="../../css/tokens.css" />
	<link rel="stylesheet" href="deck-v9.css" />
</head>
<body class="page">
<main class="reg" id="reg">
	<div class="topline"><h1>Deck に登録</h1><span class="muted small">UmaStar から</span><span class="sp" style="flex:1"></span><span class="need" id="needTop" hidden></span></div>
	<div id="body"></div>
</main>
<div class="regbar" id="regbar"><span class="sum" id="regSum"></span><button class="btn pri" type="button" id="regBtn">登録する</button></div>
<div class="toast" id="toast" hidden></div>
<script src="data-snapshot.js"></script>
<script src="deck-v9-core.js"></script>
<script src="deck-v9-register.js"></script>
