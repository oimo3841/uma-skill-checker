<!doctype html>
<html lang="ja" data-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（同じフォルダの JS と製品のトークンの CSS だけを読む）。通信は禁止 -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>Deck モック v9（作業用）</title>
	<!--
		新しい UmaSkill Deck のモック（作り直しの段3・T79・2026-11-02）。製品には組み込まない。どのページからもリンクしない。
		■ 3つの画面: このページ（Deck 本体とバックアップ）と register.html（UmaStar の OCR から送ったときの登録の画面）。
		■ 保存: IndexedDB の uma-lab-deck-v9（親1人1件 ＋ meta）。今のツールの localStorage には触れない。
		■ 案の切り替え（「⋯」の「表示の設定」）: 最初の段階（全体／縮小／拡大）・消し方（中身に写す／紐づけがあれば消せない）・因子の札の色（色つき／単色）。
		■ 仮のデータ: 最初に開いたとき親100人を入れる。「⋯」から 30・100・300人に入れ直せる。
		■ 見え方の確認: ?theme=light|dark で見た目を固定できる（設定より優先。撮影用）。
	-->
	<link rel="stylesheet" href="../../css/tokens.css" />
	<link rel="stylesheet" href="deck-v9.css" />
</head>
<body>
<div class="app" id="app">
	<header class="hd">
		<h1>Deck <span class="muted small">α</span></h1>
		<button class="nudge" id="nudge" type="button" hidden></button>
		<span class="sp"></span>
		<button class="btn icon" id="menuBtn" type="button" aria-label="メニュー">⋯</button>
	</header>
	<nav class="tb" aria-label="道具">
		<button class="chip tab" type="button" data-tab="parent" aria-pressed="false">親<span class="n" id="nParent"></span></button>
		<button class="chip tab" type="button" data-tab="skill" aria-pressed="false">スキル<span class="n" id="nSkill"></span></button>
		<button class="chip tab" type="button" data-tab="view" aria-pressed="false">表示</button>
		<span class="seg sm" role="group" aria-label="表示の段階" id="lvSeg">
			<button type="button" data-lv="0" aria-pressed="false">全体</button>
			<button type="button" data-lv="1" aria-pressed="true">縮小</button>
			<button type="button" data-lv="2" aria-pressed="false">拡大</button>
		</span>
	</nav>
	<aside class="panes" id="panes" hidden>
		<section class="pane" data-pane="parent" hidden>
			<h3>親を絞る（列）</h3>
			<div class="row"><span class="lab">まとまり</span><span class="row" id="pf-bundle"></span></div>
			<div class="row"><span class="lab">脚質</span><span class="row" id="pf-style"></span></div>
			<div class="row"><span class="lab">持ち主</span><span class="row" id="pf-owner"></span></div>
			<div class="row"><span class="lab">目標</span><span class="row" id="pf-tier"></span></div>
			<div class="row"><span class="lab">並び</span><select class="sel" id="cs" aria-label="列の並び"><option value="def">登録日の新しい順</option><option value="many">対象の多い順</option><option value="owner">持ち主ごと</option></select></div>
			<details class="fold" id="tierFold"><summary>目標の6人 <span class="muted small" id="tierSum"></span></summary>
				<div class="tier" id="tierSlots"></div>
				<div class="row" style="margin-top:6px"><span class="lab">次善</span><span class="row" id="tier2" style="flex:1"></span></div>
				<p class="hint">継承固有（衣装）で指定。親A・親Bは「必須」にできる。</p>
			</details>
		</section>
		<section class="pane" data-pane="skill" hidden>
			<h3>スキルを絞る（行）</h3>
			<div class="row"><span class="lab">欲しい</span><span class="row" id="sf-want"></span></div>
			<div class="row"><span class="lab">分類</span><span class="row" id="sf-cat"></span></div>
			<div class="row"><span class="lab">距離</span><span class="row" id="sf-dist"></span></div>
			<div class="row"><span class="lab">脚質</span><span class="row" id="sf-style"></span></div>
			<div class="row"><span class="lab">名前</span><input class="txt" id="sf-q" type="search" placeholder="スキル名で探す" aria-label="スキル名で探す" autocomplete="off" style="flex:1;min-width:8em" /></div>
			<div class="row"><span class="lab">並び</span><select class="sel" id="rs" aria-label="行の並び"><option value="def">既定（ゲーム内）</option><option value="few">持つ親の少ない順</option><option value="max">最大の大きい順</option><option value="cat">分類ごと</option></select></div>
		</section>
		<section class="pane" data-pane="view" hidden>
			<h3>表示</h3>
			<div class="row"><span class="lab">基準</span><span class="seg sm" role="group" aria-label="充足の基準"><button type="button" data-th="1" aria-pressed="true">★1以上</button><button type="button" data-th="2" aria-pressed="false">★2以上</button></span></div>
			<div class="row"><span class="lab">祖</span><button class="chip" type="button" id="gpToggle" aria-pressed="true">祖2人も数える</button><button class="chip" type="button" id="geneToggle" aria-pressed="true">遺伝子の行</button></div>
			<div class="legend" id="legend"><span><i class="sw" style="background:var(--dk-h0)"></i>0</span><span><i class="sw" style="background:var(--dk-h1)"></i>★1</span><span><i class="sw" style="background:var(--dk-h2)"></i>★2</span><span><i class="sw" style="background:var(--dk-h3)"></i>★3</span><span><i class="sw unk"></i>★不明</span><span><i class="sw gp" style="background:var(--dk-h0)"></i>祖だけ</span><span class="fr">フレンド</span></div>
		</section>
	</aside>
	<div class="stage" id="stage" tabindex="0" aria-label="ヒートマップ"></div>
	<footer class="dock" id="dock">
		<div class="r1">
			<button class="slot" type="button" id="slotA"><b>A</b><span class="nm none">未選択</span></button>
			<button class="slot" type="button" id="slotB"><b>B</b><span class="nm none">未選択</span></button>
			<span class="cov mono" id="cov">—<small>充足</small></span>
		</div>
		<div class="r2">
			<button class="chip" type="button" id="recB">親Bのおすすめ</button>
			<button class="chip" type="button" id="recPair">2組を探す</button>
			<button class="chip" type="button" id="onlyMiss" aria-pressed="false" hidden>足りないだけ</button>
			<button class="chip" type="button" id="sixCols" aria-pressed="false" hidden>6人で見る</button>
			<button class="chip" type="button" id="clearSel" hidden>選び直す</button>
		</div>
		<div class="miss" id="miss"></div>
	</footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />
<script src="data-snapshot.js"></script>
<script src="deck-v9-core.js"></script>
<script src="deck-v9-deck.js"></script>
</body>
</html>
