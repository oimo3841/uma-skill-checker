<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（fetch・XHR・WebSocket・フォームの送信を、ブラウザの側で禁止する）。読むのは同じ場所の js だけ -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob: mediastream:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>PC の取り込みの診断（作業用）</title>
	<!--
		PC 版のウマ娘のウィンドウを、ブラウザの画面共有で取り込み、動画モードの流れ（js/video-frames.js → 結合画像）に渡す試しのページ（T105 段0）。
		**ツール本体には組み込まない**（lab/capture-test.html・lab/video-diag.html と同じ扱い。どのページからもリンクしない）。

		■ ゲームに干渉しない
		- ゲームのウィンドウへの入力・操作、ゲームのプロセス・メモリ・ファイルには触れない。ブラウザの画面共有に写った絵を読むだけ。
		- 画面共有の先を操作する API（Captured Surface Control）は使わない。スクロールは利用者の手で行う。

		■ 外へ何も送らない
		- 取り込んだ絵はこの PC のブラウザの中だけで処理する。上の Content-Security-Policy で通信を禁止している。
		- 保存のボタンは、ブラウザのダウンロードで PC に置くだけ。

		■ 方式（画面の「方式」で選べる。比べるため。結果は T105 の報告）
		- encode: 届いたフレームをそのまま VideoEncoder（H.264）で圧縮し、メモリの上で断片化なしの MP4 にして UmaVideoFrames.openSource に渡す。
		- recorder-webm／recorder-mp4: MediaRecorder で録って同じく openSource に渡す（断片化・WebM なので video 要素のシークに倒れる）。
		- stills: 間引いたフレームを JPEG にしてメモリに持ち、時刻で引く出どころにする。
		どの方式でも、ゲームの画面の領域（枠を除いた所）に切り取る出どころ（cropSource）をかぶせて selectFrames → composePerson に渡す。
		js/video-frames.js・js/stitch.js・js/common.js は読むだけで変えない。
	-->
	<style>
		:root { color-scheme: light dark; --bg: #fff; --fg: #222; --sub: #666; --line: #ccc; --ok: #0a7d32; --ng: #b3261e; --warn: #9a5b00; --box: #f4f4f4; }
		@media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #eee; --sub: #aaa; --line: #444; --ok: #6fd28f; --ng: #ff8a80; --warn: #f0b860; --box: #262626; } }
		body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, sans-serif; }
		main { max-width: 960px; margin: 0 auto; }
		h1 { font-size: 20px; margin: 0 0 8px; }
		h2 { font-size: 16px; margin: 20px 0 6px; }
		ol { margin: 0; padding-left: 1.5em; }
		.box { background: var(--box); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
		.buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
		button, select, input { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
		input[type=number] { width: 5em; padding: 6px 8px; }
		button { cursor: pointer; }
		button.primary { background: #1565c0; border-color: #1565c0; color: #fff; }
		button:disabled { opacity: .45; cursor: default; }
		label { display: inline-flex; gap: 6px; align-items: center; }
		#msg { min-height: 1.6em; font-weight: bold; }
		#msg.ng { color: var(--ng); }
		#msg.ok { color: var(--ok); }
		[hidden] { display: none !important; }
		#stage { position: relative; display: inline-block; max-width: 100%; overflow: hidden; line-height: 0; border: 1px solid var(--line); background: #000; }
		#stage video { display: block; max-width: 100%; max-height: 60vh; }
		#area { position: absolute; border: 2px solid #ff3d00; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); box-sizing: border-box; pointer-events: none; }
		table { border-collapse: collapse; width: 100%; }
		th, td { border-top: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
		th { width: 13em; font-weight: normal; color: var(--sub); }
		.sub { color: var(--sub); font-size: 13px; }
		.ng { color: var(--ng); font-weight: bold; }
		.warn { color: var(--warn); font-weight: bold; }
		#persons { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
		#persons figure { margin: 0; }
		#persons figcaption { font-size: 13px; }
		#persons canvas { display: block; width: 220px; height: auto; border: 1px solid var(--line); }
		#log { max-height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
	</style>
</head>
<body>
<main>
	<h1>PC の取り込みの診断</h1>
	<div class="box">
		<ol>
			<li>ゲームで因子の画面を開いておきます。</li>
			<li>「ウィンドウから取り込む」を押し、ウマ娘のウィンドウを選びます。</li>
			<li>親から祖2 まで、ホイールで少しずつスクロールします。</li>
			<li>このページに戻り「取り込みを止める」を押します。</li>
		</ol>
		<p class="sub" style="margin:6px 0 0">絵はこの PC の中だけで処理し、どこにも送りません。ゲームには触れません。</p>
	</div>

	<div class="buttons">
		<button id="start" class="primary" type="button">ウィンドウから取り込む</button>
		<button id="stop" type="button" disabled>取り込みを止める</button>
		<label>方式
			<select id="mode">
				<option value="encode">encode（おすすめ）</option>
				<option value="recorder-webm">recorder-webm</option>
				<option value="recorder-mp4">recorder-mp4</option>
				<option value="stills">stills</option>
			</select>
		</label>
		<label>上限（秒）<input id="limit" type="number" min="5" max="600" step="5" value="180" /></label>
	</div>
	<div id="msg" role="status"></div>

	<div id="stageWrap" hidden>
		<h2>取り込みの映像（色の付いた枠が切り取る領域）</h2>
		<div id="stage"><video id="preview" muted playsinline autoplay></video><div id="area" hidden></div></div>
	</div>

	<h2>数字</h2>
	<table><tbody id="stats"></tbody></table>

	<div id="resultWrap" hidden>
		<h2>結合画像</h2>
		<div id="persons"></div>
	</div>

	<div class="buttons">
		<button id="saveText" type="button">結果を保存</button>
		<button id="saveFrame" type="button" disabled>切り取りの1枚を保存</button>
		<button id="saveImages" type="button" disabled>結合画像を保存</button>
		<button id="saveVideo" type="button" disabled>取り込みを動画で保存</button>
	</div>

	<h2>記録</h2>
	<div id="log" class="box"></div>
</main>

<script>var devGeometry = [];</script>
<script src="../js/common.js?v=2026-09-26a"></script>
<script src="../js/stitch.js?v=2026-11-01a"></script>
<script src="../js/video-frames.js?v=2026-11-05a"></script>
<script>
(function () {
	'use strict';
	const $ = (id) => document.getElementById(id);

	/* ── ゲームの画面の領域を見つける ─────────────────────────────
	 * 窓の絵（{ data, width, height }）から、枠・タイトルバーを除いた領域を返す。ゲームの中身は読まない（画素の並びだけ）。
	 *  1. 外周の枠: 外側から数 px の線のうち、線の中が揃っていて、内側の線と大きく違う所までを枠とする（Windows 11 は 1〜2px の暗い線）。
	 *  2. 黒い帯: 枠の内側に真っ黒な線が続くなら帯として除く（ゲームが窓より小さく描かれたとき）。
	 *  3. タイトルバー: 上から、同じ色が半分以上を占める行が続く所（文字やボタンがあっても半分は地の色）。
	 *  4. 縦横比: ゲームは縦:横 = 16:9（実測 981×1744 = 1.778）。「タイトルバーあり」「なし」のうち 16:9 に合うほうを取る。
	 *     どちらも合わないときは、スマホの形まで（1.55〜2.5）なら注意つきで通す。それ以外は見つからない。
	 * 戻り値 { ok, reason, x, y, w, h, aspect, title, how, warns[] } */
	const OPT = { aspect16: 16 / 9, aspectTol: 0.012, aspectMin: 1.55, aspectMax: 2.5, dmmMinW: 700, dmmMaxW: 1300 };
	function grayLine(img, horizontal, idx, a, b) {
		const { data, width } = img, out = [];
		for (let k = a; k < b; k += 2) {
			const p = (horizontal ? idx * width + k : k * width + idx) * 4;
			out.push((data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8);
		}
		return out;
	}
	const meanAbs = (u, v) => { let s = 0; for (let i = 0; i < u.length; i++) s += Math.abs(u[i] - v[i]); return s / u.length; };
	const spread = (u) => { let m = 0; for (const x of u) m += x; m /= u.length; let s = 0; for (const x of u) s += Math.abs(x - m); return s / u.length; };
	const meanOf = (u) => { let m = 0; for (const x of u) m += x; return m / u.length; };
	function modeOf(u) {
		const h = new Uint16Array(256); for (const x of u) h[x]++;
		let best = 0; for (let i = 1; i < 256; i++) if (h[i] > h[best]) best = i;
		let near = 0; for (let i = Math.max(0, best - 5); i <= Math.min(255, best + 5); i++) near += h[i];
		return { value: best, frac: near / u.length };
	}
	// 外側から順に見て、枠の線の数を返す。at(k) は外から k 番目の線
	function edgeInset(at, maxEdge) {
		let inset = 0, bestDiff = 0;
		for (let k = 0; k < maxEdge; k++) {
			const u = at(k);
			if (spread(u) > 14) break;         // 中身が揃っていない線 = もう枠ではない
			const d = meanAbs(u, at(k + 1));
			if (d >= 18 && d > bestDiff) { bestDiff = d; inset = k + 1; }
		}
		return inset;
	}
	// 枠の内側の真っ黒な帯
	function blackRun(at, start, limit) {
		let k = start;
		while (k < limit) { const u = at(k); if (meanOf(u) > 12 || Math.max.apply(null, u) > 40) break; k++; }
		return k;
	}
	function detectOne(img) {
		const W = img.width, H = img.height, warns = [];
		if (W < 64 || H < 64) return { ok: false, reason: 'too-small-image', warns };
		{	// 真っ黒・真っ白（最小化・描けていない）
			let tot = 0, ext = 0; const d = img.data;
			for (let p = 0; p < d.length; p += 4 * 97) { const v = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8; tot++; if (v <= 5 || v >= 250) ext++; }
			if (ext / tot >= 0.985) return { ok: false, reason: 'blank', warns };
		}
		const ax = Math.floor(W * 0.05), bx = Math.ceil(W * 0.95), ay = Math.floor(H * 0.1), by = Math.ceil(H * 0.95);
		// 枠の線は細い（実測 1〜2px）。ゲーム自身の端の余白（幅の 1.4% ほど）まで枠と読まないように、4px までしか見ない
		const maxX = 4, maxY = 4;
		const atL = (k) => grayLine(img, false, k, ay, by), atR = (k) => grayLine(img, false, W - 1 - k, ay, by);
		const atB = (k) => grayLine(img, true, H - 1 - k, ax, bx), atT = (k) => grayLine(img, true, k, ax, bx);
		const left = blackRun(atL, edgeInset(atL, maxX), Math.floor(W * 0.45));
		const right = blackRun(atR, edgeInset(atR, maxX), Math.floor(W * 0.45));
		const bottom = blackRun(atB, edgeInset(atB, maxY), Math.floor(H * 0.3));
		const top0 = blackRun(atT, edgeInset(atT, maxY), Math.floor(H * 0.3));
		const w = W - left - right;
		if (w < 32) return { ok: false, reason: 'aspect', warns };
		// タイトルバー
		const atRow = (y) => grayLine(img, true, y, left + Math.floor(w * 0.02), W - right - Math.floor(w * 0.02));
		let titleEnd = top0;
		{
			const first = modeOf(atRow(top0));
			if (first.frac >= 0.5) {
				let y = top0; const lim = Math.min(H, top0 + Math.ceil(H * 0.08));
				while (y < lim) { const m = modeOf(atRow(y)); if (m.frac < 0.5 || Math.abs(m.value - first.value) > 6) break; y++; }
				if (y - top0 >= Math.max(12, W * 0.015)) {
					// 境目は、すぐ近くでいちばん大きく変わる行の間（窓の拡大で境目の行が混ざる）
					let best = y, bestD = -1;
					for (let q = Math.max(top0, y - 2); q <= y + 1 && q + 1 < H; q++) { const d = meanAbs(atRow(q), atRow(q + 1)); if (d > bestD) { bestD = d; best = q + 1; } }
					titleEnd = best;
				}
			}
		}
		const hasTitle = titleEnd > top0;
		const rectOf = (y) => ({ x: left, y, w, h: H - bottom - y, aspect: (H - bottom - y) / w });
		const near16 = (r) => Math.abs(r.aspect - OPT.aspect16) / OPT.aspect16 <= OPT.aspectTol;
		const inRange = (r) => r.aspect >= OPT.aspectMin && r.aspect <= OPT.aspectMax;
		const noTitle = rectOf(top0), withTitle = rectOf(titleEnd);
		let r = null, how = '';
		if (hasTitle && near16(withTitle)) { r = withTitle; how = 'title+16:9'; }
		else if (near16(noTitle)) { r = noTitle; how = 'no-title+16:9'; }
		else if (hasTitle && inRange(withTitle)) { r = withTitle; how = 'title'; warns.push('aspect'); }
		else if (!hasTitle) {
			// タイトルバーの色が読めなくても、下端と幅から 16:9 の上端を出し、そこに境目があれば採る
			const yy = Math.round(H - bottom - w * OPT.aspect16);
			if (yy > top0 && yy < H * 0.12) {
				let best = yy, bestD = -1;
				for (let q = yy - 4; q <= yy + 4; q++) { const d = meanAbs(atRow(q - 1), atRow(q)); if (d > bestD) { bestD = d; best = q; } }
				if (bestD >= 18) { r = rectOf(best); how = 'edge+16:9'; }
			}
			if (!r && inRange(noTitle)) { r = noTitle; how = 'whole'; warns.push('aspect'); }
		}
		if (!r) return { ok: false, reason: 'aspect', warns, title: hasTitle ? titleEnd - top0 : 0, aspect: +withTitle.aspect.toFixed(3) };
		if (r.w < OPT.dmmMinW && near16(r)) warns.push('small');
		if (r.w > OPT.dmmMaxW && near16(r)) warns.push('large');
		return { ok: true, reason: '', x: r.x, y: r.y, w: r.w, h: r.h, aspect: +r.aspect.toFixed(3), title: r.y - top0, how, warns };
	}
	/** 何枚かの結果をまとめる。±2px で揃う組がいちばん多いものの中央値。6割以上で揃わなければ unstable */
	function consensus(list) {
		const use = list.filter((r) => r.reason !== 'blank');
		if (!use.length) return { ok: false, reason: list.length ? 'blank' : 'none', samples: 0, agree: 0 };
		const oks = use.filter((r) => r.ok);
		if (!oks.length) return { ok: false, reason: use[use.length - 1].reason, samples: use.length, agree: 0 };
		let best = [];
		for (const a of oks) {
			const g = oks.filter((b) => Math.abs(a.x - b.x) <= 2 && Math.abs(a.y - b.y) <= 2 && Math.abs(a.w - b.w) <= 2 && Math.abs(a.h - b.h) <= 2);
			if (g.length > best.length) best = g;
		}
		const med = (k) => best.map((r) => r[k]).sort((p, q) => p - q)[best.length >> 1];
		const out = { ok: best.length / use.length >= 0.6, reason: '', x: med('x'), y: med('y'), w: med('w'), h: med('h'), samples: use.length, agree: best.length, how: best[0].how, warns: best[0].warns, title: med('title') };
		out.aspect = +(out.h / out.w).toFixed(3);
		if (!out.ok) out.reason = 'unstable';
		return out;
	}
	const LAB_VERSION = '2026-11-06c';
	const AREA_MSG = {
		blank: '画面が真っ黒か真っ白です。ウィンドウを最小化していないか確かめてください。',
		aspect: 'ゲームの画面を見つけられませんでした。選んだウィンドウがウマ娘か確かめてください。',
		unstable: 'ゲームの画面の場所が定まりませんでした。ウィンドウの大きさを変えずに、もう一度取り込んでください。',
		none: 'まだ絵が届いていません。',
		small: 'ウィンドウが小さく、結合できない大きさです。ウィンドウを大きくして、もう一度取り込んでください。',
		large: 'ウィンドウが大きく、結合できない大きさです。ウィンドウを小さくして、もう一度取り込んでください。'
	};

	/* ── 切り取りの出どころ ─────────────────────────────
	 * どの出どころにもかぶせられるように、描く先の座標を動かす（source.drawAt は (0,0)-(dw,dh) に描くので、拡大して左上へずらし、はみ出しを切る）。 */
	function cropSource(base, rect) {
		const x = Math.max(0, rect.x), y = Math.max(0, rect.y);
		const w = Math.min(rect.w, base.width - x), h = Math.min(rect.h, base.height - y);
		return UmaVideoFrames.canvasSource({
			kind: 'crop:' + base.kind, exact: !!base.exact, width: w, height: h, duration: base.duration,
			async draw(t, ctx, dw, dh, how) {
				const sx = dw / w, sy = dh / h;
				ctx.save();
				ctx.beginPath(); ctx.rect(0, 0, dw, dh); ctx.clip();
				ctx.translate(-x * sx, -y * sy);
				try { await base.drawAt(t, ctx, base.width * sx, base.height * sy, null, how); } finally { ctx.restore(); }
			},
			close() { base.close(); }
		});
	}

	/*
	 * 動かない部分を1枚の画にそろえる出どころ（T105 の2回目。おいもさんの試しで5回とも selectFrames の「本文の帯」で止まった原因への対処）。
	 * selectFrames は上端と下端を「2枚の差が 5 を超える最初の行・途切れる行」で決める。iPhone の画面収録では動かない行の差がほぼ 0 だが、
	 * ここの圧縮（2秒ごとのキーフレーム・最初の1枚の粗さ）では、動かない部分のくっきりした行で差が 5 を超え、最初の1枚は全面で超える。写り込んだカーソルも同じ働きをする。
	 * そこで、ここで多数の組を数えて本文の帯を決め、帯の外を1枚の画で塗り直してから渡す（selectFrames・composePerson は変えない）。
	 * 画面が変わったフレーム（上の部分が基準の画と違う）は塗り直さない。selectFrames の「同じ画面か」の判定をそのまま働かせるため。
	 */
	const BAND = { samples: 48, xs: 6, moved: 12, share: 0.5, minCount: 3, gap: 12, minShare: 0.25, topY: 0.02, topH: 0.36, sameMax: 12 };
	function findMovingBand(counts) {
		let peak = 0; for (const n of counts) if (n > peak) peak = n;
		if (peak < BAND.minCount) return null;
		const need = Math.max(BAND.minCount, peak * BAND.share);
		let best = null, s = -1, e = -1;
		const close = () => { if (s >= 0 && (!best || e - s > best.bottom - best.top)) best = { top: s, bottom: e }; };
		for (let y = 0; y < counts.length; y++) {
			if (counts[y] < need) continue;
			if (s >= 0 && y - e > BAND.gap) { close(); s = -1; }
			if (s < 0) s = y;
			e = y + 1;
		}
		close();
		if (!best || best.bottom - best.top < counts.length * BAND.minShare) return null;
		best.peak = peak; best.need = need;
		return best;
	}
	async function steadySource(src) {
		const W = src.width, H = src.height, sw = Math.max(16, Math.round(W / BAND.xs)), N = BAND.samples;
		const prev = document.createElement('canvas'), cur = document.createElement('canvas');
		prev.width = cur.width = sw; prev.height = cur.height = H;
		const counts = new Uint16Array(H);
		const a = prev.getContext('2d', { willReadFrequently: true }), b = cur.getContext('2d', { willReadFrequently: true });
		for (let k = 0; k < N; k++) {
			await src.drawAt(src.duration * (k + 0.5) / N, b, sw, H, null);
			if (k > 0) { const d = stitchRowDiffSignal(prev, cur); for (let y = 0; y < H; y++) if (d[y] > BAND.moved) counts[y]++; }
			a.drawImage(cur, 0, 0);
		}
		const band = findMovingBand(counts);
		if (!band) return { src, band: null };

		const track = stream.getVideoTracks()[0];
		S.stream = stream; S.track = track; S.settings = track.getSettings ? track.getSettings() : {};
		note('取り込みを開始: ' + JSON.stringify(S.settings));
		if (S.settings.displaySurface && S.settings.displaySurface !== 'window') say('ウィンドウではなく「' + S.settings.displaySurface + '」が選ばれました。', 'ng');
		$('preview').srcObject = stream; $('stageWrap').hidden = false;
		$('preview').play().catch(() => { /* 自動で流れなくても取り込みは続く */ });
		const mode = $('mode').value, limitSec = Math.max(5, Math.min(600, +$('limit').value || 180));
		S.mode = mode; S.limitSec = limitSec;
		const tuning = S.tuning || {};
		S.cap = { recv: 0, dropped: 0, recvHidden: 0, hiddenMs: 0, perSec: [], lastUs: -1, w: 0, h: 0, peakHeap: 0, begun: false };
		S.running = true;
		$('start').disabled = true; $('stop').disabled = false; $('mode').disabled = true; $('limit').disabled = true;
		const c = S.cap;
		const t0 = performance.now();
		let hiddenAt = document.hidden ? t0 : 0;
		const onVis = () => {
			const n = performance.now();
			if (document.hidden) { hiddenAt = n; note('ページが隠れた（' + ((n - t0) / 1000).toFixed(1) + ' 秒）'); }
			else { if (hiddenAt) c.hiddenMs += n - hiddenAt; hiddenAt = 0; note('ページが見えた（' + ((n - t0) / 1000).toFixed(1) + ' 秒）'); }
		};
		document.addEventListener('visibilitychange', onVis);
		S.sink = makeSink(mode, stream, tuning);
		let reader = null, loopDone = Promise.resolve();
		const tap = track.clone();
		if (typeof MediaStreamTrackProcessor !== 'undefined') {
			reader = new MediaStreamTrackProcessor({ track: tap }).readable.getReader();
			loopDone = readLoop(reader, stream).catch((e) => { note('読み取りの失敗: ' + e.message); S.stopReason = S.stopReason || 'error'; requestStop(); });
		} else {
			say('MediaStreamTrackProcessor が無いブラウザです。この診断では試せません。', 'ng');
		}
		// 上限の時間と表示の更新は MessageChannel でなく setInterval（隠れると間引かれるが、上限は Date で比べるので遅れるだけ）
		const tick = setInterval(() => {
			const elapsed = (performance.now() - t0) / 1000;
			c.elapsed = elapsed;
			if (performance.memory) c.peakHeap = Math.max(c.peakHeap, performance.memory.usedJSHeapSize);
			if (S.running && !$('msg').classList.contains('ng')) {
				const rest = Math.max(0, limitSec - elapsed);
				say(S.area && S.area.ok ? '取り込み中（残り ' + Math.ceil(rest) + ' 秒）。スクロールが終わったら「取り込みを止める」を押してください。' : '取り込み中（残り ' + Math.ceil(rest) + ' 秒）。ゲームの画面を探しています。');
			}
			renderStats();
			if (elapsed >= limitSec) { S.stopReason = 'limit'; requestStop(); }
		}, 500);
		track.addEventListener('ended', () => { if (S.running) { S.stopReason = S.stopReason || 'ended'; requestStop(); } });
		S.stopFn = async () => {
			if (!S.running) return;
			S.running = false; S.stopFn = null;
			const endWall = performance.now();
			clearInterval(tick);
			document.removeEventListener('visibilitychange', onVis);
			if (hiddenAt) { c.hiddenMs += endWall - hiddenAt; hiddenAt = 0; }
			c.elapsed = (endWall - t0) / 1000;
			const ps = c.perSec.slice(1, -1).map((x) => x || 0); c.minPerSec = ps.length ? Math.min.apply(null, ps) : null;
			$('stop').disabled = true;
			note('止めた（理由: ' + (S.stopReason || 'ボタン') + '・' + c.elapsed.toFixed(1) + ' 秒）');
			try { if (reader) await reader.cancel(); } catch (e) { /* 読み終わっていても */ }
			await loopDone;
			tap.stop();
			const endUs = c.lastUs + 33333;
			const T = { stop: performance.now() };
			let src = null;
			try {
				if (!c.begun) throw Object.assign(new Error('フレームが届かなかった'), { code: 'no-frames' });
				const base = await S.sink.end(endUs);
				stream.getTracks().forEach((t) => t.stop());
				$('preview').srcObject = null;
				T.opened = performance.now();
				const area = S.area || consensus(S.areas);
				S.area = area;
				if (S.sink.blob && S.sink.blob()) $('saveVideo').disabled = false;
				if (S.dc) $('saveFrame').disabled = false;
				S.result = { src: base.kind + (base.fallback ? '（倒した理由 ' + base.fallback + '）' : '') + (base.codec ? '・' + base.codec : '') + '・長さ ' + base.duration.toFixed(1) + ' 秒' };
				renderStats();
				if (!area.ok) { base.close(); throw Object.assign(new Error(AREA_MSG[area.reason] || AREA_MSG.aspect), { code: 'area', friendly: true }); }
				if (area.warns && (area.warns.includes('small') || area.warns.includes('large'))) say(AREA_MSG[area.warns.includes('small') ? 'small' : 'large'], 'ng');
				src = cropSource(base, area);
				say('処理しています（本文の帯を調べています）');
				const steady = await steadySource(src);
				src = steady.src;
				S.result.band = steady.band ? steady.band.top + '〜' + steady.band.bottom + ' 行目（よく動いた組 ' + steady.band.peak + '／' + (BAND.samples - 1) + '）' : '見つからない（スクロールが足りない）';
				note('本文の帯: ' + S.result.band);
				const onProgress = (p) => { say('処理しています（' + Math.round(p.ratio * 100) + '%）'); };
				const debug = {};
				// タッチのエフェクトの置き換え（effectVote）は iPhone の動画のためのもの。カーソルが写った画の行を別の画へ写してしまうので、ここでは切る
				const sel = await UmaVideoFrames.selectFrames(src, { labels: ['親', '祖1', '祖2'], onProgress, debug, effectVote: false });
				say('処理しています（カーソルを消しています）');
				const ptr = await removePointer(src, sel, debug.track || []);
				S.result.pointer = ptr.sprite ? '形 ' + ptr.sprite.w + '×' + ptr.sprite.h + '・消した所 ' + ptr.cells + '（' + ptr.frames + ' 枚）・残した所 ' + ptr.leftCells : '形を覚えられなかった（消していない）';
				note('カーソル: ' + S.result.pointer + ' ' + JSON.stringify(ptr.boxes));
				T.selected = performance.now();
				S.result.sel = sel.persons.map((p) => p.label + ' ' + p.files.length + '枚').join('・') + '（アンカー ' + sel.anchors.map((a) => a.t).join('／') + ' 秒）';
				const persons = [];
				for (const p of sel.persons) {
					const canvas = await UmaVideoFrames.composePerson(p.files, p.shifts, p.uncertain, p.label, { still: p.still, anchorY: p.anchorY });
					persons.push({ label: p.label, canvas, h: canvas.height, w: canvas.width, frames: p.files.length, uncertain: p.uncertain.filter(Boolean).length });
				}
				T.composed = performance.now();
				S.persons = persons;
				S.result.times = '圧縮の仕上げ ' + ((T.opened - T.stop) / 1000).toFixed(1) + ' 秒・フレームを選ぶ ' + ((T.selected - T.opened) / 1000).toFixed(1) + ' 秒・組み立て ' + ((T.composed - T.selected) / 1000).toFixed(1) + ' 秒';
				S.result.ms = { finish: Math.round(T.opened - T.stop), select: Math.round(T.selected - T.opened), compose: Math.round(T.composed - T.selected) };
				S.result.stats = { sampled: sel.stats && sel.stats.sampled, picks: sel.picks && sel.picks.length };
				S.result.note = persons.map((p) => p.label + ' ' + p.w + '×' + p.h + '（' + p.frames + '枚・確かでない継ぎ目 ' + p.uncertain + '）').join('／');
				const box = $('persons');
				for (const p of persons) { const f = document.createElement('figure'), cap = document.createElement('figcaption'); cap.textContent = p.label + '（' + p.w + '×' + p.h + '）'; f.append(cap, p.canvas); box.appendChild(f); }
				$('resultWrap').hidden = false;
				$('saveImages').disabled = false;
				const stopWord = S.stopReason === 'limit' ? '上限の時間で止めました。' : '';
				// 区画の頭が帯の下のほうで初めて写ると、その人の画が頭の手前で切れる（stitch.js の頭の探し方。T105-study-2）。ホイールを大きく回したときに起きる
				const cut = persons.filter((p) => p.h < sel.header.contentH).map((p) => p.label);
				if (sel.persons.length !== 3) say(stopWord + '3人に分かれませんでした（' + sel.persons.length + '人）。親から祖2 までスクロールしたか確かめてください。', 'ng');
				else if (cut.length) say(stopWord + cut.join('・') + ' の画が途中で切れました。ホイールをもっと少しずつ回して、もう一度取り込んでください。', 'ng');
				else if (!$('msg').classList.contains('ng') || !area.warns.length) say(stopWord + '結合画像を作れました。', 'ok');
			} catch (e) {
				note('流れの失敗: ' + (e.code || '') + ' ' + e.message);
				const word = { band: 'ゲームの因子の画面を見つけられませんでした。因子の画面を開いてから取り込んでください。', 'too-few': '動きが読み取れませんでした。因子の画面をスクロールしてください。', 'no-frames': 'フレームが届きませんでした。ウィンドウを最小化していないか確かめてください。' }[e.code];
				say(e.friendly ? e.message : (word || '結合画像を作れませんでした: ' + e.message), 'ng');
				S.result = Object.assign(S.result || {}, { note: '失敗: ' + (e.code || '') + ' ' + e.message });
			} finally {
				if (src) src.close();
				stream.getTracks().forEach((t) => t.stop());
				$('stageWrap').hidden = true;
				$('start').disabled = false; $('mode').disabled = false; $('limit').disabled = false;
				S.done = true;
				renderStats();
			}
		};
		S.done = false;
		renderStats();
	}

	/* ── 保存（ブラウザのダウンロードだけ） ─────────────────────────── */
	const stamp = () => nowText().replace(/[-: ]/g, '').replace(/^(\d{8})/, '$1-');
	function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); note('保存: ' + name); }
	$('start').addEventListener('click', () => { start(); });
	$('stop').addEventListener('click', () => { requestStop(); });
	$('saveText').addEventListener('click', () => {
		renderStats();
		const lines = ['# PC の取り込みの診断 結果', '保存した日時: ' + nowText(), 'ブラウザ: ' + navigator.userAgent, '方式: ' + (S.mode || $('mode').value), '上限: ' + (S.limitSec || $('limit').value) + ' 秒', ''];
		for (const tr of $('stats').children) lines.push('- ' + tr.children[0].textContent + ': ' + tr.children[1].textContent);
		if (S.cap) lines.push('', '## 1秒ごとの受け取り', S.cap.perSec.map((x) => x || 0).join(' '));
		lines.push('', '## 記録', ...S.logs);
		download(new Blob([lines.join('\n')], { type: 'text/plain' }), 'pc-capture-result-' + stamp() + '.txt');
	});
	$('saveFrame').addEventListener('click', async () => {
		if (!S.dc) return;
		const c = new OffscreenCanvas(S.dc.width, S.dc.height), x = c.getContext('2d');
		x.drawImage(S.dc, 0, 0);
		if (S.area && S.area.ok) { x.strokeStyle = '#ff3d00'; x.lineWidth = 1; x.strokeRect(S.area.x - 0.5, S.area.y - 0.5, S.area.w + 1, S.area.h + 1); }
		download(await c.convertToBlob({ type: 'image/png' }), 'pc-capture-frame-' + stamp() + '.png');
	});
	$('saveImages').addEventListener('click', () => {
		(S.persons || []).forEach((p, i) => p.canvas.toBlob((b) => download(b, 'pc-capture-person' + (i + 1) + '-' + stamp() + '.png'), 'image/png'));
	});
	$('saveVideo').addEventListener('click', () => {
		const b = S.sink && S.sink.blob && S.sink.blob();
		if (b) download(b, 'pc-capture-' + stamp() + (b.type.includes('webm') ? '.webm' : '.mp4'));
	});
	window.addEventListener('beforeunload', () => { if (S.stream) S.stream.getTracks().forEach((t) => t.stop()); });
	renderStats();

	// 検査のための入口（画面からは使わない）
	window.__pc = { VERSION: LAB_VERSION, S, detectOne, consensus, cropSource, steadySource, findMovingBand, removePointer, muxMp4, shouldOffer, start, stop: requestStop };
})();
</script>
</body>
