	<!-- 外へは何も送らない（通信・フォームの送信・外部のファイルの読み込みを、ブラウザの側で禁止する。画像は同じサイトの img/ と、ページの中で作った data: だけ） -->

	<title>画像アップロードのモック（作業用）</title>
	<!--
		UmaStar（special）と UmaExam（exam）の「画像をアップロード」の画面と、UmaStar のセット名の帯の直しの試し描き（モック・T43）。
		おいもさんが見て決めるための作業用のページ。**ツール本体には組み込まない**（どのページからもリンクしない）。保存は無い。外へは何も送らない。

		作り: special.html（③ 画像をアップロード・セット名「LoHトプロ」を保存した状態）と exam.html（② 画像をアップロード）の画面の HTML と、
		ページの CSS（css/ の3つ・Tailwind・ページの <style>・core が差し込む CSS）を 2026-10-31 の origin/main（core 2026-10-31i）から
		Playwright で写し取った（下の cap-special-* と cap-exam-*。読み込むときに ?tool= の側だけを入れる）。写しなので、製品を変えてもこのページは変わらない。
		その上にモックの差分（<style id="t43-css"> と <script id="t43-js">）を当てている。動画の場面は見た目だけで、動画は処理しない。

		引数: ?tool=special|exam・?scene=now（今の形）|new（案）|vopen|vexist|vprog|vdone|vwarn|verr|vcancel（動画の場面。special だけ）
		      ?v=1|2（案の切り替え。new では v=1＝セット名の下線あり・人の欄の見出し(ア)、v=2＝下線なし・(イ)。動画の場面ではその場面の案）
		      ?ul=1|0（セット名の下線）・?badge=a|i（人の欄の見出し）・?g=1|2|3（撮り方の案内の文面）・?step=0..4・?n=0|1|3・?e=unreadable|noscreen|split|fast|long
		      ?imgA=N・?imgB=N（作り物の画像を入れておく）・?set=B（親Bセットのタブを開く）・?opt=1（「!」を開いておく）・?theme=light|dark・?shot=1（案内を隠す）
	-->
	<style id="t43-css">
/* ===== T43 のモックの差分（ここから下だけがモックの追加。上の写しは 2026-10-31 の origin/main〔core 2026-10-31i〕） ===== */
/* 色は今のトークン（--uma-*）と写しにある色だけ。新しい色は使わない（恒久ルール30） */

/* exam は親A／親Bの色のクラスを持っていないので、special の <style> から写す（タブの色） */
.person-col-blue { --person-bg: #eff6ff; --person-fg: #193cb8; --person-border-strong: #8ec5ff; --person-border-soft: #bedbff; --person-tint: rgba(43, 127, 255, .07); }
.person-col-red  { --person-bg: #fef2f2; --person-fg: #9f0712; --person-border-strong: #ffa2a2; --person-border-soft: #ffc9c9; --person-tint: rgba(251, 44, 54, .07); }
:root[data-theme="dark"] .person-col-blue { --person-bg: #172a4a; --person-fg: #a9c9ff; --person-border-strong: #3b6fb8; --person-border-soft: #26426b; --person-tint: rgba(74, 158, 245, .10); }
:root[data-theme="dark"] .person-col-red  { --person-bg: #3a1a1d; --person-fg: #ffb3b3; --person-border-strong: #a3474d; --person-border-soft: #6b2d33; --person-tint: rgba(251, 44, 54, .10); }
.uma-subtab.person-col-blue, .uma-subtab.person-col-red {
	--uma-subtab-tint-bg: var(--person-bg); --uma-subtab-tint-fg: var(--person-fg); --uma-subtab-tint-line: var(--person-border-strong); }

/* ---- (1) セット名のボタン「セット名 ✎ N/10」 ---- */
/* 1つのボタン。見た目の高さは今と同じ 28px のまま、上下の負の余白で押せる高さを 44px にする（帯の高さは変えない） */
button.usd-setbar-name.t43-sn { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; min-height: 44px; margin: -8px 0; padding: 0 4px 0 0;
	overflow: visible; text-decoration: none; align-self: center; line-height: 44px; }
.t43-sn-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t43-sn--ul .t43-sn-name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.t43-sn-meta { flex: none; font-size: 12px; line-height: 1; font-weight: 600; color: var(--uma-text-subtle); white-space: nowrap; letter-spacing: .02em; }
.t43-sn-pen { font-size: 12px; margin-right: 2px; }

/* ---- (2)-2・(2)-5 セットの見出しを消したあとの「セットをクリア」 ---- */
.t43-setpanel { position: relative; }
.t43-clear-row { position: absolute; top: 10px; right: 14px; margin: 0 !important; z-index: 1; }

/* ---- (2)-3 人の欄の見出し ---- */
/* (ア) 丸を消して文字だけ */
.t43-head-a { min-height: 24px; }
/* (イ) 丸の中を「親A」などに（上の図と同じ形・同じ色。図の祖の丸と同じ 28px・9px） */
.t43-badge-i { width: 28px !important; height: 28px !important; font-size: 9px !important; letter-spacing: -.02em; }

/* ---- (2)-6 タブの行の右端の動画アイコン（UmaStar だけ） ---- */
.uma-subtabs-row.t43-tabrow { flex-wrap: nowrap; gap: var(--uma-sp-1); }
.t43-new .uma-subtabs-row > #personset-tabs { flex: 1 1 0; min-width: 0; }
.t43-video-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; position: relative; width: 44px; height: 44px; margin: -6px -6px -6px 0; padding: 0;
	border: 0; border-radius: var(--uma-r-full); background: transparent; color: var(--uma-text-muted); cursor: pointer; }
.t43-video-btn:hover { background: var(--uma-surface-muted); color: var(--uma-text-heading); }
.t43-video-btn:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; }
.t43-video-btn svg { width: 22px; height: 22px; }
.t43-video-btn .t43-alpha { position: absolute; right: 6px; top: 10px; font-size: 9px; line-height: 1; font-weight: 800; color: var(--uma-text-subtle); }

/* ---- (2)-8 いちばん下の「!」（高度な解析オプション） ---- */
.t43-adv { margin-top: var(--uma-sp-3); }
.t43-adv-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -11px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.t43-adv-btn > span { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-full);
	background: transparent; color: var(--uma-text-faint); font-size: 12px; font-weight: 700; line-height: 1; }
.t43-adv-btn:hover > span, .t43-adv-btn[aria-expanded="true"] > span { color: var(--uma-text-heading); border-color: var(--uma-text-subtle); }
.t43-adv-btn:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -8px; border-radius: var(--uma-r-full); }
.t43-adv-panel { margin-top: var(--uma-sp-1); padding: var(--uma-sp-2); border: 1px solid var(--uma-border); border-radius: var(--uma-r-xl); background: var(--uma-surface-sunken); }
.t43-adv-panel[hidden] { display: none; }
.t43-adv-title { margin: 0 0 var(--uma-sp-1); font-size: 11px; font-weight: 700; color: var(--uma-text-subtle); }

/* ---- (3) 動画 ---- */
.t43-sheet-bg { position: fixed; inset: 0; z-index: 90; background: rgba(15, 23, 42, .4); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 641px) { .t43-sheet-bg { align-items: center; } }
.t43-sheet { width: 100%; max-width: 30rem; max-height: 92dvh; overflow: auto; background: var(--uma-surface); color: var(--uma-text); border-radius: var(--uma-r-xl) var(--uma-r-xl) 0 0; padding: 16px; box-shadow: 0 -4px 24px rgba(0,0,0,.18); }
@media (min-width: 641px) { .t43-sheet { border-radius: var(--uma-r-xl); } }
.t43-sheet h2 { margin: 0 0 4px; font-size: 15px; font-weight: 800; color: var(--uma-text-heading); display: flex; align-items: center; gap: 6px; }
.t43-sheet .t43-target { margin: 0 0 10px; font-size: 12px; color: var(--uma-text-muted); }
.t43-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--uma-r-full); font-size: 10px; font-weight: 800; border: 1px solid var(--uma-border-strong); color: var(--uma-text-subtle); }
.t43-note { margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--uma-border); border-radius: var(--uma-r-lg); background: var(--uma-surface-muted); font-size: 12px; line-height: 1.55; color: var(--uma-text-muted); }
.t43-note b { color: var(--uma-text-heading); }
.t43-howto { margin: 0 0 12px; font-size: 12px; line-height: 1.6; color: var(--uma-text); }
.t43-howto ol { margin: 4px 0 0; padding-left: 1.4em; }
.t43-howto strong { font-weight: 800; color: var(--uma-text-heading); }
.t43-exist { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--uma-warn-border); border-radius: var(--uma-r-lg); background: var(--uma-warn-bg); color: var(--uma-warn-text); font-size: 12px; line-height: 1.5; }
.t43-choice { display: grid; gap: 6px; margin: 0 0 12px; }
.t43-choice label { display: flex; align-items: flex-start; gap: 8px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--uma-border); border-radius: var(--uma-r-lg); font-size: 12px; cursor: pointer; }
.t43-choice label:has(input:checked) { border-color: var(--uma-control-mark); box-shadow: inset 0 0 0 1px var(--uma-control-mark); }
.t43-choice input { margin-top: 2px; accent-color: var(--uma-control); }
.t43-choice small { display: block; color: var(--uma-text-subtle); font-size: 11px; }
.t43-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.t43-btns .uma-btn { min-height: 44px; }
.t43-btns--stack { flex-direction: column; align-items: stretch; }
.t43-inline { margin: 0 0 12px; padding: 12px; border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-xl); background: var(--uma-surface); }
.t43-inline h2 { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--uma-text-heading); display: flex; align-items: center; gap: 6px; }
.t43-steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; font-size: 11px; }
.t43-steps li { display: flex; align-items: center; gap: 6px; color: var(--uma-text-faint); }
.t43-steps li[data-st="done"] { color: var(--uma-text-muted); }
.t43-steps li[data-st="now"] { color: var(--uma-text-heading); font-weight: 700; }
.t43-steps li i { font-style: normal; width: 14px; text-align: center; }
.t43-prog-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.t43-prog-foot small { font-size: 11px; color: var(--uma-text-subtle); }
.t43-summary { margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--uma-border); border-radius: var(--uma-r-lg); background: var(--uma-surface-sunken); font-size: 12px; line-height: 1.5; color: var(--uma-text); display: flex; gap: 8px; align-items: flex-start; }
.t43-summary svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--uma-text-subtle); }
.t43-vtile { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--uma-border); border-radius: var(--uma-r-lg); background: var(--uma-surface); font-size: 12px; font-weight: 700; color: var(--uma-text-heading); grid-column: 1 / -1; }
.t43-vtile img { width: 44px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--uma-border); }
.t43-vtile small { margin-left: auto; font-weight: 600; color: var(--uma-text-subtle); font-size: 11px; }
.t43-vbadge { position: absolute; left: 4px; bottom: 4px; padding: 0 4px; border-radius: 4px; background: rgba(15,23,42,.72); color: #fff; font-size: 9px; font-weight: 700; line-height: 14px; }
.t43-result { margin-top: 12px; padding: 12px; border: 1px solid var(--uma-border); border-radius: var(--uma-r-xl); background: var(--uma-surface); }
.t43-result h3 { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--uma-text-heading); }
.t43-result img { display: block; width: 100%; height: auto; border-radius: var(--uma-r-md); border: 1px solid var(--uma-border); }
.t43-shot-label { margin-top: 6px; font-size: 11px; color: var(--uma-text-subtle); }

/* ---- 案内（左上）・寸法の札 ---- */
.t43-guide { position: fixed; left: 6px; top: 6px; z-index: 200; max-width: min(360px, calc(100vw - 12px)); font: 12px/1.5 system-ui, sans-serif;
	background: var(--uma-surface); color: var(--uma-text); border: 1px solid var(--uma-border-strong); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.t43-guide > summary { cursor: pointer; padding: 4px 10px; font-weight: 700; list-style: none; }
.t43-guide > summary::-webkit-details-marker { display: none; }
.t43-guide .t43-gbody { padding: 0 10px 10px; display: grid; gap: 6px; max-height: 80vh; overflow: auto; }
.t43-guide label { display: grid; gap: 2px; font-weight: 600; }
.t43-guide select { font: inherit; padding: 2px 4px; border: 1px solid var(--uma-border-strong); border-radius: 6px; background: var(--uma-surface); color: var(--uma-text); }
.t43-guide p { margin: 0; color: var(--uma-text-muted); font-size: 11px; }
.t43-hidden { display: none !important; }

/* 作り物のサムネイル（写しの Tailwind には、写したとき画面に無かった h-14 などが無いので、製品の寸法〔高さ 56px・× 20px〕をここで当てる） */
.person-image-list > div { position: relative; overflow: hidden; border: 1px solid var(--uma-border); border-radius: 8px; background: var(--uma-surface); }
.person-image-list > div > img { display: block; width: 100%; height: 56px; object-fit: cover; }
.person-image-list button[data-t43-rm] { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 999px; background: rgba(15, 23, 42, .8); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.person-image-list button[data-t43-rm] svg { width: 12px; height: 12px; }

	</style>
</head>

					<label class="person-drop-zone group block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 bg-white hover:bg-green-50/40 hover:border-green-400 transition-all p-4 text-center mb-2" data-person="4">
						<input type="file" accept="image/*" multiple="" class="hidden person-file-input" data-person="4">
						<div class="flex flex-col items-center justify-center gap-1">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="upload-cloud" aria-hidden="true" class="lucide lucide-upload-cloud w-5 h-5 text-slate-500 group-hover:text-green-600"><path d="M12 13v8"></path><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="m8 17 4-4 4 4"></path></svg>
							<p class="text-[11px] font-medium text-slate-600">祖B1のスクショを選択</p>
						</div>
					</label>
					<div class="person-image-list grid grid-cols-2 gap-2" data-person="4"></div>
				</div>
				<div class="rounded-xl border border-slate-200 bg-slate-50/40 p-3">
					<p class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1.5">
						<span class="w-6 h-6 rounded-full bg-red-100 text-red-800 text-[9px] font-bold flex items-center justify-center shrink-0">祖2</span>
						祖B2
					</p>
					<label class="person-drop-zone group block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 bg-white hover:bg-green-50/40 hover:border-green-400 transition-all p-4 text-center mb-2" data-person="5">
						<input type="file" accept="image/*" multiple="" class="hidden person-file-input" data-person="5">
						<div class="flex flex-col items-center justify-center gap-1">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="upload-cloud" aria-hidden="true" class="lucide lucide-upload-cloud w-5 h-5 text-slate-500 group-hover:text-green-600"><path d="M12 13v8"></path><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="m8 17 4-4 4 4"></path></svg>
							<p class="text-[11px] font-medium text-slate-600">祖B2のスクショを選択</p>
						</div>
					</label>
					<div class="person-image-list grid grid-cols-2 gap-2" data-person="5"></div>
				</div></div>
				</div></div>

			<!-- オプション設定（デフォルトで折りたたみ） -->
			<details class="group rounded-xl border border-slate-200 bg-slate-50/50 overflow-hidden mb-5">
				<summary class="flex items-center justify-between p-3.5 text-xs font-semibold text-slate-700 cursor-pointer select-none">
					<span class="flex items-center gap-2">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sliders" aria-hidden="true" class="lucide lucide-sliders w-4 h-4 text-slate-500"><path d="M10 8h4"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M17 16h4"></path><path d="M19 12V3"></path><path d="M19 21v-5"></path><path d="M3 14h4"></path><path d="M5 10V3"></path><path d="M5 21v-7"></path></svg>
						<span>高度な解析オプション</span>
					</span>
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-down" aria-hidden="true" class="lucide lucide-chevron-down w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform"><path d="m6 9 6 6 6-6"></path></svg>
				</summary>

				<div class="p-4 pt-1 border-t border-slate-200/60 grid grid-cols-1 md:grid-cols-2 gap-3">
					<label class="flex items-start gap-2.5 p-2 rounded-lg hover:bg-white transition-colors cursor-pointer">
						<input id="opt-devlog" type="checkbox" class="mt-0.5 rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4">
						<div>
							<span class="text-xs font-semibold text-slate-800">開発用ログ出力</span>
							<p class="text-[11px] text-slate-500 mt-0.5">判定根拠や不一致テキストの内訳を結果エリアに表示</p>
						</div>
					</label>

					<label class="flex items-start gap-2.5 p-2 rounded-lg hover:bg-white transition-colors cursor-pointer">
						<input id="opt-preview" type="checkbox" class="mt-0.5 rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4">
						<div>
							<span class="text-xs font-semibold text-slate-800">切り出し画像のプレビュー</span>
							<p class="text-[11px] text-slate-500 mt-0.5">OCRエンジンに渡した整形画像をデバッグ用に確認</p>
						</div>
					</label>
				</div>
			</details>

			<!-- プログレスバー -->
			<div id="progress-wrap" class="hidden mb-4 p-4 rounded-xl bg-green-50 border border-green-200">
				<div class="flex justify-between text-xs font-semibold text-green-900 mb-2">
					<span id="progress-label" class="flex items-center gap-1.5">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="loader-2" aria-hidden="true" class="lucide lucide-loader-2 w-4 h-4 animate-spin text-green-600"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
						<span>処理中…</span>
					</span>
					<span id="progress-pct">0%</span>
				</div>
				<div class="h-2 bg-green-200/70 rounded-full overflow-hidden">
					<div id="progress-bar" class="h-full bg-green-600 rounded-full transition-all duration-300" style="width:0%"></div>
				</div>
			</div>

			<!-- 画質警告表示（対象外として除外した画像がある場合） -->
			<div id="quality-warn-wrap" class="hidden mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs text-amber-800 whitespace-pre-line flex gap-2">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-amber-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
				<div id="quality-warn-content"></div>
			</div>

			<!-- エラー表示 -->
			<div id="error-wrap" class="hidden mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-xs text-red-700 whitespace-pre-line flex gap-2">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-red-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
				<div id="error-content"></div>
			</div>

			<!-- ボタンは3つ。**並び・大きさ・色は exam.html と同じ**にしてある（C-62 の (8)）。
			     exam … OCR処理を開始する（黒塗り・大） → OCR処理＋画像結合を開始する（枠線・大）
			     special … 上の2つに加えて「画像を結合する」（標準の大きさ・白地＋罫線）が3つ目に付く。
			     C-61 では special だけ一体のボタンを先頭に置いていたが、2つのツールを行き来する人には
			     並びが入れ替わるほうが負担になるので、exam に合わせて戻した。
			     3つ目の「画像を結合する」は special だけの操作で、**残す**（スキルリスト未入力でも
			     押せることを special が保ってきた仕様で、やめると退行になる）。
			     文言は「（SNS投稿用）」から「（OCRしない）」へ変えた ―― このボタンの他との違いは
			     出力の用途ではなく「OCRを走らせないこと」なので、そこを言う。 -->
			<button id="process-btn" type="button" class="uma-btn uma-btn--primary uma-btn--lg w-full" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="play" aria-hidden="true" class="lucide lucide-play w-4 h-4 fill-current"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>
				<span>OCR処理を開始する</span>
			</button>

			<button id="process-stitch-btn" type="button" class="uma-btn uma-btn--accent-outline uma-btn--lg w-full mt-2" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>
				<span>OCR処理＋画像結合を開始する（高負荷）</span>
			</button>

			<!-- 画像結合だけ。OCR処理とは独立した機能で、スキルリスト未入力でも
			     アップロード済み画像だけで実行できる。各人ごとに複数枚のスクショを1枚に
			     縦結合し、さらに親A・祖A1・祖A2を横結合して1枚の比較画像として出力する。 -->
			<button id="stitch-btn" type="button" class="uma-btn uma-btn--secondary w-full mt-2" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images w-4 h-4"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<span>画像を結合する（OCRしない）</span>
			</button>
			<!-- 結合の注記。**exam.html と同じ文面**にしてある（段1）。
			     それまでは special が「1枚だけならエラー」、exam が「枚数が多いほど時間がかかる」と、
			     互いに相手の注意が抜けていた。片方を直すときはもう片方も直すこと。 -->
			<p class="mt-1.5 text-[11px] text-slate-400 text-center">※画像結合は、1人につき2枚以上のスクリーンショットを縦につなぎ、親Aセット・親Bセットそれぞれで、画像のある人を1枚にまとめてSNS投稿用に出力します。1人分が1枚だけのときはエラーになります。画像の枚数が多いほど時間がかかります。</p>

			<!-- 分類の印を結合画像に付けるかの切り替え（C-58 の作業C。段5〔C-227〕から印ではなく種類の枠。保存キー・id は同じ）。結果画像の見た目が変わる設定なので、
			     切り替えてもその場では何も変わらない引き出しの中ではなく、**結合を始める場所**に置く
			     （C-30 で exam に入れたときと同じ判断）。既定は ON ―― 印が出るのは②で周回因子セットを
			     選んだときだけで、選ぶこと自体が利用者の明示的な操作なので、そこから更にもう一段
			     チェックを入れさせる意味が薄いため（exam の属性アイコンが既定 OFF なのは、あちらが
			     対象スキルを選ばない＝誰の画像にも勝手に付くため）。保存キー uma-special-tier-marks。 -->
			<label id="tier-marks-row" class="mt-2 flex items-center justify-center gap-2 text-[11px] text-slate-500 cursor-pointer select-none">
				<input type="checkbox" id="opt-tier-marks" class="rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4" checked="">
				<span>種類の枠（周回サポカ・サポカ外・その他）を付ける</span>
			</label>

			<!-- 印を付けられるかどうかの状態表示（段0。C-59 の案(a)）。
			     結合はOCRと独立して押せるので、OCRを回していない・周回因子セットを選んでいない・
			     旧UIにいる、のいずれでも**印が黙って出ない**状態になる（C-58 で印を足したときに
			     できた穴）。押したあとのトーストではなく**押す前に読める場所**へ出す。
			     文面の組み立ては tierMarksStatusText()。 -->
			<p id="tier-marks-status" class="mt-1 text-[11px] text-center leading-relaxed text-amber-700" data-tone="warn">②で因子周回を選ぶと、種類の枠を付けられるようになります。</p>

			<!-- 画像結合の進捗バー（OCR処理と同じ見た目。処理中はstitch-btnを無効化して
			     多重クリックを防ぐ。詳細はrunImageStitching()参照） -->
			<div id="stitch-progress-wrap" class="hidden mt-3 p-4 rounded-xl bg-green-50 border border-green-200">
				<div class="flex justify-between text-xs font-semibold text-green-900 mb-2">
					<span id="stitch-progress-label" class="flex items-center gap-1.5">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="loader-2" aria-hidden="true" class="lucide lucide-loader-2 w-4 h-4 animate-spin text-green-600"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
						<span>画像結合中…</span>
					</span>
					<span id="stitch-progress-pct">0%</span>
				</div>
				<div class="h-2 bg-green-200/70 rounded-full overflow-hidden">
					<div id="stitch-progress-bar" class="h-full bg-green-600 rounded-full transition-all duration-300" style="width:0%"></div>
				</div>
			</div>

			<!-- 「高度な解析オプション」で出るもの（切り出しプレビュー・開発ログ）。
			     以前は照合結果の引き出しのいちばん下にあったが、オプションを入れた場所から遠く、
			     結果を読む流れの邪魔でもあったので、処理を始めるボタンの下へ移した。
			     オプションを切れば隠れる（renderPreview / renderDevLog）のは今までどおり。 -->
			<!-- 切り出し画像プレビュー -->
			<div id="preview-wrap" class="hidden border-t border-slate-200 pt-6 mt-6">
				<h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-4 h-4 text-slate-500"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
					<span>切り出し結果プレビュー</span>
				</h3>
				<div id="debug-preview" class="space-y-4"></div>
			</div>

			<!-- 開発ログ -->
			<div id="dev-wrap" class="hidden border-t border-slate-200 pt-6 mt-6">
				<div class="flex items-center justify-between mb-3">
					<h3 class="text-xs font-bold text-amber-700 flex items-center gap-1.5">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="terminal" aria-hidden="true" class="lucide lucide-terminal w-4 h-4"><path d="M12 19h8"></path><path d="m4 17 6-6-6-6"></path></svg>
						<span>開発用ログ</span>
					</h3>
					<button type="button" class="px-3 py-1 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-semibold transition-colors">
						ログをコピー
					</button>
				</div>
				<div id="dev-log" class="dev-log rounded-xl border border-amber-200 bg-amber-50/80 p-4 text-amber-900 max-h-80 overflow-y-auto"></div>
			</div>

			</div><!-- /#step-panel-2 -->
		</div>

	</div>

	

	<!-- ===== 引き出しパネル =====
	     行き先は3つとも同じ骨格（.uma-drawer）。背景の暗転は1枚を共有し、
	     同時に開くのは1つだけ。開閉は openDrawer() / closeDrawer() が管理する。 -->
	<div id="drawer-backdrop" class="uma-drawer-backdrop" hidden=""></div>

	<!-- 照合結果（★の数）。表の列が人数ぶん増えるので、他より広い引き出しにする。 -->
	<aside id="result-drawer" class="uma-drawer uma-drawer--wide" hidden="" role="dialog" aria-modal="true" aria-label="照合結果">
		<div class="uma-drawer-header">
			<div class="flex items-center gap-2 min-w-0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-4 h-4 text-green-600 shrink-0"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<p class="text-sm font-bold text-slate-800 truncate">照合結果（★の数）</p>
			</div>
			<div class="flex items-center gap-2 shrink-0">
				<button id="result-drawer-close" type="button" class="uma-btn uma-btn--secondary">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" aria-hidden="true" class="lucide lucide-x w-3.5 h-3.5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
					<span>閉じる</span>
				</button>
			</div>
		</div>
		<!-- 引き出しの中のタブ（C-62 の (9)）。**引き出しは2つのまま**で、押すともう一方の
		     引き出しへ切り替える（openDrawer が開いていた側を畳んでから開く）。
		     exam は1つの引き出しの中でパネルを切り替えるが（C-18）、special で同じ形にするのが
		     C-59 の段5 で、**段5 は引き続き見送り中**（理由と着手の条件は C-60 の6節）。
		     ここで作ったタブ帯は、段5 に着手したときにそのまま「1つの引き出しの中のタブ」になるので、
		     作り直しにはならない。
		     中身がまだ無い行き先は押せない（ラベルにも「（なし）」を出す）。未読の点はタブの右に出すので、
		     OCR＋結合を1回で走らせて照合結果が開いたとき、結合画像の側に点が見えて行けることが分かる。
		     骨格の CSS は css/shell.css（.drawer-tabs / .drawer-tab）。 -->
		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">
			<button type="button" role="tab" class="drawer-tab" id="result-tab-result" aria-selected="true" tabindex="0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<span id="result-tab-result-label">照合結果（なし）</span>
				<span id="result-tab-result-dot" class="uma-fab-dot" hidden=""></span>
			</button>
			<button type="button" role="tab" class="drawer-tab" id="result-tab-stitch" aria-selected="false" tabindex="-1" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-3.5 h-3.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
				<span id="result-tab-stitch-label">結合画像（なし）</span>

	<!-- 画像結合レビュー（SNS投稿用・β）。中身は画像なのでDeckと同じ幅でよい。 -->
	<aside id="stitch-drawer" class="uma-drawer" hidden="" role="dialog" aria-modal="true" aria-label="画像結合レビュー">
		<div class="uma-drawer-header">
			<div class="flex items-center gap-2 min-w-0">

				<p class="text-sm font-bold text-slate-800 truncate">画像結合レビュー</p>
				<span class="text-[11px] text-slate-400 truncate hidden sm:inline">β・SNS投稿用</span>
			</div>
			<button id="stitch-drawer-close" type="button" class="uma-btn uma-btn--secondary">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" aria-hidden="true" class="lucide lucide-x w-3.5 h-3.5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
				<span>閉じる</span>
			</button>
		</div>
		<!-- 照合結果の引き出しと対になるタブ帯（C-62 の (9)）。同じ2つを同じ順で並べ、
		     こちらでは「結合画像」が選択中。 -->
		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">
			<button type="button" role="tab" class="drawer-tab" id="stitch-tab-result" aria-selected="false" tabindex="-1" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<span id="stitch-tab-result-label">照合結果（なし）</span>
				<span id="stitch-tab-result-dot" class="uma-fab-dot" hidden=""></span>
			</button>
			<button type="button" role="tab" class="drawer-tab" id="stitch-tab-stitch" aria-selected="true" tabindex="0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-3.5 h-3.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
				<span id="stitch-tab-stitch-label">結合画像（なし）</span>
				<span id="stitch-tab-stitch-dot" class="uma-fab-dot" hidden=""></span>
			</button>
		</div>

		<div class="uma-drawer-body">
			<div id="stitch-empty" class="uma-drawer-empty">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<p class="text-sm font-bold text-slate-600">まだ画像結合の結果がありません</p>
				<p class="text-xs">1人につき2枚以上のスクリーンショットを入れて「OCR処理＋画像結合を開始する」か「画像を結合する（OCRしない）」を押すと、ここに結果が出ます。</p>
				<button type="button" class="uma-btn uma-btn--secondary">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" aria-hidden="true" class="lucide lucide-arrow-left w-3.5 h-3.5"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
					<span>入力画面に戻る</span>
				</button>
			</div>
			<div class="uma-drawer-content">
				<div id="stitch-result-wrap" class="hidden">
					<!-- 保存するときの名前。結果を見てから名付けられるよう、引き出しの先頭に1つだけ置く。
					     #stitch-result-content の外なので、結果ブロックを作り直しても入力が消えない。
					     使えない文字は打った時点で全角へ直す（ブラウザに任せると黙ってアンダーバーに
					     変えられ、画面に出ている名前と実際のファイル名がずれるため）。 -->
					<div class="mb-4">

	<!-- ===== 画面固定ナビ（右下・折りたたみFAB） =====
	     子要素の並び順は「上→下」＝「使用頻度の低い→高い」。メインボタンに一番近い
	     UmaSkill Deck が最頻用。バッジの出し入れは JS の updateFabBadges() が担当する。 -->
	<div id="fab-nav" class="uma-fab-nav">
		<button id="fab-item-result" type="button" class="uma-fab-item">
			<span>OCRの照合結果</span>
			<span class="uma-fab-icon" style="background: var(--uma-accent-soft); color: var(--uma-accent-soft-text);">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-4 h-4"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<span id="fab-dot-result" class="uma-fab-dot" hidden=""></span>
			</span>
		</button>

		<button id="fab-item-stitch" type="button" class="uma-fab-item">
			<span>画像結合レビュー</span>
			<span class="uma-fab-icon stitch-accent-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images w-4 h-4"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<span id="fab-dot-stitch" class="uma-fab-dot" hidden=""></span>
			</span>
		</button>

		<!-- Deck へ向かうボタンだけは Deck 側のアクセント（藍）で塗り、行き先を色で示す。
		     新UIのあいだだけ出す（updateDeckEntryVisibility）。既定の旧UIでは出さないので
		     hidden を書いた状態で置いてある。 -->
		<button id="deck-drawer-trigger" type="button" class="uma-fab-item deck-accent" aria-controls="deck-drawer" aria-expanded="false">
			<span>UmaSkill Deck</span>
			<span class="uma-fab-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>
				<span id="fab-dot-deck" class="uma-fab-dot" hidden=""></span>
			</span>
		</button>

		<!-- C-132: 帯の「セット」「レース」のボタンと同じ小窓を開く（帯のボタンはそのまま）。新UIのあいだだけ出す（updateDeckEntryVisibility）。
		     レースが選ばれているときは、帯と同じ短い表記を添える（開くたびに fabSyncSetItems が入れ直す） -->
		<button id="fab-item-set" type="button" class="uma-fab-item" aria-haspopup="dialog" hidden="">
			<span>セット</span>
			<span class="uma-fab-icon fab-set-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="folder-open" aria-hidden="true" class="lucide lucide-folder-open w-4 h-4"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
			</span>
		</button>
		<button id="fab-item-race" type="button" class="uma-fab-item" aria-haspopup="dialog" hidden="">
			<span class="fab-race-label"><span>レース</span><span id="fab-race-text" class="fab-race-text" hidden=""></span></span>
			<span class="uma-fab-icon fab-set-icon">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="flag" aria-hidden="true" class="lucide lucide-flag w-4 h-4"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"></path></svg>
			</span>
		</button>

		<!-- メインボタンと、畳んでいるときの未読の印。印はボタンの右上に赤い丸を1つだけ出す
		     （行き先がいくつ未読でも1つ。開けば行き先ごとの丸が見える）。丸をボタンの角に
		     合わせるために .uma-fab-main で包んである（包んでも .uma-fab-nav の最後の子は

		<span class="uma-fab-main">

	<!-- UmaSkill Deck。ここだけ中身が iframe（uma-skill-deck.html をそのまま読む）で、

		var who = n === 3 ? '親A・祖A1・祖A2' : '祖A1';
		box.innerHTML = '<h3>結合の結果（作り物の画像）</h3>'
			+ (n > 0 ? '<div class="mb-3 rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs text-amber-800 flex gap-2" role="status">' + SVG_TRI.replace('CLS', 'text-amber-500')
				+ '<div>' + who + ' の結合の一部がずれているかもしれません。結果の画像を見て、ずれていたら動画を撮り直すか、スクショで入れ直してください。</div></div>' : '')
			+ '<img src="' + fakeResult + '" alt="結合の結果（作り物）" />'
			+ '<p class="t43-shot-label">' + (n === 0 ? '警告なし（ずれの見込みが無いとき。黄色の箱は出ない）' : '人の単位の警告: ' + n + '人') + '</p>';
		var after = document.getElementById('stitch-progress-wrap') || document.getElementById('tier-marks-status');
		after.parentElement.insertBefore(box, after.nextSibling);
	}

	/* ===== 起動 ===== */
	syncStickyTop();
	if (scene === 'now') {
		tabsSlot = document.getElementById('personset-tabs');
		if (TOOL === 'exam') tabsSlot = null;
	} else {
		applyNew();
	}
	var imgA = parseInt(Q.get('imgA') || '0', 10) || 0;
	var imgB = parseInt(Q.get('imgB') || '0', 10) || 0;
	if (imgA) for (var r0 = 0; r0 < 3; r0++) for (var k0 = 0; k0 < (r0 === 0 ? imgA : Math.max(0, imgA - 1)); k0++) imgs[r0].push({ video: false });
	if (imgB) for (var k1 = 0; k1 < imgB; k1++) imgs[3].push({ video: false });
	if (scene === 'vexist' || scene === 'verr' || scene === 'vcancel') {
		if (!imgA) { imgs[0] = [{}, {}]; imgs[1] = [{}, {}]; imgs[2] = [{}]; }
	}
	renderImages();
	if (TOOL === 'special' && tabsSlot && scene !== 'now') {
		if (scene === 'vopen') showOpen(false, V);
		else if (scene === 'vexist') showOpen(true, V);
		else if (scene === 'vprog') { var sp = Math.min(4, Math.max(0, parseInt(Q.get('step') || '2', 10))); showProgress(sp, [6, 30, 58, 86, 100][sp], V === '2'); }
		else if (scene === 'vdone') { compactVideo = V === '2'; fillVideo(activeSet, [7, 10, 3]); showDoneSummary(activeSet, [7, 10, 3]); }
		else if (scene === 'vwarn') { fillVideo(activeSet, [7, 10, 3]); showDoneSummary(activeSet, [7, 10, 3]); showWarnResult(parseInt(Q.get('n') || '1', 10)); }
		else if (scene === 'verr') showError(ERRORS[Q.get('e')] ? Q.get('e') : 'unreadable');
		else if (scene === 'vcancel') showCancelled();
	}
	window.addEventListener('resize', syncStickyTop);

	/* ===== 操作（モックの中だけ） ===== */
	document.addEventListener('click', function (e) {
		var t = e.target.closest ? e.target : null;
		if (!t) return;
		var tab = t.closest('#personset-tabs [data-usd-act="personset-tab"]');
		if (tab) { activeSet = Number(tab.getAttribute('data-tab-id')) || 0; renderTabs(); return; }
		var rm = t.closest('[data-t43-rm]');
		if (rm) { var a = rm.getAttribute('data-t43-rm').split(':'); imgs[+a[0]].splice(+a[1], 1); renderImages(); e.preventDefault(); return; }
		var dz = t.closest('.person-drop-zone');
		if (dz) { e.preventDefault(); imgs[Number(dz.getAttribute('data-person'))].push({ video: false }); renderImages(); return; }
		var sn = t.closest('#deck-set-bar [data-usd-el="set-name"]');
		if (sn) { showToast('（モック）ここで今のセット名の小窓が開きます'); return; }
		var stab = t.closest('.step-tab');
		if (stab) { e.preventDefault(); showToast('（モック）この画面だけを写しています'); return; }
		if (t.closest('a[href="#"]')) e.preventDefault();
	}, true);
	function showToast(msg) {
		if (!toastEl) return;
		toastMsg.textContent = msg;
		toastEl.classList.remove('t43-hidden');
		clearTimeout(showToast.t);
		showToast.t = setTimeout(function () { toastEl.classList.add('t43-hidden'); }, 2500);
	}

	/* ===== 案内（左上） ===== */
	if (!SHOT) {
		var g = document.createElement('details');
		g.className = 't43-guide';
		var opt = function (val, cur, label) { return '<option value="' + val + '"' + (val === cur ? ' selected' : '') + '>' + label + '</option>'; };
		var sceneOpts = Object.keys(SCENES).filter(function (k) { return TOOL === 'special' || k.charAt(0) !== 'v'; }).map(function (k) { return opt(k, scene, k + ' — ' + SCENES[k]); }).join('');
		var vLabel = {
			now: ['1', '—'], new: ['1', 'v=1 下線あり・(ア) 文字だけ', '2', 'v=2 下線なし・(イ) 丸の中に「親A」'],
			vopen: ['1', 'v=1 小窓（スマホは下から）', '2', 'v=2 タブの下にその場で開く'],
			vexist: ['1', 'v=1 3つのボタン', '2', 'v=2 選んでから「動画を選ぶ」'],
			vprog: ['1', 'v=1 目安の時間なし', '2', 'v=2 目安の時間あり'],
			vdone: ['1', 'v=1 サムネイルを全部', '2', 'v=2「動画から N枚」にまとめる'],
			vwarn: ['1', '—'], verr: ['1', '—'], vcancel: ['1', '—']
		}[scene];
		var vOpts = ''; for (var i = 0; i < vLabel.length; i += 2) vOpts += opt(vLabel[i], V, vLabel[i + 1]);
		var extra = '';
		if (scene === 'vopen' || scene === 'vexist') extra += '<label>撮り方の案内の文面<select data-q="g">' + opt('1', G, 'g=1 1文') + opt('2', G, 'g=2 手順3つ') + opt('3', G, 'g=3 短く') + '</select></label>';
		if (scene === 'vprog') extra += '<label>段<select data-q="step">' + [0, 1, 2, 3, 4].map(function (s) { return opt(String(s), Q.get('step') || '2', s + ' ' + STEPS[s]); }).join('') + '</select></label>';
		if (scene === 'vwarn') extra += '<label>警告の人数<select data-q="n">' + ['0', '1', '3'].map(function (s) { return opt(s, Q.get('n') || '1', s + '人'); }).join('') + '</select></label>';
		if (scene === 'verr') extra += '<label>失敗<select data-q="e">' + Object.keys(ERRORS).map(function (s) { return opt(s, Q.get('e') || 'unreadable', s); }).join('') + '</select></label>';
		if (scene !== 'now') extra += '<label>(1) セット名の下線<select data-q="ul">' + opt('1', UL ? '1' : '0', '残す') + opt('0', UL ? '1' : '0', '外す') + '</select></label>'
			+ '<label>(2)-3 人の欄の見出し<select data-q="badge">' + opt('a', BADGE, '(ア) 丸を消して文字だけ') + opt('i', BADGE, '(イ) 丸の中を「親A」など') + '</select></label>';
		g.innerHTML = '<summary>モックの案内 ▾</summary><div class="t43-gbody">'
			+ '<p>T43 の作業用のモック。保存も通信もしない。人の欄（点線の枠）を押すと作り物の画像が1枚入る。</p>'
			+ '<label>ツール<select data-q="tool">' + opt('special', TOOL, 'special（UmaStar）') + opt('exam', TOOL, 'exam（UmaExam）') + '</select></label>'
			+ '<label>場面<select data-q="scene">' + sceneOpts + '</select></label>'
			+ '<label>案<select data-q="v">' + vOpts + '</select></label>' + extra
			+ '<label>色<select data-q="theme">' + opt('light', THEME, 'ライト') + opt('dark', THEME, 'ダーク') + '</select></label>'
			+ '</div>';
		document.body.appendChild(g);
		g.addEventListener('change', function (e) {
			var s = e.target.closest('select[data-q]'); if (!s) return;
			var q = new URLSearchParams(location.search);
			q.set(s.getAttribute('data-q'), s.value);
			if (s.getAttribute('data-q') === 'scene') { q.delete('v'); q.delete('ul'); q.delete('badge'); }
			if (s.getAttribute('data-q') === 'v') { q.delete('ul'); q.delete('badge'); }
			location.search = q.toString();
		});
	}
	window.__t43 = { tool: TOOL, scene: scene, v: V, ul: UL, badge: BADGE };
})();

</script>
</body>
</html>
