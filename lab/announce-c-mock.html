<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（このページは、同じサイトの special.html を枠で開くだけ） -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>お知らせ(c) のモック（作業用）</title>
	<!--
		C-260 の (c)「結合画像の新しい形のお知らせを UmaStar だけに1件」の試し描き（モック・T54）。
		おいもさんが文面の案1〜3 を見比べて決めるための作業用のページ。**ツール本体には組み込まない**（どのページからもリンクしない）。保存は無い。

		作り: 製品の special.html を、そのまま画面いっぱいの枠（iframe）で開き、読み込みが済んだら、その中に (c) のお知らせを1件足して開く。
		  ・小窓は製品の #ui-notice（✕・OK・‹ n / N ›）のまま。中身は js/announce.js の fill（ANNOUNCE と同じ形: 見出し・本文・箇条・画像）で作る。
		    新しい部品・新しい CSS は足していない（fill の見出し〔.announce-h〕・本文〔.announce-lead〕・箇条〔.announce-lines〕・画像〔.announce-fig〕のまま）。
		  ・履歴（UmaAnnounce.NOTICE_LIST）の先頭に (c)〔kind: stitch・2026/11/01・special だけ〕を足す。(b)（古いお知らせを外す）は入れないので、
		    履歴は (c) → catalog 09/27 → alpha 09/19 の3件になり、(c) は 1 / 3。› で今の2件へ進める。
		  ・枠は special.html?notice=force で開く（閉じても既読を書かない＝このページを見ても製品の既読の状態は変わらない）。
		  ・製品を枠で開くので、製品の小窓の見た目を変えると、このページにもそのまま出る（写しではない）。
		  ・画像は lab/announce-c-stitch-mock.png（T51 の結合画像 kiremono.png 2206×1541 を半分の 1103×771 に縮めた写し。製品の img/ には置かない）。
		    作り直すときは scripts/announce-c-mock-shots.mjs の --make-image。

		引数: ?plan=1|2|3（既定 2）・?theme=light|dark（無ければ製品の設定のまま）・?shot=1（案内を隠す）
		開き方: http で配信したリポジトリのルートから /lab/announce-c-mock.html（file:// では枠の中に手が届かない）。
	-->
	<style>
		html, body { margin: 0; height: 100%; background: #fff; }
		#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
		.mk-guide { position: fixed; left: 8px; top: 8px; z-index: 2147483000; max-width: min(320px, calc(100vw - 16px)); font: 12px/1.5 system-ui, sans-serif;
			background: #fff; color: #222; border: 1px solid #999; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
		.mk-guide button { display: block; min-height: 32px; padding: 4px 10px; font: inherit; font-weight: 700; background: transparent; border: 0; cursor: pointer; color: inherit; }
		.mk-guide-body { padding: 0 10px 10px; display: grid; gap: 6px; }
		.mk-guide[data-open="0"] .mk-guide-body { display: none; }
		.mk-guide p { margin: 0; color: #555; }
		.mk-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
		.mk-row a { display: inline-block; min-width: 32px; padding: 4px 8px; text-align: center; border: 1px solid #999; border-radius: 6px; color: #222; text-decoration: none; }
		.mk-row a[aria-current="true"] { background: #222; color: #fff; border-color: #222; }
		body[data-shot="1"] .mk-guide { display: none; }
	</style>
</head>
<body>
	<iframe id="app" title="UmaStar OCR（製品の special.html）" src="../special.html?notice=force"></iframe>
	<div class="mk-guide" data-open="0">
		<button type="button" id="mk-toggle" aria-expanded="false">モック: 案2</button>
		<div class="mk-guide-body">
			<div class="mk-row">文面: <span id="mk-plans"></span></div>
			<div class="mk-row">色: <span id="mk-themes"></span></div>
			<p>小窓を閉じたら、読み込み直すともう一度出ます。‹ › で今の2件（09/27・09/19）へ進めます。</p>
		</div>
	</div>
	<script>
	(function () {
		'use strict';

		/* ---------- 文面の案（T41 の報告 5節の案1〜3。案1 の「SP」だけ、欄の名前に合わせて「理論値SP」にした） ---------- */
		const IMAGE = {
			src: 'lab/announce-c-stitch-mock.png',  // special.html から見たパス
			alt: '新しい形の結合画像の例。いちばん上にセット名・育成ウマ娘・レース条件の帯、上の段に理論値SPと①本育成編成・②因子周回編成のサポートカード、中の段に星取表と親A・祖A1・祖A2 の継承画面、いちばん下に枠の見かた',
		};
		const PLANS = {
			1: {
				heading: '結合画像が新しくなりました',
				lead: '1枚の結合画像で、編成と因子をまとめて見られるようにしました。',
				lines: [
					'いちばん上に「セット名｜育成ウマ娘｜レース条件」が入ります。',
					'上の段に、理論値SP・本育成編成のサポートカード6枚・因子周回編成のサポートカードが並びます。',
					'中の段に、星取表と、親・祖1・祖2 の継承画面が同じ高さで並びます。それぞれに顔のアイコンと名前が付きます。',
					'継承画面の左右の余白は、自動で削ります。',
					'いちばん下に、枠の見かたを1行で入れます。',
				],
				images: [],
			},
			2: {
				heading: '結合画像の形を変えました',
				lead: '編成のカードと、星取表・親・祖1・祖2 を、1枚に並べるようにしました。',
				lines: [
					'上の段にサポートカード、中の段に星取表と3人の継承画面が並びます。',
					'継承画面の左右の余白は、自動で削ります。',
				],
				images: [IMAGE],
			},
			3: {
				heading: '結合画像が見やすくなりました',
				lead: '1枚を見れば、どの編成で、どの因子が、だれに付いているかが分かります。',
				lines: [
					'タイトルに、セット名・育成ウマ娘・レース条件が入ります。',
					'編成のカード（本育成・因子周回）が上の段に、星取表と親・祖1・祖2 が中の段に並びます。',
					'継承画面の左右の余白は、自動で削ります。',
				],
				images: [],
			},
		};
		// 履歴に足す (c) の行（日付は仮。実装では push の日）
		const ENTRY = { kind: 'stitch', date: '2026/11/01', pages: ['special'], commit: '（モック）' };
		const BODY_ID = 'ui-notice-body-stitch';
		const TITLE_ID = 'ui-notice-title-stitch';

		const q = new URLSearchParams(location.search);
		const planNo = PLANS[q.get('plan')] ? q.get('plan') : '2';
		const theme = q.get('theme') === 'dark' || q.get('theme') === 'light' ? q.get('theme') : null;
		if (q.get('shot') === '1') document.body.setAttribute('data-shot', '1');
		window.__mock = { ready: false, plan: Number(planNo), theme: theme, error: null };

		/* ---------- 案内（文面と色の切り替え。読み込み直す） ---------- */
		function link(params, text, current) {
			const u = new URLSearchParams(location.search);
			Object.keys(params).forEach(function (k) { if (params[k] === null) u.delete(k); else u.set(k, params[k]); });
			const a = document.createElement('a');
			a.href = '?' + u.toString();
			a.textContent = text;
			if (current) a.setAttribute('aria-current', 'true');
			return a;
		}
		['1', '2', '3'].forEach(function (n) { document.getElementById('mk-plans').appendChild(link({ plan: n }, '案' + n, n === planNo)); });
		[['light', 'ライト'], ['dark', 'ダーク'], [null, '製品のまま']].forEach(function (t) {
			document.getElementById('mk-themes').appendChild(link({ theme: t[0] }, t[1], t[0] === theme));
		});
		const guide = document.querySelector('.mk-guide');
		const toggle = document.getElementById('mk-toggle');
		toggle.textContent = 'モック: 案' + planNo;
		toggle.addEventListener('click', function () {
			const open = guide.getAttribute('data-open') !== '1';
			guide.setAttribute('data-open', open ? '1' : '0');
			toggle.setAttribute('aria-expanded', String(open));
		});

		/* ---------- 枠の中の special.html に (c) を足して開く ---------- */
		const frame = document.getElementById('app');
		function inject(cw) {
			const doc = cw.document;
			const A = cw.UmaAnnounce;
			if (theme) doc.documentElement.setAttribute('data-theme', theme);
			// 起動のときに ?notice=force で開いた最新の1件（今は 09/27）を閉じる（force なので既読は書かない）
			if (cw.eval('uiNoticeOpen')) cw.closeUiNotice();
			// 履歴の先頭に (c)
			if (!A.NOTICE_LIST.some(function (n) { return n.kind === ENTRY.kind; })) A.NOTICE_LIST.unshift(ENTRY);
			// 本文の入れ物（製品の edition・scenario と同じ、空の div）
			let body = doc.getElementById(BODY_ID);
			if (!body) {
				body = doc.createElement('div');
				body.id = BODY_ID;
				body.hidden = true;
				doc.querySelector('#ui-notice .notice-body').appendChild(body);
			}
			// 中身は js/announce.js の fill（ANNOUNCE と同じ形）で作る。定義を一時的に差し替えて呼び、元に戻す
			const plan = PLANS[planNo];
			const keep = { sections: A.ANNOUNCE.sections };
			A.ANNOUNCE.sections = [{ heading: plan.heading, lead: plan.lead, lines: plan.lines, images: plan.images }];
			try { A.fill(body); } finally { A.ANNOUNCE.sections = keep.sections; }
			const sr = body.querySelector('h2.announce-sr');
			if (sr) sr.id = TITLE_ID;
			// 種類の表（製品の NOTICE_KINDS）に足す。既読は読まない・書かない（モック）
			const kinds = cw.eval('NOTICE_KINDS');
			kinds[ENTRY.kind] = { body: BODY_ID, title: function () { return TITLE_ID; }, seen: function () { return false; }, mark: function () {} };
			cw.openUiNotice(ENTRY.kind);
			const img = body.querySelector('img');
			const done = function () { window.__mock.ready = true; };
			if (img && !img.complete) { img.addEventListener('load', done); img.addEventListener('error', function () { window.__mock.error = '画像が読めない'; done(); }); }
			else done();
		}
		frame.addEventListener('load', function () {
			const cw = frame.contentWindow;
			const t0 = Date.now();
			(function wait() {
				let booted = false, open = false;
				try {
					booted = !cw.document.documentElement.hasAttribute('data-boot') && !!cw.UmaAnnounce && typeof cw.openUiNotice === 'function';
					open = booted && cw.eval('uiNoticeOpen');
				} catch (e) { /* まだ */ }
				// 起動の最後に force で1件開くので、それを待つ（開かないとき〔引き出しが開いているなど〕は 5秒で先へ）
				if (booted && (open || Date.now() - t0 > 5000)) {
					try { inject(cw); } catch (e) { window.__mock.error = String(e && e.message || e); }
					return;
				}
				setTimeout(wait, 100);
			})();
		});
	})();
	</script>
</body>
</html>
