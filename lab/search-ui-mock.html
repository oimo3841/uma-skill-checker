<html lang="ja" data-theme="light">

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない（通信・フォームの送信・外部のファイルの読み込みを、ブラウザの側で禁止する。画像は同じサイトの img/ だけ） -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>検索の小窓のモック（作業用）</title>
	<!--
		UmaStar の②の「スキルを探して追加」まわりの小窓の試し描き（モック・T21）。おいもさんが見て決めるための作業用のページ。
		**ツール本体には組み込まない**（lab/popup-mock.html・lab/capture-test.html と同じ扱い。どのページからもリンクしない）。
		保存は無い。テキストで検索の候補の絞り込みと、候補を押して入れる／外すだけ、ページの中の簡単なスクリプトで動く。

		作り: UmaStar（special.html）の②の画面と「条件で検索」「緑スキルを追加」「スキルを探して追加」の小窓の HTML と、ページの CSS を
		2026-10-30 の origin/main（core 2026-10-30h）から写し取り、その上にモックの差分（下の <style id="t21-css"> と <script>）を当てている。
		写しなので、製品を変えてもこのページは変わらない。
		場面は ?scene=…、ライト／ダークは ?theme=light|dark、画像を撮るときは &shot=1（上の案内を隠す）。
		「条件で検索」は &sel=0 で何も選んでいない状態、&strike=a|b で選べない行の表し方の案を当てる。
	-->
	<style>
html[data-boot] .step-tabs, html[data-boot] .step-panel { visibility: hidden; }
@layer base { i[data-lucide] { display: inline-block; width: 1em; height: 1em; } }
/* css/tokens.css */
/* ============================================================
 * Uma Tools 共通スタイル — 1/3 デザイントークン（css/tokens.css）
 *
 * special.html / uma-skill-deck.html / exam.html / css/styleguide.html で共有する。
 * ここには :root のカスタムプロパティ（色・余白・文字サイズ・角丸・影）だけを置く。
 * 見た目を描く規則は置かない。参照されない限り何も描かないので、
 * 共通部品を持たないページ（exam.html）が読んでも既存の見た目は変わらない。
 *
 * 3ファイルの役割:
 *   css/tokens.css … 変数だけ（このファイル）
 *   css/common.css … 共通部品（ボタン・入力欄・バッジ・カード）
 *   css/shell.css  … 画面の骨格（FAB・引き出し・オーバーレイ・ステップのタブ・告知）
 * 読み込み順は tokens → common → shell → Tailwind → 各HTMLの<style>。
 * 版は3ファイルで1つ（同じ文字列）。tests/visual/run-verify.mjs が一致を検査する。
 *
 * ---- 色の値について ----
 * Tailwind v4 はパレットを oklch で再定義しており、v3時代の hex とは
 * 微妙に違う（例: slate-500 は #64748b ではなく #62748e）。
 * ここに書く hex は、実際に読み込んでいる Tailwind v4.1.11 を
 * ブラウザ上で描画して実測した値である。v3世代の値を混ぜないこと。
 * ============================================================ */

:root {
	/* 版数。tokens.css / common.css / shell.css の3ファイルで同じ文字列を使う。
	   変更したら3ファイルの印と、各HTMLの ?v=（3つとも）と、
	   各ページの EXPECTED_COMMON_CSS_VERSION を必ず揃えて上げること。
	   （古い版がキャッシュされたままだとレイアウトが崩れるため、
	     読み込み側で照合して警告を出している） */
	--common-css-version: "2026-10-13a";

	/* ---- 面 ---- */
	--uma-surface: #ffffff;          /* white     : カード・入力欄の地 */
	--uma-glass-bg: rgba(255, 255, 255, .9); /* 半透明パネルの地 */
	--uma-glass-blur: blur(14px);            /* 同上のぼかし量 */
	--uma-surface-sunken: #f8fafc;   /* slate-50  : 一段沈めた面 */
	--uma-surface-muted: #f1f5f9;    /* slate-100 : 押せる要素の待機状態 */
	/* **枠を引かずに「ここからここまで」を示す面**（72セッション目・段11 ⑨）。
	   ②のAの「スキルセット」のまとまり（.uma-section--framed とその札）が使う。
	   **値は --uma-border と同じ slate-200 だが、役割が違うので別に持つ**
	   ―― 罫線の色を動かしたときに、まとまりの面まで一緒に動いてほしくない。
	   **新しい色は増やしていない**（パレットに既に在る値に、役割の名前を付けただけ）。
	   **なぜここまで濃いか**: 囲む相手が .glass-card（rgba(255,255,255,.9)＋ぼかし）なので、
	   周りの実際の画素は真っ白ではなく #fbfbfa〜#ffffff になる。合成後の色で測ると
	     slate-50（段11 の最初の版） … ΔE 1.72〜2.21 … **並べても見分けが付かない**
	     slate-100                    … ΔE 3.66〜4.40 … 近くで見れば分かる程度
	     slate-200（これ）            … ΔE 8.50〜9.43 … はっきり違って見える
	   実機で「差がほとんど無い」という指摘を受けて、3段目まで下ろした。
	   **差そのものを run-smoke が見張っている**（段11 ⑨ の ΔE の検査）。 */
	--uma-surface-group: #e2e8f0;    /* slate-200 : まとまりを示す面（枠線の代わり） */
	--uma-surface-inverse: #0f172b;  /* slate-900 : トースト・選択中の反転 */

	/* ---- 文字 ---- */
	--uma-text: #1d293d;             /* slate-800 : 本文 */
	--uma-text-heading: #314158;     /* slate-700 : 見出し・ボタン文字 */
	--uma-text-muted: #45556c;       /* slate-600 : やや弱い文字 */
	--uma-text-subtle: #62748e;      /* slate-500 : 補助・説明 */
	--uma-text-faint: #90a1b9;       /* slate-400 : 注記 */
	--uma-text-inverse: #ffffff;

	/* ---- 罫線 ---- */
	--uma-border: #e2e8f0;           /* slate-200 : 既定の罫線 */
	--uma-border-strong: #cad5e2;    /* slate-300 : hover時など */

	/* ---- 状態色 ---- */
	--uma-success: #008236;          /* green-700 : 本文に混ぜる緑（「見つかった」など、文字だけの箇所） */
	/* 淡い緑の面と、その上に載せる文字（64セッション目・段E-3）。
	   --uma-danger-bg / -text と同じ組み方。**面に載せる文字は上の --uma-success より
	   一段濃い**（淡い緑の上で読めるようにするため。役割が違うので値も分けてある）。 */
	--uma-success-bg: #dbfce7;       /* green-100 */
	--uma-success-text: #016630;     /* green-800 */
	--uma-warn-bg: #fffbeb;          /* amber-50  */
	--uma-warn-border: #fee685;      /* amber-200 */
	--uma-warn-text: #973c00;        /* amber-800 */
	--uma-danger-bg: #fef2f2;        /* red-50    */
	--uma-danger-border: #ffc9c9;    /* red-200   */
	--uma-danger-text: #c10007;      /* red-700   */
	--uma-star: #fe9a00;             /* amber-500 : ★の実数 */
	--uma-star-empty: #cad5e2;       /* slate-300 : ★の空き */

	/* ---- 印の色 ----
	   「そのスキルがどの区分か」を表す記号（★●♦■✕）の色。一覧・判定結果の表・
	   結果画像の3か所が同じ値を使う。面の色（--uma-surface-*）や状態色
	   （--uma-success 等）を流用しないこと。役割が違うものを同じ値にすると、
	   面の色を変えたときに印まで一緒に動いてしまう。
	   値は Tailwind v4.1.11 の実測（F-19）。
	   ★は --uma-star、その他の対象スキルの●は --uma-text、
	   追加・除外の■✕は --uma-danger-text、シナリオ因子の◆は下の --uma-mark-catalog、
	   遺伝子のハートは下の --uma-mark-gene を使うので、ここには無い。 */
	--uma-mark-green-skill: #00bc7d; /* emerald-500 : 緑スキル（SP70以外）の● */

	/* ---- スキルセットの分類（超優先／優先／通常）の印の色（C-58・58セッション目） ----
	   **競馬の印**で示す: 超優先＝◎（本命）／優先＝○（対抗）／通常＝▲（単穴）。
	   ②のスキルパネルの左・照合結果の表のスキル名の前・結合画像の3か所が同じ値を使う。
	   印は**線で描き、塗りつぶさない**。形だけで順位が読めるので、色は補助でしかない。
	   **（履歴）57セッション目は金・銀・銅の★だった**が、★は3つとも同じ形で色でしか違わず、
	   金と銅が並ぶと区別がつきにくかった。形で順位を示すほうが直感的なので競馬の印へ変えた（C-58）。
	   値は Tailwind のパレットに無いので直書き。白地とのコントラストは 5.07／5.51／7.56、
	   スキルパネルの地（下の --uma-skillpanel-*）の左端 #fbfbfe で 4.91／5.34／7.32、いちばん濃い右端 #dcdeee でも 3.80／4.13／5.66。
	   Exam の結合画像の印（★橙・●緑・●濃紺・♦紫・ハート紫・■✕赤）とは別のツールの別の画像に
	   出るので同じ画像には並ばない。■✕の赤（#c10007）とは近いが（ΔE 9.5）、形が重ならないので
	   そのままにした。**同じ画像に並ぶのは遺伝子のハート（--uma-mark-gene #581c87）**で、
	   こちらは紫なので赤の◎とは離れている（ΔE 34.0。段G-2）。 */
	--uma-mark-tier-1: #d81f26;   /* 超優先 ◎（本命）: 赤 */
	--uma-mark-tier-2: #1667c8;   /* 優先 ○（対抗）: 青 */
	--uma-mark-tier-3: #4b5563;   /* 通常 ▲（単穴）: 灰 */

	/* ---- スキルパネル（②の追加済みスキル1件の箱）の見た目（C-57・C-58 で質感を足した） ----
	   ゲームの「スキルセット詳細」の板に寄せる。単色ではなく、
	   **左（文字側）がほぼ白 → 右へいくほど薄紫が濃くなる横方向のグラデーション**に、
	   **下端の内側の影**と**上端の細い白のハイライト**を重ねる。値は3つともここで持つ（1か所で管理）。 */
	--uma-skillpanel-bg: linear-gradient(90deg, #fbfbfe 0%, #eceef8 46%, #dcdeee 100%);
	--uma-skillpanel-border: #c8c8de;
	--uma-skillpanel-shadow:
		inset 0 -7px 9px -7px rgba(60, 60, 110, .45),   /* 下端の内側の影（板の厚み） */
		inset 0 1px 0 #ffffff,                          /* 上端の白いハイライト */
		0 1px 2px rgba(41, 37, 36, .12);                /* 面から浮かせる薄い影 */

	/* ---- 表の罫線（C-57・57セッション目） ----
	   ★取り表（編成パネル）の列の間の縦線と、行の間の横線。**地色に依存させず、ここで1か所で持つ**
	   （ダークの値はこのファイルの末尾。C-134）。
	   見出しのセルの地と、育成ウマ娘の列の見出しだけに使う濃い地もここ。 */
	--uma-table-rule: #e2e8f0;          /* slate-200 : 列の間の縦線・行の間の横線 */
	--uma-table-rule-strong: #cad5e2;   /* slate-300 : 見出し行の下線 */
	--uma-table-head-bg: #f8fafc;       /* slate-50  : 見出しのセルの地 */
	/* 主の列（育成ウマ娘）の見出しは「主要な操作」の塗り（C-144。それまでは stone-700 #44403b と白の直書き） */
	--uma-table-head-key-bg: var(--uma-control);
	--uma-table-head-key-text: var(--uma-control-text);
	--uma-table-head-key-edge: var(--uma-control-edge);
	--uma-table-col-alt: #f8fafc;       /* slate-50  : 1列おきの薄い灰（C-62 の (3)） */
	--uma-table-col-key: #f1f5f9;       /* slate-100 : 主の列（育成ウマ娘）の本体の地（C-63 の (4)）。
	                                       1列おきの灰より一段濃くして、縞の一部に見えないようにする */

	/* ---- シナリオ因子の色＝紫 ----
	   ◆の印・バッジ・ハイライトのカード・結合画像の因子の行・模式図の帯・
	   Deck の比較シートの◆が、**この4つの役割だけ**を使う。
	   場所ごとに別の値（sky-50〜900・canvas の直書き）だったものを 2026-09-15 にまとめた。

	   **名前は「catalog」だが、いま指しているのはシナリオ因子だけ**（段G）。
	   66セッション目に遺伝子を下の --uma-gene-* へ切り出したので、この4本は
	   シナリオ因子専用になった。**それでも改名していない** ―― Deck の比較シートの印
	   （js/uma-skill-deck.js）はカテゴリを問わず「スキルではないカタログ」を指す名前として
	   この語を使っており、改名するとあちらで逆に食い違うため（恒久ルール19 の棚卸しの結果）。

	   紫にした理由: Exam のテーマ色を青C `#0b6bcb` にしたため、それまでの sky 系と
	   近くなって区別できなくなった。青C・緑スキルの緑・その他の対象スキルの紺・
	   除外と通知の赤・sp70緑と結合画像の琥珀のいずれとも離れる範囲を選んである。
	   値はおいもさんが試作で決めた確定値（Tailwind のパレットの値ではない）。
	   **4本とも据え置き。** 段G で印だけ #a42fb8 へ動かしたが、遺伝子を赤にする案を
	   撤回した（段G-2）ので、赤から離す理由が無くなって元の値へ戻した。 */
	--uma-mark-catalog: #b02aa8;   /* ◆の印・凡例の◆・「他」・模式図の帯（白地に 5.61。
	                                  以前の sky-500 は 2.77 しかなく、印としては薄すぎた） */
	--uma-catalog-text: #76136f;   /* バッジとカードの文字・結合画像の因子の行
	                                  （白地に 10.03／淡い地の上で 8.55） */
	--uma-catalog-soft: #fbe7f8;   /* バッジとカードの地・選択一覧の hover の面。
	                                  **この地の上に置く文字は --uma-catalog-text**（印の色は 4.78 なので文字には使わない） */
	--uma-catalog-border: #f0abe8; /* カードの枠 */

	/* ---- 遺伝子の色＝紫（濃いほう。段G-2・66セッション目） ----
	   上のシナリオ因子と**同じ4つの役割**を持つ（印・文字・地・枠）。

	   **印の体系の考え方**（段G-2 で決めた）:
	     色 … どのカテゴリか。シナリオ因子も遺伝子も「スキルではないもの」で同じ仲間
	           （◆が付くのはスキルではないものだけ、という段A-2 の基準）なので**同系色（紫）**。
	     形 … その中のどれか。シナリオ因子は◆、遺伝子はハート。
	   同系色の中で濃淡を付け、形と合わせて読み分ける。**色域を1つも増やさない**ので、
	   将来また別のカテゴリが増えても形を足すだけで済む。

	   **赤にする案は撤回した**（段G）。実機の凡例で赤が3つ（遺伝子・除外・対象外）並び、
	   小さい印では形より色が先に目に入った。既存の赤との ΔE も 12.8 しか取れず、
	   色域（琥珀・緑・紺・紫・赤・青）が既に埋まっていた。

	   濃さの選び方: ◆ #b02aa8 を基準に濃く／薄くした梯子を実測した。
	   **薄い側は行き止まり** ―― スキルパネルのいちばん濃いところ（#dcdeee）との
	   コントラストが、◆との ΔE が 10 に届く前に 3.0 を切って沈む。
	   **濃い側は十分**で、ΔE 16〜24 を取りながら紺の●（#1d293d）とは 19〜23 離れる。
	   同色相のまま濃くすると下の --uma-catalog-text（#76136f）と ΔE 6.6 まで近づくので、
	   **青紫へ少し寄せて濃く**した。◆との ΔE は 17.5。 */
	--uma-mark-gene: #581c87;   /* ハートの印・凡例のハート（白地に 10.88／スキルパネルの地の
	                               左端 10.52・いちばん濃い右端 8.14） */
	--uma-gene-text: #451270;   /* バッジとカードの文字・結合画像の遺伝子の行
	                               （白地に 13.35／下の地の上で 11.61） */
	--uma-gene-soft: #f4ecfd;   /* バッジとカードの地。**この地の上に置く文字は --uma-gene-text** */
	--uma-gene-border: #d3bcf0; /* カードの枠（地との比 1.49。シナリオ因子側の 1.53 とほぼ同じ） */

	/* ---- 緑スキルの色（emerald） ----
	   「緑スキル」という区分そのものを表す色。印の●（上の --uma-mark-green-skill）と
	   ハイライトの緑カード（emerald-50/200/600/700）が同じ系統を使う。
	   **「操作できる部品は黒」の例外**: 緑スキルの数え方の切り替え（「実質53種（既定）」／
	   「59種個別」）は押せる部品だが、**何を数えるのか＝緑スキル**を色が示しているので、
	   ここの緑で塗る（通知の赤と同じ扱い。2026-09-15・43セッション目）。
	   値は Tailwind v4.1.11 の emerald の実測。

	   **72セッション目・段9 の追加とそのやり直し**: 入口の「緑スキル」のボタンは、
	   **無印（`--uma-green-skill`）を草の芽のアイコンの色にだけ使う。**
	   いったん面・枠・文字の3本で塗る形（`.uma-btn--danger` と同じ組み方）にしたが、
	   **実機で他のボタンより大きく見えた**ので取りやめた（膨張色＋件数の文字でボタン自体が広がった）。
	   ボタンの地・枠・文字は他の入口と同じ黒系統に戻し、**色で名乗るのはアイコン1つだけ**にしてある。 */
	--uma-green-skill: #007a55;        /* emerald-700 : 選択中の地（白文字と 5.36）・未選択の文字 */
	--uma-green-skill-hover: #006045;  /* emerald-800 : 選択中の hover（白文字と 7.61） */
	--uma-green-skill-soft: #ecfdf5;   /* emerald-50  : 未選択の hover の面 */
	--uma-green-skill-border: #a4f4cf; /* emerald-200 : 切り替えを囲む枠 */
	/* 緑スキルの色で塗った地の上に載せる文字（ダークでは地が明るい緑になるので暗い色。C-134） */
	--uma-green-skill-on: #ffffff;
	/* ---- 操作できる部品の色（3ツール共通の黒） ----
	   ボタンの地・枠線だけのボタンの枠と文字・チェック／ラジオ・選択中のタブの下線・
	   選択中を示す枠・右下と引き出しの丸ボタン。**押せるものは色でなく黒**にして、
	   ページごとの色（--uma-accent 系）は見出し・バッジ・装飾の側に回す
	   （2026-09-15・43セッション目に役割で分け直した）。
	   無効（disabled）は黒ではなく灰で「押せない」と示す。 */
	--uma-control: #1c1917;              /* stone-900 : ボタンの地・チェック・文字（白と 17.49） */
	--uma-control-hover: #292524;        /* stone-800 */
	--uma-control-soft: #f5f5f4;         /* stone-100 : hover の面・選択中の淡い地 */
	--uma-control-border: #d6d3d1;       /* stone-300 : 枠線だけのボタンの枠 */
	--uma-control-border-strong: #a8a29e;/* stone-400 : hover で一段濃い枠 */
	--uma-control-disabled: #a8a29e;     /* stone-400 : 無効の文字 */
	--uma-control-disabled-bg: #e7e5e4;  /* stone-200 : 無効の地 */
	/* 操作色の役割（C-144・2026-10-12）。主要な操作＝塗り（--uma-control）、補助的な操作＝枠線のみ（--uma-control-mark）の2段で参照する。
	   ツールごとの値は各ページの :root（ライト）と :root[data-theme="dark"]（ダーク）が持つ。ここの既定は C-143 までの見た目と同じ。
	     --uma-control-text … 塗りの上の文字（ライト・ダークとも白。既定のダークは塗りが明るいので暗い文字のまま）
	     --uma-control-edge … 塗りの縁の色（ダークで塗りが背景に近いとき、明るい縁で浮かせる）
	     --uma-control-rim  … 縁を 2px に見せる外側の 1px の影（1px の枠＋この影で 2px。寸法は変えない。ライトは無し）。
	                         枠の無い部品は inset 0 0 0 1px var(--uma-control-edge) と並べて 2px にする
	     --uma-control-mark … 選択のしるし（タブの下線・ラジオの点・チェックの塗り・選んだ枠）と、枠線だけの操作の線と文字 */
	--uma-control-text: #ffffff;
	--uma-control-edge: var(--uma-control);
	--uma-control-rim: 0 0 0 0 transparent;
	--uma-control-mark: var(--uma-control);
	/* 層の役割（C-144）。ページ／カード／パネル／オプションの4層。既定は C-143 までの見た目と同じ（各ページが :root で上書きする）
	     --uma-card-border … カード（.glass-card）の枠／--uma-panel-bg・--uma-panel-border … カードの中の一段（パネル）
	     --uma-option-border … パネルの中の選べる箱・入力欄の枠／--uma-aux-bg・--uma-aux-border … 補助ボタン（ヘッダーのアイコン・「？」・リセット）
	     --uma-card-shadow … カードの影 */
	--uma-card-border: var(--uma-border);
	--uma-panel-bg: var(--uma-surface-sunken);
	--uma-panel-border: var(--uma-border);
	--uma-option-border: var(--uma-border);
	--uma-aux-bg: var(--uma-surface);
	--uma-aux-border: var(--uma-border);
	--uma-card-shadow: none;

	/* ---- キーボード操作のフォーカス枠 ----
	   黒い部品の上でも輪が見えるように、部品の色とは変えて青にする。3ツール共通。 */
	--uma-focus-ring: #0b6bcb;           /* 白地に 5.28 */

	/* ---- 通知（未読の印） ----
	   行き先を問わず1色。落ち着いた赤で「見ていないものがある」ことだけを示す
	   （2026-09-15・43セッション目。行き先ごとに色を変える案は取りやめた）。 */
	--uma-notify: #c53030;

	/* ---- アクセント（＝そのツールの色。見出し・バッジ・淡い地・枠などの装飾） ----
	   既定は藍。ツールごとに各HTMLの<style>で :root ごと上書きする。
	   「できること」ではなく「何のための画面か」で色を分ける（Deck=評価/比較、Star=読取/登録）。
	   **操作できる部品には使わない**（そちらは上の --uma-control 系）。 */
	--uma-accent: #4f39f6;           /* indigo-600 : 主ボタンの地 */
	--uma-accent-hover: #432dd7;     /* indigo-700 */
	--uma-accent-soft: #eef2ff;      /* indigo-50  : 淡い面 */
	--uma-accent-soft-text: #432dd7; /* indigo-700 : 淡い面の上の文字 */
	--uma-accent-border: #c6d2ff;    /* indigo-200 */
	--uma-accent-ring: #4f39f6;      /* フォーカス輪郭 */

	/* ---- UmaSkill Deck の色 ----
	   「Deck 行き」を示す色。Deck 単独ページの :root と、special / exam の .deck-accent スコープが
	   --uma-accent 系へ写像して使う。ここを変えれば3ツールの Deck の色が一度に変わる。
	   special の緑とも exam の青とも重ならないよう、濃いめの暖かいグレー（stone 系）。
	   薄いグレーは「無効・★0・未選択」の表現（slate-100/300/400）と見分けがつかないので採らない
	   （exam-ui-analysis.md B-2 / B-3 の案B）。
	   【2026-09-15・43セッション目】一度この6行を赤紫（fuchsia）に変えたが、実機で見て**元の暖かい
	   グレーに戻した**。操作できる部品が黒に揃ったので、Deck の色は「行き先の合図」に徹する。
	   値は Tailwind v4.1.11 の stone の実測。 */
	--uma-deck-accent: #44403b;         /* stone-700 : 見出し・アイコン・タブの帯 */
	--uma-deck-accent-hover: #292524;   /* stone-800 */
	--uma-deck-accent-soft: #e7e5e4;    /* stone-200 : 淡い面（計バッジ・候補名チップ・選択中タブ） */
	--uma-deck-accent-soft-text: #292524; /* stone-800 : 淡い面の上の文字 */
	--uma-deck-accent-border: #a6a09b;  /* stone-400 */
	--uma-deck-accent-ring: #44403b;    /* stone-700 : フォーカス輪郭 */

	/* ---- 結合画像（琥珀）の色 ----
	   「結合画像」の**印**（右下のボタン群の2項目のアイコンの丸・設定パネルの見出しのアイコン）
	   だけに使う。操作できる部品（チェック・主ボタン・「画像を更新」・丸ボタン）には使わない
	   ＝そちらは --uma-control の黒。
	   基調は白地とのコントラストが 3.19 しかないので、**この地の上に白い文字は載せない**
	   （載せてよいのは大きめの白いアイコンまで）。文字を載せる面は必ず淡い地（-soft）の側。 */
	--uma-stitch-accent: #d97706;       /* amber-600 : 見出しのアイコン */
	--uma-stitch-soft: #fef3c6;         /* amber-100 : 淡い面 */
	--uma-stitch-soft-text: #973c00;    /* amber-800 : 淡い面の上の文字・アイコン（6.36） */

	/* ---- サポートカードの種類の色（typeOrder の番号で引く） ----
	   ゲーム内で種類ごとに使われている色に寄せた、**文字を載せる欄のための調整版**
	   （地は淡く、文字は濃く。左の罫線だけ本来の色に近い濃さ）。
	   **どの番号がどの種類かは、ここにもコードにも書かない**（恒久ルール1）。番号は
	   収録データ（サポートカードの `typeOrder`＝ゲーム内で扱われる順番）に従い、
	   使う側は `var(--uma-card-type-<番号>-bg)` のように番号で引く。定義の無い番号は
	   使う側の fallback（既定の面の色）に落ちるので、種類が増えてもここに足すだけでよい。
	   値は Tailwind v4.1.11 の各パレットの -100 / -300 / -800（F-19）。
	   文字（-800）は地（-100）の上で 6.4〜7.2（実測。AA の 4.5:1 は全部満たし、AAA の 7:1 は 1 だけ。C-51 の11節）。
	   2026-09-18・54セッション目に、編成パネルの選択済みカードの欄のために新設。 */
	--uma-card-type-1-bg: #dbeafe;     --uma-card-type-1-border: #8ec5ff; --uma-card-type-1-text: #193cb8; /* 青 */
	--uma-card-type-2-bg: #ffe2e2;     --uma-card-type-2-border: #ffa2a2; --uma-card-type-2-text: #9f0712; /* 赤 */
	--uma-card-type-3-bg: #ffedd4;     --uma-card-type-3-border: #ffb86a; --uma-card-type-3-text: #9f2d00; /* 橙 */
	--uma-card-type-4-bg: #fce7f3;     --uma-card-type-4-border: #fda5d5; --uma-card-type-4-text: #a3004c; /* 桃 */
	--uma-card-type-5-bg: #dcfce7;     --uma-card-type-5-border: #7bf1a8; --uma-card-type-5-text: #016630; /* 緑 */
	--uma-card-type-6-bg: #fef9c2;     --uma-card-type-6-border: #ffdf20; --uma-card-type-6-text: #894b00; /* 黄 */

	/* ---- ①②の帯・②の設定の枠・まとまり（段9・C-121） ----
	   core の .usd-bandbox などが読む。special.html の <style> にあったものを、Deck の引き出し・Deck 単体でも
	   同じ値になるようにここへ移した（C-134 段2。値は core の var() のフォールバックと同じなので、
	   これまで変数が無かった Deck でもライトの見た目は変わらない）。 */
	--uma-band: #e9eef6;        /* ①②の「Pt／種」の薄い帯の地 */
	--uma-dash: #b9c2d0;        /* ②の設定の枠の破線（アイコンの無い丸の破線も同じ色） */
	--uma-group-bg: #ffffff;    /* ②のスキルのまとまりの面 */
	--uma-group-line: #cad5e2;  /* その枠の線 */
	--uma-config-bg: #f8fafc;   /* ②の設定の枠（破線）の地 */

	/* ---- 画面の骨格（css/shell.css が読む。C-134 段2 で直書きから変数へ） ---- */
	--uma-drawer-bg: #f5f6fb;                                /* 引き出しの地 */
	--uma-scrim: rgba(15, 23, 42, .45);                      /* 引き出し・ダイアログの背景の暗転 */
	--uma-drawer-shadow: -8px 0 32px rgba(15, 23, 42, .25);  /* 引き出しの影 */
	/* ---- トースト・色の付いた地の上の白い文字（C-134 段3） ----
	   ライトでは各ページの Tailwind のクラス（bg-slate-900 text-white border-slate-700）が描くので、ここの値は
	   ダークの規則（css/common.css の末尾）だけが読む。ライトの値はそのクラスの色と同じにしてある。 */
	--uma-text-on-color: #ffffff;  /* 色の付いた地（緑・青・赤のボタン、トースト）の上の白い文字。ダークでも白 */
	--uma-toast-bg: #0f172b;       /* トーストの地（slate-900）。ダークでも暗いまま（決定7） */
	--uma-toast-border: #314158;   /* トーストの縁（slate-700）。ダークでは明るい細い枠にする */
	--uma-symbol-faint: #cad5e2;   /* わざと淡くした記号（★の空き・「−」。Tailwind の text-slate-300）。ダークでは記号として 3:1 を保つ */

	/* ---- 余白（4pxを単位とする刻み。1/3/7/9pxのような孤立値は使わない） ---- */
	--uma-sp-0-5: 2px;
	--uma-sp-1: 4px;
	--uma-sp-1-5: 6px;
	--uma-sp-2: 8px;
	--uma-sp-2-5: 10px;
	--uma-sp-3: 12px;
	--uma-sp-3-5: 14px;
	--uma-sp-4: 16px;
	--uma-sp-5: 20px;
	--uma-sp-6: 24px;

	/* ---- 文字サイズ（行間とセット。同じ字送りが2種類生まれないようにする） ---- */
	--uma-fs-2xs: 10px;  --uma-lh-2xs: 14px;
	--uma-fs-xs: 11px;   --uma-lh-xs: 16px;
	--uma-fs-sm: 12px;   --uma-lh-sm: 16px;   /* 基準 */
	--uma-fs-md: 14px;   --uma-lh-md: 20px;
	--uma-fs-lg: 18px;   --uma-lh-lg: 24px;
	--uma-fs-xl: 24px;   --uma-lh-xl: 32px;

	/* ---- 角丸 ---- */
	--uma-r-sm: 6px;
	--uma-r-md: 8px;
	--uma-r-lg: 12px;   /* 既定 */
	--uma-r-xl: 16px;   /* カード */
	--uma-r-full: 999px;

	/* ---- 影（3段。面は最小限、浮遊要素だけ強く） ---- */
	--uma-shadow-1: 0 1px 2px 0 rgba(0, 0, 0, .05);
	--uma-shadow-2: 0 4px 6px -1px rgba(0, 0, 0, .1), 0 2px 4px -2px rgba(0, 0, 0, .1);
	--uma-shadow-3: 0 20px 25px -5px rgba(0, 0, 0, .1), 0 8px 10px -6px rgba(0, 0, 0, .1);

	/* ---- 等幅フォント（OCRの生文字列・JSONなど、字形の区別が必要な場所） ---- */
	--uma-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

	/* ---- 演出 ---- */
	--uma-transition: 160ms cubic-bezier(.16, 1, .3, 1);

	/* ---- カードの内側余白（狭い画面では詰める） ---- */
	--uma-card-pad: 16px;
}

@media (min-width: 768px) {
	:root { --uma-card-pad: 24px; }
}

/* ============================================================
 * スコープ
 * 「この中だけ別のアクセント」を作るためのクラス。値だけなのでここに置く。
 * ============================================================ */

/* UmaSkill Deck の色を局所的に当てるスコープ。
   .btn-deck-accent はボタン用の古い名前で、中身は同じ。ボタン以外にも使うので
   .deck-accent を足してある。special / exam の「Deck 行き」のボタン・FAB の項目・
   取り込み案内・Deck の引き出しが使う。値は上の --uma-deck-* から引く（ここには書かない）。 */
.btn-deck-accent, .deck-accent {
	--uma-accent: var(--uma-deck-accent);
	--uma-accent-hover: var(--uma-deck-accent-hover);
	--uma-accent-soft: var(--uma-deck-accent-soft);
	--uma-accent-soft-text: var(--uma-deck-accent-soft-text);
	--uma-accent-border: var(--uma-deck-accent-border);
	--uma-accent-ring: var(--uma-deck-accent-ring);   /* これが無いとフォーカスの輪だけ
	                                                    ページのアクセントのまま残って浮く */
}

/* ============================================================
 * ダーク（C-134・2026-10-07）
 *
 * <html data-theme="dark"> のときだけ、上の色の変数を同じ名前のまま差し替える。属性は js/theme.js が付ける
 * （利用者が選んだときだけ。段7 までは OS の設定には従わない）。**ライトの値は1つも変えていない。**
 * 基調は青黒（地 #0f1318・面 #171d26。決定6）で、special・exam・Deck の3ツールで同じ。
 * ツールごとの色味（special の緑・exam の青・Deck の暖灰）は暗い面には残さず、アクセントや
 * 意味を持つ色（印・種類・状態）だけを、色相を保って明るい側へ寄せる（dark-mode-step0.md §6）。
 * 結合画像・結果画像の canvas は、ここを通らずに常にライトの値で焼き込む（決定4。各ページの readTokenLight）。
 * 値は special.html の <style> にあった足場（段9・C-121 の37個）を引き継ぎ、残りを足した。
 *
 * **セレクタは :root:where([data-theme="dark"])（詳細度は :root と同じ）。** 各ページの <style> が :root で
 * 持つ自前の値（special の緑のアクセント・exam の青の段・Deck の地など）は、このファイルより後に読まれるので
 * ダークでもそちらが勝つ。**ページ固有の色のダークは、そのページが :root[data-theme="dark"] で持つ。**
 * ここを :root[data-theme="dark"] にすると、ページのアクセントが既定の藍に塗り替わってしまう。
 * ============================================================ */
:root:where([data-theme="light"]) { color-scheme: light; }
:root:where([data-theme="dark"]) {
	/* ブラウザ自身が描く部品（select の選択肢・スクロールバー・日付の入力）も暗くする */
	color-scheme: dark;

	/* ---- 面 ---- */
	--uma-surface: #171d26;
	--uma-glass-bg: rgba(23, 29, 38, .92);
	--uma-surface-sunken: #1c2430;
	--uma-surface-muted: #263041;
	--uma-surface-group: #263041;
	--uma-surface-inverse: #e2e8f0;
	--uma-page-ground: #0f1318;      /* ページの地（各ページの body がダークで使う） */

	/* ---- 文字 ---- */
	--uma-text: #e2e8f0;
	--uma-text-heading: #f1f5f9;
	--uma-text-muted: #cbd5e1;
	--uma-text-subtle: #aab6c8;
	--uma-text-faint: #8f9cb0;
	--uma-text-inverse: #0f1318;

	/* ---- 罫線 ---- */
	--uma-border: #2a3441;
	--uma-border-strong: #3b4555;

	/* ---- 状態色 ---- */
	--uma-success: #5ad28c;
	--uma-success-bg: #12301f;
	--uma-success-text: #8be3ac;
	--uma-warn-bg: #2f2510;
	--uma-warn-border: #6a5214;
	--uma-warn-text: #f6c453;
	--uma-danger-bg: #3a1c1f;
	--uma-danger-border: #6b2d33;
	--uma-danger-text: #ff9a9a;
	/* ★の実数（橙）は暗い面の上でも読めるので変えない。空きはライトの slate-300 だと暗い面で明るすぎて
	   「空き」に見えないので、暗い灰へ */
	--uma-star-empty: #7a869b;

	/* ---- 印の色（形が主・色は補助。色相はそのままで明るい側へ） ---- */
	--uma-mark-tier-1: #ff7070;
	--uma-mark-tier-2: #6aa8ff;
	--uma-mark-tier-3: #9aa4b3;

	/* ---- スキルパネル ---- */
	--uma-skillpanel-bg: linear-gradient(90deg, #1f2733 0%, #27303f 46%, #2f3a4c 100%);
	--uma-skillpanel-border: #3b4555;
	--uma-skillpanel-shadow: none;

	/* ---- 表 ---- */
	--uma-table-rule: #2a3441;
	--uma-table-rule-strong: #3b4555;
	--uma-table-head-bg: #263041;
	--uma-table-col-alt: #1c2430;
	--uma-table-col-key: #22304a;

	/* ---- シナリオ因子（紫）・遺伝子（濃い紫） ---- */
	--uma-mark-catalog: #e57ad9;
	--uma-catalog-text: #f2a8ea;
	--uma-catalog-soft: #35172f;
	--uma-catalog-border: #6b2b63;
	--uma-mark-gene: #a08aff;
	--uma-gene-text: #d6bcf8;
	--uma-gene-soft: #251a3a;
	--uma-gene-border: #4c3a70;

	/* ---- 緑スキル ---- */
	--uma-green-skill: #34d399;
	--uma-green-skill-hover: #6ee7b7;
	--uma-green-skill-soft: #10291f;
	--uma-green-skill-border: #1f5a43;
	--uma-green-skill-on: #0f1318;

	/* ---- 操作できる部品（ダークでは明るい灰。上に載る文字は --uma-text-inverse の暗い色） ---- */
	--uma-control: #e2e8f0;
	--uma-control-hover: #f1f5f9;
	--uma-control-soft: #263041;
	--uma-control-border: #3b4555;
	--uma-control-border-strong: #52607a;
	--uma-control-disabled: #6b778b;
	--uma-control-disabled-bg: #222a35;
	--uma-control-text: #0f1318;   /* 既定のダークは塗りが明るい灰なので暗い文字（C-144 のツールの値では白） */

	--uma-focus-ring: #6aa8ff;
	--uma-notify: #ff6464;

	/* ---- アクセント（既定の藍。ツールのページは各HTMLが上書きする） ---- */
	--uma-accent: #8b7dff;
	--uma-accent-hover: #a59bff;
	--uma-accent-soft: #221f45;
	--uma-accent-soft-text: #b8b0ff;
	--uma-accent-border: #3d3780;
	--uma-accent-ring: #8b7dff;

	/* ---- Deck の色（暖灰の色相を保って明るい側へ。淡い面は青黒の面） ---- */
	--uma-deck-accent: #d6d3d1;
	--uma-deck-accent-hover: #e7e5e4;
	--uma-deck-accent-soft: #263041;
	--uma-deck-accent-soft-text: #e7e5e4;
	--uma-deck-accent-border: #57534e;
	--uma-deck-accent-ring: #d6d3d1;

	/* ---- 結合画像（琥珀） ---- */
	--uma-stitch-accent: #f5a524;
	--uma-stitch-soft: #33270f;
	--uma-stitch-soft-text: #f6c453;

	/* ---- サポートカードの種類（地は暗く・文字は明るく・左の罫線は中間） ---- */
	--uma-card-type-1-bg: #172a4a;     --uma-card-type-1-border: #3b6fb8; --uma-card-type-1-text: #a9c9ff;
	--uma-card-type-2-bg: #3a1a1d;     --uma-card-type-2-border: #a3474d; --uma-card-type-2-text: #ffb3b3;
	--uma-card-type-3-bg: #3a2412;     --uma-card-type-3-border: #b0662a; --uma-card-type-3-text: #ffc48a;
	--uma-card-type-4-bg: #3a1a2c;     --uma-card-type-4-border: #a8457a; --uma-card-type-4-text: #ffb0d8;
	--uma-card-type-5-bg: #12301f;     --uma-card-type-5-border: #2f8f57; --uma-card-type-5-text: #8be3ac;

/* css/common.css */
/* ============================================================
 * Uma Tools 共通スタイル — 2/3 共通部品（css/common.css）
 *
 * special.html / uma-skill-deck.html / card-event-input.html / exam.html で共有する。
 * **exam.html も 59セッション目（C-60）から読む**（それまでは tokens.css と shell.css だけで、
 * ここには「exam は読まない」と書いてあったが、実態と合わなくなっていた。2026-09-20 に直した）。
 *
 * ここに置くもの:
 *   全ツールで同じ形であるべき共通部品（ボタン・入力欄・バッジ・カード）
 * ここに置かないもの:
 *   デザイントークン（css/tokens.css）、画面の骨格（css/shell.css）、
 *   各画面固有のレイアウトと、その画面にしか出てこない要素の装飾。
 *   判断基準は「片方だけ変えたくなる可能性があるか」。あるなら共通化しない。
 *
 * ---- カスケードについての重要な前提 ----
 * Tailwind v4（browser版）はユーティリティを @layer utilities に入れる。
 * CSSのカスケードレイヤー規則では「レイヤーに属さない指定」がレイヤー付きより
 * 強いため、このファイルの素のクラスセレクタは Tailwind ユーティリティに勝つ。
 * 読み込み順は  tokens.css → common.css → shell.css → Tailwind → 各HTMLの<style>  であり、
 *   共通の土台 → ユーティリティ → ページ固有の上書き
 * という三層になる。したがって !important は不要。
 *
 * 逆に、このファイルに要素セレクタ（button {} など）で装飾を書くと、
 * 既存のユーティリティ指定を一括で無効化してしまう。装飾はクラスセレクタで書く。
 * 要素セレクタを使ってよいのは body の基本色など「継承の起点」だけ。
 *
 * ---- 色の値について ----
 * 色・寸法はすべて css/tokens.css のトークン経由で参照する。hex を直書きしない。
 * ============================================================ */

:root {
	/* 版数の印。tokens.css の --common-css-version と同じ文字列にする
	   （run-verify.mjs が一致を検査し、各ページも起動時に照合する）。 */
	--uma-components-css-version: "2026-10-13a";
}

/* ============================================================
 * 基礎
 * ============================================================ */

/* 基本の文字色。継承の起点なので要素セレクタで置く。
   （uma-skill-deck.html は指定が無く、ブラウザ既定の黒のままだった） */
body {
	color: var(--uma-text);
}

/* キーボード操作時のフォーカス。黒い部品の上でも見えるよう、部品の色とは変えて青
   （--uma-focus-ring）。3ツール共通（2026-09-15・43セッション目）。 */
:focus-visible {
	outline: 2px solid var(--uma-focus-ring);
	outline-offset: 2px;
	border-radius: var(--uma-r-sm);
}

@media (prefers-reduced-motion: reduce) {
	* { scroll-behavior: auto !important; }
	.uma-btn, .uma-icon-btn, .uma-pill, .uma-input { transition: none; }
}

/* 共通部品と「隠す指定」の衝突を防ぐ。
   共通部品は display を指定するが、このファイルはレイヤーに属さないため、
   Tailwind の .hidden（@layer utilities）や hidden 属性のUA既定より強くなってしまう。
   放置すると「hidden を付けたのに消えない」事故になるので、詳細度で明示的に負かす。
   （!important は使わない。§詳細度の設計で解決する） */
.uma-btn.hidden, .uma-btn[hidden],
.uma-icon-btn.hidden, .uma-icon-btn[hidden],
.uma-pill.hidden, .uma-pill[hidden],
.uma-input.hidden, .uma-input[hidden],
.uma-badge.hidden, .uma-badge[hidden],
.uma-list-row.hidden, .uma-list-row[hidden] {
	display: none;
}

/* Tailwind を読み込めなかったときの保険。
   Tailwind が無いと `hidden` クラスが何も指定しないクラスになり、
   隠れているべき要素（エラー表示・他タブの中身など）が全部見えてしまう。
   読み込みに成功した時点で各ページのJSが <html> に .uma-tw-ready を付けるので、
   通常時この規則は無効になり、既存の挙動（例：hidden と sm:inline の併記で
   広い画面だけ表示する）は一切変わらない。 */
html:not(.uma-tw-ready) .hidden { display: none; }

/* ============================================================
 * カード
 * 両ツールに同名で存在していたものを、ここに一本化する。
 * ============================================================ */
.glass-card {
	background: var(--uma-glass-bg);
	backdrop-filter: var(--uma-glass-blur);
	border: 1px solid var(--uma-card-border);
	border-radius: var(--uma-r-xl);
	padding: var(--uma-card-pad);
}

/* 一覧の行。カードより情報密度が高く、押せることがある。
   （uma-skill-deck.html の .list-card と core.js の .usd-list-card が
     衝突回避のためだけに同じ定義を二重に持っていたものを一本化した） */
.uma-list-row {
	display: flex;
	align-items: center;
	gap: var(--uma-sp-3);
	padding: var(--uma-sp-3) var(--uma-sp-4);
	border: 1px solid var(--uma-border);
	border-radius: var(--uma-r-lg);
	background: var(--uma-surface);
	margin-bottom: var(--uma-sp-2);
}
.uma-list-row--selectable {
	cursor: pointer;
	transition: border-color var(--uma-transition), background-color var(--uma-transition);
}
.uma-list-row--selectable:hover {
	border-color: var(--uma-border-strong);
	background: var(--uma-surface-sunken);
}
/* 選んでいる行。選択は操作の結果なので、ページの色ではなく操作の色（黒）で示す */
.uma-list-row--selected {
	border-color: var(--uma-control-mark);
	background: var(--uma-control-soft);
}

/* ============================================================
 * ボタン
 *   既定 = 12px / 600 / 角丸12px
 *   --primary   塗り（そのツールのアクセント）
 *   --secondary 白地＋罫線
 *   --ghost     文字だけ
 *   --danger    まとめて消す操作（淡い赤地＋赤い文字）
 *   --lg        主要導線用の大きいボタン
 * ============================================================ */
.uma-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--uma-sp-1-5);
	padding: var(--uma-sp-2-5) var(--uma-sp-4);
	border: 1px solid transparent;
	border-radius: var(--uma-r-lg);
	background: transparent;
	font-size: var(--uma-fs-sm);
	line-height: var(--uma-lh-sm);
	font-weight: 600;
	color: var(--uma-text-heading);
	cursor: pointer;
	transition: background-color var(--uma-transition), border-color var(--uma-transition), color var(--uma-transition), box-shadow var(--uma-transition);
}

.uma-btn:active { scale: .99; }

.uma-btn:disabled,
.uma-btn[disabled] {
	opacity: .4;
	cursor: not-allowed;
	box-shadow: none;
	scale: 1;
}

/* 主ボタン。押せるものは3ツールとも黒（--uma-control）。ページの色は装飾の側で使う */
.uma-btn--primary {
	background: var(--uma-control);
	border-color: var(--uma-control-edge);
	color: var(--uma-control-text);
	box-shadow: var(--uma-control-rim), var(--uma-shadow-2);
}
.uma-btn--primary:hover:not(:disabled) { background: var(--uma-control-hover); }

.uma-btn--secondary {
	background: var(--uma-aux-bg);
	border-color: var(--uma-aux-border);
	color: var(--uma-text-heading);
	box-shadow: var(--uma-shadow-1);
}
.uma-btn--secondary:hover:not(:disabled) {
	border-color: var(--uma-border-strong);
	background: var(--uma-surface-sunken);
}

.uma-btn--ghost { color: var(--uma-text-subtle); }
.uma-btn--ghost:hover:not(:disabled) {
	background: var(--uma-surface-muted);
	color: var(--uma-text-heading);
}

/* 実行系だが、そのツールの主役ではない操作（解析する・元に戻す 等）。
   アクセントを使うと主要導線と競合するため、無彩色で塗る。 */
.uma-btn--neutral {
	background: var(--uma-control);
	border-color: var(--uma-control-edge);
	color: var(--uma-control-text);
	box-shadow: var(--uma-control-rim);
}
.uma-btn--neutral:hover:not(:disabled) { background: var(--uma-control-hover); }

/* 主ボタンと同じ系統だが一段弱い扱い（並記される第2の実行ボタン）。
   枠と文字は黒、面だけ白のまま。 */
.uma-btn--accent-outline {
	background: var(--uma-surface);
	border-color: var(--uma-control-mark);
	color: var(--uma-control-mark);
}
.uma-btn--accent-outline:hover:not(:disabled) { background: var(--uma-control-soft); }

/* まとめて消す・元に戻しにくい操作。**押せるときだけ赤く名乗る**（70セッション目・段1）。
   **文字だけ赤くする（--ghost の色替え）ではなく面を塗る。** disabled は .uma-btn の
   opacity:.4 で薄くなるので、文字だけ赤だと薄赤になって、隣に並ぶ灰色の文字ボタンと
   見分けが付かなくなる。面で塗れば、押せない状態も「薄い赤の札」としてはっきり別物に見える。
   色は tokens.css の --uma-danger-*（.uma-help-box--alpha ・ shell.css の注意の箱と同じ3本）。 */
.uma-btn--danger {
	background: var(--uma-danger-bg);
	border-color: var(--uma-danger-border);
	color: var(--uma-danger-text);
}
.uma-btn--danger:hover:not(:disabled) { background: var(--uma-danger-border); }

.uma-btn--lg {
	padding: var(--uma-sp-3-5) var(--uma-sp-4);
	font-size: var(--uma-fs-md);
	line-height: var(--uma-lh-md);
	font-weight: 700;
}

/* アイコンだけのボタン */
.uma-icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: var(--uma-sp-1-5);
	border: none;
	border-radius: var(--uma-r-md);
	background: transparent;
	color: var(--uma-text-subtle);
	cursor: pointer;
	transition: background-color var(--uma-transition), color var(--uma-transition);
}
.uma-icon-btn:hover:not(:disabled) {
	background: var(--uma-surface-muted);
	color: var(--uma-text-heading);
}
.uma-icon-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ============================================================
 * 補助説明を隠す「?」と、隠したものを開く文字ボタン（C-52）
 *
 * 常時出すほどではない説明は、見出しの脇の丸い「?」の中に入れ、押したときだけ
 * その直下に .uma-help-box をインラインで出す。ホバー依存のツールチップにしない
 * （タッチ端末で出せない）。別の層（ポップオーバー・ダイアログ）にもしない。
 * **例外（C-2c）**: 中身が文ではなく**何十行かの一覧**のときだけ、ミニウィンドウで開く。
 * ②の B・C の「?」（因子24種・遺伝子10種の一覧）がこれで、インラインに出すと
 * その下の中身を画面外へ押し出してしまう。押して選ぶものではない（見るだけ）。
 * 説明ではなく一覧（項目の列挙）や状態の注記を隠すときは「?」ではなく .uma-disclose
 * （押した先が分かる語の文字ボタン。押した状態は塗りつぶし）。色は --uma-disclose-color で
 * 文脈に合わせる（既定は通知・注意の赤）。
 * どちらも aria-expanded を付け、開閉は JS が hidden 属性で行う。
 * 2026-09-18（54セッション目）に special.html と js/uma-skill-deck-core.js から移した
 * （2か所目が出たので共通部品にした）。
 * ============================================================ */
.uma-help-btn {
	display: inline-flex; align-items: center; justify-content: center;
	width: 22px; height: 22px; padding: 0;
	border: 1px solid var(--uma-aux-border); border-radius: var(--uma-r-full);
	background: var(--uma-aux-bg); color: var(--uma-text-heading);
	font: inherit; font-size: var(--uma-fs-sm); font-weight: 700; line-height: 1; cursor: pointer;
}
.uma-help-btn:hover { background: var(--uma-surface-muted); }
.uma-help-btn[aria-expanded="true"] {
	background: var(--uma-accent-soft); border-color: var(--uma-accent); color: var(--uma-accent-soft-text);
}
.uma-help-box {
	margin: 0; padding: var(--uma-sp-2) var(--uma-sp-3);
	border: 1px solid var(--uma-border-strong); border-radius: var(--uma-r-sm);
	background: var(--uma-surface-sunken);
	font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); color: var(--uma-text);
}
.uma-help-box[hidden] { display: none; }
/* αテスト中であることの常時表示の注記（C-62 の (4)・段F）。告知ダイアログは一度閉じると
   出ないので、作りかけの機能にはこちらを使う。色は注意の赤（tokens.css の --uma-danger-*）。
   **2ページ目が出たので共通部品にした**（special の #deck-roster-alpha と exam の遺伝子の行。
   C-62 の (9) で shell.css へ移したのと同じ運び）。special 側の .deck-panel-note は
   あのパネルの余白の都合なので、あちらに残す。 */
.uma-help-box--alpha {
	border-color: var(--uma-danger-border); background: var(--uma-danger-bg); color: var(--uma-danger-text);
}
.uma-disclose {
	--uma-disclose-color: var(--uma-danger-text);
	font: inherit; font-size: var(--uma-fs-xs); line-height: var(--uma-lh-xs);
	padding: 1px var(--uma-sp-2);
	border: 1px solid var(--uma-disclose-color); border-radius: var(--uma-r-full);
	background: transparent; color: var(--uma-disclose-color); cursor: pointer;
}
.uma-disclose[aria-expanded="true"] { background: var(--uma-disclose-color); color: var(--uma-text-inverse); }

/* ============================================================
 * 節（見出し＋中身。C-2a）
 *
 * 1つの画面の中を意味のまとまりに分ける。見出しは <p>、畳めるようにするときだけ
 * <button> ＋ aria-expanded にして、中身を hidden 属性で開閉する。
 * **いまは畳める節が無い**（C-2a で入れた B・C は C-2c で1行に畳んだ）。畳む必要が出たら
 * <button> にして、開閉の向きを示す印はそのときに足す。
 * **.uma-disclose とは役割が違う** ―― あちらは「一覧をちょっと開く」小さな文字ボタンで、
 * 赤い丸ピル1個ぶんの大きさしかない。こちらは節そのものの見出しで、横幅いっぱいに置く。
 *
 * **見出しと中身の間（8px）は、中身どうしの間（12px）より詰める。** 同じ間隔だと、
 * 見出しがどの節のものか読み取れない。
 * **枠で囲う `.uma-section--framed` では 0px**（出っ張りが枠に接する）＝もっと強く結びつける。下の節を読むこと。
 * ============================================================ */
.uma-section { display: flex; flex-direction: column; gap: var(--uma-sp-2); }
.uma-section-head {
	display: flex; align-items: center; gap: var(--uma-sp-1-5);
	margin: 0; padding: 0; border: 0; background: transparent; text-align: left;
	font: inherit; font-size: var(--uma-fs-xs); line-height: var(--uma-lh-xs);
	font-weight: 600; letter-spacing: .02em; color: var(--uma-text-subtle);
}
button.uma-section-head { cursor: pointer; }
button.uma-section-head:hover { color: var(--uma-text-heading); }
/* 畳める節の向きの印（72セッション目・段11 ⑩）。上の「畳む必要が出たら <button> にして、
   開閉の向きを示す印はそのときに足す」がこれ。**開いているとき下向き／閉じていると右向き。**
   印そのもの（lucide の chevron-down）は使う側が置く。ここは向きだけを受け持つ。 */
.uma-section-caret { transition: transform var(--uma-transition); }
.uma-section-head[aria-expanded="false"] .uma-section-caret { transform: rotate(-90deg); }
.uma-section-body { display: flex; flex-direction: column; gap: var(--uma-sp-3); }
.uma-section-body[hidden] { display: none; }

/* ============================================================
 * 枠で囲った節と、その上の並びの行（段K）
 *
 * **「この枠は、並んでいるうちのどれのものか」を形で示す**ための一組。
 * 節の中身を枠で囲い、見出しをその枠の**左上に接する出っ張り**にして、
 * 同じ行に**同じ層の別の選択肢**（special の②なら「☑ シナリオ因子 ?」「☑ 遺伝子 ?」）を並べる。
 *
 *   ┌ スキルセット ┐  ☑ シナリオ因子 ?   ☑ 遺伝子 ?
 *   ├──────────────┴──────────────────────────────┐
 *   │ 条件でスキルを検索 …                          │
 *
 * **なぜ出っ張りにするか**: 3つを同じ行に並べただけだと、枠が3つ全部のものに見える
 * （実際に並べて確かめた）。出っ張りが枠に接していると、どれのものかが一意に読める。
 *
 * **影は付けない。** special の②はすでに .glass-card の中で、これはその中のもう一段の枠。
 * 影を付けると層が深く見えて関係が読みにくくなる（.uma-help-box など既存の枠も影を持たない）。
 *
 * **72セッション目・段11 ⑨ で、枠線をやめて「わずかなグレーの面」に変えた。**
 * 出っ張りと中身が**同じ面の色（--uma-surface-group）**で繋がっていることだけで、
 * 上の「どれのものか」を示す。**2か所の background は必ず同じ値にすること。**
 * （それ以前は、白い面＋1pxの枠で、出っ張りの下で枠の上辺を消す作りだった。
 *   .glass-card の地が rgba(255,255,255,.9) なので、白い箱が白い地に乗っていて
 *   領域の見分けが線1本に頼っていた。）
 *
 * **並びの行そのものは折り返さない**（flex-wrap: nowrap）。折り返すと出っ張りが枠から離れて宙に浮く。
 * 入りきらないぶんは中の器（core の .usd-tm-scopes）の中だけで折り返すので、
 * **幅によって左右の並び順が入れ替わることが無い。**
 * ============================================================ */
.uma-section--framed {
	/* 出っ張りの高さ。文字の行 ＋ 上下の余白 ＋ 枠線。**値は書かずトークンから出す** */
	--uma-section-tab-h: calc(var(--uma-lh-md) + var(--uma-sp-1-5) * 2 + 2px);
	/* 広い幅の横の間隔。狭い幅では下の @media で詰める */
	--uma-section-row-gap: var(--uma-sp-6);
	gap: 0;   /* 出っ張りが枠に接する（.uma-section の 8px は空けない） */
}
/* **72セッション目・段11 ⑨: 枠線をやめ、わずかなグレーの面に変えた。**
   それまでは白い面＋1pxの枠で、**.glass-card の白い地の上に白い箱**が乗っている状態だった
   （境目は 1px の線だけ）。面に色を付けると、線を引かなくても「ここからここまで」が読める。
   色は `--uma-surface-group`（slate-200）。**最初は slate-50 にしたが、実機で
   「周りのカードとの差がほとんど無い」と指摘された** ―― 囲む相手が半透明の .glass-card なので、
   周りの実際の画素は真っ白ではなく、slate-50 との色差（ΔE）は 1.7〜2.2 しか出ていなかった
   （＝並べても見分けが付かない範囲）。いまは 8.5〜9.4。値の根拠は css/tokens.css の
   --uma-surface-group のコメント。**差そのものを run-smoke が見張っている。**
   **出っ張りも同じ色にする**（下の .uma-section-row > .uma-section-head）。
   枠を無くしたので、**札と枠の一体感は色の一致だけで保つ** ―― 段K の狙い
   （「この枠は並んでいるうちのどれのものか」）は、同じ色の面が繋がって見えることで残る。 */
.uma-section--framed > .uma-section-body {
	background: var(--uma-surface-group);
	/* 左上だけ角を立てる（出っ張りがそこに接するため） */
	border-radius: 0 var(--uma-r-lg) var(--uma-r-lg) var(--uma-r-lg);
	padding: var(--uma-sp-3);
}
.uma-section-row {
	display: flex; flex-wrap: nowrap; align-items: flex-end;
	column-gap: var(--uma-section-row-gap);
}
/* 出っ張り。同じ行に並ぶ選択肢の中でこれが主役なので、**一段大きい字**にする。
   **72セッション目・段11 ⑨: 枠線をやめ、面を下の本体と同じ `--uma-surface-group` にした。**
   枠が無くなったので、**札と本体は色が一致していることだけで地続きに見える** ――
   ここと `.uma-section--framed > .uma-section-body` の `background` は**必ず同じ値**にすること
   （片方だけ変えると札が浮いて、段K の「どの枠のものか」が読めなくなる）。
   枠線を消したぶん高さが 2px 縮むので、`--uma-section-tab-h`（枠線ぶんの +2px を含む）と
   `margin-bottom: -1px`（枠の上辺を消すためのもの）も要らなくなったが、
   **行は下ぞろえで、並ぶチェックの高さもこの変数に揃えている**ので、
   高さの定義はそのまま残す（見た目の段差を作らないため）。 */
.uma-section-row > .uma-section-head {
	flex: none; box-sizing: border-box; justify-content: center;
	min-height: var(--uma-section-tab-h);
	padding: 0 var(--uma-sp-3);
	font-size: var(--uma-fs-md); line-height: var(--uma-lh-md);
	letter-spacing: 0; color: var(--uma-text);
	background: var(--uma-surface-group);
	border-radius: var(--uma-r-md) var(--uma-r-md) 0 0;
	position: relative; z-index: 1;
}
/* 並ぶ側のチェックは出っ張りと同じ高さにする（行は下ぞろえなので、高さが同じ＝文字の高さも同じ） */
.uma-section-row .uma-checkrow { min-height: var(--uma-section-tab-h); }
.uma-section-row .uma-checkrow-label { font-size: var(--uma-fs-xs); line-height: var(--uma-lh-xs); }
@media (max-width: 640px) {
	/* 狭い幅は余白に余裕が無いので詰める。**並び順は変えない**（上の説明を読むこと） */
	.uma-section--framed { --uma-section-row-gap: var(--uma-sp-2); }
}

/* ============================================================
 * 1行のチェック（C-2c）
 *
 * 「☑ シナリオ因子 24種 ?」のように、チェック・呼び名・件数・「?」が横1行に並ぶもの。
 * **special の②の B・C と exam のシナリオ因子が同じ形**なので共通部品にした
 * （どちらも「この一群をまとめて対象に含めるか」という同じ問いで、説明を読ませずに
 *   件数と「?」の一覧で足りる）。
 *
 * C-2a では見出しで畳める節＋白いカード（.uma-checkcard）＋説明文の形だったが、
 * C-2c で**1行に畳んだ**（冗長という判断）。カードのクラスは使い手がいなくなったので消してある。
 * ============================================================ */
.uma-checkrow { display: flex; align-items: center; gap: var(--uma-sp-2); flex-wrap: wrap; }
.uma-checkrow-label {
	display: inline-flex; align-items: center; gap: var(--uma-sp-2); cursor: pointer;
	font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600; color: var(--uma-text);
}
.uma-checkrow-label > input { accent-color: var(--uma-control-mark); cursor: pointer; }

/* ラジオ（C-144・2026-10-12）。ブラウザの既定はダークで「未選択」が黒く塗った丸に見えるので、自前で描く。
   未選択＝中が空の輪（塗りはオプションの面の色・輪 2px）、選択＝輪＋内側の点。**色だけでなく形で区別する**（ライトも同じ作り）。
   詳細度 0 の :where() にしてあるので、個別に描いているラジオ（core の .usd-link-opt など）はそちらが勝つ。余白は指定しない（Tailwind の mt-0.5 などを残す） */
:where(input[type="radio"]) {
	appearance: none; -webkit-appearance: none; flex: none;
	width: 14px; height: 14px; box-sizing: border-box;
	border: 2px solid var(--uma-text-subtle); border-radius: 50%;
	background: var(--uma-surface);
	display: inline-grid; place-content: center; vertical-align: middle; cursor: pointer;
}
:where(input[type="radio"])::before {
	content: ""; width: 6px; height: 6px; border-radius: 50%;
	background: var(--uma-control-mark); transform: scale(0);
}
:where(input[type="radio"]:checked) { border-color: var(--uma-control-mark); }
:where(input[type="radio"]:checked)::before { transform: scale(1); }
:where(input[type="radio"]:disabled) { border-color: var(--uma-control-disabled); cursor: not-allowed; }
:where(input[type="radio"]:focus-visible) { outline: 2px solid var(--uma-focus-ring); outline-offset: 2px; }

/* 「?」で開く、**見るだけ**の名前の一覧。押して選ぶものではないので、候補のボタン
   （core の .usd-name-hit）ではなく素の箱にする。件数が多いので列は幅に合わせて増やす。 */
.uma-namelist {
	list-style: none; margin: 0; padding: 0; display: grid; gap: var(--uma-sp-1);
	grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.uma-namelist > li {
	padding: var(--uma-sp-1) var(--uma-sp-2); border-radius: var(--uma-r-sm);
	background: var(--uma-surface-sunken);
	font-size: var(--uma-fs-xs); line-height: var(--uma-lh-xs); color: var(--uma-text);
}

/* 絞り込みなどの切り替えボタン。
   UmaStar OCR の結果表で使っている形（角丸の矩形・選択中は反転）に揃えた。 */
.uma-pill {
	display: inline-flex;
	align-items: center;
	gap: var(--uma-sp-1);
	padding: var(--uma-sp-1) var(--uma-sp-3);
	border: 1px solid transparent;
	border-radius: var(--uma-r-md);
	background: var(--uma-surface-muted);
	font-size: var(--uma-fs-sm);
	line-height: var(--uma-lh-sm);
	font-weight: 500;
	color: var(--uma-text-muted);
	cursor: pointer;
	transition: background-color var(--uma-transition), color var(--uma-transition);
}
.uma-pill:hover:not(.active):not(:disabled) { background: var(--uma-border); }
.uma-pill.active {
	background: var(--uma-control);
	color: var(--uma-control-text);
	box-shadow: inset 0 0 0 1px var(--uma-control-edge), var(--uma-control-rim);
	font-weight: 500;
}

/* スキルセットの分類（超優先／優先／通常）の印（C-57・C-58 で競馬の印にした）。
   ②のスキルパネルの左と、照合結果の表のスキル名の前で同じ部品を使う。
   中身は js/uma-skill-deck-core.js の tiers.markHtml() が返す SVG（◎ ○ ▲ を**線で**描く。
   結合画像の Canvas 側と同じ形になるよう、形はあの1か所で決めている）。
   色は css/tokens.css の --uma-mark-tier-N を data-tier="1|2|3" で引き、SVG は currentColor で拾う。
   ★の数（橙）とは形・色・置き場所（名前の左）のすべてで役割が分かれる。 */
.uma-tier-mark {
	display: inline-flex; flex: none; align-items: center; justify-content: center;
	width: 1.2em; height: 1.2em;
	/* 中身が文字でない inline-flex は、下端が文字のベースラインに乗って一段高く見える。
	   文字の高さの中で真ん中に来るよう、下へずらす（文の中に置く照合結果の表のため）。 */
	vertical-align: -0.28em;
	color: var(--uma-mark-tier-2);
}
.uma-tier-mark[data-tier="1"] { color: var(--uma-mark-tier-1); }
.uma-tier-mark[data-tier="3"] { color: var(--uma-mark-tier-3); }
.uma-tier-mark svg { display: block; width: 100%; height: 100%; }

/* 文字の記号（★●◆）と同じ場所に置く、**SVG の印**（段G-2・66セッション目）。
   いまの用途は**白抜きの菱形 ◇**（遺伝子。段I-5）。◇（U+25C7）は JIS X 0208 内だが
   **検証環境では豆腐になった**（F-63）ので、文字ではなく SVG で持っている。
   SVG で持てば**画面と結合画像（Canvas）が同じ形であることが作りとして保証される**
   （上の .uma-tier-mark ＝ Special の ◎○△ が先にこの作法を採っている。輪郭は
   js/stitch.js の stitchDiamondPathD() が Canvas と同じ元から出す）。
   大きさとベースラインの下げ幅は .uma-tier-mark と同じ値にしてある ―― 隣に ◆★● が
   並ぶので、揃っていないと1つだけ浮いて見える。
   **色は currentColor**（置く側が文字色で決める）。塗るか線だけかも置く側が決める
   ―― Exam の印は塗りつぶし、Special の印は線だけ、という既存の決まりに従わせるため。 */
.uma-glyph-mark {
	display: inline-flex; flex: none; align-items: center; justify-content: center;
	width: 1.2em; height: 1.2em;
	vertical-align: -0.28em;
}
.uma-glyph-mark svg { display: block; width: 100%; height: 100%; }

/* ============================================================
 * 入力欄（input / select / textarea 共通）
 * ============================================================ */
.uma-input {
	width: 100%;
	padding: var(--uma-sp-2) var(--uma-sp-3);
	border: 1px solid var(--uma-border);
	border-radius: var(--uma-r-md);
	background: var(--uma-surface);
	color: var(--uma-text);
	font-size: var(--uma-fs-sm);
	line-height: var(--uma-lh-sm);
	/* font-family はあえて指定しない。Tailwindのpreflight（@layer base）が
	   フォーム部品に font: inherit を当てており、その上で font-mono のような
	   ユーティリティを効かせたい箇所がある（JSONの貼り付け欄など）。
	   ここで font-family を指定すると、レイヤー無しの方が強いため上書きしてしまう。 */
	transition: border-color var(--uma-transition), box-shadow var(--uma-transition);
}
.uma-input:focus {
	outline: none;
	border-color: var(--uma-control-mark);
	box-shadow: 0 0 0 3px var(--uma-control-soft);
}
.uma-input:disabled {
	background: var(--uma-surface-muted);
	color: var(--uma-text-faint);
	cursor: not-allowed;
}
.uma-input::placeholder { color: var(--uma-text-faint); }

/* textarea は面積が大きいぶん角を大きくする */
textarea.uma-input {
	border-radius: var(--uma-r-lg);
	padding: var(--uma-sp-3);
	resize: vertical;
}

/* ============================================================
 * バッジ
 * ============================================================ */
.uma-badge {
	display: inline-flex;
	align-items: center;
	gap: var(--uma-sp-1);
	padding: var(--uma-sp-1) var(--uma-sp-2-5);
	border-radius: var(--uma-r-full);
	background: var(--uma-surface-muted);
	color: var(--uma-text-muted);
	font-size: var(--uma-fs-xs);
	line-height: var(--uma-lh-xs);
	font-weight: 600;
	white-space: nowrap;
	flex-shrink: 0;
}
.uma-badge--accent {
	background: var(--uma-accent-soft);
	color: var(--uma-accent-soft-text);
}
.uma-badge--warn {
	background: var(--uma-warn-bg);
	color: var(--uma-warn-text);
}

/* ============================================================
 * ダーク（C-134 段3）: Tailwind の白とトースト
 *
 * ダークでは css/tokens.css が --color-white を面の色にする（bg-white などの面を暗くするため）。
 * そのままだと**色の付いた地の上の白い文字**（text-white）まで暗くなるので、ここで白に戻す。
 * 地が「操作できる部品の色」（--uma-control・bg-slate-900）のものは、ダークでは地が明るくなるので
 * 白ではなく反転の文字（--uma-text-inverse の暗い色）にする。
 * トーストはダークでも暗いまま、明るい細い枠で縁を出す（決定7。注意のアイコン付き＝C-130 も同じ要素）。
 * 規則は :root[data-theme="dark"] の下だけに置くので、ライトには何も効かない。
 * ============================================================ */
:root[data-theme="dark"] .text-white,
:root[data-theme="dark"] .group:hover .group-hover\:text-white { color: var(--uma-text-on-color); }
:root[data-theme="dark"] :is(.bg-slate-900, .bg-slate-900\/80).text-white { color: var(--uma-text-inverse); }
/* 操作色の塗りの Tailwind クラス（exam の「コピー」「画像を更新」など。C-144）: 塗りの上の文字と、ダークの明るい縁 */
.bg-\[var\(--uma-control\)\] { box-shadow: inset 0 0 0 1px var(--uma-control-edge), var(--uma-control-rim); }
:root[data-theme="dark"] .bg-\[var\(--uma-control\)\].text-white { color: var(--uma-control-text); }
:root[data-theme="dark"] #toast {
	background-color: var(--uma-toast-bg);
	color: var(--uma-text-on-color);
	border: 1px solid var(--uma-toast-border);
}
/* 淡い記号（★の空き・「−」）は、ダークでも淡いまま、記号として読める濃さ（3:1）にする。罫線の slate-300 は変えない */
:root[data-theme="dark"] .text-slate-300 { color: var(--uma-symbol-faint); }
/* 色相の 500・600 は、ダークの上書き表では中間のまま（色の地のボタンに白い文字を載せるため）。
   文字として使っているもの（数字・注意の文字）は、暗い面の上で読めるよう同じ色相の 400 にする（値は Tailwind v4.1.11 の 400。
   変数 --color-*-400 はそのページで使っていないと Tailwind が出さないので、値を書く） */
:root[data-theme="dark"] :is(.text-blue-600, .hover\:text-blue-600:hover) { color: oklch(70.7% 0.165 254.624); }
:root[data-theme="dark"] :is(.text-red-600, .text-red-500, .hover\:text-red-600:hover) { color: oklch(70.4% 0.191 22.216); }
:root[data-theme="dark"] :is(.text-green-600, .hover\:text-green-600:hover) { color: oklch(79.2% 0.209 151.711); }
:root[data-theme="dark"] :is(.text-emerald-600) { color: oklch(76.5% 0.177 163.223); }
:root[data-theme="dark"] :is(.text-indigo-600) { color: oklch(67.3% 0.182 276.935); }
:root[data-theme="dark"] :is(.text-violet-600) { color: oklch(70.2% 0.183 293.541); }
:root[data-theme="dark"] :is(.text-amber-600) { color: oklch(82.8% 0.189 84.429); }

/* ============================================================
 * 画面の色の切り替え（C-135・ダークモードの段7）
 * special／exam の「？」の小窓の先頭の1行と、スタイルガイド。押したときの動きは js/theme.js。
 * 3つを1つの枠に横に並べる。選ばれているものは**黒い地と「✓」**（色だけに頼らない）。
 * 「✓」の場所は選ばれていないものにも空けておき、選び直しても幅が動かないようにする（320px でも1行）。
 * ============================================================ */
.uma-theme-row { display: flex; align-items: center; gap: var(--uma-sp-2); margin: 0 0 var(--uma-sp-4); }
.uma-theme-label { flex: none; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 700; color: var(--uma-text-heading); white-space: nowrap; }
.uma-theme-choices { display: inline-flex; flex: none; border: 1px solid var(--uma-control-border); border-radius: var(--uma-r-md); overflow: hidden; }
.uma-theme-choice {
	display: inline-flex; align-items: center; gap: 2px; padding: var(--uma-sp-1) var(--uma-sp-2);
	font: inherit; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600; white-space: nowrap;
	color: var(--uma-text-heading); background: var(--uma-surface); border: 0; cursor: pointer;
}
.uma-theme-choice + .uma-theme-choice { border-left: 1px solid var(--uma-control-border); }
.uma-theme-choice::before { content: "✓"; visibility: hidden; font-size: var(--uma-fs-xs); }
.uma-theme-choice:hover { background: var(--uma-control-soft); }
.uma-theme-choice[aria-checked="true"] { background: var(--uma-control); color: var(--uma-control-text); box-shadow: inset 0 0 0 2px var(--uma-control-edge); }
.uma-theme-choice[aria-checked="true"]::before { visibility: visible; }
.uma-theme-choice:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; border-radius: 0; }

/* css/shell.css */
/* ============================================================
 * Uma Tools 共通スタイル — 3/3 画面の骨格（css/shell.css）
 *
 * special.html / exam.html で共有する。中身は
 *   ステップ1・2のタブ／右下の折りたたみFAB／引き出しパネル／
 *   手前に重ねるダイアログ（使い方ガイド・UI切り替えの告知）／「新UI」バッジ
 * の骨格。もともと special.html の <style> にあったものを、exam.html にも同じ
 * 画面構成を持ち込むために切り出した（2026-09-11）。
 *
 * 前提:
 *   - 色・寸法は css/tokens.css のトークン経由。直書きの色は「ツールに依らない意味」
 *     （暗転＝slate-900 の半透明）のものだけ。押せる部品は --uma-control、未読の丸は
 *     --uma-notify（2026-09-15・43セッション目に橙の直書きをやめた）。
 *   - ツールごとに変える値（FAB の影）は :root のトークンにし、各HTMLの <style> で上書きする。
 *   - マークアップ側のボタンは共通部品（.uma-btn 等）を使っても、ページ固有の
 *     ユーティリティで書いてもよい。このファイルは骨格の箱だけを描く。
 *   - [hidden] の規則に !important が付いているのは、display:flex を持つ箱を
 *     hidden 属性で確実に消すため（F-13）。run-verify.mjs はこのファイルの !important を
 *     「[hidden] と prefers-reduced-motion に限る」という条件で検査する。
 * 読み込み順は tokens → common → shell → Tailwind → 各HTMLの<style>。
 * ============================================================ */

:root {
	/* 版数の印。tokens.css の --common-css-version と同じ文字列にする。 */
	--uma-shell-css-version: "2026-10-13a";

	/* ===== 右下固定ナビ（FAB）の寸法 =====
	   トーストの退避位置・本文の下端余白もこの変数から計算するので、
	   サイズを変えるときはここだけ触ればよい（3か所が自動で追従する）。 */
	--uma-fab-edge: var(--uma-sp-4);   /* 画面端からの距離 */
	--uma-fab-size: 56px;              /* メインボタンの直径 */
	--uma-fab-gap: var(--uma-sp-3);    /* ボタン間の間隔 */
	--uma-fab-icon: 36px;              /* サブボタンのアイコン丸の直径 */
	--uma-fab-font: var(--uma-fs-sm);  /* サブボタンのラベル */
	--uma-fab-reserve: 18rem;          /* 本文の下端に空ける余白（展開時の高さ+余白） */
	/* メインボタンの影。メインボタンが3ツール共通の黒（--uma-control）になったので、影も無彩色で揃える
	   （2026-09-15・43セッション目に special の緑系・exam の藍系の上書きを外した）。 */
	--uma-fab-shadow: 0 10px 20px -6px rgba(15, 23, 42, .35);
}

/* PCではスマホ用の寸法だと小さく見えるので、一回り大きくする。
   位置も画面の右端ではなく本文カラム（max-w-5xl = 1024px）の右端に合わせ、
   本文と関係のない隅に浮いて見えないようにする。構造は共通のまま。 */
@media (min-width: 768px) {
	:root {
		--uma-fab-edge: var(--uma-sp-6);
		--uma-fab-size: 64px;
		--uma-fab-gap: var(--uma-sp-3-5);
		--uma-fab-icon: 40px;
		--uma-fab-font: var(--uma-fs-md);
		--uma-fab-reserve: 20rem;
	}
}

/* ============================================================
 * ステップ1・2のタブ
 *
 * 以前は「①スキルリスト」「②画像アップロード」を別々のカードで縦に並べていた。
 * ①は一度用意したら触らないのに、②へ行くたびに①の全高をスクロールして
 * 通り過ぎる必要があった。1枚のカードに重ねてタブで切り替える。
 * 隠れている側の状況は、タブに出す件数バッジ（スキル件数／画像枚数）で分かる。
 * ============================================================ */
.step-tabs {
	display: flex; gap: var(--uma-sp-2);
	margin-bottom: var(--uma-sp-4);
	border-bottom: 1px solid var(--uma-border);
}
.step-tab {
	/* 等分（1 1 0）ではなく**中身の幅を基準に縮める**（1 1 auto）。min-width:0 とラベル側の
	   省略で、狭い画面でも枠から溢れさせない。
	   等分をやめた理由（C-63 の (2)）: ①のタブに「除外N種」のバッジを入れたところ、
	   375px で3等分するとバッジと丸数字で幅を使い切り、**ラベルが1文字まで削られた**。
	   中身を基準にすると、バッジを持つタブのぶんだけ取り分が増えて名前が読める。 */
	flex: 1 1 auto; min-width: 0;
	display: flex; align-items: center; gap: var(--uma-sp-2);
	padding: var(--uma-sp-2) var(--uma-sp-2-5);
	margin-bottom: -1px;                 /* 下線をカードの区切り線に重ねる */
	background: none; border: 0; border-bottom: 2px solid transparent;
	font: inherit; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600;
	color: var(--uma-text-subtle); text-align: left; cursor: pointer;
	transition: color var(--uma-transition), border-color var(--uma-transition);
}
.step-tab:hover { color: var(--uma-text-heading); }
.step-tab:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; border-radius: var(--uma-r-sm); }
/* 選んでいるタブの下線は操作の色（黒）。ページの色ではない */
.step-tab[aria-selected="true"] { color: var(--uma-text-heading); border-bottom-color: var(--uma-control-mark); }
.step-tab-num {
	flex: none; width: 24px; height: 24px; border-radius: var(--uma-r-full);
	display: flex; align-items: center; justify-content: center;
	font-size: var(--uma-fs-xs); font-weight: 700;
	background: var(--uma-surface-muted); color: var(--uma-text-subtle);
	transition: background-color var(--uma-transition), color var(--uma-transition);
}
.step-tab[aria-selected="true"] .step-tab-num { background: var(--uma-surface-inverse); color: var(--uma-text-inverse); }
.step-tab-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-tab-badge {
	flex: none; margin-left: auto;
	font-size: var(--uma-fs-2xs); line-height: var(--uma-lh-2xs); font-weight: 700;
	padding: var(--uma-sp-0-5) var(--uma-sp-1-5); border-radius: var(--uma-r-full);
	background: var(--uma-surface-muted); color: var(--uma-text-subtle);
}
/* 注意を引く件数（いまは①の「除外N種」だけ。C-63 の (2)）。
   「何かを外している」ことの印なので、他のバッジと同じ形のまま色だけ赤にする。
   **枠のぶんは内側の余白から引く**（64セッション目・段E-3）。引かないと枠の無いバッジより
   外側が 2px 大きくなり、並んだときに大きさが揃わない。**幅も 2px 増えるので、
   狭い画面では折り返しの境目まで変わる**（exam のタブが1行から2行になるのを実測した）。 */
.step-tab-badge--alert {
	background: var(--uma-danger-bg); color: var(--uma-danger-text);
	border: 1px solid var(--uma-danger-border);
	padding: calc(var(--uma-sp-0-5) - 1px) calc(var(--uma-sp-1-5) - 1px);
}
/* **そのステップに必要なものが揃っている**ことを表す件数（いまは②の「N種」だけ。
   64セッション目・段E-3）。①の「除外N種」（--alert）と対になる ―― 赤は「外している
   ものがある（注意）」、緑は「用意ができている」。**数が0のときは出さない**運用なので、
   出ている＝揃っている、で意味が一致する。
   名前は色（--green）でも用途（--count）でもなく、**何を表す件数か**を名乗らせている（F-59）。 */
.step-tab-badge--ready {
	background: var(--uma-success-bg); color: var(--uma-success-text);
}
.step-tab-badge[hidden] { display: none !important; }
/* 狭い画面では、タブの余白と間隔を詰めて名前に幅を回す（C-63 の (2)）。
   ①に「除外N種」のバッジが入ったぶん、375px で名前が削られるため。
   丸数字・バッジ・下線の扱いは変えない。 */
@media (max-width: 480px) {
	.step-tabs { gap: var(--uma-sp-1); }
	/* 名前とバッジが1行に収まらないときは、バッジを名前の下へ回す。
	   名前を1〜2文字まで削るより、2行にするほうが読める（375px で実測）。
	   **折り返した行は上に詰める**（64セッション目・段E-2）。既定の align-content は
	   1行しかないタブ（バッジの無い③）の行を縦に伸ばし、`align-items: center` と相まって
	   **そのタブだけ丸数字と名前が下へ沈んでいた**。 */
	.step-tab { gap: var(--uma-sp-1); padding-left: var(--uma-sp-1); padding-right: var(--uma-sp-1); flex-wrap: wrap; align-content: flex-start; }
	/* **折り返しのきっかけになるのはバッジだけ**にする（64セッション目・段E-2）。
	   basis が auto（＝名前の実寸）だと、名前が長いタブでは**名前そのものが丸数字の下へ
	   回って**しまい、タブごとに名前の高さが変わっていた。basis を 0 にすると名前は
	   残り幅まで縮んで（溢れは `text-overflow` で省略）、丸数字の隣に必ず並ぶ。
	   min-width（4em）は残す ―― これが無いと名前が1文字まで削られ、バッジが名前の
	   横に居座る（C-63 の (2) で実測した失敗。375px で名前の幅が 15px になる）。 */
	.step-tab-label { flex: 1 1 0; min-width: 4em; }
	.step-tab-num { width: 20px; height: 20px; }
	/* 折り返したバッジは、右端ではなく**そのタブの左端**に置く（どのタブのものか分かるように）。
	   1行に収まるときは、名前が残り幅まで伸びるので見え方は変わらない。 */
	.step-tab-badge { padding: var(--uma-sp-0-5) var(--uma-sp-1); margin-left: 0; }
	/* 枠のぶんを引くのは、余白を詰めたここでも同じ（上の --alert と同じ理由）。 */
	.step-tab-badge--alert { padding: calc(var(--uma-sp-0-5) - 1px) calc(var(--uma-sp-1) - 1px); }
}
.step-panel[hidden] { display: none !important; }
/* Tailwind の preflight が来なかった場合の保険（F-13と同じ理由で自前でも指定する） */
#ui-mode-badge[hidden] { display: none !important; }

/* ============================================================
 * 帯のタブ（.uma-subtabs）— タブの中で「どれを扱うか」を選ぶ2段目のタブ（C-54）
 *
 * ステップのタブ（上の .step-tab）の下に置く、保存した編成／スキルセット／親A・親Bセットの
 * 切り替え。見た目はステップのタブと同じ規則（選択中は黒の下線＋濃い文字、未選択は灰）。
 * 帯は**横だけ**スクロールする（縦は動かない＝斜めスクロールにならない。C-51 の10節⑥）。
 * 狭い画面ではタブを固定幅にして「＋ 新規」＋3件が見え、4件目からは左右スワイプ。
 * **選択中のタブだけ幅を広げ、名前と件数まで読める**ようにする（C-54 の (8)）。
 * 描画は js/uma-skill-deck-core.js の tabStrip.html()（Exam で使うときは core.js を読み込む）。
 * 色付き（.uma-subtab--tinted）は --uma-subtab-tint-* を持つクラスと組み合わせて使う
 * （special の親A／親Bセット＝ .person-col-blue / .person-col-red）。
 * ============================================================ */
.uma-subtabs-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--uma-sp-2); }
.uma-subtabs {
	display: flex; gap: var(--uma-sp-1); min-width: 0; flex: 1 1 auto;
	overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none;
	border-bottom: 1px solid var(--uma-border-strong);
}
.uma-subtabs::-webkit-scrollbar { display: none; }
.uma-subtab {
	flex: none; scroll-snap-align: start; max-width: 180px; min-width: 0;
	display: inline-flex; align-items: center; gap: var(--uma-sp-1);
	padding: var(--uma-sp-1-5) var(--uma-sp-2); margin-bottom: -1px;
	background: none; border: 0; border-bottom: 2px solid transparent;
	font: inherit; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600;
	color: var(--uma-text-subtle); cursor: pointer; white-space: nowrap;
}
.uma-subtab-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.uma-subtab-count {
	flex: none; font-size: var(--uma-fs-2xs); line-height: var(--uma-lh-2xs); font-weight: 700;
	padding: 0 var(--uma-sp-1-5); border-radius: var(--uma-r-full);
	background: var(--uma-surface-muted); color: var(--uma-text-subtle);
}
.uma-subtab:hover { color: var(--uma-text-heading); }
.uma-subtab:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; border-radius: var(--uma-r-sm); }
.uma-subtab[aria-selected="true"] { color: var(--uma-text-heading); border-bottom-color: var(--uma-control-mark); }
.uma-subtab[aria-selected="true"] .uma-subtab-count { background: var(--uma-surface-inverse); color: var(--uma-text-inverse); }
.uma-subtab--new { font-weight: 700; }
.uma-subtab--tinted[aria-selected="true"] {
	background: var(--uma-subtab-tint-bg, transparent);
	color: var(--uma-subtab-tint-fg, var(--uma-text-heading));
	border-bottom-color: var(--uma-subtab-tint-line, var(--uma-control-mark));
	border-radius: var(--uma-r-sm) var(--uma-r-sm) 0 0;
}
.uma-subtab--tinted[aria-selected="true"] .uma-subtab-count {
	background: var(--uma-subtab-tint-fg, var(--uma-surface-inverse)); color: var(--uma-text-inverse);
}
@media (max-width: 640px) {
	.uma-subtabs { flex-basis: 100%; }   /* 見出しの下の行へ折り返し、帯に幅いっぱいを使う */
	/* タブの幅は名前に合わせる（帯の半分まで）。それまでは 72px 固定で「＋新規＋3件が見える」ことを
	   優先していたが、件数バッジのぶんで名前が2文字＋「…」になり読めなかった（C-55 の (2)）。
	   名前の長さぶんだけ幅を取り、収まらないぶんは横スワイプで届く。件数バッジは flex: none なので
	   縮まず、名前の側が「…」で切れる。選択中はさらに広げる（帯の 3/4 まで）。 */
	.uma-subtab { width: auto; min-width: 56px; max-width: 50%; font-size: var(--uma-fs-xs); line-height: var(--uma-lh-xs); }
	.uma-subtab[aria-selected="true"] { max-width: 75%; }
}
@media (max-width: 640px) {
	.step-tab { gap: var(--uma-sp-1-5); padding: var(--uma-sp-2) var(--uma-sp-1); font-size: var(--uma-fs-xs); }
	.step-tab-num { width: 20px; height: 20px; }
}

/* ===== 画面固定ナビ（右下・折りたたみFAB） =====
   画面右端に取っ手を常時出しておく方式をやめ、右下のメインボタン1つに畳んだ。
   行き先は「UmaSkill Deck（引き出し）」「画像結合レビュー」「OCRの照合結果」の3つで、
   メインボタンに近い順＝押す頻度の高い順に並べる。

   ・.uma-fab-nav が fixed のクラスタ本体。子は「サブ3つ → メインボタン」の順。
   ・展開状態は .open クラス1つで表す（JS側は setFabOpen() だけを触ればよい）。
   ・スマホの片手操作を基準に、右下 16px・タッチ領域 44px・間隔 12px を最低線にした。 */
.uma-fab-nav {
	position: fixed;
	right: var(--uma-fab-edge);
	bottom: calc(var(--uma-fab-edge) + env(safe-area-inset-bottom, 0px));
	z-index: 70;
	/* align-items: stretch で、サブボタンをこの箱の幅（＝いちばん長いラベルのボタンの幅）に
	   揃える。箱そのものの幅は中身に合わせて決まるので、ラベルが変わっても自動で追従する
	   （ピクセルで固定しない。2026-09-15・43セッション目）。メインボタンだけは丸のままに
	   したいので、下の .uma-fab-main で align-self: flex-end に戻す。 */
	display: flex; flex-direction: column; align-items: stretch; gap: var(--uma-fab-gap);
	/* 外枠そのものはクリックを受け取らない。畳んでいる間もこの箱は
	   「見えないサブボタン3つ＋間隔＋メインボタン」ぶんの高さを持ち、右下に
	   約170×250px の透明な板として居座る。何も指定しないと、その板の下にある
	   テンプレート行の編集／複製／削除ボタンが、スクロール位置によって
	   押せなくなる（実測で 900px幅は6箇所・375pxは8箇所がブロックされていた）。
	   受け取るのはメインボタンと、展開中のサブボタンだけ。 */
	pointer-events: none;
}
.uma-fab-nav > * { pointer-events: auto; }
/* 引き出しを開いている間は隠す。暗転の下に見えていると押せそうに見えるが、
   実際には暗転がクリックを受け取って閉じるだけで、紛らわしいため。
   display:flex を上で指定しているので [hidden] は !important で押す。 */
.uma-fab-nav[hidden] { display: none !important; }
/* PCでは本文カラムの右端に揃える。fixed 要素の % は
   ビューポート（スクロールバーを除いた幅）基準なので、
   100vw で計算するよりスクロールバーぶんのズレが出ない。
   本文が画面いっぱいまで広がる幅では max() 側の端マージンが効く。 */
@media (min-width: 768px) {
	.uma-fab-nav { right: max(var(--uma-fab-edge), calc(50% - 512px)); }
}

/* ===== 画面固定の「元に戻す」（左下の黒いピル） =====
   Deck の「即実行＋元に戻す」の受け皿。履歴がある間だけ出し、どのタブ・どのスクロール位置でも
   同じ場所（左下＝右下の FAB と対称・同じ高さ）にある（C-55 の (4)(5)。56セッション目）。
   もともと Deck 単独ページの左下にあった固定ボタンを共通部品にし、special にも出すようにした
   （それまで special では②のパネルの下にインラインで出るだけで、①で除外しても見えなかった）。
   ・表示／非表示は JS が hidden 属性で切り替える（Deck: 履歴 0 で隠す。special: 履歴 0 と、
     引き出しを開いている間＝Deck の引き出しの中に Deck 自身の「元に戻す」があり二重に見えるため）。
   ・PC では本文カラムの左端に揃える（FAB の右端と同じ計算。カラムの半幅はページが
     --uma-content-half で上書きできる。既定は special の 1024px カラム）。 */
.uma-undo-fab {
	position: fixed;
	left: var(--uma-fab-edge);
	bottom: calc(var(--uma-fab-edge) + env(safe-area-inset-bottom, 0px));
	z-index: 70;
	display: inline-flex; align-items: center; gap: var(--uma-sp-2);
	padding: var(--uma-sp-2-5) var(--uma-sp-4);
	border: 0; border-radius: var(--uma-r-full);
	background: var(--uma-control); color: var(--uma-control-text);
	font: inherit; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600;
	box-shadow: inset 0 0 0 1px var(--uma-control-edge), var(--uma-control-rim), var(--uma-shadow-3); cursor: pointer; white-space: nowrap;
}
.uma-undo-fab:hover { background: var(--uma-control-hover); }
.uma-undo-fab:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: 2px; }
.uma-undo-fab[hidden] { display: none !important; }
.uma-undo-fab-count {
	font-size: var(--uma-fs-2xs); line-height: var(--uma-lh-2xs); font-weight: 700;
	padding: 0 var(--uma-sp-1-5); border-radius: var(--uma-r-full);
	background: color-mix(in srgb, var(--uma-control-text) 20%, transparent);  /* 黒い地の上の白の 20%（ダークでは明るい地の上の暗い色の 20%） */
}
@media (min-width: 768px) {
	.uma-undo-fab { left: max(var(--uma-fab-edge), calc(50% - var(--uma-content-half, 512px))); }
}

/* サブボタン（ピル型）。閉じている間は pointer-events:none で完全に無効化する。
   display:none にしないのは、開閉のトランジションを効かせるため。 */
.uma-fab-item {
	/* ラベルは左、アイコンの丸は右端。幅は .uma-fab-nav の align-items: stretch で揃う */
	display: flex; align-items: center; justify-content: space-between; gap: var(--uma-sp-2);
	min-height: 44px;
	padding: var(--uma-sp-1-5) var(--uma-sp-1-5) var(--uma-sp-1-5) var(--uma-sp-4);
	border: 1px solid var(--uma-border); border-radius: var(--uma-r-full);
	background: var(--uma-surface); color: var(--uma-text-heading);
	font-size: var(--uma-fab-font); line-height: 1.4; font-weight: 700; white-space: nowrap;
	box-shadow: var(--uma-shadow-2); cursor: pointer;
	opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none;
	transition: opacity .18s ease, transform .18s ease, background-color var(--uma-transition);
}
/* 自前で指定する（F-13）。上の display:flex と同じ詳細度では、
   Tailwind preflight の [hidden]{display:none} が後ろに来ないため効かない。 */
.uma-fab-item[hidden] { display: none !important; }
.uma-fab-item:hover { background: var(--uma-surface-sunken); }
.uma-fab-nav.open .uma-fab-item { opacity: 1; transform: none; pointer-events: auto; }
/* 下（メインボタンに近い側）から順に現れる。最後の子はメインボタンなので、その1つ上（nth-last-child(2)）が
   最下段＝最初。下から数えるのは、項目が3つ（special）でも4つ（exam）でも下側の遅延が変わらないようにするため。 */
.uma-fab-nav.open .uma-fab-item:nth-last-child(2) { transition-delay: 0s; }
.uma-fab-nav.open .uma-fab-item:nth-last-child(3) { transition-delay: .03s; }
.uma-fab-nav.open .uma-fab-item:nth-last-child(4) { transition-delay: .06s; }
.uma-fab-nav.open .uma-fab-item:nth-last-child(5) { transition-delay: .09s; }

.uma-fab-icon {
	position: relative; flex-shrink: 0;
	width: var(--uma-fab-icon); height: var(--uma-fab-icon); border-radius: var(--uma-r-full);
	display: flex; align-items: center; justify-content: center;
}

/* 新着バッジ。行き先に「まだ見ていない結果」があるときだけ出す。
   数を出さないドットにしているのは、結果が1件か複数かに意味がないため。
   【2026-09-15・43セッション目】橙の直書き → 行き先ごとの色、と試したうえで、
   **行き先を問わず1色の赤（--uma-notify）**に落ち着いた。色で行き先を言い分けるより、
   「見ていないものがある」ことだけを一目で分かる方を採る。脈動の光も同じ色から作る。 */
.uma-fab-dot {
	position: absolute; top: -2px; right: -2px;
	width: 12px; height: 12px; border-radius: var(--uma-r-full);
	background: var(--uma-notify);
	border: 2px solid var(--uma-surface);
	animation: uma-fab-pulse 1.8s ease-out infinite;
}
.uma-fab-dot[hidden] { display: none !important; }
@keyframes uma-fab-pulse {
	0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--uma-notify) 55%, transparent); }
	70%  { box-shadow: 0 0 0 8px color-mix(in srgb, var(--uma-notify) 0%, transparent); }
	100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--uma-notify) 0%, transparent); }
}

/* 畳んでいるときの未読の印は、メインボタンの右上に**赤い丸を1つだけ**出す
   （未読の行き先がいくつあっても1つ。子項目を開けば行き先ごとの丸が見える）。
   丸は .uma-fab-dot をそのまま使い、この箱を位置の基準にする。
   周りに並べる・回す案は取りやめた（2026-09-15・43セッション目）。 */
.uma-fab-main { position: relative; display: flex; align-self: flex-end; }

/* メインボタン。塗りは --uma-control（3ツール共通の黒。ページの色とは分ける）で、
   影は --uma-fab-shadow。開いている間は＋アイコンを135度回して×にする。 */
.uma-fab-toggle {
	width: var(--uma-fab-size); height: var(--uma-fab-size); flex-shrink: 0;
	border: none; border-radius: var(--uma-r-full);
	background: var(--uma-control); color: var(--uma-control-text);
	display: flex; align-items: center; justify-content: center;
	box-shadow: inset 0 0 0 1px var(--uma-control-edge), var(--uma-control-rim), var(--uma-fab-shadow), var(--uma-shadow-2);
	cursor: pointer;
	transition: background-color var(--uma-transition), transform var(--uma-transition);
}
.uma-fab-toggle:hover { background: var(--uma-control-hover); }
.uma-fab-toggle:active { transform: scale(.95); }
/* lucide は <i data-lucide> を <svg> に差し替えるので、回転はsvgに掛ける。
   アイコンの大きさは Tailwind の w-4/w-6 ではなくボタン径から決める
   （PCで一回り大きくしたときに、アイコンだけ取り残されないようにするため）。
   Tailwindのユーティリティは @layer utilities に入るので、この指定の方が強い。 */
.uma-fab-toggle svg {
	width: calc(var(--uma-fab-size) * .43); height: calc(var(--uma-fab-size) * .43);
	transition: transform .25s ease;
}
.uma-fab-icon svg {
	width: calc(var(--uma-fab-icon) * .45); height: calc(var(--uma-fab-icon) * .45);
}
.uma-fab-nav.open .uma-fab-toggle svg { transform: rotate(135deg); }

@media (prefers-reduced-motion: reduce) {
	.uma-fab-item, .uma-fab-toggle, .uma-fab-toggle svg { transition: none !important; }
	.uma-fab-nav.open .uma-fab-item { transition-delay: 0s !important; }
	/* 脈動は止める。丸そのものは出したまま（消さない） */
	.uma-fab-dot { animation: none !important; }
}

/* ===== 引き出しパネル（スライドオーバー） =====
   FABの3つの行き先（照合結果 / 画像結合レビュー / UmaSkill Deck）が
   同じ骨格を共有する。同時に開くのは1つだけで、背景の暗転は1枚を使い回す。

   注意: 背景の暗転に opacity は使わない。opacity<1 は新しいスタッキング
   コンテキストを生成し、他要素の z-index 制御を壊す（F-7の実績）。
   半透明の背景色を持つ不透明な要素として実装する。 */
.uma-drawer-backdrop {
	position: fixed; inset: 0; z-index: 90;
	background: var(--uma-scrim);
	transition: background-color .3s ease;
}
.uma-drawer-backdrop[hidden] { display: none !important; }
.uma-drawer-backdrop.closing { background: rgba(15, 23, 42, 0); }

.uma-drawer {
	position: fixed; top: 0; right: 0; z-index: 100;
	width: min(92vw, 820px); height: 100%;
	display: flex; flex-direction: column;
	background: var(--uma-drawer-bg); box-shadow: var(--uma-drawer-shadow);
	transform: translateX(100%);
	transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
}
/* 照合結果の表は人物ぶん列が増える（最大7列）ので、この引き出しだけ広く取る。 */
.uma-drawer--wide { width: min(96vw, 1100px); }
.uma-drawer[hidden] { display: none !important; }
.uma-drawer.open { transform: translateX(0); }
.uma-drawer-header {
	flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
	gap: var(--uma-sp-3); padding: var(--uma-sp-3) var(--uma-sp-4);
	background: var(--uma-surface); border-bottom: 1px solid var(--uma-border);
}
/* 中身は引き出しの中でスクロールする（本文側は body ごとスクロールを止める）。
   iframe の引き出しだけは中の文書が自前でスクロールするので、外側は固定。 */
.uma-drawer-body { flex: 1; min-height: 0; overflow-y: auto; background: var(--uma-drawer-bg); }
.uma-drawer-body--frame { overflow: hidden; }
.uma-drawer-body iframe { width: 100%; height: 100%; border: 0; display: block; }
.uma-drawer-content { padding: var(--uma-sp-4); }

/* ===== 引き出しの中のタブ（照合結果／結合画像） =====
   ヘッダーと本文のあいだに固定で置き、中をスクロールしても見えたままにする。
   ステップのタブ（上の .step-tabs）と同じ見え方に合わせてある。
   もとは exam.html の <style> にだけあったが、special も使うようになったので
   ここ（画面の骨格）へ移した（C-62 の (9)）。**片方だけ直さないこと。**
   exam … 1つの引き出しの中でパネルを切り替える（C-18）
   special … 引き出しが2つのままなので、押すともう一方の引き出しへ切り替える（段5 は見送り中） */
.drawer-tabs {
	flex-shrink: 0; display: flex; gap: var(--uma-sp-2);
	padding: 0 var(--uma-sp-4); background: var(--uma-surface);
	border-bottom: 1px solid var(--uma-border);
}
.drawer-tab {
	position: relative; display: flex; align-items: center; gap: var(--uma-sp-1-5);
	padding: var(--uma-sp-2-5) var(--uma-sp-2); margin-bottom: -1px;
	background: none; border: 0; border-bottom: 2px solid transparent;
	font: inherit; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 600;
	color: var(--uma-text-subtle); cursor: pointer;
	transition: color var(--uma-transition), border-color var(--uma-transition);
}
.drawer-tab:hover:not(:disabled) { color: var(--uma-text-heading); }
.drawer-tab[aria-selected="true"] { color: var(--uma-text-heading); border-bottom-color: var(--uma-control-mark); }
.drawer-tab:disabled { color: var(--uma-text-faint); cursor: not-allowed; }
.drawer-tab:focus-visible { outline: 2px solid var(--uma-focus-ring); outline-offset: -2px; border-radius: var(--uma-r-sm); }
/* 未読の点はタブの文字の右に置く（FABの点と同じ見た目を借りるが、位置だけ流し込みに戻す） */
.drawer-tab .uma-fab-dot { position: static; margin-left: var(--uma-sp-0-5); }
.drawer-panel[hidden] { display: none !important; }

/* 結果がまだ無いときの案内。行き止まりにせず、作るためのボタンへ戻す。 */
.uma-drawer-empty {
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	gap: var(--uma-sp-3); text-align: center;
	min-height: 60vh; padding: var(--uma-sp-6);
	color: var(--uma-text-subtle);
}
.uma-drawer-empty[hidden] { display: none !important; }
.uma-drawer-empty svg { width: 40px; height: 40px; color: var(--uma-text-faint); }

@media (prefers-reduced-motion: reduce) {
	.uma-drawer, .uma-drawer-backdrop { transition: none !important; }
}

/* ============================================================
 * 手前に重ねるダイアログの骨格（使い方ガイド・UI切り替えの告知で共有）
 * 引き出し（z 90/100）より手前、FAB（z 70）より手前。
 * 背景の暗さは引き出しの暗転と同じ値に揃える。
 * 中身の寸法は各ダイアログ側（.help-dialog / .notice-dialog）が持つ。
 * ============================================================ */
.uma-overlay-backdrop {
	position: fixed; inset: 0; z-index: 110;
	background: var(--uma-scrim);
}
.uma-overlay-backdrop[hidden] { display: none !important; }
.uma-overlay {
	position: fixed; z-index: 111;
	left: 50%; top: 50%; transform: translate(-50%, -50%);
	display: flex; flex-direction: column;
	background: var(--uma-surface); border-radius: var(--uma-r-xl);
	box-shadow: var(--uma-shadow-3);
}
/* display:flex を上で当てているので、hidden は自前で押す（F-13） */
.uma-overlay[hidden] { display: none !important; }

/* ============================================================
 * 小さな設定パネル（ポップオーバー）。exam の「結合画像の設定」が使う（2026-09-15・41セッション目）。
 *   .uma-popover--fab    … 右下の FAB の項目から開く。.uma-overlay と併用して暗転つき（引き出しは閉じている前提）。
 *                          PC は FAB のメインボタンの真上に右揃えで浮かせ、640px 以下は下からのシート（高さは画面の半分まで）。
 *   .uma-popover--drawer … 引き出しの中の丸ボタン（.uma-drawer-fab）から開く。引き出し本体（fixed＋transform）の
 *                          内側に absolute で置くので、引き出しの本文をスクロールしても位置は変わらない。暗転なし。
 *                          640px 以下は引き出しの下辺からのシート（高さは引き出しの半分まで＝上側で画像が見える）。
 * 色はトークンだけを使う（ダークモードと配色の変更に備える）。
 * ============================================================ */
.uma-popover {
	display: flex; flex-direction: column;
	width: min(92vw, 380px); max-height: min(70vh, 560px);
	max-height: min(70dvh, 560px);
	background: var(--uma-surface); border: 1px solid var(--uma-border);
	border-radius: var(--uma-r-xl); box-shadow: var(--uma-shadow-3);
}
.uma-popover[hidden] { display: none !important; }
.uma-popover-head {
	flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--uma-sp-2);
	padding: var(--uma-sp-2) var(--uma-sp-2) var(--uma-sp-2) var(--uma-sp-4);
	border-bottom: 1px solid var(--uma-border);
}
.uma-popover-title {
	margin: 0; display: flex; align-items: center; gap: var(--uma-sp-2);
	font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); font-weight: 700; color: var(--uma-text-heading);
}
/* 見出しに添えるアイコンだけ別の色にできるようにしておく（既定は見出しの文字と同じ色）。
   exam の「結合画像の設定」は結合画像の琥珀を入れて、何の設定かを色でも示している。 */
.uma-popover-title svg { color: var(--uma-popover-icon, currentColor); }
.uma-popover-close {
	flex-shrink: 0; width: 36px; height: 36px; border: 0; border-radius: var(--uma-r-full);
	display: flex; align-items: center; justify-content: center;
	background: transparent; color: var(--uma-text-subtle); cursor: pointer;
	transition: background-color var(--uma-transition), color var(--uma-transition);
}
.uma-popover-close:hover { background: var(--uma-surface-muted); color: var(--uma-text-heading); }
.uma-popover-close svg { width: 18px; height: 18px; }
.uma-popover-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--uma-sp-3); }
/* FAB から開くもの。.uma-overlay の中央寄せを解いて、メインボタンの真上・右揃えに置く（右端の計算は .uma-fab-nav と同じ） */
.uma-popover--fab {
	left: auto; top: auto; transform: none;
	right: var(--uma-fab-edge);
	bottom: calc(var(--uma-fab-edge) + var(--uma-fab-size) + var(--uma-fab-gap) + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 768px) {
	.uma-popover--fab { right: max(var(--uma-fab-edge), calc(50% - 512px)); }
}
/* 引き出しの中の丸ボタン。右下の FAB のメインボタン（.uma-fab-toggle を併用）と同じ黒で、
   一回り小さいだけ。押せるものは黒に揃える（43セッション目に琥珀からこちらへ戻した）。 */
.uma-drawer-fab {
	position: absolute; z-index: 2;
	--uma-fab-size: 48px;
	right: var(--uma-sp-4);
	bottom: calc(var(--uma-sp-4) + env(safe-area-inset-bottom, 0px));
}
.uma-drawer-fab[hidden] { display: none !important; }
/* 引き出しの中で開くもの。丸ボタンの真上に浮かせる */
.uma-popover--drawer {
	position: absolute; z-index: 3;
	right: var(--uma-sp-4);
	bottom: calc(var(--uma-sp-4) + 48px + var(--uma-sp-3) + env(safe-area-inset-bottom, 0px));
	width: min(calc(100% - var(--uma-sp-4) * 2), 400px);
	max-height: 60%;
}

.help-dialog { width: min(92vw, 640px); max-height: min(88vh, 720px); max-height: min(88dvh, 720px); }
.help-head {
	flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
	gap: var(--uma-sp-3); padding: var(--uma-sp-3) var(--uma-sp-3) var(--uma-sp-3) var(--uma-sp-5);
	border-bottom: 1px solid var(--uma-border);
}
.help-title {
	margin: 0; display: flex; align-items: center; gap: var(--uma-sp-2);
	font-size: var(--uma-fs-md); line-height: var(--uma-lh-md); font-weight: 700; color: var(--uma-text-heading);
}
.help-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--uma-sp-5); }
.help-foot {
	flex-shrink: 0; display: flex; justify-content: flex-end;
	padding: var(--uma-sp-3) var(--uma-sp-5); border-top: 1px solid var(--uma-border);
}
.help-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--uma-sp-4); }
.help-steps > li { display: flex; gap: var(--uma-sp-3); align-items: flex-start; }
.help-num {
	flex: none; width: 24px; height: 24px; border-radius: var(--uma-r-full);
	display: flex; align-items: center; justify-content: center;
	font-size: var(--uma-fs-xs); font-weight: 700;
	background: var(--uma-surface-inverse); color: var(--uma-text-inverse);
}
.help-step-title { margin: 0 0 var(--uma-sp-1); font-size: var(--uma-fs-md); line-height: var(--uma-lh-md); font-weight: 700; color: var(--uma-text-heading); }
.help-step-text { margin: 0; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-md); color: var(--uma-text-muted); }
.help-step-text + .help-step-text { margin-top: var(--uma-sp-1); }
.help-step-text[hidden] { display: none !important; }
.help-tips {
	margin-top: var(--uma-sp-5); padding: var(--uma-sp-3) var(--uma-sp-4);
	border: 1px solid var(--uma-warn-border); border-radius: var(--uma-r-lg); background: var(--uma-warn-bg);
}
.help-tips-title { margin: 0 0 var(--uma-sp-1-5); display: flex; align-items: center; gap: var(--uma-sp-1-5); font-size: var(--uma-fs-sm); font-weight: 700; color: var(--uma-warn-text); }
.help-tips ul { margin: 0; padding-left: var(--uma-sp-4); font-size: var(--uma-fs-sm); line-height: var(--uma-lh-md); color: var(--uma-warn-text); }
.help-tips li + li { margin-top: var(--uma-sp-1); }
/* ============================================================
 * UIの切り替えを知らせるモーダル
 * 既定を新UIにしたことは利用者が頼んだ変化ではないので、画面の中の案内枠ではなく
 * 一度だけ手前に出して確実に伝える。以後は右上のバッジから読み直せる。
 * ============================================================ */
.notice-dialog { width: min(92vw, 420px); max-height: min(88vh, 640px); max-height: min(88dvh, 640px); }
.notice-body { padding: var(--uma-sp-6) var(--uma-sp-5) var(--uma-sp-4); text-align: center; overflow-y: auto; }
.notice-icon {
	width: 48px; height: 48px; margin: 0 auto var(--uma-sp-3);
	display: flex; align-items: center; justify-content: center;
	border-radius: var(--uma-r-full);
	background: var(--uma-accent-soft); color: var(--uma-accent);
}
.notice-title {
	margin: 0 0 var(--uma-sp-2-5);
	font-size: var(--uma-fs-lg); line-height: var(--uma-lh-lg); font-weight: 700; color: var(--uma-text-heading);
}
.notice-text { margin: 0; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-md); color: var(--uma-text-muted); }
.notice-text + .notice-text { margin-top: var(--uma-sp-3); }
.notice-foot {
	flex-shrink: 0; padding: 0 var(--uma-sp-5) var(--uma-sp-5);
}
/* ✕はカードの右上に浮かせる（見出しを中央に置きたいので、頭に行を作らない） */
.notice-close { position: absolute; top: var(--uma-sp-2); right: var(--uma-sp-2); }

/* 右上の「新UI」バッジ。押すと告知を読み直せる。
   色はそのスコープのアクセント（special は .deck-accent を付けて Deck の色、exam はページの青）。 */
.ui-mode-badge {
