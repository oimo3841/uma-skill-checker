		.uma-fab-nav.open .uma-fab-item:nth-last-child(7) { transition-delay: .15s; }
		.fab-set-icon { background: var(--uma-surface-muted); color: var(--uma-text-heading); }
		.fab-race-label { display: inline-flex; align-items: baseline; gap: var(--uma-sp-1-5); min-width: 0; }
		.fab-race-text { font-size: var(--uma-fs-xs); font-weight: 600; color: var(--uma-text-muted); max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.fab-race-text[hidden] { display: none; }
		/* 親A／親Bセットのタブ（③）の色。結果の表と同じ変数（.person-col-blue / .person-col-red）を、
		   共有部品の色付きタブ（css/shell.css の .uma-subtab--tinted）の変数へ写す。 */
		.uma-subtab.person-col-blue, .uma-subtab.person-col-red {
			--uma-subtab-tint-bg: var(--person-bg); --uma-subtab-tint-fg: var(--person-fg); --uma-subtab-tint-line: var(--person-border-strong); }

		/* このツールのアクセント。UmaStar OCR は「読み取って登録する」画面なので緑。
		   共通部品（ボタン・入力欄・フォーカス輪郭）はこの変数を見て色が決まる。
		   値は Tailwind v4.1.11 のパレット実測値。
		   FAB の寸法は css/shell.css の :root が持つ。影だけはツールの色に合わせてここで上書きする。 */
		:root {
			--uma-accent: #00a63e;            /* green-600 */
			--uma-accent-hover: #008236;      /* green-700 */
			--uma-accent-soft: #dbfce7;       /* green-100 */
			--uma-accent-soft-text: #016630;  /* green-800 */
			--uma-accent-border: #b9f8cf;     /* green-200 */
			--uma-accent-ring: #008236;       /* green-700 */
			/* 右下のメインボタンは3ツール共通の黒（tokens.css の --uma-fab-bg）になったので、
			   影もページの色ではなく shell.css の既定（暗い中間色）に任せる。ここで上書きしない。 */
		}
		body {
			background-color: #f4faf0;
			background-image:
				repeating-linear-gradient(115deg, rgba(59, 109, 17, 0.05) 0px, rgba(59, 109, 17, 0.05) 40px, transparent 40px, transparent 80px),
				radial-gradient(ellipse 720px 300px at 50% -4%, rgba(214, 240, 200, 0.65), transparent 70%),
				radial-gradient(ellipse 600px 260px at 90% 100%, rgba(250, 231, 175, 0.25), transparent 70%),
				linear-gradient(180deg, #f2f9ec 0%, #f8faf5 42%, #ffffff 100%);
			background-repeat: repeat, no-repeat, no-repeat, no-repeat;
			background-attachment: fixed, fixed, fixed, fixed;
		}
		/* .glass-card / :focus-visible / prefers-reduced-motion は css/common.css へ移した。
		   （両ツールで同じ意図の定義が別々に存在していたため） */
		.result-table { border-collapse: separate; border-spacing: 0; width: 100%; }
		.result-table th {
			background-color: var(--uma-surface-muted); font-weight: 600;
			font-size: var(--uma-fs-sm); line-height: var(--uma-lh-sm); color: var(--uma-text-muted);
			border-bottom: 2px solid var(--uma-border); padding: var(--uma-sp-3) var(--uma-sp-4);
		}
		.result-table td {
			border-bottom: 1px solid var(--uma-surface-muted);
			padding: var(--uma-sp-3) var(--uma-sp-4);
			font-size: var(--uma-fs-md); line-height: var(--uma-lh-md);
		}
		.result-table tr:hover td { background-color: var(--uma-surface-sunken); }
		/* C-238: スキル名は説明の小窓を開くボタン（②のパネルの名前と同じ下線）。回復・デバフ・パッシブの文字の色は core のクラス（usd-roster-skillname--*）。
		   因子（◆♡）はスキルではないので文字のまま */
		.result-skillname { font: inherit; background: transparent; border: 0; padding: 0; cursor: pointer; text-align: left;
			text-decoration: underline; text-decoration-color: var(--uma-border-strong); text-underline-offset: 2px; }
		.result-skillname:not([class*="usd-roster-skillname--"]) { color: inherit; }
		.result-skillname:hover { text-decoration-color: currentColor; }

		/* ===== 結果表の人物列 =====
		   親Aセット＝青系統／親Bセット＝赤系統。値は Tailwind v4 のパレット実測値。
		   以前はインラインstyleで当てていた（「クラスでは優先度で負ける」ため、と
		   コメントに残っていた）が、Tailwindのユーティリティは @layer utilities に
		   入るため、レイヤーに属さないこの指定の方が強い。前提が変わったのでクラスに戻した。
		   exam.html を合流させるときは、このブロックごと共通化できる。 */
		.person-col-blue { --person-bg: #eff6ff; --person-fg: #193cb8; --person-border-strong: #8ec5ff; --person-border-soft: #bedbff; --person-tint: rgba(43, 127, 255, .07); }
		.person-col-red  { --person-bg: #fef2f2; --person-fg: #9f0712; --person-border-strong: #ffa2a2; --person-border-soft: #ffc9c9; --person-tint: rgba(251, 44, 54, .07); }
		.result-table th.person-col { background-color: var(--person-bg); color: var(--person-fg); }
		.result-table td.person-col { background-color: var(--person-tint); }
		.result-table th.person-col.person-set-boundary { border-left: 2px solid var(--person-border-strong); }
		.result-table td.person-col.person-set-boundary { border-left: 2px solid var(--person-border-soft); }
		.result-table th.person-total { background-color: var(--uma-surface-muted); color: var(--uma-text-heading); border-left: 2px solid var(--uma-border-strong); }
		.result-table td.person-total { background-color: var(--uma-surface-sunken); border-left: 2px solid var(--uma-border); }
		.found { color: var(--uma-success); font-weight: 600; }
		.not-found { color: var(--uma-text-faint); }
		/* Tailwindのユーティリティは @layer utilities に入るため、レイヤーに属さない
		   このルールの方が強い。以前は !important で押していたが不要になった。 */
		.drop-active { border-color: var(--uma-control-mark); background-color: var(--uma-control-soft); transform: scale(1.005); }
		.dev-log {
			font-family: var(--uma-font-mono);
			font-size: var(--uma-fs-xs); line-height: 1.6; white-space: pre-wrap; word-break: break-all;
		}
		#debug-preview canvas {
			max-width: 100%; border: 1px solid var(--uma-border); border-radius: var(--uma-r-md); background: var(--uma-surface);
		}
		#toast {
			transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
			/* 引き出し（z-index:100）より前に出す。引き出しの中の操作
			   （「まとめてコピー」など）もトーストで結果を知らせるため、
			   Tailwindの z-50 のままだと引き出しの裏に隠れて見えない。 */
			z-index: 110;
		}
		.star-cell { font-weight: 700; letter-spacing: 0.05em; }
		/* ★の数のコピー元。「スプレッドシート貼り付け用データ」の窓としては出さないが、
		   値をコピーするために DOM には残す。display:none だと選択できなくなるので、
		   画面の外へ追い出す形で隠す。 */
		.copy-source-hidden { position: absolute; width: 1px; height: 1px; margin: -1px;
			padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

		/* ステップのタブ・FAB・引き出し・ダイアログ（ガイド／告知）・「新UI」バッジの骨格は
		   css/shell.css へ移した（exam.html と共有するため）。Deck（藍）のスコープ
		   .btn-deck-accent / .deck-accent は css/tokens.css にある。 */

		/* 旧UIの画面先頭の注記（更新終了。2026-09-15 片道化）。共有CSSは触らず、このページに閉じる。
		   色は css/tokens.css の警告の色（不透明。opacity は使わない。B節ルール9・F-7）。
		   display は指定していないので hidden 属性はそのまま効く。 */
		.old-ui-end-note {
			margin-bottom: var(--uma-sp-6);
			padding: var(--uma-sp-4) var(--uma-sp-5);
			border: 1px solid var(--uma-warn-border);
			border-radius: var(--uma-r-xl);
			background: var(--uma-warn-bg);
			color: var(--uma-warn-text);
		}
		.old-ui-end-note-title { margin: 0 0 var(--uma-sp-1); font-size: var(--uma-fs-md); line-height: var(--uma-lh-md); font-weight: 700; }
		.old-ui-end-note-text { margin: 0; font-size: var(--uma-fs-sm); line-height: var(--uma-lh-md); text-wrap: pretty; }
		.old-ui-end-note-nb { white-space: nowrap; }  /* 「新UIへ」の途中で折り返さない（375px） */
		/* 告知の文面の改行位置を整える（exam.html と同じ .nb。C-62 の (11)） */
		.nb { white-space: nowrap; }
		/* 収録の告知（C-100）が layout／alpha の告知と同じモーダルに並ぶときは、線で区切って印を出さない。
		   special だけの節なので共通CSS（shell.css）には置かない。 */
		.notice-catalog--with { margin-top: var(--uma-sp-4); padding-top: var(--uma-sp-4); border-top: 1px solid var(--uma-border); }
		.notice-catalog--with .notice-icon { display: none; }
		.notice-catalog--with .notice-title { margin-bottom: 0; font-size: var(--uma-fs-md); }

		/* ===== C-144（2026-10-12）: UmaStar の配色（ライト＝暖色・ダーク＝ほぼモノトーン）。ライト・ダークのメリハリ =====
		   面は4層（ページ → カード → パネル → オプション）。内側ほど明るく、層の区切りは塗りの明度差と枠線の両方で取る（ゲート G3）。
		   操作色は濃い茶（ダークは暖かい灰の塗り＋明るい縁）。値の一覧と根拠は DECISIONS の C-144。
		   結合画像（canvas）が読むトークン（印の色・シナリオ因子・遺伝子）は変えていない。タイトルの緑（UmaStar）も変えない */
		:root {
			--uma-glass-bg: #f6eedf; --uma-card-border: #c9b490; --uma-card-shadow: 0 2px 10px rgba(110, 80, 30, .18);
			--uma-panel-bg: #fbf6ec; --uma-panel-border: #bfa982;
			--uma-surface: #fffdf8; --uma-option-border: #b49c72;
			--uma-surface-sunken: #fbf6ec; --uma-surface-muted: #efe4cf; --uma-surface-group: #efe4cf;
			--uma-text: #2a2216; --uma-text-heading: #2a2216; --uma-text-muted: #4a3e2c; --uma-text-subtle: #6a5b45; --uma-text-faint: #716250;
			--uma-border: #cdbb9f; --uma-border-strong: #b49c72; --uma-dash: #ad9670;
			--uma-control: #43321a; --uma-control-hover: #33260f; --uma-control-soft: #efe4cf; --uma-control-border: #b49c72;
			--uma-aux-bg: #fffdf8; --uma-aux-border: #b49c72; --usd-ui-line: #8f7a52;
			--uma-control-rim: 0 0 0 1px var(--uma-control);   /* 選んでいる塗りの部品は、ライトでも縁を 2px にして太さでも示す */
			--uma-surface-inverse: #43321a;
			--uma-band: #efe4cf; --uma-group-bg: #fffdf8; --uma-group-line: #bfa982; --uma-config-bg: #fbf6ec;
			--uma-table-rule: #c9b693; --uma-table-rule-strong: #b49c72; --uma-table-head-bg: #fbf6ec;
			--uma-table-col-alt: #f8f1e3; --uma-table-col-key: #f1e6d2; --uma-table-cell-bg: #fffdf8;
			--uma-gold-row-bar: #ffc83d;   /* 金スキルの行・進化の小窓の金スキルの見出しの左バー（ダークと同じ色） */
			--uma-drawer-bg: #f6eedf;
			--star-page: #efe6d8; --star-stripe: rgba(120, 90, 40, .05);
			--star-head-l: #f1e0c4; --star-head-m: #fbf6ea; --star-head-r: #fdf6e0; --star-head-line: #c9b490;
			--star-hl: #e69a00; --star-hl-shadow: 0 1px 0 rgba(90, 50, 0, .5);
			--star-img-count: rgba(50, 35, 10, .80);
			--star-badge-green-bg: #cdebd3; --star-badge-green-text: #1d5a35; --star-badge-green-line: #86bf98;
			--star-badge-red-bg: #fde3e0; --star-badge-red-text: #a3221a; --star-badge-red-line: #e29a94;
			--star-tabnum-bg: var(--uma-surface-muted); --star-tabnum-text: var(--uma-text-subtle);
			/* 注意の文字（amber-700）は、カードの暖色の地の上で 4.5 になるよう、色相を保って明度だけ下げる */
			--color-amber-700: #af4801;
			/* Tailwind の灰（slate）を、このページの暖色の段に置き換える（50〜300 が面と線、400〜950 が文字） */
			--color-white: #fffdf8;
			--color-slate-50: #fbf6ec; --color-slate-100: #f1e8d8; --color-slate-200: #cdbb9f; --color-slate-300: #b49c72;
			--color-slate-400: #716250; --color-slate-500: #6a5b45; --color-slate-600: #54472f; --color-slate-700: #3d3120;
			--color-slate-800: #2a2216; --color-slate-900: #1f190f; --color-slate-950: #15110a;
		}
		:root[data-theme="dark"] {
			--uma-page-ground: #181716;
			--uma-glass-bg: #232220; --uma-card-border: #5c5a55; --uma-card-shadow: 0 4px 16px rgba(0, 0, 0, .35);
			--uma-panel-bg: #2c2b29; --uma-panel-border: #6a675f;
			--uma-surface: #363431; --uma-option-border: #7d7a71;
			--uma-surface-sunken: #2c2b29; --uma-surface-muted: #403e39; --uma-surface-group: #2c2b29;
			--uma-text: #f3f1ec; --uma-text-heading: #f3f1ec; --uma-text-muted: #dcd8cf; --uma-text-subtle: #bdb9b0; --uma-text-faint: #a9a59a;
			--uma-border: #5c5a55; --uma-border-strong: #7d7a71; --uma-dash: #7d7a71;
			--uma-control: #4d4a44; --uma-control-hover: #5a564f; --uma-control-text: #ffffff; --uma-control-edge: #e9e3d6;
			--uma-control-rim: 0 0 0 1px #e9e3d6; --uma-control-mark: #e6e0d2; --uma-control-soft: #403e39; --uma-control-border: #7d7a71;
			--uma-aux-bg: #363431; --uma-aux-border: #a9a59a; --usd-ui-line: #a9a59a;
			--uma-control-disabled: #7d7a71; --uma-control-disabled-bg: #2c2b29;
			--uma-surface-inverse: #e6e0d2; --uma-text-inverse: #232220;
			--uma-band: #3a3834; --uma-group-bg: #2c2b29; --uma-group-line: #6a675f; --uma-config-bg: #1d1c1a;
			--uma-table-rule: #5c5a55; --uma-table-rule-strong: #7d7a71; --uma-table-head-bg: #2c2b29;
			--uma-table-col-alt: #32312e; --uma-table-col-key: #2c2b29; --uma-table-cell-bg: #262523;
			--uma-gold-row-bg: #5e4510; --uma-gold-row-bar: #ffc83d; --uma-gold-row-text: #ffe08a;
			--uma-drawer-bg: #1d1c1a;
			--star-head-l: #3a3830; --star-head-m: #232220; --star-head-r: #33322c; --star-head-line: #6a675f;
			--star-hl: #ffc21a; --star-hl-shadow: 0 1px 0 rgba(0, 0, 0, .45);
			--star-img-count: rgba(8, 8, 6, .82);
			--star-badge-green-bg: #1b5340; --star-badge-green-text: #a0f0cb; --star-badge-green-line: #3fa27a;
			--star-badge-red-bg: #7a2a3a; --star-badge-red-text: #ffd0d6; --star-badge-red-line: #ff8a9a;
			--star-tabnum-bg: #403e39; --star-tabnum-text: #cfcbc0;
			--color-amber-700: oklch(87.9% 0.169 91.605);
			/* サポカの種類（チップ・列見出し）: 濃い地・明るい枠・白い文字 */
			--uma-card-type-1-bg: #1f4a8a; --uma-card-type-1-border: #6aa3ff; --uma-card-type-1-text: #ffffff;
			--uma-card-type-2-bg: #7a2a3a; --uma-card-type-2-border: #ff8a9a; --uma-card-type-2-text: #ffffff;
			--uma-card-type-3-bg: #7a3d12; --uma-card-type-3-border: #ff9f5a; --uma-card-type-3-text: #ffffff;
			--uma-card-type-4-bg: #7a2a5a; --uma-card-type-4-border: #ff8ac8; --uma-card-type-4-text: #ffffff;
			--uma-card-type-5-bg: #1d6a45; --uma-card-type-5-border: #66d19a; --uma-card-type-5-text: #ffffff;
			--uma-card-type-6-bg: #7a5f12; --uma-card-type-6-border: #ffd24a; --uma-card-type-6-text: #ffffff;
			--color-white: var(--uma-surface);
			--color-slate-50: #2c2b29; --color-slate-100: #363431; --color-slate-200: #5c5a55; --color-slate-300: #7d7a71;
			--color-slate-400: #a9a59a; --color-slate-500: #bdb9b0; --color-slate-600: #cfcbc0; --color-slate-700: #e0dcd2;
			--color-slate-800: #f3f1ec; --color-slate-900: #f7f5f1; --color-slate-950: #fbfaf7;
		}
		/* ページ（縞はそのまま。白へ抜ける光とグラデーションは外して、ページの色をそのまま見せる） */
		body {
			background-color: var(--star-page);
			background-image: repeating-linear-gradient(115deg, var(--star-stripe) 0px, var(--star-stripe) 40px, transparent 40px, transparent 80px);
			background-repeat: repeat; background-attachment: fixed;
		}
		:root[data-theme="dark"] body { background: var(--uma-page-ground); }
		/* ヘッダーの帯と枠 */
		.site-header { background-image: linear-gradient(90deg, var(--star-head-l) 0%, var(--star-head-m) 50%, var(--star-head-r) 100%); border-color: var(--star-head-line); }
		/* タイトルの強調黄（色はくすませず、細い影で縁を出す。UmaStar の緑はそのまま） */
		.site-header h1 .text-amber-400 { color: var(--star-hl); text-shadow: var(--star-hl-shadow); }
		/* カード（帯の sticky の地もカードの色） */
		.glass-card { background: var(--uma-glass-bg); box-shadow: var(--uma-card-shadow); }
		.deck-set-bar { background: var(--uma-glass-bg); border-bottom-color: var(--uma-border); }
		/* パネル（カードの中の一段）とオプション */
		.glass-card .bg-slate-50\/50 { background-color: var(--uma-panel-bg); border-color: var(--uma-panel-border); }
		/* タブの番号の丸（選ぶ前）・バッジ（淡色・押せない。緑＝ピル「2nd Edition」と②の件数、赤＝①の件数） */
		.step-tab-num { background: var(--star-tabnum-bg); color: var(--star-tabnum-text); }
		.step-tab-badge--ready { background: var(--star-badge-green-bg); color: var(--star-badge-green-text); border-color: var(--star-badge-green-line); }
		.step-tab-badge--ready { box-shadow: inset 0 0 0 1px var(--star-badge-green-line); }
		.step-tab-badge--alert { background: var(--star-badge-red-bg); color: var(--star-badge-red-text); border-color: var(--star-badge-red-line); }
		/* ==== 段G(6) 操作できる部品の強調（UmaStar だけ。Exam・Deck は変えない）====
		   4段階: 通常＝細い枠（1px）／設定済み＝細い枠＋うすい地色／選択中＝太い枠（2px。排他の選択＝どれか1つが選ばれている状態だけ）／
		   主な操作＝塗りつぶし（1画面に1つ。.uma-btn--primary）。
		   色は今のトークンだけ: 選択中の枠＝--uma-control-mark（ライトは濃い茶・ダークはクリーム色の輪）、設定済みの地＝--uma-control-soft。新しい色相は作らない。
		   細い枠だけ、地との差が 3:1 に届くよう、同じ色相のまま少し濃い値 --usd-ui-line を置いた（ライト #8f7a52・ダークは今の --uma-aux-border のまま）。
		   2px は「1px の枠＋内側の 1px の輪」にして、部品の大きさを変えない。 */
		:root { --usd-ui-sel: var(--uma-control-mark); --usd-ui-set: var(--uma-control-soft); }
		/* 通常 */
		body .usd-setbar-race, body .usd-roster-filtersel, body .usd-roster-togglebtn, body .usd-out-segbtn, body .usd-roster-pill,
		body .usd-roster-linkbtn, body .usd-circle-mark {

		else if (SCENE === 'v-remove') t25Scene({ query: '真髄', queueN: 6, removeName: 'レースの真髄・力' });
		else if (SCENE === 'v-zero') t25Scene({ query: '真髄だいすき' });
		else if (SCENE === 'v-pc') t25Scene({ query: 'コーナー', queueNames: ['中距離コーナー○', '差しコーナー○'], active: 4 });
		else if (SCENE === 'v-mix') t25Scene({ query: 'コーナー', queueNames: ['中距離コーナー○', '差しコーナー○'] });
		else if (SCENE === 'f-now') filterScene(null);
		else if (/^f-[ab][ab]$/.test(SCENE || '')) filterScene(SCENE[2], SCENE[3]);
		else if (SCENE === 'p-now') passiveScene(null);
		else if (SCENE === 'p-a') passiveScene('a');
		else if (SCENE === 'p-b') passiveScene('b');
		else if (SCENE === 'e-entry') entryScene();
		else if (SCENE === 't-empty') textScene({});
		else if (SCENE === 't-query') textScene({ query: '真髄' });
		else if (SCENE === 't-added') textScene({ query: '真髄', addN: 3 });
		else if (SCENE === 't-zero') textScene({ query: '真髄だいすき' });
		else if (SCENE === 't-pc') textScene({ query: '真髄', addN: 1, active: 2 });
		// 「×」で閉じる（モックなので一覧へ戻る）
		document.addEventListener('click', function (e) {
			var c = e.target.closest && e.target.closest('[data-usd-act="picker-close"], [data-usd-el="info-close"]');
			if (c) location.href = '?' + (Q.get('theme') ? 'theme=' + Q.get('theme') : '');
		});
	</script>
</body>
</html>
