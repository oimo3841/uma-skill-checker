<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow, noarchive" />
	<meta name="referrer" content="no-referrer" />
	<!-- 外へは何も送らない・何も読まない（このページの中だけで完結する） -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
	<title>Deck の大きさと速さの計測（作業用）</title>
	<!--
		新しい Deck（作り直しの段1・調査C。T74・2026-11-02）で、親とスキルの数を増やしたときに
		データの大きさ・表の描画・「2組を探す」がどれだけかかるかを測るページ。
		**ツール本体には組み込まない**（lab/video-diag.html と同じ扱い。どのページからもリンクしない）。
		おいもさんが iPhone で開いて「4通りを測る」を押し、結果の表のスクリーンショットを返す。

		■ 保存領域に何も書かない
		- 仮のデータはこのページの中（メモリ）だけで作る。localStorage・IndexedDB・Cookie は使わない。
		- 上の Content-Security-Policy で通信（connect-src）とフォームの送信を禁止している。外のファイルも読まない。

		■ 何を測るか（親 100・300人 × スキル 133・500種 の4通り）
		- データ: データの形の第1版の案（報告 T74-deck-data-shape-report の 1.）で仮の親を作り、JSON にしたときの大きさ・
		  書き出し（JSON.stringify）と読み込み（JSON.parse ＋ 表示用の形への展開）の時間。
		- 表の描画: 全体（キャンバス）・縮小・拡大の3段階。描き方は3通り。
		  (a) モック版8 と同じ（1マスごとに色を getComputedStyle で読み、style に書き、マスごとに押したときの処理を付ける）
		  (b) 色を先に1回だけ読み、マスは class で色を付け、押したときの処理は表に1つだけ
		  (c) 見える範囲だけ描く（縮小・拡大。最初の描画と、表を動かしたときの描き直し10回の平均）
		  時間は「処理（js）」「配置まで（強制レイアウト）」「画面に出るまで（次の描画のあと）」の3つを取り、表には「画面に出るまで」を出す。
		- 2組を探す: 表示中の親から2家系を選ぶ全組み合わせを数える。(a) モック版8 と同じ（真偽の配列・組ごとに遺伝子を数え直す・全部並べ替える）
		  (b) ビット列（家系ごとに持つスキルを32本ずつの整数に詰め、OR と1の数え上げ。上位8組だけ残す）
		- 繰り返し: 表は3回（1回目が3秒を超えたら1回だけ）、2組は5回。中央値を出す。
	-->
	<style>
		:root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --sub: #666; --line: #d0d0d0; --ok: #0a7d32; --ng: #b3261e; --warn: #9a5b00; --box: #f4f4f4;
			--surface: #fff; --ink: #1d1d1f; --muted: #666; --h0: #F3F5F8; --h1: #C9DCEE; --h2: #6F9FD0; --h3: #1F4E85; --unk: #B8BEC7; --gp: #9AA6B4; --sel: #26292E; --friend: #A8501E; }
		@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --sub: #aaa; --line: #444; --ok: #6fd28f; --ng: #ff8a80; --warn: #f0b860; --box: #232323;
			--surface: #161616; --ink: #eee; --muted: #aaa; --h0: #222831; --h1: #2D4A6B; --h2: #4F86C0; --h3: #A9CBF0; --unk: #56606C; --gp: #6B7787; --sel: #E6E9EE; --friend: #F2A273; } }
		body { margin: 0; padding: 8px 10px 40px; background: var(--bg); color: var(--fg); font: 11px/1.4 -apple-system, system-ui, sans-serif; }
		main { max-width: 1100px; margin: 0 auto; }
		h1 { font-size: 15px; margin: 0 0 6px; }
		h2 { font-size: 12px; margin: 10px 0 2px; }
		.box { background: var(--box); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
		.ua { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
		.ok { color: var(--ok); font-weight: 700; }
		.ng { color: var(--ng); font-weight: 700; }
		.warn { color: var(--warn); font-weight: 700; }
		button.go { font-size: 15px; padding: 8px 14px; margin: 6px 6px 0 0; }
		#now { margin: 6px 0; font-weight: 700; min-height: 1.4em; }
		table.res { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
		table.res th, table.res td { border-top: 1px solid var(--line); padding: 2px 3px; text-align: right; white-space: nowrap; }
		table.res th:first-child, table.res td:first-child { text-align: left; white-space: normal; }
		table.res thead th { border-top: 0; color: var(--sub); font-weight: 600; }
		table.res tr.sec td { color: var(--sub); font-weight: 700; text-align: left; padding-top: 6px; }
		#txt { width: 100%; box-sizing: border-box; height: 7em; font: 10px/1.3 ui-monospace, Menlo, monospace; }
		#stage { position: relative; height: 420px; overflow: auto; border: 1px solid var(--line); margin-top: 8px; background: var(--surface); color: var(--ink); }
		#stage canvas { display: block; }
		/* 表（モック版8 の .hm の写し。opacity だけは (b)(c) で使わない） */
		table.hm { border-collapse: separate; border-spacing: 0; font-size: 11px; }
		.hm th, .hm td { padding: 0; }
		.hm thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; vertical-align: bottom; border-bottom: 1px solid var(--line); }
		.hm tbody th { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line); padding: 0 6px; }
		.hm thead th.corner { left: 0; z-index: 3; text-align: left; padding: 4px 6px; font-weight: 500; color: var(--muted); }
		.hm td { border-right: 1px solid var(--surface); border-bottom: 1px solid var(--surface); text-align: center; position: relative; }
		.hm td.gp::after { content: ""; position: absolute; right: 2px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--gp); }
		.hm td.low { opacity: .35; }
		.hm td.unk { background-image: repeating-linear-gradient(45deg, var(--unk) 0 2px, transparent 2px 5px); }
		.hm .cnt { color: var(--muted); font-size: 10px; text-align: center; background: var(--surface); font-weight: 500; }
		.hm .vt { writing-mode: vertical-rl; white-space: nowrap; margin: 0 auto; line-height: 1.1; }
		.hm .cn { display: block; font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px; border-top: 1px solid var(--line); padding-top: 2px; }
		.hm th.fr .vt { color: var(--friend); font-weight: 700; }
		/* (b)(c) の色は class で */
		.hm td.c0 { background-color: var(--h0); color: var(--ink); } .hm td.c1 { background-color: var(--h1); color: var(--ink); }
		.hm td.c2 { background-color: var(--h2); color: var(--surface); } .hm td.c3 { background-color: var(--h3); color: var(--surface); }
		.hm td.lw { background-color: var(--h0); color: var(--muted); }
		/* (c) 見える範囲だけ */
		.vw-sizer { position: relative; }
		.vw-part { position: absolute; }
	</style>
</head>
<body>
<main>
	<h1>Deck の大きさと速さの計測（作業用・T74）</h1>
	<div class="box">
		<div class="ua" id="ua"></div>
		<div id="env"></div>
	</div>
	<button class="go" id="go-all" type="button">4通りを測る</button>
	<button class="go" id="go-small" type="button">親100×スキル133 だけ</button>
	<div id="now"></div>
	<h2>結果（中央値・ms。画面に出るまで）</h2>
	<table class="res"><thead id="res-h"></thead><tbody id="res-b"></tbody></table>
	<p style="color:var(--sub);margin:4px 0">色：<span class="ok">100ms 以下</span>・<span class="warn">500ms 以下</span>・<span class="ng">それより遅い</span>（目安。報告 T74 の 3.）。「5MB比」は 5MB（5,000,000 バイト）に対する割合で、/2 は1文字2バイトで数える保存先の場合。</p>
	<h2>文字の結果（写す用）</h2>
	<textarea id="txt" readonly></textarea>
	<div id="stage"></div>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stage = $('stage');
const COMBOS = [[100, 133], [100, 500], [300, 133], [300, 500]];
const QUOTA = 5000000;

/* ── 端末 ─────────────────────── */
$('ua').textContent = navigator.userAgent;
$('env').textContent = '画面 ' + screen.width + '×' + screen.height + '・dpr ' + devicePixelRatio + '・表示幅 ' + innerWidth + '・' + (navigator.hardwareConcurrency || '?') + 'コア';

/* ── 仮のデータ（データの形の第1版の案のとおりに作る） ─────────────────────── */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIST = ['short', 'mile', 'medium', 'long'], STY = ['nige', 'senko', 'sashi', 'oikomi'], SURF = ['turf', 'dirt'];
const STATS = ['speed', 'stamina', 'power', 'guts', 'wit'];
const APT = SURF.concat(DIST, STY);
const GENE = { turf: 'ap-turf', dirt: 'ap-dirt', short: 'ap-short', mile: 'ap-mile', medium: 'ap-medium', long: 'ap-long', nige: 'ap-nige', senko: 'ap-senko', sashi: 'ap-sashi', oikomi: 'ap-oikomi' };
const pick = (r, a) => a[Math.floor(r() * a.length)];
const pad = (n, w) => String(n).padStart(w, '0');

// スキルの ID は公開データと同じ形：マスターは '1'〜'445'、拡張スキルは 'ex-0001'…（445 を超える分）
function skillIds(n, r) {
	if (n > 445) { const a = []; for (let i = 1; i <= 445; i++) a.push(String(i)); for (let i = 1; a.length < n; i++) a.push('ex-' + pad(i, 4)); return a; }
	const all = []; for (let i = 1; i <= 445; i++) all.push(i);
	for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
	return all.slice(0, n).sort((a, b) => a - b).map(String);
}

function makeDoc(nP, nS, seed) {
	const r = rng(seed);
	const ids = skillIds(nS, r);
	// スキルの性質（モック版8 の確率の作りに合わせる：ふつう .07・サポカ外 .15・シナリオ .2、距離・脚質の指定つきは合う親で出やすい）
	const attr = ids.map(() => { const q = r(); return { p: q < .7 ? .07 : q < .9 ? .15 : .2, d: r() < .25 ? pick(r, DIST) : null, s: r() < .25 ? pick(r, STY) : null }; });
	const bundles = [
		{ id: 'b1', name: '11月LoH', dist: 'medium', surface: 'turf' },
		{ id: 'b2', name: '10月CM', dist: 'mile', surface: 'turf' },
		{ id: 'b3', name: '12月CM', dist: 'long', surface: 'turf' },
		{ id: 'b4', name: '9月LoH', dist: 'mile', surface: 'dirt' }
	];
	const whites = (b, st, rich, keep) => {
		const o = {};
		for (let k = 0; k < ids.length; k++) {
			const a = attr[k]; let p = a.p;
			if (a.d) p = a.d === b.dist ? p + .35 : p * .4;
			if (a.s) p = a.s === st ? p + .3 : p * .5;
			if (rich) p = Math.min(.85, p * 1.7);
			if (r() >= p) continue;
			if (keep && r() >= keep) continue;
			const q = r(); o[ids[k]] = r() < .03 ? -1 : q < .5 ? 1 : q < .85 ? 2 : 3;
		}
		return o;
	};
	const genes = (b, st) => {
		const q = r(), n = q < .25 ? 0 : q < .6 ? 1 : q < .85 ? 2 : 3, want = [b.surface, b.dist, st], o = {};
		for (let g = 0; Object.keys(o).length < n && g < 20; g++) { const k = r() < .7 ? pick(r, want) : pick(r, APT); if (!o[GENE[k]]) o[GENE[k]] = 1 + Math.floor(r() * 3); }
		return o;
	};
	const factors = (b) => ({ blue: [pick(r, STATS), 1 + Math.floor(r() * 3)], red: [r() < .6 ? b.dist : pick(r, APT), 1 + Math.floor(r() * 3)], green: 1 + Math.floor(r() * 3) });
	const parents = [];
	const base = Date.UTC(2026, 7, 1);
	for (let j = 0; j < nP; j++) {
		const b = pick(r, bundles), st = pick(r, STY), owner = r() < .1 ? 'friend' : 'self';
		const day = new Date(base + Math.floor(j * 90 / nP + r()) * 86400000);
		const p = {
			id: 'p' + (j + 1),
			uma: 'uma-' + pad(1 + Math.floor(r() * 272), 4),
			date: day.toISOString().slice(0, 10), no: 0, owner,
			bundles: [b.id], tags: { dist: [b.dist], style: [st], surface: [b.surface] }
		};
		if (r() < .3) { const s2 = pick(r, STY); if (s2 !== st) p.tags.style.push(s2); }
		if (r() < .2) { const b2 = pick(r, bundles); if (b2.id !== b.id) p.bundles.push(b2.id); }
		Object.assign(p, factors(b));
		p.skills = whites(b, st, owner === 'friend', 0);
		p.genes = genes(b, st);
		p.gp = [];
		for (let k = 0; k < 2; k++) {
			const fr = parents.filter((x) => x.owner === 'friend');
			if (fr.length && r() < .45) p.gp.push({ link: pick(r, fr).id });
			else if (parents.length && r() < .2) p.gp.push({ link: pick(r, parents).id });
			else p.gp.push(Object.assign({ uma: 'uma-' + pad(1 + Math.floor(r() * 272), 4) }, factors(b), { skills: whites(b, st, false, .6), genes: genes(b, st) }));
		}
		parents.push(p);
	}
	const byDate = {};
	parents.forEach((p) => { byDate[p.date] = (byDate[p.date] || 0) + 1; p.no = byDate[p.date]; });
	return {
		doc: { format: 'uma-deck', schema: 1, tool: 'star', savedAt: '2026-11-02T12:00:00+09:00', data: { master: '2026-10-27a', extended: '2026-10-27a', training: '2026-10-26a' }, next: nP + 1, bundles, parents },
		ids
	};
}

/* ── 読み込んだあとの、表示用の形（スキルの並びの番号で引ける配列） ─────────────────────── */
function expand(doc, ids) {
	const ix = new Map(ids.map((id, i) => [id, i]));
	const N = ids.length;
	const dense = (m) => { const a = new Int8Array(N); for (const k in m) { const i = ix.get(k); if (i !== undefined) a[i] = m[k]; } return a; };
	const gl = (m) => Object.keys(m).map((k) => ({ k: k.slice(3), st: m[k] }));
	const byId = new Map();
	const ps = doc.parents.map((p) => {
		const q = { id: p.id, name: 'ウマ娘' + p.uma.slice(4), owner: p.owner, date: p.date, code: p.date + '-' + p.no, keys: [p.tags.surface[0], p.tags.dist[0]].concat(p.tags.style), stars: dense(p.skills), genes: gl(p.genes), gpRaw: p.gp };
		byId.set(p.id, q); return q;
	});
	ps.forEach((q) => {
		q.gp = q.gpRaw.map((g) => (g.link ? byId.get(g.link) : { name: 'ウマ娘' + g.uma.slice(4), stars: dense(g.skills), genes: gl(g.genes) }));
		q.fam = [q, q.gp[0], q.gp[1]];
		delete q.gpRaw;
	});
	// 列の既定は登録日の新しい順
	ps.sort((a, b) => b.date.localeCompare(a.date) || b.code.localeCompare(a.code));
	const ss = ids.map((id, i) => ({ i, id, n: 'スキル' + id + '○' }));
	return { ps, ss };
}

/* ── モック版8 と同じ数え方 ─────────────────────── */
const TH = 1;
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function heat(v) { return v < 0 ? null : cssv('--h' + v); }
function ok(v) { return v < 0 ? TH === 1 : v >= TH; }
function gpOnly(p, i) { if (ok(p.stars[i])) return false; return p.gp.some((g) => ok(g.stars[i])); }
function has(p, i) { return ok(p.stars[i]) || gpOnly(p, i); }
function famHas(p, i) { return p.fam.some((x) => ok(x.stars[i])); }
function geneN(x, keys) { return (x.genes || []).filter((g) => keys.includes(g.k) && g.st >= TH).length; }
function triple(p, i) { const z = (v) => (v >= TH ? v : 0); return z(p.stars[i]) + p.gp.reduce((a, g) => a + z(g.stars[i]), 0); }
function rowMax(ps, i) { return ps.reduce((m, p) => Math.max(m, triple(p, i)), 0); }
function famGenes(p) { return p.fam.reduce((a, m) => a + geneN(m, p.keys), 0); }

/* ── 全体（キャンバス） ─────────────────────── */
// (a) モック版8 の drawOverview と同じ（色は塗るたびに getComputedStyle）
function overviewA(ps, ss) {
	stage.innerHTML = '';
	const W = stage.clientWidth - 2, barT = 22, barR = 26, gap = 2;
	const cw = Math.max(3, Math.floor((W - barR - gap) / ps.length));
	const ch = Math.max(3, Math.min(cw, ss.length > 80 ? 8 : 12));
	const GH = ch * 3 + 4, w = cw * ps.length, h = ch * ss.length;
	const cv = document.createElement('canvas'), dpr = window.devicePixelRatio || 1;
	const CW = w + gap + barR, CH = barT + gap + GH + h;
	cv.width = CW * dpr; cv.height = CH * dpr; cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
	const g = cv.getContext('2d'); g.scale(dpr, dpr);
	const colN = ps.map((p) => ss.filter((s) => has(p, s.i)).length), rowN = ss.map((s) => rowMax(ps, s.i));
	const maxC = Math.max(1, ...colN), maxR = 9;
	g.fillStyle = cssv('--h2');
	ps.forEach((p, x) => { const bh = Math.round((barT - 4) * colN[x] / maxC); g.fillRect(x * cw + 1, barT - bh, Math.max(1, cw - 2), bh); });
	ss.forEach((s, y) => { const bw = Math.round((barR - 4) * rowN[y] / maxR); g.fillRect(w + gap, barT + gap + GH + y * ch + 1, bw, Math.max(1, ch - 2)); });
	ps.forEach((p, x) => { p.fam.forEach((m, k) => { g.fillStyle = heat(geneN(m, p.keys)); g.fillRect(x * cw, barT + gap + k * ch, cw, ch); }); });
	const unk = cssv('--unk'), gpC = cssv('--gp');
	ss.forEach((s, y) => ps.forEach((p, x) => {
		const v = p.stars[s.i], X = x * cw, Y = barT + gap + GH + y * ch;
		if (v < 0) { g.fillStyle = cssv('--h0'); g.fillRect(X, Y, cw, ch); g.fillStyle = unk; g.fillRect(X + cw / 4, Y + ch / 4, cw / 2, ch / 2); }
		else { g.fillStyle = heat(v); g.globalAlpha = (v > 0 && v < TH) ? .35 : 1; g.fillRect(X, Y, cw, ch); g.globalAlpha = 1; if (v === 0 && gpOnly(p, s.i)) { g.fillStyle = gpC; g.globalAlpha = .55; g.fillRect(X + cw * .3, Y + ch * .3, cw * .4, ch * .4); g.globalAlpha = 1; } }
	}));
	stage.appendChild(cv);
}
// (b) 色を先に1回だけ読む。数えるのも1回の走査で
function overviewB(ps, ss) {
	stage.innerHTML = '';
	const H = [0, 1, 2, 3].map((k) => cssv('--h' + k)), unk = cssv('--unk'), gpC = cssv('--gp');
	const W = stage.clientWidth - 2, barT = 22, barR = 26, gap = 2;
	const cw = Math.max(3, Math.floor((W - barR - gap) / ps.length));
	const ch = Math.max(3, Math.min(cw, ss.length > 80 ? 8 : 12));
	const GH = ch * 3 + 4, w = cw * ps.length, h = ch * ss.length;
	const cv = document.createElement('canvas'), dpr = window.devicePixelRatio || 1;
	const CW = w + gap + barR, CH = barT + gap + GH + h;
	cv.width = CW * dpr; cv.height = CH * dpr; cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
	const g = cv.getContext('2d'); g.scale(dpr, dpr);
	const P = ps.length, S = ss.length, colN = new Int32Array(P), rowN = new Int32Array(S);
	// 色ごとにまとめて塗る（fillStyle の切り替えを4回＋α に）
	const buckets = [[], [], [], []], unkL = [], gpL = [];
	for (let y = 0; y < S; y++) {
		const i = ss[y].i;
		for (let x = 0; x < P; x++) {
			const p = ps[x], v = p.stars[i], a = p.gp[0].stars[i], b = p.gp[1].stars[i];
			const own = v < 0 || v >= TH, go = !own && (a < 0 || a >= TH || b < 0 || b >= TH);
			if (own || go) colN[x]++;

	stage.onscroll = null; stage.innerHTML = '';
	say('2組を探す'); await frame();
	const pa = timeCalc(() => pairsA(ps, ss), 5), pb = timeCalc(() => pairsB(ps, ss), 5);
	out.pairs = pa.r.count; out.pA = pa.ms; out.pB = pb.ms;
	// 2つの数え方の結果（上位8組の充足の数）が同じかを確かめる
	out.same = JSON.stringify(pa.r.top) === JSON.stringify(pb.r.top);
	if (!out.same) out.pB = NaN;
	render();
}
async function run(list) {
	document.querySelectorAll('button.go').forEach((b) => (b.disabled = true));
	const t0 = performance.now();
	try { for (const [p, s] of list) await runCombo(p, s); $('now').innerHTML = '<span class="ok">完了</span>（' + ((performance.now() - t0) / 1000).toFixed(0) + '秒）'; }
	catch (e) { $('now').innerHTML = '<span class="ng">止まった: ' + esc(e && e.message || e) + '</span>'; }
	stage.onscroll = null; stage.innerHTML = '';
	document.querySelectorAll('button.go').forEach((b) => (b.disabled = false));
	window.__deckPerfDone = true;
}
$('go-all').onclick = () => run(COMBOS);
$('go-small').onclick = () => run([COMBOS[0]]);
render();
window.__deckPerf = { R, makeDoc, expand, pairsA, pairsB, overviewA, overviewB, tableA, tableB, tableC };
</script>
