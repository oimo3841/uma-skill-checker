		a: P.get('a') === 'B' ? 'B' : 'A', i: P.get('i') === 'B' ? 'B' : 'A', u: P.get('u') === 'B' ? 'B' : 'A',
		theme: P.get('theme') === 'dark' ? 'dark' : 'light',
		pane: P.get('pane') === 'events' ? 0 : 1
	};
	if (P.get('shot') === '1') document.documentElement.setAttribute('data-t66-shot', '1');
	const CAT_NAMES = { unique: '固有', evo: '進化', gold: '金', goldNoEvo: '進化先の無い金', white: 'その他の白', chain: '連続イベント', event: 'イベントスキル', common: '共通イベント' };

	/** 小窓の一覧を、行のまとまり（進化の組・金と下位の白の組・1行）に分ける。今の描き方（buildEventsInfo）の並びの決まりをそのまま読む */
	function unitsOf(ul) {
		const lis = Array.from(ul.children);
		const out = [];
		for (let i = 0; i < lis.length;) {
			const li = lis[i];
			if (li.getAttribute('data-usd-el') === 'ev-skill-evo') {
				const items = [];
				while (i < lis.length && lis[i].getAttribute('data-usd-el') === 'ev-skill-evo') items.push(lis[i++]);
				const head = lis[i];
				items.push(lis[i++]);
				while (i < lis.length && lis[i].getAttribute('data-usd-evo-depth') === '2') items.push(lis[i++]);
				out.push({ type: 'evo', head: head, items: items });
				continue;
			}
			const id = li.getAttribute('data-skill-id');
			const items = [li];
			i++;
			while (i < lis.length && lis[i].getAttribute('data-usd-gold-white-of') === id) items.push(lis[i++]);
			out.push({ type: items.length > 1 ? 'gold' : 'single', head: li, items: items });
		}
		return out;
	}
	/** そのメンバーの由来（skillId → kind の集合と、連続イベントの回） */
	function sourcesOf(sc) {
		const m = new Map();
		const steps = sc.cardId ? (D.steps[sc.cardId] || []) : [];
		sc.src.forEach((s) => {
			const cur = m.get(s.id) || { kinds: new Set(), steps: [] };
			cur.kinds.add(s.kind === 'uma' ? 'uma-' + s.part : s.kind);
			if (s.kind === 'event' && s.key) {
				const mm = /#(\d+)$/.exec(s.key);
				const step = mm ? steps[Number(mm[1])] : null;
				if (typeof step === 'number' && cur.steps.indexOf(step) === -1) cur.steps.push(step);
			}
			m.set(s.id, cur);
		});
		m.forEach((v) => v.steps.sort((x, y) => x - y));
		return m;
	}
	const rarityOf = (id) => (D.meta[id] || {}).r;
	const posOf = (id) => { const p = (D.meta[id] || {}).p; return typeof p === 'number' ? p : null; };
	/** まとまりの区分（キャラ／サポカ。(イ) の案で変わる） */
	function catOf(sc, u, src) {
		const id = u.head.getAttribute('data-skill-id');
		const k = (src.get(id) || { kinds: new Set() }).kinds;
		const r = rarityOf(id);
		if (sc.kind === 'uma') {
			if (r === 'unique') return 'unique';
			if (u.type === 'evo') return 'evo';
			const own = k.has('uma-initial') || k.has('uma-awakening');
			if (!own && k.has('umaEvent')) return 'event';
			return r === 'gold' ? 'goldNoEvo' : 'white';
		}
		const own = k.has('hint') || (st.i === 'A' && k.has('event'));
		if (own) return r === 'gold' ? 'gold' : 'white';
		if (k.has('event')) return 'chain';
		return 'common';
	}
	const ORDER = { uma: ['unique', 'evo', 'goldNoEvo', 'white', 'event'], card: ['gold', 'white', 'chain', 'common'] };
	/** 区分の中の並び: 既定の並び（ゲーム内の並び）の位置の大きい順＝新しいものが先。並びに無いもの（公式の ID が無い）は区分の最後に、今の並びのまま */
	function sortUnits(list) {
		return list.map((u, n) => ({ u, n, p: posOf(u.head.getAttribute('data-skill-id')) }))
			.sort((x, y) => (x.p === null) - (y.p === null) || (x.p !== null && y.p !== null ? y.p - x.p : 0) || x.n - y.n).map((x) => x.u);
	}
	function tagEl(text, el) {
		const t = document.createElement('span');
		t.className = 'usd-roster-autotag t66-tag';
		t.setAttribute('data-usd-el', el);
		t.textContent = text;
		return t;
	}
	function addTag(li, text, el) {
		const nm = li.querySelector('.usd-ev-skill-name');
		if (!nm) return;
		// 札の並びは名前 →（自動）→（未選択・対象）の後ろ
		nm.appendChild(tagEl(text, el));
	}
	function reorder(root, sc) {
		const ul = root.querySelector('[data-usd-el="ev-skills"]');
		if (!ul) return;
		const src = sourcesOf(sc);
		const units = unitsOf(ul);
		units.forEach((u) => { u.cat = catOf(sc, u, src); u.maybe = u.head.getAttribute('data-usd-maybe') === '1'; });
		// 札: サポカの連続イベントのスキル（(イ) の両案）／キャラのイベントのスキル（(ウ) 案B）
		units.forEach((u) => u.items.forEach((li) => {
			const id = li.getAttribute('data-skill-id');
			const s = src.get(id);
			if (sc.kind === 'card' && s && s.kinds.has('event') && s.steps.length > 0) addTag(li, '連続イベント' + s.steps.join('・') + '回目', 't66-chain-tag');
			if (sc.kind === 'uma' && st.u === 'B' && u.cat === 'event' && li.getAttribute('data-usd-el') === 'ev-skill') addTag(li, 'イベントスキル', 't66-event-tag');
		}));
		const cats = ORDER[sc.kind];
		const blocks = [];
		if (st.a === 'A') cats.forEach((c) => { blocks.push({ c, list: sortUnits(units.filter((u) => u.cat === c && !u.maybe)) }); blocks.push({ c, list: sortUnits(units.filter((u) => u.cat === c && u.maybe)) }); });
		else [false, true].forEach((mb) => cats.forEach((c) => blocks.push({ c, list: sortUnits(units.filter((u) => u.cat === c && u.maybe === mb)) })));
		ul.textContent = '';
		let prevCat = null;
		blocks.forEach((b) => {
			if (b.list.length === 0) return;
			// (ウ) 案A: キャラのイベントのスキルの区分の頭に見出し（続けて同じ区分が来るときは1つ）
			if (sc.kind === 'uma' && st.u === 'A' && b.c === 'event' && prevCat !== 'event') {
				const h = document.createElement('li');
				h.className = 'usd-ev-skills-title';
				h.setAttribute('data-usd-el', 't66-event-head');
				h.textContent = 'イベントスキル';
				ul.appendChild(h);
			}
			b.list.forEach((u) => u.items.forEach((li) => { li.setAttribute('data-t66-cat', u.cat); ul.appendChild(li); }));
			prevCat = b.c;
		});
	}
	function render() {
		const sc = D.scenes[st.scene];
		document.documentElement.setAttribute('data-theme', st.theme);
		const stage = document.getElementById('t66-stage');
		stage.innerHTML = sc.html;
		const root = stage.firstElementChild;
		if (root) { root.hidden = false; root.removeAttribute('style'); }
		if (st.order === 'new') reorder(stage, sc);
		// 狭い幅のタブ（今の部品。押すと切り替え）
		const panes = stage.querySelector('[data-usd-el="events-panes"]');
		const tabs = Array.from(stage.querySelectorAll('[data-usd-el="events-tab"]'));
		const setPane = (n) => { if (panes) panes.setAttribute('data-active-pane', String(n)); tabs.forEach((b, i) => { b.setAttribute('aria-selected', i === n ? 'true' : 'false'); b.tabIndex = i === n ? 0 : -1; }); st.pane = n; };
		tabs.forEach((b, i) => b.addEventListener('click', () => setPane(i)));
		setPane(st.pane);
		const close = stage.querySelector('[data-usd-el="info-close"]');
		if (close) close.disabled = true;
		document.getElementById('t66-shotbar').textContent = 'T66 モック (3)｜' + sc.label + '｜' + (st.order === 'now' ? '今の並び' : '新しい並び（(ア)案' + st.a + (sc.kind === 'card' ? '・(イ)案' + st.i : '・(ウ)案' + st.u) + '）');
		const q = new URLSearchParams(); q.set('scene', st.scene); if (st.order === 'now') q.set('order', 'now'); q.set('a', st.a); q.set('i', st.i); q.set('u', st.u); if (st.theme === 'dark') q.set('theme', 'dark'); if (st.pane === 0) q.set('pane', 'events'); if (P.get('shot') === '1') q.set('shot', '1');
		history.replaceState(null, '', '?' + q.toString());
	}
	const sel = (id, key) => { const s = document.getElementById(id); s.value = st[key]; s.addEventListener('change', () => { st[key] = s.value; render(); }); };
	const sceneSel = document.getElementById('t66-scene');
	Object.keys(D.scenes).forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = D.scenes[k].label; sceneSel.appendChild(o); });
	sel('t66-scene', 'scene'); sel('t66-order', 'order'); sel('t66-a', 'a'); sel('t66-i', 'i'); sel('t66-u', 'u'); sel('t66-theme', 'theme');
	const g = document.getElementById('t66-guide'), gt = document.getElementById('t66-guide-toggle');
	gt.addEventListener('click', () => { const open = g.getAttribute('data-open') !== '1'; g.setAttribute('data-open', open ? '1' : '0'); gt.setAttribute('aria-expanded', open ? 'true' : 'false'); });
	window.T66 = { st, render, CAT_NAMES };
	render();
})();
</script>
