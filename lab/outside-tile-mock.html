	<title>オススメサポのタイルとピン止めの検索のモック（作業用）</title>
	<!--
		オススメサポの小窓の (4) カードのタイルに「+X種/対象Y種」を入れる案と、(5)「除外中」の左の虫眼鏡＋ピン止めのアイコン（白スキルを探してピン止め）の試し描き
		（モック・T66。2026-11-01 のおいもさんの要望 (4)(5)）。おいもさんが見て決めるための作業用のページ。**ツール本体には組み込まない**（どのページからもリンクしない）。保存は無い。外へは何も送らない。

		作り: special.html を「①に uma-0272 とカード6枚・レース 京都 3000m（リーグ オブ ヒーローズ）・②のオススメサポは 4枚＋残りの枠に card-0300 を指定・
		オススメのカード1枚（card-0559）を除外・距離の区分（長距離）の除外 2種」にして、オススメサポの小窓（375px と 1280px）・ピン止めした結果・
		②の「テキストで検索」の小窓の HTML と、ページの CSS を 2026-11-01 の origin/main（a69e49d）から Playwright で写し取った。写しなので、製品を変えてもこのページは変わらない。
		Y（対象Y種）は、そのとき計算した結果（オススメサポのカード名の小窓で「対象」の札が付くスキル。金と、その下位の白は1種に数える）。
		検索の候補（白・金）と選べない理由は、ピン止めの計算（母集団に候補の全部をピンとして渡し、入れ直せない理由を読む）を同じ状態で回した結果。

		引数: ?tile=now|1|2|3（(4) タイルの案。既定 1）・?scene=tiles|search|pinned（既定 tiles）・?q=…（検索の語）・?excl=auto|full|short|long（除外中の表記。long は数の多い場合の試し）
		      ?theme=light|dark・?shot=1（案内を隠す）
	-->

	<style id="t66-css">
/* ===== T66 のモックの差分（ここから下だけがモックの追加） ===== */
/* 色は今のトークン（--uma-*）だけ。新しい色は使わない（恒久ルール30） */
body { background: var(--uma-bg, var(--uma-surface-muted)); }

/* ---- (4) タイルの案 ---- */
/* 対象Y種の字（小さい字。今の「＋N種」と同じ色） */
.t66-y { font-size: 9px; line-height: 1.2; }
/* 案1（おいもさんの例）: × を右上へ（押せる範囲 44×44 は今のまま）・SSR の札を二つ名の側へ寄せる（× の分だけ左）・下の段に「＋X種/対象Y種」 */
html[data-t66-tile="1"] :is([data-usd-el="outside-card"], [data-usd-el="outside-pinned"]) .usd-out-card-x { top: 0; bottom: auto; align-items: flex-start; padding: 5px 5px 0 0; }

/* 案2: SSR の札を左の種別アイコンの下へ（16px）・右の上の段に「＋X種」（右上の × の左）・下の段に「対象Y種」 */
html[data-t66-tile="2"] :is([data-usd-el="outside-card"], [data-usd-el="outside-pinned"]) .usd-out-card-lead { flex-direction: column; justify-content: center; gap: 0; align-self: stretch; }

html[data-t66-tile="2"] :is([data-usd-el="outside-card"], [data-usd-el="outside-pinned"]) .usd-out-card-x { top: 0; bottom: auto; align-items: flex-start; padding: 5px 5px 0 0; }
html[data-t66-tile="2"] :is([data-usd-el="outside-card"], [data-usd-el="outside-pinned"]) .usd-out-card-sub--x { padding-right: 17px; }
html[data-t66-tile="2"] :is([data-usd-el="outside-card"], [data-usd-el="outside-pinned"]) .t66-y2 { font-size: 9px; line-height: 1.2; color: var(--uma-text-subtle); white-space: nowrap; }
/* 案3: 今の配置のまま、「＋X種」を「＋X/Y種」（/Y は小さい字。読み上げは「対象」を足す） */

/* ---- (5) 除外中の左のアイコン（虫眼鏡＋ピン止め）。見た目は行のピンのボタン（.usd-out-pin）と同じ部品・押せる範囲 44×44 ---- */

.t66-pinsearch-ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* ピン止めの検索の小窓: テキストで検索の小窓のうち、検索の欄と候補の一覧だけ（追加候補の欄・「追加（N種）」は使わない。押すとすぐピン止め） */
.t66-pinpicker [data-usd-el="search-tray"], .t66-pinpicker [data-usd-el="picker-footer"] { display: none; }

/* ---- モックの案内（左上） ---- */
.t66-guide { position: fixed; left: 8px; bottom: 8px; z-index: 2147483600; max-width: min(360px, calc(100vw - 16px)); font-size: 12px; line-height: 1.5;

.t66-guide p { margin: 0; color: var(--uma-text-muted); }

<script id="t66-js">
(function () {
	'use strict';
	const D = JSON.parse(document.getElementById('t66-data').textContent);
	const P = new URLSearchParams(location.search);
	const st = {
		tile: ['now', '1', '2', '3'].indexOf(P.get('tile')) !== -1 ? P.get('tile') : '1',
		scene: ['tiles', 'search', 'pinned'].indexOf(P.get('scene')) !== -1 ? P.get('scene') : 'tiles',
		q: P.get('q') || '',
		excl: ['auto', 'full', 'short', 'long'].indexOf(P.get('excl')) !== -1 ? P.get('excl') : 'auto',
		theme: P.get('theme') === 'dark' ? 'dark' : 'light'
	};
	if (P.get('shot') === '1') document.documentElement.setAttribute('data-t66-shot', '1');
	const NAMES = new Map(D.cand.map((c) => [c[0], c[1]]));
	document.getElementById('t66-pinname').textContent = NAMES.get(D.pinId) || D.pinId;
	// ピン止めできない理由の文（今のピンの理由の文 OUTSIDE_PIN_REASON_TEXT と、②の追加の一覧の「追加済み」。金は今のレアリティの名前「金スキル」）
	const REASON = { none: '組み合わせなし', taken: '本育成で取得', off: '本育成で不要', distance: '①の絞り込み不一致', style: '①の絞り込み不一致', surface: '①の絞り込み不一致', race: 'レース条件不一致', added: '追加済み', gold: '金スキル' };
	const PINSEARCH_LABEL = 'ピン止めするスキルを探す';
	const PINSEARCH_SVG = '<svg class="t66-pinsearch-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">'
		+ '<circle cx="10" cy="10" r="7"/><path d="m15.2 15.2 5.3 5.3"/>'
		// レンズの中にピン（lucide の pin を縮めた形）
		+ '<path d="M10 12.6v2.4"/><path d="M7.2 12.6h5.6v-.7a.9.9 0 0 0-.5-.8l-.8-.4a.9.9 0 0 1-.5-.8V7.6h.4a.9.9 0 0 0 0-1.8H8.6a.9.9 0 0 0 0 1.8H9v2.3a.9.9 0 0 1-.5.8l-.8.4a.9.9 0 0 0-.5.8Z"/></svg>';

	/** 二つ名が「[」＋3文字＋「…」も入らない幅のときは、二つ名を出さない（製品の outsideFitNicks と同じ決まり） */
	function fitNicks(root) {
		const nicks = Array.from(root.querySelectorAll('.usd-out-card-nick'));
		nicks.forEach((n) => { n.hidden = false; });
		nicks.forEach((n) => {
			if (n.scrollWidth <= n.clientWidth + 1) return;
			const probe = n.cloneNode(false);
			probe.removeAttribute('data-usd-el');
			probe.style.cssText = 'position:absolute;visibility:hidden;flex:none;max-width:none;overflow:visible;';
			probe.textContent = n.textContent.slice(0, 4) + '…';
			n.parentNode.appendChild(probe);
			const need = probe.getBoundingClientRect().width;
			n.parentNode.removeChild(probe);
			if (n.clientWidth < need - 0.5) n.hidden = true;
		});
	}
	function srNote(text) { const s = document.createElement('span'); s.className = 'usd-roster-srnote'; s.textContent = text; return s; }
	/** (4) タイルに対象Y種を入れる（案ごと） */
	function applyTile(root, tgt) {
		document.documentElement.setAttribute('data-t66-tile', st.tile);
		if (st.tile === 'now') return;
		root.querySelectorAll('[data-usd-el="outside-card"], [data-usd-el="outside-pinned"]').forEach((t) => {
			const y = tgt[t.getAttribute('data-card-id')];
			const gain = t.querySelector('[data-usd-el="outside-card-gain"]');
			if (!y || !gain) return;
			if (st.tile === '1') {
				const s = document.createElement('span');
				s.className = 'usd-out-card-gain t66-y';
				s.setAttribute('data-usd-el', 't66-target-y');
				s.textContent = '/対象' + y.y + '種';
				gain.after(s);
			} else if (st.tile === '2') {
				const side = t.querySelector('.usd-out-card-side');
				const rar = side.querySelector('.usd-card-ico--rarity');
				if (rar) t.querySelector('.usd-out-card-lead').appendChild(rar);
				const s = document.createElement('span');
				s.className = 't66-y2';
				s.setAttribute('data-usd-el', 't66-target-y');
				s.textContent = '対象' + y.y + '種';
				side.appendChild(s);
			} else if (st.tile === '3') {
				const n = gain.textContent.replace(/種$/, '');
				gain.textContent = n;
				const s = document.createElement('span');
				s.className = 't66-y';
				s.setAttribute('data-usd-el', 't66-target-y');
				s.appendChild(document.createTextNode('/'));
				s.appendChild(srNote('対象'));
				s.appendChild(document.createTextNode(String(y.y)));
				gain.appendChild(s);
				gain.appendChild(document.createTextNode('種'));
			}
		});
	}
	/** (5) 除外中の行: 左にアイコン、入らない幅でだけ短い表記 */
	function applyExcl(root) {
		const left = root.querySelector('.usd-out-exleft');
		const tg = root.querySelector('[data-usd-el="outside-excl-toggle"]');
		if (!left || !tg) return;
		const b = document.createElement('button');
		b.type = 'button';
		b.className = 'usd-out-pin t66-pinsearch';
		b.setAttribute('data-usd-el', 't66-pinsearch');
		b.setAttribute('aria-haspopup', 'dialog');
		b.setAttribute('aria-expanded', 'false');
		b.setAttribute('aria-label', PINSEARCH_LABEL);
		b.title = PINSEARCH_LABEL;
		b.innerHTML = PINSEARCH_SVG;
		b.addEventListener('click', () => openPicker(b));
		left.insertBefore(b, left.firstChild);
		const full = tg.textContent;   // 例「除外中 カード1枚・スキル2種（長距離） ▴」
		const m = /^除外中 (?:カード(\d+)枚)?・?(?:スキル(\d+)種（(.+?)）)? ([▴▾])$/.exec(full);
		const parts = m ? { c: m[1], s: m[2], d: m[3], a: m[4] } : null;
		if (parts && st.excl === 'long') { parts.c = '3'; parts.s = '12'; parts.d = '距離指定なし'; }
		const fullText = (p) => '除外中 ' + [p.c ? 'カード' + p.c + '枚' : '', p.s ? 'スキル' + p.s + '種（' + p.d + '）' : ''].filter(Boolean).join('・') + ' ' + p.a;
		const shortText = (p) => '除外中 ' + (p.c ? p.c + '枚' : '') + (p.c && p.s ? '/' : '') + (p.s ? p.s + '種（' + p.d + '）' : '') + ' ' + p.a;
		if (!parts) return;
		tg.textContent = fullText(parts);
		const head = root.querySelector('.usd-out-exhead');
		const over = () => head.scrollWidth > head.clientWidth + 1 || tg.scrollWidth > tg.clientWidth + 1 || tg.getBoundingClientRect().height > 29;
		if (st.excl === 'short' || ((st.excl === 'auto' || st.excl === 'long') && over())) { tg.textContent = shortText(parts); tg.setAttribute('data-t66-short', '1'); }
		tg.setAttribute('aria-label', fullText(parts).replace(/ [▴▾]$/, ''));
	}
	/* ---- 検索の小窓（テキストで検索の部品。候補は白スキル。選べないものは灰色と理由） ---- */
	const fold = (s) => s.normalize('NFKC').replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).toLowerCase();
	const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
	let pickerEl = null, opener = null;
	function openPicker(btn) {
		opener = btn;
		const host = document.getElementById('t66-picker-host');
		host.innerHTML = D.picker;
		pickerEl = host.firstElementChild;
		pickerEl.classList.add('t66-pinpicker');
		pickerEl.hidden = false;
		pickerEl.querySelectorAll('[data-usd-el="mode-filter"], [data-usd-el="mode-paste"], [data-usd-el="mode-passive"]').forEach((x) => x.remove());
		pickerEl.querySelector('[data-usd-el="picker-title"]').textContent = PINSEARCH_LABEL;
		const input = pickerEl.querySelector('[data-usd-el="search-input"]');
		input.value = st.q;
		input.addEventListener('input', () => { st.q = input.value; renderHits(); sync(); });
		pickerEl.querySelector('[data-usd-act="search-clear"]').addEventListener('click', () => { input.value = ''; st.q = ''; renderHits(); input.focus(); sync(); });
		pickerEl.querySelector('[data-usd-act="picker-close"]').addEventListener('click', closePicker);
		pickerEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });
		btn.setAttribute('aria-expanded', 'true');
		renderHits();
		input.focus();
		st.scene = 'search'; sync();
	}
	function closePicker() {
		document.getElementById('t66-picker-host').innerHTML = '';
		pickerEl = null;
		if (opener) { opener.setAttribute('aria-expanded', 'false'); opener.focus(); }
		if (st.scene === 'search') { st.scene = 'tiles'; sync(); }
	}
	function renderHits() {
		const out = pickerEl.querySelector('[data-usd-el="search-results"]');
		const count = pickerEl.querySelector('[data-usd-el="search-count"]');
		const qv = fold(st.q.trim());
		pickerEl.querySelector('[data-usd-el="search-clear"]').hidden = !st.q;
		if (!qv) { out.hidden = true; out.innerHTML = ''; count.textContent = ''; return; }
		const hits = D.cand.map((c) => ({ id: c[0], name: c[1], why: c[2], at: fold(c[1]).indexOf(qv) })).filter((h) => h.at !== -1);
		out.hidden = false;
		count.textContent = '候補（' + hits.length + '件）';
		if (hits.length === 0) { out.innerHTML = '<p class="usd-tsearch-none">一致するスキルはありません</p>'; return; }
		out.innerHTML = hits.map((h, i) => {
			const why = REASON[h.why] || '';
			const blocked = !!why;
			const nm = esc(h.name.slice(0, h.at)) + '<b>' + esc(h.name.slice(h.at, h.at + st.q.trim().length)) + '</b>' + esc(h.name.slice(h.at + st.q.trim().length));
			return '<div class="usd-row usd-tsearch-row' + (blocked ? ' usd-tsearch-row--excluded' : ' usd-tsearch-row--pick') + '" role="option" id="usd-tsearch-opt-' + i + '" data-skill-id="' + esc(h.id) + '"'
				+ (blocked ? ' aria-disabled="true"' : ' data-usd-act="search-pick" aria-selected="false"') + '>'
				+ '<span class="usd-tsearch-mark" aria-hidden="true">' + (blocked ? '' : '+') + '</span>'
				+ '<span class="usd-tsearch-name">' + nm + '</span>' + (blocked ? '<span class="usd-tsearch-side">' + esc(why) + '</span>' : '') + '</div>';
		}).join('');
		out.querySelectorAll('[data-usd-act="search-pick"]').forEach((r) => r.addEventListener('click', () => pick(r.getAttribute('data-skill-id'))));
	}
	function note(text) { const n = document.getElementById('t66-note'); n.textContent = text; n.hidden = false; clearTimeout(note.t); note.t = setTimeout(() => { n.hidden = true; }, 2600); }
	function pick(id) {
		if (id !== D.pinId) { note('モックでは「' + (NAMES.get(D.pinId) || D.pinId) + '」だけ結果まで描きます'); return; }
		closePicker();
		st.scene = 'pinned'; render();
	}
	function render() {
		document.documentElement.setAttribute('data-theme', st.theme);
		const narrow = window.innerWidth < 640;
		const stage = document.getElementById('t66-stage');
		const pinned = st.scene === 'pinned';
		stage.innerHTML = pinned ? (narrow ? D.pin375 : D.pin1280) : (narrow ? D.html375 : D.html1280);
		const root = stage.firstElementChild;
		root.hidden = false;
		applyTile(root, pinned ? D.pinTgt : D.tgt);
		fitNicks(root);
		applyExcl(root);
		if (pinned) { const r = root.querySelector('[data-usd-pinned="1"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
		sync();
		if (st.scene === 'search' && !pickerEl) openPicker(root.querySelector('[data-usd-el="t66-pinsearch"]'));
	}
	function sync() {
		const q = new URLSearchParams();
		if (st.tile !== '1') q.set('tile', st.tile);
		if (st.scene !== 'tiles') q.set('scene', st.scene);
		if (st.scene === 'search' && st.q) q.set('q', st.q);
		if (st.excl !== 'auto') q.set('excl', st.excl);
		if (st.theme === 'dark') q.set('theme', 'dark');
		if (P.get('shot') === '1') q.set('shot', '1');
		history.replaceState(null, '', q.toString() ? '?' + q.toString() : location.pathname);
	}
	/** 計測（報告の表に使う）: タイルごとの幅・二つ名と名前の見える字数・札と × と「＋X種」の位置と大きさ／除外中の行 */
	function measure() {
		const box = (e, t) => { if (!e || e.getClientRects().length === 0) return null; const b = e.getBoundingClientRect(); const o = t ? t.getBoundingClientRect() : { x: 0, y: 0 }; return [+(b.x - o.x).toFixed(1), +(b.y - o.y).toFixed(1), +b.width.toFixed(1), +b.height.toFixed(1)]; };
		const vis = (el) => {
			if (!el || el.hidden || el.getClientRects().length === 0) return 0;
			const t = el.textContent;
			// 文字の幅で見る（scrollWidth は整数に丸められ、1px 未満のはみ出しで省略記号が出るのを見落とす）
			const all = document.createRange(); all.selectNodeContents(el);
			if (all.getBoundingClientRect().width <= el.getBoundingClientRect().width - parseFloat(getComputedStyle(el).paddingLeft) - parseFloat(getComputedStyle(el).paddingRight) + 0.01) return t.length;
			const probe = document.createElement('span'); probe.textContent = '…'; probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit'; el.appendChild(probe);
			const ell = probe.getBoundingClientRect().width; el.removeChild(probe);
			const limit = el.getBoundingClientRect().left + el.clientWidth - ell;
			const rg = document.createRange(); let n = 0;
			for (let i = 0; i < t.length; i++) { rg.setStart(el.firstChild, i); rg.setEnd(el.firstChild, i + 1); if (rg.getBoundingClientRect().right <= limit + 0.5) n = i + 1; else break; }
			return n;
		};
		const tiles = Array.from(document.querySelectorAll('#t66-stage .usd-out-card')).map((t) => ({
			el: t.getAttribute('data-usd-el'), id: t.getAttribute('data-card-id'), w: box(t)[2], h: box(t)[3],
			nick: vis(t.querySelector('.usd-out-card-nick')), nickAll: (t.querySelector('.usd-out-card-nick') || { textContent: '' }).textContent.length,
			name: vis(t.querySelector('.usd-out-card-name')), nameAll: (t.querySelector('.usd-out-card-name') || { textContent: '' }).textContent.length,
			main: box(t.querySelector('.usd-out-card-main'), t), rarity: box(t.querySelector('.usd-card-ico--rarity'), t),
			gain: box(t.querySelector('[data-usd-el="outside-card-gain"]'), t), y: box(t.querySelector('[data-usd-el="t66-target-y"]'), t), x: box(t.querySelector('.usd-out-card-x'), t), xg: box(t.querySelector('.usd-out-card-xg, .usd-out-card-xt'), t)
		}));
		const tg = document.querySelector('#t66-stage [data-usd-el="outside-excl-toggle"]');
		const excl = { text: tg ? tg.textContent : '', short: !!(tg && tg.getAttribute('data-t66-short')), head: box(document.querySelector('#t66-stage .usd-out-exhead')), left: box(document.querySelector('#t66-stage .usd-out-exleft')),
			icon: box(document.querySelector('#t66-stage [data-usd-el="t66-pinsearch"]')), toggle: box(tg), restore: box(document.querySelector('#t66-stage [data-usd-el="outside-restore-all"]')) };
		const ic = document.querySelector('#t66-stage [data-usd-el="t66-pinsearch"]');
		if (ic) { const s = getComputedStyle(ic, '::before'); excl.iconHit = [s.width, s.height]; }
		return { w: window.innerWidth, scrollX: document.documentElement.scrollWidth > document.documentElement.clientWidth, tiles, excl };
	}
	const sel = (id, key) => { const s = document.getElementById(id); s.value = st[key]; s.addEventListener('change', () => { st[key] = s.value; render(); }); };
	sel('t66-tile', 'tile'); sel('t66-excl', 'excl'); sel('t66-theme', 'theme');
	const g = document.getElementById('t66-guide'), gt = document.getElementById('t66-guide-toggle');
	gt.addEventListener('click', () => { const open = g.getAttribute('data-open') !== '1'; g.setAttribute('data-open', open ? '1' : '0'); gt.setAttribute('aria-expanded', open ? 'true' : 'false'); });
	let lastNarrow = window.innerWidth < 640;
	window.addEventListener('resize', () => { const n = window.innerWidth < 640; if (n !== lastNarrow) { lastNarrow = n; render(); } else { const r = document.getElementById('t66-stage').firstElementChild; if (r) fitNicks(r); } });
	window.T66 = { st, render, measure, openPicker: () => openPicker(document.querySelector('[data-usd-el="t66-pinsearch"]')), pick };
	render();
})();
</script>
