	<title>画像アップロードの並べ方のモック（作業用）</title>
	<!--
		UmaStar（special の③）と UmaExam（exam の②）の「画像をアップロード」の作り直しの試し描き（モック・T69）。
		おいもさんが見て決めるための作業用のページ。**ツール本体には組み込まない**（どのページからもリンクしない）。保存は無い。外へは何も送らない。

		作り: special.html（③ 画像をアップロード）と exam.html（② 画像をアップロード）の画面の HTML と、ページの CSS（css/ の3つ・Tailwind・ページの <style>）を
		2026-11-02 の origin/main（7c5b7e0）から Playwright で写し取った（下の cap-special-* と cap-exam-*。読み込むときに ?tool= の側だけを入れる）。
		サムネイル・動画の箱（進捗・知らせ・失敗）・結合の結果の部品も、作り物の画像を入れた製品の画面から写した（cap-*-parts）。写しなので、製品を変えてもこのページは変わらない。
		その上にモックの差分（<style id="t69-css"> と <script id="t69-js">）を当てている。動画の場面は見た目だけで、動画も画像も処理しない（画像は作り物）。

		引数: ?tool=special|exam・?scene=now（今の形）|new（新しい並べ方。既定）|vprog|vdone|vwarn|verr（動画の場面。special だけ）
		      ?imgs=empty|one|few|many|mix（親Aセットの3人の枚数。既定 mix＝0・3・10枚）・?n=a,b,c（枚数を直に）・?nb=a,b,c（親Bセット）・?set=B（親Bセットのタブを開く）
		      ?add=lg|sm（画像を足すボタンの高さ。lg＝今の「スクショを選択」の欄と同じ・sm＝44px）
		      ?res=inline|drawer（vdone: 結合画像を③の中に出す／今と同じく引き出しを開く）・?who=0|1|2（vwarn: 警告の人）・?e=unreadable|noscreen|split|fast（verr）・?step=0..4（vprog）
		      ?theme=light|dark・?shot=1（案内を隠す）
	-->
	<style id="t69-css">
/* ===== T69 のモックの差分（ここから下だけがモックの追加。上の写しは origin/main） ===== */
/* 色は今のトークン（--uma-*）と写しにある色だけ。新しい色は使わない（恒久ルール30） */

/* 3列（どの幅でも3列）。列の間は今の欄の間（gap-3 の 12px）より狭い 8px（375px でサムネイルの幅を取るため） */
.t69-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.t69-col { min-width: 0; display: flex; flex-direction: column; }
/* 見出し（今の「親A」の行のまま）の下の余白も今の mb-2 のまま */
.t69-col > p { margin-bottom: 8px; }
/* 画像を足すボタン（今の「スクショを選択」の欄＝点線の枠を、字を「追加」にして列の幅に） */
.t69-add.person-drop-zone { padding: 10px 4px; margin-bottom: 8px; min-height: 76px; display: flex; align-items: center; justify-content: center; }
.t69-add.person-drop-zone p { white-space: nowrap; }
.t69-add--sm.person-drop-zone { min-height: 44px; padding: 4px; }
.t69-add--sm.person-drop-zone > div { flex-direction: row; gap: 4px; }
/* サムネイルは縦1列（今のサムネイルの部品のまま。高さ 56px・× 20px） */
.t69-thumbs { display: flex; flex-direction: column; gap: 8px; }
.t69-thumbs .video-tile { flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; font-size: 11px; }
.t69-thumbs .video-tile img { width: 100%; height: 32px; }
.t69-thumbs .video-tile small { margin-left: 0; font-size: 10px; }
/* 写しの Tailwind には、写したとき画面に無かったクラスが無いことがあるので、サムネイルの寸法はここでも当てる（製品と同じ値） */
.t69-thumbs img.h-14 { height: 56px; width: 100%; object-fit: cover; display: block; }
.t69-thumbs .person-image-remove { width: 20px; height: 20px; }

/* 下に固定した帯。重なりの順は 帯（60）＜ 右下のナビ（70）＜ 引き出しの暗転（90） */
.t69-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--uma-surface); border-top: 1px solid var(--uma-border);
	box-shadow: 0 -4px 12px rgba(15, 23, 42, .08); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
.t69-bar[hidden] { display: none !important; }
.t69-bar-in { display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
.t69-bar-in > .uma-btn { width: 100%; margin-top: 0 !important; }
@media (min-width: 768px) {
	.t69-bar-in { flex-direction: row; }
	.t69-bar-in > .uma-btn { flex: 1 1 0; width: auto; }
}
/* 帯が出ている間は、右下のナビ（結果の丸ボタン）と左下の「元に戻す」を帯の上へ上げる（大きさ・右／左の位置は今のまま。足すのは帯の高さだけ） */
body.t69-has-bar .uma-fab-nav,
body.t69-has-bar .uma-undo-fab { bottom: calc(var(--uma-fab-edge) + var(--t69-bar-h, 0px) + env(safe-area-inset-bottom, 0px)); }
/* いちばん下まで送ったとき、③の中身が帯の下に入らないよう、ページの下に帯の高さぶんの余白を足す */
body.t69-has-bar { padding-bottom: var(--t69-bar-h, 0px); }

/* 動画で結合したあとの「親ごとの画像を見る」（今の「セットをクリア」と同じ字のボタン。押せる高さ 44px） */
.t69-showcols { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; font-size: 12px; color: var(--uma-text-subtle); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
.t69-showcols:hover { color: var(--uma-text-heading); }
.t69-result { margin-bottom: 12px; }

/* 案内（左上） */
.t69-guide { position: fixed; left: 6px; top: 6px; z-index: 200; max-width: min(360px, calc(100vw - 12px)); font: 12px/1.5 system-ui, sans-serif;
	background: var(--uma-surface); color: var(--uma-text); border: 1px solid var(--uma-border-strong); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.t69-guide > summary { cursor: pointer; padding: 4px 10px; font-weight: 700; list-style: none; }
.t69-guide > summary::-webkit-details-marker { display: none; }
.t69-guide .t69-gbody { padding: 0 10px 10px; display: grid; gap: 6px; max-height: 80vh; overflow: auto; }
.t69-guide label { display: grid; gap: 2px; font-weight: 600; }
.t69-guide select { font: inherit; padding: 2px 4px; border: 1px solid var(--uma-border-strong); border-radius: 6px; background: var(--uma-surface); color: var(--uma-text); }
.t69-guide p { margin: 0; color: var(--uma-text-muted); font-size: 11px; }
.t69-hidden { display: none !important; }
	</style>

						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="loader-2" aria-hidden="true" class="lucide lucide-loader-2 w-4 h-4 animate-spin text-green-600"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
						<span>処理中…</span>
					</span>
					<span id="progress-pct">0%</span>
				</div>
				<div class="h-2 bg-green-200/70 rounded-full overflow-hidden">
					<div id="progress-bar" class="h-full bg-green-600 rounded-full transition-all duration-300" style="width:0%"></div>
				</div>
			</div>

			<!-- 画質警告表示（対象外として除外した画像がある場合） -->
			<div id="quality-warn-wrap" class="hidden mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-xs text-amber-800 whitespace-pre-line flex gap-2">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-amber-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
				<div id="quality-warn-content"></div>
			</div>

			<!-- エラー表示 -->
			<div id="error-wrap" class="hidden mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-xs text-red-700 whitespace-pre-line flex gap-2">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-triangle" aria-hidden="true" class="lucide lucide-alert-triangle w-4 h-4 text-red-500 shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
				<div id="error-content"></div>
			</div>

			<!-- ボタンは3つ。**並び・大きさ・色は exam.html と同じ**にしてある（C-62 の (8)）。
			     exam … OCR処理を開始する（黒塗り・大） → OCR処理＋画像結合を開始する（枠線・大）
			     special … 上の2つに加えて「画像を結合する」（標準の大きさ・白地＋罫線）が3つ目に付く。
			     C-61 では special だけ一体のボタンを先頭に置いていたが、2つのツールを行き来する人には
			     並びが入れ替わるほうが負担になるので、exam に合わせて戻した。
			     3つ目の「画像を結合する」は special だけの操作で、**残す**（スキルリスト未入力でも
			     押せることを special が保ってきた仕様で、やめると退行になる）。
			     文言は「（SNS投稿用）」から「（OCRしない）」へ変えた ―― このボタンの他との違いは
			     出力の用途ではなく「OCRを走らせないこと」なので、そこを言う。
			     T56（C-258 の (2)-9）: special は「OCR処理を開始する」を消し、一体のボタンを先頭の主なボタン（黒塗り）にした。
			     名前の「（高負荷）」も外した（exam も同じ）。ボタンは2つ（一体のボタン → 画像を結合する）。 -->
			<button id="process-stitch-btn" type="button" class="uma-btn uma-btn--primary uma-btn--lg w-full" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>
				<span>OCR処理＋画像結合を開始する</span>
			</button>

			<!-- 画像結合だけ。OCR処理とは独立した機能で、スキルリスト未入力でも
			     アップロード済み画像だけで実行できる。各人ごとに複数枚のスクショを1枚に
			     縦結合し、さらに親A・祖A1・祖A2を横結合して1枚の比較画像として出力する。 -->
			<button id="stitch-btn" type="button" class="uma-btn uma-btn--secondary w-full mt-2" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="images" aria-hidden="true" class="lucide lucide-images w-4 h-4"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path><circle cx="13" cy="7" r="1" fill="currentColor"></circle><rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>
				<span>画像を結合する（OCRしない）</span>
			</button>
			<!-- 結合の注記。**exam.html と同じ文面**にしてある（段1）。
			     それまでは special が「1枚だけならエラー」、exam が「枚数が多いほど時間がかかる」と、
			     互いに相手の注意が抜けていた。片方を直すときはもう片方も直すこと。 -->
			<p class="mt-1.5 text-[11px] text-slate-400 text-center">※親Aセット・親Bセットそれぞれで1枚にまとめて結合画像を生成します。</p>

			<!-- 分類の印を結合画像に付けるかの切り替え（C-58 の作業C。段5〔C-227〕から印ではなく種類の枠。保存キー・id は同じ）。結果画像の見た目が変わる設定なので、
			     切り替えてもその場では何も変わらない引き出しの中ではなく、**結合を始める場所**に置く
			     （C-30 で exam に入れたときと同じ判断）。既定は ON ―― 印が出るのは②で周回因子セットを
			     選んだときだけで、選ぶこと自体が利用者の明示的な操作なので、そこから更にもう一段
			     チェックを入れさせる意味が薄いため（exam の属性アイコンが既定 OFF なのは、あちらが
			     対象スキルを選ばない＝誰の画像にも勝手に付くため）。保存キー uma-special-tier-marks。 -->
			<label id="tier-marks-row" class="mt-2 flex items-center justify-center gap-2 text-[11px] text-slate-500 cursor-pointer select-none">
				<input type="checkbox" id="opt-tier-marks" class="rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4" checked="">
				<span>種類の枠（周回サポカ・サポカ外・その他）を付ける</span>
			</label>

			<!-- 印を付けられるかどうかの状態表示（段0。C-59 の案(a)）。
			     結合はOCRと独立して押せるので、OCRを回していない・周回因子セットを選んでいない・
			     旧UIにいる、のいずれでも**印が黙って出ない**状態になる（C-58 で印を足したときに
			     できた穴）。押したあとのトーストではなく**押す前に読める場所**へ出す。
			     文面の組み立ては tierMarksStatusText()。 -->
			<p id="tier-marks-status" class="mt-1 text-[11px] text-center leading-relaxed text-amber-700" data-tone="warn">②で因子周回を選ぶと、種類の枠を付けられるようになります。</p>

			<!-- 画像結合の進捗バー（OCR処理と同じ見た目。処理中はstitch-btnを無効化して
			     多重クリックを防ぐ。詳細はrunImageStitching()参照） -->
			<div id="stitch-progress-wrap" class="hidden mt-3 p-4 rounded-xl bg-green-50 border border-green-200">
				<div class="flex justify-between text-xs font-semibold text-green-900 mb-2">
					<span id="stitch-progress-label" class="flex items-center gap-1.5">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="loader-2" aria-hidden="true" class="lucide lucide-loader-2 w-4 h-4 animate-spin text-green-600"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
						<span>画像結合中…</span>
					</span>
					<span id="stitch-progress-pct">0%</span>
				</div>
				<div class="h-2 bg-green-200/70 rounded-full overflow-hidden">
					<div id="stitch-progress-bar" class="h-full bg-green-600 rounded-full transition-all duration-300" style="width:0%"></div>
				</div>
			</div>

			<!-- 「高度な解析オプション」で出るもの（切り出しプレビュー・開発ログ）。
			     以前は照合結果の引き出しのいちばん下にあったが、オプションを入れた場所から遠く、
			     結果を読む流れの邪魔でもあったので、処理を始めるボタンの下へ移した。
			     オプションを切れば隠れる（renderPreview / renderDevLog）のは今までどおり。 -->
			<!-- 切り出し画像プレビュー -->
			<div id="preview-wrap" class="hidden border-t border-slate-200 pt-6 mt-6">
				<h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-4 h-4 text-slate-500"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
					<span>切り出し結果プレビュー</span>
				</h3>
				<div id="debug-preview" class="space-y-4"></div>
			</div>

			<!-- 開発ログ -->
			<div id="dev-wrap" class="hidden border-t border-slate-200 pt-6 mt-6">
				<div class="flex items-center justify-between mb-3">
					<h3 class="text-xs font-bold text-amber-700 flex items-center gap-1.5">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="terminal" aria-hidden="true" class="lucide lucide-terminal w-4 h-4"><path d="M12 19h8"></path><path d="m4 17 6-6-6-6"></path></svg>
						<span>開発用ログ</span>
					</h3>
					<button type="button" class="px-3 py-1 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-semibold transition-colors">
						ログをコピー
					</button>
				</div>
				<div id="dev-log" class="dev-log rounded-xl border border-amber-200 bg-amber-50/80 p-4 text-amber-900 max-h-80 overflow-y-auto"></div>
			</div>

			<!-- 高度な解析オプション（T56・C-258 の (2)-8。モック T43 の形）。パネルのいちばん下の左に、丸の線の中の灰色の「!」だけを置く
			     （押せる範囲 44px。画質の警告・エラーの「!」は三角・黄／赤なので、丸・灰の線で分ける）。押すとすぐ下に今の2つが開く。
			     2つのチェックの id（opt-devlog・opt-preview）と中身は今までどおり。exam.html と同じ作り -->
			<div id="adv-opts" class="adv-opts">
				<button type="button" id="adv-opts-btn" class="adv-opts-btn" aria-expanded="false" aria-controls="adv-opts-panel" aria-label="高度な解析オプション" title="高度な解析オプション"><span aria-hidden="true">!</span></button>
				<div id="adv-opts-panel" class="adv-opts-panel" hidden="">
					<p class="adv-opts-title">高度な解析オプション</p>
					<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
						<label class="flex items-start gap-2.5 p-2 rounded-lg hover:bg-white transition-colors cursor-pointer">
							<input id="opt-devlog" type="checkbox" class="mt-0.5 rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4">
							<div>
								<span class="text-xs font-semibold text-slate-800">開発用ログ出力</span>
								<p class="text-[11px] text-slate-500 mt-0.5">判定根拠や不一致テキストの内訳を結果エリアに表示</p>
							</div>
						</label>

						<label class="flex items-start gap-2.5 p-2 rounded-lg hover:bg-white transition-colors cursor-pointer">
							<input id="opt-preview" type="checkbox" class="mt-0.5 rounded text-[var(--uma-control)] focus:ring-[var(--uma-focus-ring)] w-4 h-4">
							<div>
								<span class="text-xs font-semibold text-slate-800">切り出し画像のプレビュー</span>
								<p class="text-[11px] text-slate-500 mt-0.5">OCRエンジンに渡した整形画像をデバッグ用に確認</p>
							</div>
						</label>
					</div>
				</div>
			</div>

			</div><!-- /#step-panel-2 -->
		</div>

	</div>

	

	<!-- ===== 引き出しパネル =====
	     行き先は3つとも同じ骨格（.uma-drawer）。背景の暗転は1枚を共有し、
	     同時に開くのは1つだけ。開閉は openDrawer() / closeDrawer() が管理する。 -->
	<div id="drawer-backdrop" class="uma-drawer-backdrop" hidden=""></div>

	<!-- 照合結果（★の数）。表の列が人数ぶん増えるので、他より広い引き出しにする。 -->
	<aside id="result-drawer" class="uma-drawer uma-drawer--wide" hidden="" role="dialog" aria-modal="true" aria-label="照合結果">
		<div class="uma-drawer-header">
			<div class="flex items-center gap-2 min-w-0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-4 h-4 text-green-600 shrink-0"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<p class="text-sm font-bold text-slate-800 truncate">照合結果（★の数）</p>
			</div>
			<div class="flex items-center gap-2 shrink-0">
				<button id="result-drawer-close" type="button" class="uma-btn uma-btn--secondary">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" aria-hidden="true" class="lucide lucide-x w-3.5 h-3.5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
					<span>閉じる</span>
				</button>
			</div>
		</div>
		<!-- 引き出しの中のタブ（C-62 の (9)）。**引き出しは2つのまま**で、押すともう一方の
		     引き出しへ切り替える（openDrawer が開いていた側を畳んでから開く）。
		     exam は1つの引き出しの中でパネルを切り替えるが（C-18）、special で同じ形にするのが
		     C-59 の段5 で、**段5 は引き続き見送り中**（理由と着手の条件は C-60 の6節）。
		     ここで作ったタブ帯は、段5 に着手したときにそのまま「1つの引き出しの中のタブ」になるので、
		     作り直しにはならない。
		     中身がまだ無い行き先は押せない（ラベルにも「（なし）」を出す）。未読の点はタブの右に出すので、
		     OCR＋結合を1回で走らせて照合結果が開いたとき、結合画像の側に点が見えて行けることが分かる。
		     骨格の CSS は css/shell.css（.drawer-tabs / .drawer-tab）。 -->
		<div class="drawer-tabs" role="tablist" aria-label="結果の種類">
			<button type="button" role="tab" class="drawer-tab" id="result-tab-result" aria-selected="true" tabindex="0">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks w-3.5 h-3.5"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<span id="result-tab-result-label">照合結果（なし）</span>
				<span id="result-tab-result-dot" class="uma-fab-dot" hidden=""></span>
			</button>
			<button type="button" role="tab" class="drawer-tab" id="result-tab-stitch" aria-selected="false" tabindex="-1" disabled="">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-3.5 h-3.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
				<span id="result-tab-stitch-label">結合画像（なし）</span>
				<span id="result-tab-stitch-dot" class="uma-fab-dot" hidden=""></span>
			</button>
		</div>

		<div class="uma-drawer-body">
			<div id="result-empty" class="uma-drawer-empty">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="list-checks" aria-hidden="true" class="lucide lucide-list-checks"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>
				<p class="text-sm font-bold text-slate-600">まだ照合結果がありません</p>
				<p class="text-xs">スキルリストと画像を用意して「OCR処理＋画像結合を開始する」を押すと、ここに結果が出ます。</p>
				<button type="button" class="uma-btn uma-btn--secondary">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" aria-hidden="true" class="lucide lucide-arrow-left w-3.5 h-3.5"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
					<span>入力画面に戻る</span>
				</button>
			</div>
			<div class="uma-drawer-content">
				<div id="result-wrap" class="hidden">

					<!-- ===== UmaSkill Deckへの受け渡しの案内 =====
					     以前はここに保存パネルを持っていたが、UmaSkill Deck側に同等の
					     取り込みダイアログ（「UmaStar OCRの判定結果があります → 読み込む」）が
					     あり、入口が二重になっていたため、Deck側に一本化して削除した。

					     判定が終わると writeOcrHandoff() が localStorage へ書き出す。
					     「Deck側に渡し終わった」ことは画面に出ないと分からないので、
					     ここで知らせる。取り込みが済んだかどうかは refreshDeckHandoffState()
					     が localStorage を見て切り替える（Deck側の取り込みは storage イベントで届く）。 -->
					<div id="deck-handoff-note" class="hidden mb-6">
						<div id="deck-handoff-box" class="deck-accent deck-note">
							<div class="flex items-start gap-2.5">
								<span class="relative shrink-0 mt-0.5">
									<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="layers" aria-hidden="true" class="lucide lucide-layers w-4 h-4 deck-icon"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>
									<span id="deck-handoff-dot" class="uma-fab-dot" style="top:-5px; right:-5px;"></span>
								</span>
								<div class="min-w-0">
									<p id="deck-handoff-title" class="text-xs font-bold deck-note-title">この結果をUmaSkill Deckに取り込めます</p>
									<p id="deck-handoff-detail" class="text-[11px] deck-note-text mt-0.5 leading-relaxed"></p>

			<!-- 対象スキルの範囲（軸1・排他3択）と シナリオ因子（軸2・独立ON/OFF）
			     画面に出す呼び名は「既定」「対象を広げる」「対象を絞る」で確定済み（C-46）。
			     内部の値は default / expanded / curated（優劣を含まない中立な名前）で、
			     呼び名が変わってもこの値は変えない。
			     各選択肢の種数は renderTargetScopeControls() が定数から数えて書く。 -->
			<div class="rounded-xl border border-slate-200 bg-slate-50/50 p-4 mb-4">
				<fieldset>
					<legend class="text-xs font-semibold text-slate-700 mb-2">対象スキルの範囲</legend>
					<!-- 「対象を広げる／絞る」に触れている間は、足す／外すスキル名を下の #scope-detail に出す
					     （中身は renderScopeDetail() がデータから書く）。マウスだけでなく、キーボード・
					     タップでラジオに焦点が来たときも同じ欄に出す。選択肢の上には何も重ねない。 -->
					<!-- 4択（C-136 で「効率を指定」を足した）。640px 未満は2列×2段（縦3段だったときより1段減る。恒久ルール25）、
					     640px 以上は横1列（3択のときと同じ段数）。種数の「（N種）」は途中で折り返さない -->
					<div class="grid gap-2 grid-cols-2 sm:grid-cols-4">
						<label for="scope-mode-default" class="flex items-start gap-2 rounded-lg border border-slate-200 bg-white p-2.5 cursor-pointer hover:border-[var(--uma-control-border)] transition-all">
							<input type="radio" id="scope-mode-default" name="target-scope-mode" value="default" class="mt-0.5 accent-[var(--uma-control)] cursor-pointer" checked="">
							<span>
								<span class="block text-xs font-semibold text-slate-800">既定<span class="whitespace-nowrap">（<span id="scope-count-default">133</span>種）</span></span>
							</span>
						</label>
						<label for="scope-mode-expanded" class="flex items-start gap-2 rounded-lg border border-slate-200 bg-white p-2.5 cursor-pointer hover:border-[var(--uma-control-border)] transition-all">
							<input type="radio" id="scope-mode-expanded" name="target-scope-mode" value="expanded" class="mt-0.5 accent-[var(--uma-control)] cursor-pointer">
							<span>
								<span class="block text-xs font-semibold text-slate-800">対象を広げる<span class="whitespace-nowrap">（<span id="scope-count-expanded">138</span>種）</span></span>
								<span class="scope-sub block text-[11px] text-slate-500 mt-0.5">既定に5種を足します</span>
							</span>
						</label>
						<label for="scope-mode-curated" class="flex items-start gap-2 rounded-lg border border-slate-200 bg-white p-2.5 cursor-pointer hover:border-[var(--uma-control-border)] transition-all">
							<input type="radio" id="scope-mode-curated" name="target-scope-mode" value="curated" class="mt-0.5 accent-[var(--uma-control)] cursor-pointer">
							<span>
								<span class="block text-xs font-semibold text-slate-800">対象を絞る<span class="whitespace-nowrap">（<span id="scope-count-curated">121</span>種）</span></span>
								<span class="scope-sub block text-[11px] text-slate-500 mt-0.5">既定から12種を外します</span>
							</span>
						</label>
						<!-- 効率を指定（βテスト・C-136）。種数は区間で対象にしているぶん（データを読めるまでは「…」）。
						     選んでいる間は、下の #scope-detail の位置に区切りのバー（#eff-panel）を出す -->
						<label for="scope-mode-efficiency" class="flex items-start gap-2 rounded-lg border border-slate-200 bg-white p-2.5 cursor-pointer hover:border-[var(--uma-control-border)] transition-all">
							<input type="radio" id="scope-mode-efficiency" name="target-scope-mode" value="efficiency" class="mt-0.5 accent-[var(--uma-control)] cursor-pointer">
							<span>
								<span class="block text-xs font-semibold text-slate-800">効率を指定<span class="whitespace-nowrap">（<span id="scope-count-efficiency">…</span>種）<button type="button" class="uma-help-btn scope-help" id="eff-help-btn" aria-expanded="false" aria-haspopup="dialog" aria-label="効率を指定の説明を見る" title="効率を指定の説明を見る">?</button></span></span>
							</span>
						</label>
					</div>
					<!-- 足す／外すスキル名の欄。aria-live で、キーボード操作でも読み上げられる -->
					<div id="scope-detail" class="scope-detail" aria-live="polite">「対象を広げる」「対象を絞る」に触れると、足す／外すスキル名をここに表示します。</div>
					<!-- 「効率で選ぶ」を選んでいる間だけ、#scope-detail の代わりに出す区切りのバー（C-136）。
					     中身（4つの区間・3つのつまみ・値）は renderEffPanel() がデータから作る -->
					<div id="eff-panel" class="eff-panel" hidden=""></div>
				</fieldset>

				<!-- シナリオ因子は**まとめて1つのチェック**（64セッション目・段D）。
				     それまでは24種の個別選択だったが、1種ずつ選び分ける実体的な需要が無かった。
				     種数は renderScenarioFactorToggle() が正本のデータから書く（1件ずつ手書きしない）。
				     **1行に畳んである**（C-2c。special の②の B・C と同じ形）: 「☑ シナリオ因子 24種 ?」。
				     白いカードも「因子はスキルではないので別に数える」の説明文も置かない（冗長という判断）。
				     何が対象になるのかは「?」の一覧（#factor-list-box）で見る。 -->
				<div class="uma-checkrow mt-2.5">

				</div>

				<!-- 遺伝子（66セッション目・段F）。上のシナリオ因子と同じ1行の形。
				     種数は renderAptitudeGeneToggle() が写しから書く（1件ずつ手書きしない）。
				     **αの注記（#genes-alpha）は段H で削除した。** α という断りは
				     「結合画像にはまだ反映されない」作りかけの状態を指していたもので、

				<div class="uma-checkrow mt-2.5">

					</label>

				</div>

			<div id="stitch-show-panel"><div class="stitch-show" data-stitch-show-panel=""><div class="stitch-show-body"><p class="stitch-show-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sliders-horizontal" aria-hidden="true" class="lucide lucide-sliders-horizontal"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg><span>結合画像の設定</span></p><div class="stitch-show-list"><label class="stitch-show-item" data-stitch-hot="banner"><input type="checkbox" id="stitch-show-banner" data-stitch-show="banner" class="stitch-show-check"><span class="stitch-show-text">検出数カード<span class="stitch-show-sub">（検出数・sp70緑）</span></span></label><label class="stitch-show-item is-off" data-stitch-hot="scenario"><input type="checkbox" id="stitch-show-scenario" data-stitch-show="scenario" class="stitch-show-check" disabled=""><span class="stitch-show-text">シナリオ因子・遺伝子<span class="stitch-show-sub">（各列の該当状況）</span></span></label><label class="stitch-show-item" data-stitch-hot="marks"><input type="checkbox" id="opt-attr-icons" data-stitch-show="marks" class="stitch-show-check"><span class="stitch-show-text"><span data-stitch-marks-label="">印</span><img class="stitch-shoe-mini" data-stitch-marks-shoe="" src="../img/horseshoe-4-rainbow-2026-10-09.png" alt="" hidden=""><span class="stitch-show-sub"><span data-stitch-marks-sub="">（★●◆◇✕）</span></span></span></label><label class="stitch-show-item stitch-show-item--child is-off" data-stitch-hot="legend"><span class="stitch-show-branch" aria-hidden="true">└</span><input type="checkbox" id="stitch-show-legend" data-stitch-show="legend" class="stitch-show-check" disabled=""><span class="stitch-show-text">凡例<span class="stitch-show-sub">（印の見かた）</span></span></label><label class="stitch-show-item" data-stitch-hot="conditions"><input type="checkbox" id="stitch-show-conditions" data-stitch-show="conditions" class="stitch-show-check"><span class="stitch-show-text">集計条件<span class="stitch-show-sub">（追加／除外スキル・シナリオ因子・遺伝子一覧）</span></span></label></div></div><div class="stitch-wire" aria-hidden="true"><div class="stitch-wire-sheet"><div class="stitch-wire-head" data-stitch-part="header"><span>親A</span></div><div class="stitch-wire-banner is-hot" data-stitch-part="banner"><span class="stitch-wire-card stitch-wire-card--a"><small>検出</small><b></b></span><span class="stitch-wire-card stitch-wire-card--b"><small>sp70緑</small><b></b></span></div><div class="stitch-wire-factors" data-stitch-part="scenario" hidden=""><span class="stitch-wire-factor"></span><span class="stitch-wire-factor stitch-wire-factor--gene"></span></div><div class="stitch-wire-countnote is-hot" data-stitch-part="banner"><b></b></div><div class="stitch-wire-shots" data-stitch-part="shots"><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="sp70" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="green" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="plain" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="factor" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="gene" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="removed" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="sp70" data-stitch-part="marks"></i><b></b></span><span class="stitch-wire-row"><i class="stitch-wire-mark" data-stitch-mark="plain" data-stitch-part="marks"></i><b></b></span></div><div class="stitch-wire-notes" data-stitch-part="notebar"><span class="stitch-wire-line" data-stitch-part="legend" hidden=""><i class="stitch-wire-mark is-on" data-stitch-mark="sp70"></i><i class="stitch-wire-mark is-on" data-stitch-mark="green"></i><i class="stitch-wire-mark is-on" data-stitch-mark="factor"></i><i class="stitch-wire-mark is-on" data-stitch-mark="gene"></i><b></b></span><span class="stitch-wire-line" data-stitch-part="conditions"><b style="width:92%"></b></span><span class="stitch-wire-line" data-stitch-part="conditions"><b style="width:74%"></b></span></div></div></div></div></div>

		if (vw) { if (warn) vw.querySelector('div').textContent = vt('video.warn.person', { 人: LABELS[si * 3 + WHO] }); else vw.remove(); }
		// 継ぎ目の一致度の警告（スクショの結合の警告）は写しの作り物なので外す
		$$(':scope > div', el).forEach(function (x) { if (/継ぎ目の一致度/.test(x.textContent)) x.remove(); });
		var p = el.querySelector('p.text-xs.font-bold');
		if (p) p.textContent = SETS[si].label;
		return el;
	}
	function openStitchDrawer(si) {
		var drawer = document.getElementById('stitch-drawer');
		var backdrop = document.getElementById('drawer-backdrop');
		if (!drawer) return;
		var empty = document.getElementById('stitch-empty'); if (empty) empty.hidden = true;
		var wrap = document.getElementById('stitch-result-wrap'); if (wrap) wrap.classList.remove('hidden');
		var content = document.getElementById('stitch-result-content');
		if (content) { content.innerHTML = ''; content.appendChild(resultHtml(si, false)); }
		// 結果があるときのタブの名前（製品の updateResultTabs と同じく「（なし）」を外す）
		var tl = document.getElementById('stitch-tab-stitch-label'); if (tl) tl.textContent = '結合画像';
		if (backdrop) { backdrop.hidden = false; backdrop.classList.remove('closing'); }
		drawer.hidden = false;
		void drawer.offsetWidth;
		drawer.classList.add('open');
		document.getElementById('fab-nav').hidden = true;
		document.body.style.overflow = 'hidden';
	}
	function applyVideo() {
		var si = 0;
		var panel = $('#personset-A-wrap .upload-set-panel');
		var cols = panel.querySelector('.t69-cols');
		var tree = panel.querySelector(':scope > .flex.items-center.justify-center');
		if (scene === 'vprog') {
			insertBox(progressHtml(STEP));
			$$('#personset-A-wrap, #personset-B-wrap').forEach(function (w) { w.classList.add('video-busy'); });
		} else if (scene === 'verr') {
			insertBox(errorHtml());
		} else if (scene === 'vdone' || scene === 'vwarn') {
			insertBox(summaryHtml(nA));
			if (scene === 'vdone' && RES === 'drawer') { openStitchDrawer(si); return; }
			var res = resultHtml(si, scene === 'vwarn');
			res.classList.add('t69-result');
			var clear = panel.querySelector('.upload-set-clear');
			clear.parentElement.insertBefore(res, clear.nextSibling);
			if (scene === 'vdone') {
				// 親ごとの画像は見せない（押すと出す）
				tree.classList.add('t69-hidden'); cols.classList.add('t69-hidden');
				var b = document.createElement('button');
				b.type = 'button'; b.className = 't69-showcols'; b.setAttribute('aria-expanded', 'false');
				b.textContent = vt('t69.showcols');
				res.appendChild(b);
				b.addEventListener('click', function () {
					var show = cols.classList.contains('t69-hidden');
					tree.classList.toggle('t69-hidden', !show); cols.classList.toggle('t69-hidden', !show);
					b.textContent = vt(show ? 't69.hidecols' : 't69.showcols');
					b.setAttribute('aria-expanded', String(show));
					syncBar();
				});
			}
		}
	}

	/* ===== 組み立て ===== */
	if (scene !== 'now') { buildCols(0); buildCols(1); buildBar(); }
	renderAll();
	if (VIDEO) applyVideo();
	syncStickyTop();
	syncBar();
	window.addEventListener('resize', function () { syncStickyTop(); syncBar(); });

	/* ===== 操作（見た目だけ。点線の枠を押すと作り物の画像が1枚入る・× で外す・タブを切り替える） ===== */
	document.addEventListener('click', function (e) {
		var t = e.target;
		var rm = t.closest('[data-t69-rm]');
		if (rm) { var a = rm.getAttribute('data-t69-rm').split(':'); imgs[+a[0]].splice(+a[1], 1); renderAll(); return; }
		var ex = t.closest('[data-t69-expand]');
		if (ex) { expanded[+ex.getAttribute('data-t69-expand')] = true; renderAll(); return; }
		var zone = t.closest('.person-drop-zone');
		if (zone) { e.preventDefault(); var p = +zone.getAttribute('data-person'); imgs[p].push({ video: false }); renderAll(); return; }
		var tab = t.closest('#personset-tabs [data-usd-act="personset-tab"]');
		if (tab) { activeSet = Number(tab.getAttribute('data-tab-id')) || 0; renderTabs(); return; }
		if (t.closest('a[href="#"]')) e.preventDefault();
	}, true);

	/* ===== 案内（左上） ===== */
	if (!SHOT) {
		var g = document.createElement('details');
		g.className = 't69-guide';
		var opt = function (val, cur, label) { return '<option value="' + val + '"' + (val === cur ? ' selected' : '') + '>' + label + '</option>'; };
		var sceneOpts = Object.keys(SCENES).filter(function (k) { return TOOL === 'special' || k.charAt(0) !== 'v'; }).map(function (k) { return opt(k, scene, k + ' — ' + SCENES[k]); }).join('');
		var extra = '';
		if (scene === 'vprog') extra += '<label>段<select data-q="step">' + [0, 1, 2, 3, 4].map(function (s) { return opt(String(s), String(STEP), String(s)); }).join('') + '</select></label>';
		if (scene === 'vdone') extra += '<label>結合画像の出し方<select data-q="res">' + opt('inline', RES, 'inline ③の中に出す') + opt('drawer', RES, 'drawer 今と同じく引き出しを開く') + '</select></label>';
		if (scene === 'vwarn') extra += '<label>警告の人<select data-q="who">' + [0, 1, 2].map(function (s) { return opt(String(s), String(WHO), LABELS[s]); }).join('') + '</select></label>';
		if (scene === 'verr') extra += '<label>失敗<select data-q="e">' + Object.keys(ERRKEY).map(function (s) { return opt(s, ERR, s); }).join('') + '</select></label>';
		if (scene !== 'now') extra += '<label>画像を足すボタンの高さ<select data-q="add">' + opt('lg', ADD, 'lg 今の欄と同じ（76px）') + opt('sm', ADD, 'sm 44px') + '</select></label>';
		g.innerHTML = '<summary>モックの案内 ▾</summary><div class="t69-gbody">'
			+ '<p>T69 の作業用のモック。保存も通信もしない。点線の枠（追加）を押すと作り物の画像が1枚入る。× で外す。動画の入口はタブの行の右端（今と同じ場所）。</p>'
			+ '<label>ツール<select data-q="tool">' + opt('special', TOOL, 'special（UmaStar の③）') + opt('exam', TOOL, 'exam（UmaExam の②）') + '</select></label>'
			+ '<label>場面<select data-q="scene">' + sceneOpts + '</select></label>'
			+ '<label>親Aセットの枚数<select data-q="imgs">' + opt('', IMGS, '既定（' + nA.join('・') + '枚）') + Object.keys(PRESETS).map(function (k) { return opt(k, IMGS, k + '（' + PRESETS[k].join('・') + '枚）'); }).join('') + '</select></label>'
			+ extra
			+ '<label>色<select data-q="theme">' + opt('light', THEME, 'ライト') + opt('dark', THEME, 'ダーク') + '</select></label>'
			+ '</div>';
		document.body.appendChild(g);
		g.addEventListener('change', function (e) {
			var s = e.target.closest('select[data-q]'); if (!s) return;
			var q = new URLSearchParams(location.search);
			if (s.value) q.set(s.getAttribute('data-q'), s.value); else q.delete(s.getAttribute('data-q'));
			if (s.getAttribute('data-q') === 'imgs') q.delete('n');
			location.search = q.toString();
		});
	}
	window.__t69 = { tool: TOOL, scene: scene, add: ADD, res: RES, nA: nA };
})();
</script>
